syntax = "proto3";

package quicbaas.dynamicsecrets.v1;

option go_package = "github.com/jeremyhahn/go-quicbaas/api/proto;proto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// =============================================================================
// Dynamic Secrets Service
// =============================================================================

// DynamicSecretsService handles dynamic credential generation with lease-based TTL management.
// Dynamic secrets are auto-generated, time-limited credentials that are automatically
// revoked on expiry.
service DynamicSecretsService {
  // CreateRole creates a new credential generation role.
  // Roles define how credentials are generated, what permissions they have, and their TTL limits.
  rpc CreateRole(DynSecretsCreateRoleRequest) returns (DynSecretsCreateRoleResponse);

  // GetRole retrieves a credential generation role by name.
  rpc GetRole(DynSecretsGetRoleRequest) returns (DynSecretsGetRoleResponse);

  // ListRoles returns all credential generation roles.
  rpc ListRoles(DynSecretsListRolesRequest) returns (DynSecretsListRolesResponse);

  // DeleteRole removes a credential generation role.
  rpc DeleteRole(DynSecretsDeleteRoleRequest) returns (DynSecretsDeleteRoleResponse);

  // GenerateCredential generates a new dynamic credential based on a role.
  rpc GenerateCredential(GenerateCredentialRequest) returns (GenerateCredentialResponse);

  // RenewLease extends the expiration time of a credential lease.
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);

  // RevokeLease revokes a credential lease immediately.
  rpc RevokeLease(RevokeLeaseRequest) returns (RevokeLeaseResponse);

  // ListLeases returns all active leases.
  rpc ListLeases(ListLeasesRequest) returns (ListLeasesResponse);
}

// =============================================================================
// Enums
// =============================================================================

// LeaseState represents the current state of a lease.
enum LeaseState {
  // LEASE_STATE_UNSPECIFIED is the default unspecified value.
  LEASE_STATE_UNSPECIFIED = 0;

  // LEASE_STATE_ACTIVE indicates the lease is active and valid.
  LEASE_STATE_ACTIVE = 1;

  // LEASE_STATE_EXPIRED indicates the lease has expired.
  LEASE_STATE_EXPIRED = 2;

  // LEASE_STATE_REVOKED indicates the lease was manually revoked.
  LEASE_STATE_REVOKED = 3;
}

// =============================================================================
// Common Types
// =============================================================================

// Role represents a credential generation role configuration.
message Role {
  // Name is the unique identifier for the role.
  string name = 1;

  // GeneratorType identifies the credential generator (e.g., "postgres", "mysql").
  string generator_type = 2;

  // Config contains generator-specific configuration.
  map<string, string> config = 3;

  // DefaultTTL is the default time-to-live for generated credentials.
  google.protobuf.Duration default_ttl = 4;

  // MaxTTL is the maximum allowed time-to-live for credentials.
  google.protobuf.Duration max_ttl = 5;

  // CreatedAt is when the role was created.
  google.protobuf.Timestamp created_at = 6;

  // UpdatedAt is when the role was last updated.
  google.protobuf.Timestamp updated_at = 7;
}

// Credential represents a generated dynamic credential.
message Credential {
  // Username is the generated username.
  string username = 1;

  // Password is the generated password.
  string password = 2;

  // ConnectionString is an optional connection string.
  string connection_string = 3;

  // Host is the database/service host.
  string host = 4;

  // Port is the database/service port.
  int32 port = 5;

  // Database is the target database name.
  string database = 6;

  // Metadata contains additional credential metadata. It carries the
  // generator's full credential data map (the same payload the REST engine
  // returns under "secret").
  map<string, string> metadata = 7;

  // CredentialID is the unique identifier for this credential. Callers
  // correlate revocation and audit records by this value; the REST engine
  // returns it as "credential_id".
  string credential_id = 8;
}

// Lease represents a credential lease.
message Lease {
  // LeaseID is the unique identifier for the lease.
  string lease_id = 1;

  // SecretPath is the path to the secret or resource this lease grants
  // access to. The REST engine returns it as "path".
  string secret_path = 2;

  // State is the current lease state.
  LeaseState state = 3;

  // TTL is the remaining time-to-live.
  google.protobuf.Duration ttl = 4;

  // ExpiresAt is when the lease expires.
  google.protobuf.Timestamp expires_at = 5;

  // CreatedAt is when the lease was created.
  google.protobuf.Timestamp created_at = 6;

  // RenewedAt is when the lease was last renewed.
  google.protobuf.Timestamp renewed_at = 7;

  // Renewable indicates if the lease can be renewed.
  bool renewable = 8;

  // MaxTTL is the maximum allowed TTL for renewal.
  google.protobuf.Duration max_ttl = 9;

  // RenewCount tracks how many times this lease has been renewed.
  int32 renew_count = 10;

  // Metadata contains additional key-value data about this lease.
  map<string, string> metadata = 11;
}

// =============================================================================
// Create Role Request/Response
// =============================================================================

// DynSecretsCreateRoleRequest requests creation of a credential role.
message DynSecretsCreateRoleRequest {
  // Name is the unique identifier for the role.
  string name = 1;

  // GeneratorType identifies the credential generator (e.g., "postgres", "mysql").
  string generator_type = 2;

  // Config contains generator-specific configuration.
  map<string, string> config = 3;

  // DefaultTTL is the default time-to-live for generated credentials.
  google.protobuf.Duration default_ttl = 4;

  // MaxTTL is the maximum allowed time-to-live for credentials.
  google.protobuf.Duration max_ttl = 5;
}

// DynSecretsCreateRoleResponse returns the created role.
message DynSecretsCreateRoleResponse {
  // Role is the created role.
  Role role = 1;

  // Timestamp is when the role was created.
  google.protobuf.Timestamp timestamp = 2;
}

// =============================================================================
// Get Role Request/Response
// =============================================================================

// DynSecretsGetRoleRequest requests retrieval of a role.
message DynSecretsGetRoleRequest {
  // Name is the role name to retrieve.
  string name = 1;
}

// DynSecretsGetRoleResponse returns the retrieved role.
message DynSecretsGetRoleResponse {
  // Role is the retrieved role.
  Role role = 1;

  // Timestamp is when the request was processed.
  google.protobuf.Timestamp timestamp = 2;
}

// =============================================================================
// List Roles Request/Response
// =============================================================================

// DynSecretsListRolesRequest requests a list of roles.
message DynSecretsListRolesRequest {
  // Prefix filters roles by name prefix (optional).
  string prefix = 1;
}

// DynSecretsListRolesResponse returns the list of roles.
message DynSecretsListRolesResponse {
  // Roles is the list of roles.
  repeated Role roles = 1;

  // Count is the total number of roles.
  int32 count = 2;

  // Timestamp is when the request was processed.
  google.protobuf.Timestamp timestamp = 3;
}

// =============================================================================
// Delete Role Request/Response
// =============================================================================

// DynSecretsDeleteRoleRequest requests deletion of a role.
message DynSecretsDeleteRoleRequest {
  // Name is the role name to delete.
  string name = 1;
}

// DynSecretsDeleteRoleResponse confirms role deletion.
message DynSecretsDeleteRoleResponse {
  // Success indicates if the deletion was successful.
  bool success = 1;

  // Timestamp is when the role was deleted.
  google.protobuf.Timestamp timestamp = 2;
}

// =============================================================================
// Generate Credential Request/Response
// =============================================================================

// GenerateCredentialRequest requests generation of a dynamic credential.
message GenerateCredentialRequest {
  // RoleName is the name of the role to use for generation.
  string role_name = 1;

  // TTL is the requested time-to-live for the credential.
  // If not specified, the role's DefaultTTL is used.
  google.protobuf.Duration ttl = 2;
}

// GenerateCredentialResponse returns the generated credential and lease.
message GenerateCredentialResponse {
  // Credential is the generated credential.
  Credential credential = 1;

  // Lease is the associated lease.
  Lease lease = 2;

  // LeaseID is the lease identifier.
  string lease_id = 3;

  // Timestamp is when the credential was generated.
  google.protobuf.Timestamp timestamp = 4;
}

// =============================================================================
// Renew Lease Request/Response
// =============================================================================

// RenewLeaseRequest requests renewal of a lease.
message RenewLeaseRequest {
  // LeaseID is the ID of the lease to renew.
  string lease_id = 1;

  // Increment is the duration to add to the expiration time.
  // If not specified, the original TTL is used.
  google.protobuf.Duration increment = 2;
}

// RenewLeaseResponse returns the renewed lease.
message RenewLeaseResponse {
  // Lease is the renewed lease.
  Lease lease = 1;

  // Timestamp is when the lease was renewed.
  google.protobuf.Timestamp timestamp = 2;
}

// =============================================================================
// Revoke Lease Request/Response
// =============================================================================

// RevokeLeaseRequest requests revocation of a lease.
message RevokeLeaseRequest {
  // LeaseID is the ID of the lease to revoke.
  string lease_id = 1;
}

// RevokeLeaseResponse confirms lease revocation.
message RevokeLeaseResponse {
  // Success indicates if the revocation was successful.
  bool success = 1;

  // Timestamp is when the lease was revoked.
  google.protobuf.Timestamp timestamp = 2;
}

// =============================================================================
// List Leases Request/Response
// =============================================================================

// ListLeasesRequest requests a list of leases.
message ListLeasesRequest {
  // Prefix filters leases by path prefix (optional).
  string prefix = 1;
}

// ListLeasesResponse returns the list of leases.
message ListLeasesResponse {
  // Leases is the list of leases.
  repeated Lease leases = 1;

  // Count is the total number of leases.
  int32 count = 2;

  // Timestamp is when the request was processed.
  google.protobuf.Timestamp timestamp = 3;
}
