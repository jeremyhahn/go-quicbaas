// QuicBaaS Ceremony Protocol Buffer Definitions v1
// M-of-N initialization ceremony exposed by the QuicBaaS daemon.
//
// QuicBaaS itself does not own the ceremony; the embedded go-qrdb
// instance does. These RPCs are a thin gRPC facade that QuicBaaS exposes
// so that gRPC-only clients connecting to the QuicBaaS endpoint can drive
// ceremony operations against the composed stack. The shape mirrors the
// REST surface served from /api/v1/init and the underlying go-qrdb
// Ceremony gRPC service.
//
// Copyright (c) 2025 Jeremy Hahn
// Copyright (c) 2025 Automate The Things, LLC

syntax = "proto3";

package quicbaas.ceremony.v1;

import "google/protobuf/empty.proto";
import "qrdb/v1/permission.proto";

option go_package = "github.com/jeremyhahn/go-quicbaas/api/proto;proto";

// =============================================================================
// Ceremony Service
// =============================================================================

// Ceremony exposes the M-of-N initialization ceremony lifecycle through
// gRPC. All RPCs delegate to the embedded go-qrdb CeremonyClient at the
// QuicBaaS service-layer facade.
service Ceremony {
  // CeremonyInitialize starts the initialization ceremony, issuing the CA,
  // server TLS certificate, optional SO certificate, and Shamir shares for
  // the supplied officers.
  rpc CeremonyInitialize(CeremonyInitializeRequest) returns (CeremonyInitializeResponse) {
      option (qrdb.v1.permission) = "ceremony:initialize";
  }

  // CeremonyStatus reports the current ceremony state and SPKI pin.
  rpc CeremonyStatus(google.protobuf.Empty) returns (CeremonyStatusResponse) {
      option (qrdb.v1.permission) = "ceremony:status";
  }

  // CeremonySignCSR submits a CSR for signing during the ceremony.
  rpc CeremonySignCSR(CeremonySignCSRRequest) returns (CeremonySignCSRResponse) {
      option (qrdb.v1.permission) = "ceremony:sign_csr";
  }

}

// =============================================================================
// Messages
// =============================================================================

// CeremonyOfficer describes a single officer for M-of-N initialization.
message CeremonyOfficer {
  string username = 1;
  string csr_pem = 2;
  // role is the holder role; empty selects go-qrdb's default.
  string role = 3;
  // encryption_kem and encryption_key enrol a separate HPKE recipient key the
  // share envelope is sealed to; empty uses the certificate key.
  string encryption_kem = 4;
  bytes encryption_key = 5;
  repeated CeremonyHolderFactor factors = 6;
  // designated names the factor fixed at enrolment under the designated
  // policy; "mtls" when empty.
  string designated = 7;
}

// CeremonyHolderFactor is one factor a holder enrols with (go-qrdb
// HolderFactorEnrolment). params_json is the factor's parameters as a JSON
// object, the encoding go-qrdb's own gRPC wire uses.
message CeremonyHolderFactor {
  string name = 1;
  bytes params_json = 2;
}

// CeremonyHolderCert is the certificate go-qrdb issued to one initial holder.
message CeremonyHolderCert {
  string username = 1;
  string role = 2;
  string cert_pem = 3;
}

// CeremonyInitializeRequest starts the initialization ceremony.
message CeremonyInitializeRequest {
  string so_pin = 1;
  string user_pin = 2;
  // credential_seal_strategy selects how the SO/User credentials are
  // sealed. Empty selects the daemon default.
  string credential_seal_strategy = 3;
  int32 threshold = 4;
  repeated CeremonyOfficer officers = 5;
  string hostname = 6;
  repeated string sans = 7;
  // admin_csr_pem, admin_cert_pem and admin_generate select the bootstrap
  // admin's credential path (go-qrdb#548): CSR-sign, bring-your-own
  // certificate, or generate (dev/test only). Exactly one must be set.
  string admin_csr_pem = 8;
  string admin_cert_pem = 9;
  // admin_cert_pool_pem is the CA pool that verifies admin_cert_pem.
  string admin_cert_pool_pem = 10;
  bool admin_generate = 11;
  // secret is the system barrier passphrase, required when the barrier's
  // strategy needs one (e.g. "passphrase") and empty for "none".
  bytes secret = 12;
  // policy is the Shamir custody policy for threshold >= 2: "designated"
  // (default) or "any-enrolled".
  string policy = 13;
}

// CeremonyInitializeResponse returns the result of ceremony initialization.
message CeremonyInitializeResponse {
  string spki_pin = 1;
  string ca_cert_pem = 2;
  string tls_cert_pem = 3;
  // Fields 4 and 5 held so_cert_pem / so_key_pem. The SO identity is
  // CSR-based; the server never holds officer private keys.
  reserved 4, 5;
  reserved "so_cert_pem", "so_key_pem";
  string state = 6;
  int32 share_count = 7;
  // holders carries the certificate issued to each initial holder.
  repeated CeremonyHolderCert holders = 8;
  // admin_cert_pem is the bootstrap administrator's signed certificate.
  string admin_cert_pem = 9;
  // admin_key_pem is the generated administrator's private key, present only
  // when admin_credential_source is "generated". go-qrdb returns it exactly
  // once and keeps no copy.
  bytes admin_key_pem = 10;
  string admin_credential_source = 11;
}

// CeremonyStatusResponse describes the current ceremony state.
message CeremonyStatusResponse {
  string state = 1;
  string spki_pin = 2;
}

// CeremonySignCSRRequest submits a CSR for signing during the ceremony.
message CeremonySignCSRRequest {
  string username = 1;
  string so_pin = 2;
  string csr_pem = 3;
  string role = 4;
}

// CeremonySignCSRResponse returns the signed certificate.
message CeremonySignCSRResponse {
  string cert_pem = 1;
}
