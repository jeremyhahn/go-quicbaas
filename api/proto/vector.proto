  // metrics contains component-specific metrics.
  map<string, double> metrics = 4;

  reserved 5 to 10;
}

// ========================================
// Index Operations Messages
// ========================================

// RebuildIndexRequest rebuilds the index for a namespace.
message RebuildIndexRequest {
  // namespace identifies the namespace to rebuild.
  // REQUIRED.
  string namespace = 1;

  // index_params overrides existing index parameters during rebuild.
  // OPTIONAL. Use to tune index quality vs. build time.
  map<string, string> index_params = 2;

  // async returns immediately without waiting for completion.
  // OPTIONAL. Defaults to true. Use GetIndexProgress to monitor.
  bool async = 3;

  // timeout_ms specifies the maximum time to wait (milliseconds).
  // OPTIONAL. Defaults to 300000ms (5 minutes). Only applies if async = false.
  int64 timeout_ms = 4;

  reserved 5 to 10;
}

// RebuildIndexResponse confirms index rebuild initiation.
message RebuildIndexResponse {
  // operation_id uniquely identifies this rebuild operation.
  string operation_id = 1;

  // started is when the rebuild started.
  google.protobuf.Timestamp started = 2;

  // estimated_duration_ms is the estimated rebuild time.
  int64 estimated_duration_ms = 3;

  reserved 4 to 10;
}

// GetIndexProgressRequest gets rebuild progress.
message GetIndexProgressRequest {
  // namespace identifies the namespace.
  // REQUIRED.
  string namespace = 1;

  // operation_id identifies the rebuild operation.
  // OPTIONAL. Empty returns current/latest operation.
  string operation_id = 2;

  reserved 3 to 10;
}

// GetIndexProgressResponse returns rebuild progress.
message GetIndexProgressResponse {
  // operation_id is the rebuild operation ID.
  string operation_id = 1;

  // namespace is the namespace being rebuilt.
  string namespace = 2;

  // vectors_indexed is the number of vectors indexed so far.
  int64 vectors_indexed = 3;

  // total_vectors is the total number of vectors to index.
  int64 total_vectors = 4;

  // percent_complete is the completion percentage.
  double percent_complete = 5;

  // elapsed_time_ms is the elapsed time in milliseconds.
  int64 elapsed_time_ms = 6;

  // estimated_remaining_ms is the estimated remaining time.
  int64 estimated_remaining_ms = 7;

  // status is the rebuild status ("running", "completed", "failed").
  string status = 8;

  // error_message provides details if rebuild failed.
  string error_message = 9;

  reserved 10 to 15;
}

// ========================================
// Admin Service Messages
// ========================================

// GetClusterStatsRequest requests cluster-wide statistics.
message GetClusterStatsRequest {
  // include_namespaces includes per-namespace breakdown.
  // OPTIONAL. Defaults to false.
  bool include_namespaces = 1;

  // include_nodes includes per-node breakdown.
  // OPTIONAL. Defaults to false.
  bool include_nodes = 2;

  reserved 3 to 10;
}

// GetClusterStatsResponse returns cluster statistics.
message GetClusterStatsResponse {
  // cluster_id uniquely identifies the cluster.
  string cluster_id = 1;

  // total_nodes is the number of nodes in the cluster.
  int32 total_nodes = 2;

  // total_vectors is the total number of vectors across all nodes.
  int64 total_vectors = 3;

  // total_namespaces is the total number of namespaces.
  int32 total_namespaces = 4;

  // total_storage_bytes is the total storage used.
  int64 total_storage_bytes = 5;

  // total_index_bytes is the total index size.
  int64 total_index_bytes = 6;

  // cluster_qps is the cluster-wide queries per second.
  double cluster_qps = 7;

  // namespace_stats contains per-namespace statistics (if requested).
  repeated NamespaceStats namespace_stats = 8;

  // node_stats contains per-node statistics (if requested).
  repeated NodeStats node_stats = 9;

  // timestamp is when the stats were collected.
  google.protobuf.Timestamp timestamp = 10;

  reserved 11 to 20;
}

// NodeStats contains per-node statistics.
message NodeStats {
  // node_id uniquely identifies the node.
  uint64 node_id = 1;

  // address is the node's network address.
  string address = 2;

  // vector_count is the number of vectors on this node.
  int64 vector_count = 3;

  // storage_bytes is the storage used on this node.
  int64 storage_bytes = 4;

  // index_bytes is the index size on this node.
  int64 index_bytes = 5;

  // qps is the queries per second on this node.
  double qps = 6;

  // avg_latency_ms is the average search latency.
  double avg_latency_ms = 7;

  // cpu_usage is the CPU usage percentage.
  double cpu_usage = 8;

  // memory_usage_bytes is the memory used.
  int64 memory_usage_bytes = 9;

  reserved 10 to 15;
}

// CompactNamespaceRequest compacts a namespace.
message CompactNamespaceRequest {
  // namespace identifies the namespace to compact.
  // REQUIRED.
  string namespace = 1;

  // async returns immediately without waiting for completion.
  // OPTIONAL. Defaults to true.
  bool async = 2;

  // timeout_ms specifies the maximum time to wait (milliseconds).
  // OPTIONAL. Defaults to 300000ms (5 minutes).
  int64 timeout_ms = 3;

  reserved 4 to 10;
}

// CompactNamespaceResponse confirms compaction initiation.
message CompactNamespaceResponse {
  // operation_id uniquely identifies this compaction.
  string operation_id = 1;

  // started is when the compaction started.
  google.protobuf.Timestamp started = 2;

  reserved 3 to 10;
}

// GetCompactionProgressRequest gets compaction progress.
message GetCompactionProgressRequest {
  // namespace identifies the namespace.
  // REQUIRED.
  string namespace = 1;

  // operation_id identifies the compaction operation.
  // OPTIONAL. Empty returns current/latest operation.
  string operation_id = 2;

  reserved 3 to 10;
}

// GetCompactionProgressResponse returns compaction progress.
message GetCompactionProgressResponse {
  // operation_id is the compaction operation ID.
  string operation_id = 1;

  // namespace is the namespace being compacted.
  string namespace = 2;

  // bytes_compacted is the number of bytes compacted.
  int64 bytes_compacted = 3;

  // total_bytes is the total bytes to compact.
  int64 total_bytes = 4;

  // percent_complete is the completion percentage.
  double percent_complete = 5;

  // elapsed_time_ms is the elapsed time.
  int64 elapsed_time_ms = 6;

  // space_reclaimed_bytes is the disk space reclaimed.
  int64 space_reclaimed_bytes = 7;

  // status is the compaction status.
  string status = 8;

  reserved 9 to 10;
}

// ExportVectorsRequest exports vectors from a namespace.
message ExportVectorsRequest {
  // namespace identifies the namespace to export.
  // REQUIRED.
  string namespace = 1;

  // format specifies the export format ("json", "parquet", "binary").
  // OPTIONAL. Defaults to "binary".
  string format = 2;

  // compression specifies compression ("none", "gzip", "zstd").
  // OPTIONAL. Defaults to "gzip".
  string compression = 3;

  // batch_size specifies vectors per batch.
  // OPTIONAL. Defaults to 1000.
  int32 batch_size = 4;

  // metadata_filters applies filtering before export.
  // OPTIONAL.
  repeated MetadataFilter metadata_filters = 5;

  reserved 6 to 10;
}

// ExportVectorsResponse streams exported vector batches.
message ExportVectorsResponse {
  // batch_data contains serialized vector data.
  bytes batch_data = 1;

  // vectors_exported is the cumulative count.
  int64 vectors_exported = 2;

  // batch_number is the sequence number.
  int32 batch_number = 3;

  // is_final indicates the last batch.
  bool is_final = 4;

  // checksum is the CRC32 checksum for this batch.
  uint32 checksum = 5;

  reserved 6 to 10;
}

// ImportVectorsRequest imports vectors into a namespace.
message ImportVectorsRequest {
  // namespace identifies the target namespace.
  // REQUIRED for first message.
  string namespace = 1;

  // format specifies the import format ("json", "parquet", "binary").
  // REQUIRED for first message.
  string format = 2;

  // batch_data contains serialized vector data.
  // REQUIRED for all messages.
  bytes batch_data = 3;

  // skip_validation bypasses vector validation (faster, but risky).
  // OPTIONAL. Defaults to false.
  bool skip_validation = 4;

  // overwrite_existing overwrites vectors with matching IDs.
  // OPTIONAL. Defaults to false (skip existing).
  bool overwrite_existing = 5;

  reserved 6 to 10;
}

// ImportVectorsResponse confirms import completion.
message ImportVectorsResponse {
  // vectors_imported is the total number imported.
  int64 vectors_imported = 1;

  // vectors_skipped is the number skipped (duplicates).
  int64 vectors_skipped = 2;

  // vectors_failed is the number that failed validation.
  int64 vectors_failed = 3;

  // duration_ms is the import duration.
  int64 duration_ms = 4;

  // timestamp is when the import completed.
  google.protobuf.Timestamp timestamp = 5;

  reserved 6 to 10;
}

// ========================================
// Scalar Index Management Messages
// ========================================

// CreateScalarIndexRequest creates a scalar field index for a namespace.
message CreateScalarIndexRequest {
  // namespace identifies the target namespace.
  // REQUIRED.
  string namespace = 1;

  // field is the metadata field name to index.
  // REQUIRED.
  string field = 2;

  // index_type specifies the scalar index algorithm.
  // REQUIRED.
  ScalarIndexType index_type = 3;

  reserved 4 to 10;
}

// CreateScalarIndexResponse confirms scalar index creation.
message CreateScalarIndexResponse {
  // field is the indexed field name.
  string field = 1;

  // index_type is the scalar index algorithm used.
  ScalarIndexType index_type = 2;

  // timestamp is when the index was created.
  google.protobuf.Timestamp timestamp = 3;

  reserved 4 to 10;
}

// DropScalarIndexRequest removes a scalar field index.
message DropScalarIndexRequest {
  // namespace identifies the target namespace.
  // REQUIRED.
  string namespace = 1;

  // field is the metadata field name whose index should be removed.
  // REQUIRED.
  string field = 2;

  reserved 3 to 10;
}

// DropScalarIndexResponse confirms scalar index removal.
message DropScalarIndexResponse {
  // field is the field whose index was removed.
  string field = 1;

  // timestamp is when the index was removed.
  google.protobuf.Timestamp timestamp = 2;

  reserved 3 to 10;
}

// ListScalarIndexesRequest lists scalar field indexes for a namespace.
message ListScalarIndexesRequest {
  // namespace identifies the target namespace.
  // REQUIRED.
  string namespace = 1;

  reserved 2 to 10;
}

// ScalarIndexInfo describes a scalar field index.
message ScalarIndexInfo {
  // field is the indexed metadata field name.
  string field = 1;

  // index_type is the scalar index algorithm.
  ScalarIndexType index_type = 2;

  // entry_count is the number of indexed entries.
  int64 entry_count = 3;

  // created_at is when the index was created.
  google.protobuf.Timestamp created_at = 4;

  reserved 5 to 10;
}

// ListScalarIndexesResponse returns all scalar field indexes for a namespace.
message ListScalarIndexesResponse {
  // indexes contains the scalar index information.
  repeated ScalarIndexInfo indexes = 1;

  reserved 2 to 10;
}
