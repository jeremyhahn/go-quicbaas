// QuicBaaS Barrier Protocol Buffer Definitions v1
// Storage barrier (root-key) lifecycle exposed by the QuicBaaS daemon.
//
// QuicBaaS itself does not own the barrier; the embedded go-qrdb instance
// does. These RPCs are a thin gRPC facade that QuicBaaS exposes so that
// gRPC-only clients connecting to the QuicBaaS endpoint can drive barrier
// operations against the composed stack without having to dial qrdb
// directly. The shape mirrors the REST surface served from
// /api/v1/barrier and the underlying go-qrdb Barrier gRPC service.
//
// Copyright (c) 2025 Jeremy Hahn
// Copyright (c) 2025 Automate The Things, LLC

syntax = "proto3";

package quicbaas.barrier.v1;

import "google/protobuf/empty.proto";
import "qrdb/v1/permission.proto";

option go_package = "github.com/jeremyhahn/go-quicbaas/api/proto;proto";

// =============================================================================
// Barrier Service
// =============================================================================

// Barrier exposes the storage-barrier (root-key) lifecycle through gRPC.
// All RPCs delegate to the embedded go-qrdb BarrierClient at the QuicBaaS
// service-layer facade.
service Barrier {
  // BarrierInitialize initializes the storage barrier with a single
  // passphrase. Returns FailedPrecondition if the barrier is already
  // initialized.
  rpc BarrierInitialize(BarrierInitializeRequest) returns (google.protobuf.Empty) {
      option (qrdb.v1.permission) = "tenant_barrier:init";
  }

  // BarrierUnseal unseals the barrier using a single passphrase.
  rpc BarrierUnseal(BarrierUnsealRequest) returns (google.protobuf.Empty) {
      option (qrdb.v1.permission) = "tenant_barrier:unseal";
  }

  // BarrierSeal transitions the barrier to the sealed state. Subsequent
  // data operations are rejected until the barrier is unsealed again.
  // When a PIN backend with an SO PIN is configured, so_pin must carry it.
  rpc BarrierSeal(BarrierSealRequest) returns (google.protobuf.Empty) {
      option (qrdb.v1.permission) = "tenant_barrier:seal";
  }

  // BarrierStatus reports the current barrier state including the active
  // sealing strategy, hardware backing, and initialization timestamp.
  rpc BarrierStatus(google.protobuf.Empty) returns (BarrierStatusResponse) {
      option (qrdb.v1.permission) = "tenant_barrier:status";
  }

  // BarrierShamirInitialize initializes the barrier with Shamir secret
  // sharing, splitting the root key into threshold-of-total shares.
  rpc BarrierShamirInitialize(BarrierShamirInitializeRequest) returns (BarrierShamirInitializeResponse) {
      option (qrdb.v1.permission) = "seal:initialize_shamir";
  }

  // BarrierRecoveryGenerate generates a fresh set of recovery shares for
  // disaster recovery.
  rpc BarrierRecoveryGenerate(BarrierRecoveryGenerateRequest) returns (BarrierRecoveryKeysResponse) {
      option (qrdb.v1.permission) = "seal:generate_recovery";
  }

  // BarrierRecoveryDelete removes all persisted recovery key metadata.
  rpc BarrierRecoveryDelete(google.protobuf.Empty) returns (google.protobuf.Empty) {
      option (qrdb.v1.permission) = "seal:generate_recovery";
  }

  // BarrierRecoveryStatus reports whether recovery key metadata exists.
  rpc BarrierRecoveryStatus(google.protobuf.Empty) returns (BarrierRecoveryStatusResponse) {
      option (qrdb.v1.permission) = "seal:status";
  }

  // BarrierEnableEncryption migrates the system barrier from the none
  // (unencrypted) strategy to a keyed strategy in place. This RPC is
  // implemented only when the embedded qrdb node is available; the
  // transport BarrierClient stubs it with UNIMPLEMENTED.
  rpc BarrierEnableEncryption(BarrierEnableEncryptionRequest) returns (google.protobuf.Empty) {
      option (qrdb.v1.permission) = "seal:enable_encryption";
  }
}

// =============================================================================
// Messages
// =============================================================================

// BarrierInitializeRequest initialises the barrier with a single master key.
message BarrierInitializeRequest {
  // secret is the raw master-key material, carried as bytes end to end.
  bytes secret = 1;
}

// BarrierUnsealRequest unseals the barrier with a master key.
message BarrierUnsealRequest {
  // secret is the raw master-key material, carried as bytes end to end.
  bytes secret = 1;
}

// BarrierSealRequest seals the barrier. so_pin is the Security Officer PIN;
// it may be empty only when no PIN backend with an SO PIN is configured.
message BarrierSealRequest {
  string so_pin = 1;
}

// BarrierStatusResponse describes the current barrier state.
message BarrierStatusResponse {
  bool sealed = 1;
  string strategy = 2;
  bool hardware_backed = 3;
  // initialized_at is RFC3339 (UTC) or empty when never initialised. qrdb
  // leaves it empty while a system barrier is sealed; read initialized.
  string initialized_at = 4;
  // initialized is true once the barrier holds a root key, sealed or not.
  bool initialized = 5;
}

// BarrierShamirInitializeRequest initialises the barrier with Shamir secret
// sharing (qrdb BarrierInitializeShamirRequest). policy is "designated"
// (default) or "any-enrolled"; so_pin and user_pin, when set, are provisioned
// into the node's PIN backend.
message BarrierShamirInitializeRequest {
  int32 threshold = 1;
  int32 total_shares = 2;
  string policy = 3;
  string so_pin = 4;
  string user_pin = 5;
}

// BarrierShamirInitializeResponse is the share-free result; officers claim
// their shares through the share-claim flow.
message BarrierShamirInitializeResponse {
  int32 threshold = 1;
  int32 total_shares = 2;
  int32 share_count = 3;
}

// BarrierRecoveryGenerateRequest generates the recovery key, split
// threshold-of-N to the enrolled recovery officers.
message BarrierRecoveryGenerateRequest {
  int32 threshold = 1;
  string policy = 2;
  string so_pin = 3;
}

// BarrierRecoveryKeysResponse is the share-free result of recovery key
// generation.
message BarrierRecoveryKeysResponse {
  int32 threshold = 1;
  int32 total = 2;
  int32 share_count = 3;
}

// BarrierRecoveryStatusResponse indicates whether recovery keys exist.
message BarrierRecoveryStatusResponse {
  bool has_recovery_keys = 1;
}

// BarrierEnableEncryptionRequest requests at-rest encryption migration for the
// system barrier.
message BarrierEnableEncryptionRequest {
  // target_strategy is the keyed strategy to migrate to: "passphrase" or
  // "shamir". Required; must not be "none".
  string target_strategy = 1;

  // mechanism selects the physical re-encryption approach: "swap" (default,
  // ~2x peak disk, crash-safe) or "inplace" (lower peak disk).
  string mechanism = 2;

  // availability controls write availability during migration: "online"
  // (default, keeps serving writes) or "quiesced" (blocks writes).
  string availability = 3;

  // passphrase is required for a passphrase-target migration.
  bytes passphrase = 4;

  // shamir_threshold is the M-of-N quorum threshold for a Shamir-target
  // migration. Must be >= 2 and <= shamir_total.
  int32 shamir_threshold = 5;

  // shamir_total is the total number of Shamir shares for a Shamir-target
  // migration. Must be >= shamir_threshold.
  int32 shamir_total = 6;
}
