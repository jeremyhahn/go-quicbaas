// =============================================================================
// Job Requests and Responses
// =============================================================================

// OrchestratorStartJobRequest starts an autonomous orchestration job.
message OrchestratorStartJobRequest {
    string tenant_id = 1;
    string description = 2;
    // lead is the Agent or pool the job's lead runs as; unset takes the
    // project's default lead.
    quicbaas.agents.v1.AgentRef lead = 3;
    reserved 4;
    string project_id = 5;
    int32 max_iterations = 6;
    string poll_interval = 7;
    string workflow_name = 8;
    string workflow_file = 9;
    string lead_agent_id = 10;
    string task_id = 11;   // task this job is an attempt at
    int64 attempt = 12;    // 1-based attempt ordinal
    string runner = 13;    // JobRunner driving the job's states; empty = "workflow"
    // prompt_append is run-time prompt material appended to every session
    // the job spawns, the lead's included. At most 64 KiB.
    string prompt_append = 14;
}

// OrchestratorStartJobResponse contains the result of starting an orchestration job.
message OrchestratorStartJobResponse {
    string job_id = 1;
    google.protobuf.Timestamp timestamp = 2;
}

// OrchestratorGetJobStatusRequest requests the status of an orchestration job.
message OrchestratorGetJobStatusRequest {
    string tenant_id = 1;
    string job_id = 2;
}

// OrchestratorGetJobStatusResponse contains the current status of an orchestration job.
message OrchestratorGetJobStatusResponse {
    string job_id = 1;
    string state = 2;
    int32 iteration = 3;
    int32 task_count = 4;
    int32 completed = 5;
    int32 failed = 6;
    string description = 7;
    int64 started_at = 8;
    int64 updated_at = 9;
    string error = 10;
    google.protobuf.Timestamp timestamp = 11;
    repeated OrchestratorAuditEvent events = 12; // Complete audit trail
    string task_id = 13;
    int64 attempt = 14;
    string node = 15;
    int64 heartbeat_at = 16;
    string failure_class = 17;
    string lead_session_id = 18;
    repeated string session_ids = 19;
    string stage = 20; // last lifecycle moment the job passed through
    string runner = 21; // JobRunner that drove the job's states

    // Provenance: who ran the attempt, which attempt it was, and what it
    // left behind. See pkg/orchestration/job_provenance.go.
    string agent_id = 22;                          // fleet agent the work was dispatched to
    repeated OrchestratorJobStage stages = 23;     // lifecycle moments entered, in order
    repeated OrchestratorJobAttempt attempts = 24; // every attempt at the job's task
    int32 attempt_budget = 25;                     // charged attempts the task allows
    string terminal_reason = 26;                   // typed reason the task stopped
    bool readmit_allowed = 27;                     // whether a person may requeue the task
    OrchestratorJobDelivery delivery = 28;         // branch, head, pull request, reviews
    repeated OrchestratorJobVerification verification = 29; // last validator pipeline's results

    // source is where the job's TASK came from — the forge issue it was
    // adopted from, in the task's own {kind, ref, url} shape. Absent for a
    // job that is not an attempt at a task, or whose task records no origin.
    TaskSource source = 30;

    // prompt_append is the run-time prompt material the job appends to every
    // session it spawns: the request's, or its task's.
    string prompt_append = 31;
}

// OrchestratorJobVerification is one verification command's outcome.
message OrchestratorJobVerification {
    string name = 1;
    bool passed = 2;
    string message = 3;
    string details = 4;
}

// OrchestratorJobStage is one lifecycle moment the job entered.
message OrchestratorJobStage {
    string stage = 1;
    int64 entered_at = 2; // Unix nanoseconds
}

// OrchestratorJobAttempt is one attempt at the job's task.
message OrchestratorJobAttempt {
    int32 attempt = 1;
    string job_id = 2;
    bool current = 3;
}

// OrchestratorJobReviewRound is one reviewer's verdict on one head.
message OrchestratorJobReviewRound {
    int32 round = 1;
    string reviewer = 2;
    string verdict = 3;
    string head_sha = 4;
    string findings = 5;
    string submitted_at = 6; // RFC 3339
}

// OrchestratorJobDelivery is the git side of the job's attempt.
message OrchestratorJobDelivery {
    string branch = 1;
    string head_sha = 2;
    int32 pull_request_number = 3;
    string pull_request_url = 4;
    string pull_request_state = 5;
    repeated OrchestratorJobReviewRound reviews = 6;
}

// OrchestratorAuditEvent records a single event in the job's audit trail.
message OrchestratorAuditEvent {
    int64 timestamp = 1;
    string type = 2;
    string details = 3;
}

// OrchestratorCancelJobRequest cancels a running orchestration job.
message OrchestratorCancelJobRequest {
    string tenant_id = 1;
    string job_id = 2;
}

// OrchestratorCancelJobResponse contains the result of cancelling an orchestration job.
message OrchestratorCancelJobResponse {
    string job_id = 1;
    bool cancelled = 2;
    google.protobuf.Timestamp timestamp = 3;
}

// OrchestratorListJobsRequest lists a tenant's jobs, optionally narrowed by
// any of the job listing filters.
message OrchestratorListJobsRequest {
    string tenant_id = 1;

    // task_id narrows the listing to the attempts at one task. Empty lists
    // every job the tenant owns. The SERVER applies it: a client that has to
    // re-filter the answer cannot tell a task with no attempts from a task
    // whose attempts were not returned.
    string task_id = 2;

    // Paging, sorting and search — the contract every list endpoint speaks
    // (docs/software-factory/api.md). limit 0 takes the default page (25);
    // anything above 100 is capped. sort is "<field>" or "<field>:desc",
    // naming a field from the endpoint's allow-list; an unknown field is
    // refused with InvalidArgument. q is a case-insensitive substring
    // matched against the endpoint's documented text fields.
    int32 limit = 3;
    int32 offset = 4;
    string sort = 5;
    string q = 6;

    // Existing jobs filters. They compose with q and the paging envelope.
    string runner = 7;
    string project_id = 8;
    repeated string statuses = 9;
    repeated string job_ids = 10;
    string agent_id = 11;
}

// OrchestratorListJobsResponse contains the list of jobs for a tenant.
message OrchestratorListJobsResponse {
    repeated OrchestratorJobSummary jobs = 1;

    // The paging envelope. total counts the records that matched the filters
    // and the search BEFORE the page was cut; limit and offset are the values
    // the server APPLIED. next_offset is the offset of the following page and
    // is zero on the last page.
    int32 total = 2;
    int32 limit = 3;
    int32 offset = 4;
    int32 next_offset = 5;
}

// OrchestratorJobSummary provides a summary of an orchestration job.
message OrchestratorJobSummary {
    string job_id = 1;
    string state = 2;
    int32 iteration = 3;
    int32 task_count = 4;
    int32 completed = 5;
    int32 failed = 6;
    string description = 7;
    int64 started_at = 8;
    int64 updated_at = 9;
    string error = 10;
    int32 event_count = 11;
    string task_id = 12;
    int64 attempt = 13;

    // source is the forge issue behind the job's task, filled by the server
    // for every row it answers. A consumer paging the jobs listing holds no
    // tasks to resolve it against, so without it the row cannot name its
    // issue at all (go-quicbaas#976). Absent when the job is not an attempt
    // at a task, or its task records no origin.
    TaskSource source = 14;
}

// SubscribeJobEventsRequest subscribes to real-time events from a job.
message SubscribeJobEventsRequest {
    string tenant_id = 1;
    string job_id = 2;
}

// JobEvent represents a real-time event from a running orchestration job.
message JobEvent {
    string job_id = 1;
    string type = 2;
    string state = 3;
    string message = 4;
    int32 iteration = 5;
    map<string, string> metadata = 6;
    int64 timestamp = 7;
}

