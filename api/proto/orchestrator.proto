syntax = "proto3";

package quicbaas.orchestrator.v1;

option go_package = "github.com/jeremyhahn/go-quicbaas/api/proto;proto";

import "google/protobuf/timestamp.proto";
import "pkg/api/grpc/proto/qrdbv1/authz.proto";

// =============================================================================
// Orchestrator Service
// =============================================================================

service OrchestratorService {
    // Session Operations
    rpc SpawnSession(SpawnSessionRequest) returns (SpawnSessionResponse) {
        option (qrdb.v1.permission) = "orchestrator:spawn";
    }
    rpc PromptSession(PromptSessionRequest) returns (PromptSessionResponse) {
        option (qrdb.v1.permission) = "orchestrator:prompt";
    }
    rpc SessionStatus(SessionStatusRequest) returns (SessionStatusResponse) {
        option (qrdb.v1.permission) = "orchestrator:status";
    }
    rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse) {
        option (qrdb.v1.permission) = "orchestrator:close";
    }
    rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
        option (qrdb.v1.permission) = "orchestrator:list";
    }

    // RotateSessionAccount moves one session onto a different pooled provider
    // account. Rotation also happens automatically when a turn fails on a
    // classified provider limit; this is the operator-initiated door to the
    // same verb ("this seat is bad, move my session now").
    rpc RotateSessionAccount(RotateSessionAccountRequest) returns (RotateSessionAccountResponse) {
        option (qrdb.v1.permission) = "orchestrator:spawn";
    }

    // Task Operations
    rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_create";
    }
    rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_read";
    }
    rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_list";
    }
    rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_claim";
    }
    rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_complete";
    }
    rpc BlockTask(BlockTaskRequest) returns (BlockTaskResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_block";
    }
    rpc ReadmitTask(ReadmitTaskRequest) returns (ReadmitTaskResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_readmit";
    }
    // DeleteTask removes a task and releases its source reservation.
    // Authorized as the task-record write verb: deleting a task is the
    // inverse of creating one, and the permission vocabulary go-qrdb owns
    // carries no separate delete action for this family.
    rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_create";
    }
    rpc DecomposeTask(DecomposeTaskRequest) returns (DecomposeTaskResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_decompose";
    }

    // Job Operations
    rpc StartJob(OrchestratorStartJobRequest) returns (OrchestratorStartJobResponse) {
        option (qrdb.v1.permission) = "orchestrator:job_start";
    }
    rpc GetJobStatus(OrchestratorGetJobStatusRequest) returns (OrchestratorGetJobStatusResponse) {
        option (qrdb.v1.permission) = "orchestrator:job_read";
    }
    rpc CancelJob(OrchestratorCancelJobRequest) returns (OrchestratorCancelJobResponse) {
        option (qrdb.v1.permission) = "orchestrator:job_cancel";
    }
    rpc ListJobs(OrchestratorListJobsRequest) returns (OrchestratorListJobsResponse) {
        option (qrdb.v1.permission) = "orchestrator:job_list";
    }

    // Event Streaming
    rpc SubscribeJobEvents(SubscribeJobEventsRequest) returns (stream JobEvent) {
        option (qrdb.v1.permission) = "orchestrator:job_read";
    }

    // Backend Operations
    rpc ListBackends(OrchestratorListBackendsRequest) returns (OrchestratorListBackendsResponse) {
        option (qrdb.v1.permission) = "orchestrator:backend_list";
    }

    // Runner Registry Operations

    // ListRunners returns every registered JobRunner and the ordered,
    // non-terminal states it declares. This is REGISTRY data, not tenant
    // data: the runners a daemon can drive are the same for every caller,
    // which is why the request carries no tenant. Gated on the same
    // orchestrator:status the REST route GET /api/v1/orchestrator/runners
    // is gated on.
    rpc ListRunners(OrchestratorListRunnersRequest) returns (OrchestratorListRunnersResponse) {
        option (qrdb.v1.permission) = "orchestrator:status";
    }

    // Health Operations
    rpc Health(OrchestratorHealthRequest) returns (OrchestratorHealthResponse) {
        option (qrdb.v1.permission) = "orchestrator:health";
    }

    // Agent Fleet Management
    rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse) {
        option (qrdb.v1.permission) = "orchestrator:agent_register";
    }
    rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
        option (qrdb.v1.permission) = "orchestrator:agent_read";
    }
    rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
        option (qrdb.v1.permission) = "orchestrator:agent_list";
    }
    rpc RemoveAgent(RemoveAgentRequest) returns (RemoveAgentResponse) {
        option (qrdb.v1.permission) = "orchestrator:agent_remove";
    }
    rpc AgentHeartbeat(AgentHeartbeatRequest) returns (AgentHeartbeatResponse) {
        option (qrdb.v1.permission) = "orchestrator:agent_heartbeat";
    }

    // Session event ingest (Phase 3). Daemon-side agents open a bidi stream
    // and push each session event as PushEventRequest; the control plane acks
    // with EventAck carrying the accepted sequence. At-least-once delivery:
    // daemon re-sends events the control plane hasn't ack'd after reconnect.
    rpc PushEvents(stream PushEventRequest) returns (stream PushEventAck) {
        option (qrdb.v1.permission) = "orchestrator:hook";
    }

    // Session event subscription (Phase 4). Operators attach to a session
    // to see prompts, assistant output, tool calls, file ops in real time.
    // When from_sequence > 0 the stream begins with the historical replay
    // from that sequence, then transitions to live tail when follow is true.
    rpc SubscribeSessionEvents(SubscribeSessionRequest) returns (stream SessionEventEnvelope) {
        option (qrdb.v1.permission) = "orchestrator:status";
    }

    // GetSessionConversation returns one page of a session's CONVERSATION:
    // who said what, which tools ran, and what each answer cost. It is the
    // coarser sibling of SubscribeSessionEvents, which serves the raw log —
    // every fragment, thought and presence change — in the shape a live
    // attacher needs. A streaming answer is many events and exactly one turn
    // here, and the page boundary always falls between turns.
    //
    // NAMED FOR WHAT IT RETURNS, not for the route it is reached on. The SDK
    // already has a GetSessionHistory that pages the raw EVENT log, and two
    // verbs called history returning two different shapes would be worse than
    // one verb whose name does not match its URL. Its REST route is
    // GET /orchestrator/sessions/{id}/history, because that is the resource an
    // operator reaches for.
    rpc GetSessionConversation(GetSessionConversationRequest) returns (GetSessionConversationResponse) {
        option (qrdb.v1.permission) = "orchestrator:status";
    }

    // GetSpendReport returns one scope of the CONSUMPTION LEDGER: the tokens
    // spent under it, the drill-down to the level below, and the allowance
    // status of every pooled account that paid.
    //
    // ONE VERB FOR EVERY LEVEL, because the ledger's attribution chain is a
    // PATH — tenant/project/task/job/session/round — and "the project's
    // spend" and "the job's spend" are the same prefix scan at two depths.
    // Four RPCs over one scan would be four places for a drill-down's
    // arithmetic to stop agreeing with itself.
    //
    // WHAT IT DOES NOT CLAIM. cost_micros is accompanied by cost_measured,
    // and today nothing in the tree prices a turn, so the flag is false and
    // a renderer must show a dash rather than the zero. Likewise
    // policy_status distinguishes an account with no cap from one this
    // deployment could not read. See go-quicbaas#791.
    rpc GetSpendReport(GetSpendReportRequest) returns (GetSpendReportResponse) {
        option (qrdb.v1.permission) = "orchestrator:status";
    }

    // Inference runs a stateless prompt against a named backend without
    // requiring a prior session. The response is aggregated and returned
    // as a single InferenceResponse. For streaming use InferenceStream.
    rpc Inference(InferenceRequest) returns (InferenceResponse) {
        option (qrdb.v1.permission) = "orchestrator:inference";
    }

    // InferenceStream runs a stateless prompt against a named backend and
    // streams InferenceChunk frames until the backend signals completion.
    // The final frame carries final=true and the aggregated stop_reason.
    rpc InferenceStream(InferenceRequest) returns (stream InferenceChunk) {
        option (qrdb.v1.permission) = "orchestrator:inference";
    }

    // SpawnChildJob fans out a child job from a parent job's lead agent.
    // The calling agent MUST be the registered lead of parent_job_id; any
    // other caller receives PERMISSION_DENIED (not_lead_of_parent).
    rpc SpawnChildJob(SpawnChildJobRequest) returns (SpawnChildJobResponse) {
        option (qrdb.v1.permission) = "orchestrator:job_start";
    }

    // SubmitTaskArtifacts attaches typed artifacts to a completed task.
    // Artifacts exceeding the server-side InlineLimit are stored in the
    // QuicBaaS KV store; the task record carries only the Ref.
    rpc SubmitTaskArtifacts(SubmitTaskArtifactsRequest) returns (SubmitTaskArtifactsResponse) {
        option (qrdb.v1.permission) = "orchestrator:artifact_submit";
    }

    // ListTaskArtifacts returns artifact metadata for a task without resolving
    // large Refs to their content.
    rpc ListTaskArtifacts(ListTaskArtifactsRequest) returns (ListTaskArtifactsResponse) {
        option (qrdb.v1.permission) = "orchestrator:artifact_read";
    }

    // GetTaskArtifact retrieves a single named artifact, resolving kv_key Refs
    // to their full byte content.
    rpc GetTaskArtifact(GetTaskArtifactRequest) returns (GetTaskArtifactResponse) {
        option (qrdb.v1.permission) = "orchestrator:artifact_read";
    }
}

// =============================================================================
// Enums
// =============================================================================

enum TaskStatus {
    TASK_STATUS_UNSPECIFIED = 0;
    TASK_STATUS_PENDING = 1;
    TASK_STATUS_CLAIMED = 2;
    TASK_STATUS_IN_PROGRESS = 3;
    TASK_STATUS_COMPLETED = 4;
    TASK_STATUS_FAILED = 5;
    TASK_STATUS_CANCELLED = 6;
    TASK_STATUS_BLOCKED = 7;
}

enum AgentStatus {
    AGENT_STATUS_UNSPECIFIED = 0;
    AGENT_STATUS_ONLINE = 1;
    AGENT_STATUS_OFFLINE = 2;
    AGENT_STATUS_BUSY = 3;
    AGENT_STATUS_ERROR = 4;
    AGENT_STATUS_DRAINING = 5;
}

enum SessionState {
    SESSION_STATE_UNSPECIFIED = 0;
    SESSION_STATE_ACTIVE = 1;
    SESSION_STATE_IDLE = 2;
    SESSION_STATE_CLOSED = 3;
    SESSION_STATE_ERROR = 4;
    // SESSION_STATE_RESUMABLE marks a session whose durable record survived a
    // daemon restart but whose agent process did not. The session is
    // addressable and its transcript is intact; the next prompt reconstitutes
    // the process and restores the conversation before the turn runs.
    SESSION_STATE_RESUMABLE = 5;
}

// SandboxMode selects the execution sandboxing strategy for an agent
// session. The server resolves SANDBOX_MODE_DEFAULT per its active
// SandboxPolicy (and any tenant override). SANDBOX_MODE_REQUIRED forces
// container execution; SANDBOX_MODE_NONE forces raw exec. Both are
// subject to the server's policy — REQUIRED is rejected if no container
// runtime is available; NONE is rejected if the policy forbids raw exec.
enum SandboxMode {
    SANDBOX_MODE_DEFAULT = 0;
    SANDBOX_MODE_REQUIRED = 1;
    SANDBOX_MODE_NONE = 2;
}

// TrustLevel is the integrity tier a session is required to run at. It mirrors
// orchestration.TrustLevel one-for-one, including the ordering, because the
// mapping either way is a cast.
//
// THE ZERO VALUE IS "UNSTATED", NOT "NONE". A request that names no tier is
// resolved against the receiving side's TrustPolicy; a request that names
// TRUST_LEVEL_NONE has said, positively, that it wants no guarantee. Collapsing
// the two would turn "the operator did not say" into "the operator opted out",
// which is the wrong direction for a requirement.
enum TrustLevel {
    TRUST_LEVEL_DEFAULT = 0;
    TRUST_LEVEL_NONE = 1;
    TRUST_LEVEL_PINNED = 2;
    TRUST_LEVEL_ATTESTED = 3;
    TRUST_LEVEL_MEASURED = 4;
}

// =============================================================================
// Core Types
// =============================================================================

// MCPServerConfig configures an MCP server for an agent session.
message MCPServerConfig {
    string name = 1;
    string url = 2;
    map<string, string> env = 3;

    // args and command complete the shape orchestration.MCPServerConfig has
    // always had. A stdio MCP server IS its command and argv; with only name,
    // url and env on the wire, a remote spawn received a server it could not
    // launch, and the pre-existing url->command mirroring on arrival hid the
    // difference by filling Command with the URL. Both fields are optional and
    // a sender that omits them leaves the old fallback in force.
    repeated string args = 4;
    string command = 5;
}

// ContainerMount is one policy-authorized bind/volume/tmpfs mount for a
// sandbox container. It mirrors orchestration.ContainerMount.
//
// AUTHORIZED TWICE, ON PURPOSE. The control plane authorizes every mount
// against its own MountPolicy before dispatching, and the daemon that will
// actually create the container authorizes them again against its own
// (pkg/agent Runtime.authorizeMounts). The second check is not a duplicate:
// only the daemon knows which host it is, and it is the one binding the path.
message ContainerMount {
    string source = 1;
    string target = 2;
    bool read_only = 3;
    string type = 4;      // "bind" | "volume" | "tmpfs"; empty keeps the untyped short form

    // tmpfs_size_bytes bounds a "tmpfs" mount's size. Zero leaves it unbounded
    // up to the container's whole memory cgroup, which is what every mount
    // before this field meant, so it is inert at its zero value.
    int64 tmpfs_size_bytes = 5;
}

// ContainerSpec defines a container configuration for sandboxed sessions.
message ContainerSpec {
    string image = 1;
    repeated string command = 2;
    map<string, string> env = 3;
    repeated string volumes = 4;
    string work_dir = 5;
    string network = 6;
    string name = 7;
}

// ContentBlock represents a block of content in a response.
message ContentBlock {
    string type = 1;
    string text = 2;
}

// SessionInfo contains summary information about an active session.
message SessionInfo {
    string session_id = 1;
    string project_id = 2;
    string backend = 3;
    string model = 4;
    SessionState state = 5;
    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp last_activity = 7;
}

// Task represents an orchestration work item.
message Task {
    string id = 1;
    string tenant_id = 2;
    string team_name = 3;
    string subject = 4;
    string description = 5;
    TaskStatus status = 6;
    string assigned_to = 7;
    string created_by = 8;
    repeated string dependencies = 9;
    repeated string blocks = 10;
    TaskResult result = 11;
    map<string, string> metadata = 12;
    google.protobuf.Timestamp created_at = 13;
    google.protobuf.Timestamp updated_at = 14;
    google.protobuf.Timestamp claimed_at = 15;
    google.protobuf.Timestamp completed_at = 16;
    uint64 version = 17;
    bool auto_spawn = 18;
    string spawned_job_id = 19;
    google.protobuf.Timestamp spawned_at = 20;
    string project_id = 21;
    TaskSource source = 22;
    int64 priority = 23;
    int64 attempts = 24;
    int64 attempt_budget = 25;
    int64 environment_faults = 26;
    int64 consecutive_environment_faults = 27;
    int64 retry_not_before = 28;      // Unix nanoseconds; 0 = dispatchable now
    string blocked_reason = 29;
    string block_kind = 30;           // needs_info | blocked | escalated
    int64 status_changed_at = 31;     // Unix nanoseconds
    string runner = 32;               // JobRunner driving an attempt; empty = "workflow"
    TaskRouting routing = 33;         // placement hints a dispatch reads
    string dispatch_reason = 34;      // why the last dispatch produced no job
    // question_attempts counts attempts that ended with the agent asking a
    // person, refunded against the budget like environment_faults but reported
    // separately: one means the factory is broken, the other means the worker
    // did the right thing and is waiting.
    int64 question_attempts = 35;
}

// TaskRouting are the placement hints a dispatch reads when it decides where
// an attempt at a task runs. The zero value constrains nothing.
message TaskRouting {
    string backend = 1;
    string host_affinity = 2;
    bool gpu_required = 3;
}

// TaskSource records where a task came from. kind is an open set: the engine
// emits scheduler | operator | job, and a registered task source declares any
// other kind it emits. (kind, ref) is unique within a tenant and project.
message TaskSource {
    string kind = 1;
    string ref = 2;
    string url = 3;
}

// TaskResult contains the output of a completed task.
message TaskResult {
    string output = 1;
    repeated string files = 2;
    map<string, string> metadata = 3;
}

// TaskFilter specifies criteria for listing tasks.
message TaskFilter {
    string team_name = 1;
    TaskStatus status = 2;
    string assigned_to = 3;
    string created_by = 4;
    int32 limit = 5;
    string project_id = 6;
    repeated TaskStatus statuses = 7;
}

// OrchestratorWorkItem represents a decomposed unit of work.
message OrchestratorWorkItem {
    string id = 1;
    string project_id = 2;
    string title = 3;
    string description = 4;
    int32 priority = 5;
    repeated string dependencies = 6;
}

// AgentRegistration represents a registered agent in the fleet registry.
message AgentRegistration {
    string id = 1;
    string tenant_id = 2;
    string name = 3;
    string host = 4;
    string backend = 5;
    string agent_type = 6;
    AgentStatus status = 7;
    repeated string capabilities = 8;
    string container_id = 9;
    string work_dir = 10;
    google.protobuf.Timestamp last_seen = 11;
    google.protobuf.Timestamp registered_at = 12;
    uint64 version = 13;
    map<string, string> metadata = 14;
    string model = 15;
}

// AgentFilter specifies criteria for listing agents.
message AgentFilter {
    string host = 1;
    AgentStatus status = 2;
    string agent_type = 3;
    string backend = 4;
    int32 limit = 5;
    string model = 6;
}

// BackendCapabilities describes what a backend supports.
message BackendCapabilities {
    bool supports_sessions = 1;
    bool supports_streaming = 2;
    bool supports_mcp = 3;
    bool supports_rag = 4;
    bool supports_tools = 5;
    string kind = 6;
}

// AgentBackendInfo contains information about a registered agent backend.
message AgentBackendInfo {
    string name = 1;
    string type = 2;
    BackendCapabilities capabilities = 3;
    string default_model = 4;
}

// SessionHealthResult contains the health check result for a single session.
message SessionHealthResult {
    string session_id = 1;
    string backend = 2;
    SessionState state = 3;
    bool healthy = 4;
    string error = 5;
}

// HealthCheckReport contains the results of checking all active sessions.
message HealthCheckReport {
    google.protobuf.Timestamp timestamp = 1;
    int32 total_sessions = 2;
    int32 healthy = 3;
    int32 unhealthy = 4;
    int32 closed = 5;
    repeated SessionHealthResult results = 6;
}

// =============================================================================
// Session Requests and Responses
// =============================================================================

// SpawnSession
message SpawnSessionRequest {
    string backend = 1;
    string project_id = 2;
    string model = 3;
    string system_prompt = 4;
    repeated MCPServerConfig mcp_servers = 5;
    map<string, string> env = 6;
    string work_dir = 7;
    bool sandboxed = 8;                // deprecated: use sandbox_mode
    string container_image = 9;
    ContainerSpec container_config = 10;
    string tenant_id = 11;
    SandboxMode sandbox_mode = 12;
    string host_affinity = 13;         // pin to a specific agent daemon (Name or Host)
    bool host_affinity_strict = 14;    // when true, fail with NoMatchingAgentError if host_affinity is offline (overrides operator soft default)
    bool persistent = 15;              // when true, spawn a durable multi-turn session (CLI-mode backends register it in the session registry for Prompt/Status/Close); when false the backend uses one-shot-per-prompt execution

    // Pooled provider account selection. account_id pins the session to one
    // account; account_auto asks the named strategy to choose. The account a
    // session resolves to is persisted on its durable record and replayed as a
    // pin on resume, so a reconstituted session never lands on a different
    // provider account than the one it has been billing to.
    string account_id = 16;
    bool account_auto = 17;
    string account_strategy = 18;      // "static" | "least_usage"; empty selects the registry default

    // account_allow optionally names the accounts this session may use and
    // rotate through. It is an additive filter, never a source: an id the
    // tenant does not own is simply not a candidate. Together with
    // account_auto it is what authorizes rotation — a session with neither is
    // a deliberate pin and is never moved off its account.
    repeated string account_allow = 19;

    // extra_args are additional command-line arguments for the agent program,
    // forwarded verbatim by the daemon that spawns it.
    //
    // ON THE WIRE BECAUSE THE GRANT IS THE CALLER'S TO STATE. The SDLC module
    // spawns its workers with an explicit permission grant
    // (--permission-mode acceptEdits) so that a worker's ability to edit its
    // worktree is a property of the SDLC module rather than of whichever operator's
    // settings the executing daemon happened to inherit — go-quicbaas#218. A
    // field absent here silently drops that grant for every REMOTE worker,
    // leaving exactly the failure the local path just fixed.
    repeated string extra_args = 20;

    // THE CONTAINER AND TRUST DIMENSION, WHICH BOTH ENDS ALREADY IMPLEMENTED
    // AND ONLY THE WIRE WAS MISSING. The orchestrator populates every one of
    // these on the SpawnRequest it hands to the backend, and the ACPBackend the
    // daemon runs consumes every one of them when it builds the container spec.
    // Between the two, a remote spawn dropped them all.
    //
    // DROPPING THEM DID NOT FAIL, which is the whole reason they are called out
    // here. Each is inert at its zero value, so a remote session simply ran
    // without the mount its operator authorized and at whatever tier the daemon
    // defaulted to, and no error anywhere said that the control plane had asked
    // for anything else. trust_level is the dangerous direction of #248's class
    // in its purest form: a REQUIREMENT whose absence reads as "nothing was
    // required".
    repeated ContainerMount extra_mounts = 21;
    string image_digest = 22;
    TrustLevel trust_level = 23;
    string trust_label = 24;
    map<uint32, bytes> expected_pcrs = 25;

    // account_exclude is account_allow's other half and travels for the same
    // reason. allow narrows the pool to a set; exclude removes one account from
    // it — the account a session has just been rotated off. Carrying one and
    // not the other lets a rotation land straight back on the account it was
    // moving away from.
    repeated string account_exclude = 26;

    // THE STORAGE TIER, FOR THE SAME REASON THE TRUST TIER TRAVELS. The control
    // plane holds the project record and resolves the tier from it; the daemon
    // that creates the container is the only party that can apply it. Dropping
    // it would not fail — it is inert at its zero value — it would silently run
    // a remote worker's checkout on the disk its operator configured it off,
    // and with no memory limit on the tmpfs the tier depends on.
    WorkspaceStoragePlan storage = 27;

    // job_id names the job this spawn works for.
    //
    // ON THE WIRE FOR THE SAME REASON account_allow IS: the scope is the
    // control plane's to state, and the daemon cannot derive it. The daemon's
    // account resolution carries it into the delivery grant's scope
    // (pkg/orchestration/account_lease.go), so a remote session's grant records
    // the job it served even though the daemon's own credential cache — and
    // therefore the grant itself — is keyed by account rather than by job.
    string job_id = 28;

    // THE WORKSPACE, NAMED RATHER THAN GIVEN AS A PATH (go-quicbaas#981). A
    // work_dir is a path on the control plane's host and means nothing on any
    // other; an agent on another machine refused every mount it named. So the
    // spawn names the workspace and the agent provisions it under its own
    // projects root, reporting the directory in SpawnSessionResponse.work_dir.
    // Mutually exclusive with work_dir.
    SessionWorkspace workspace = 29;
}

// WorkspaceStoragePlan is the RESOLVED storage decision for one spawn: which
// filesystem the checkout is mounted on and how much memory the container gets.
// See docs/software-factory/storage-tiers.md.
message WorkspaceStoragePlan {
    // tier is "" (the host bind mount every project had before this existed),
    // "persistent" (the same thing, stated) or "ephemeral" (a container-local
    // tmpfs). An unrecognized tier is refused rather than rounded down.
    string tier = 1;

    // tmpfs_size_bytes sizes the ephemeral tier's tmpfs checkout; zero is
    // unsized.
    int64 tmpfs_size_bytes = 2;

    // memory_bytes is the container's memory cgroup limit; zero leaves the
    // runtime's own default.
    int64 memory_bytes = 3;
}

message SpawnSessionResponse {
    string session_id = 1;
    string backend = 2;
    string model = 3;
    string container_id = 4;
    google.protobuf.Timestamp timestamp = 5;

    // THE ACCOUNT THE DAEMON RESOLVED, WITHOUT WHICH NO REMOTE SESSION HAS ONE.
    // Selection happens on the daemon — the credential lives in its secret
    // store and never crosses the wire — so the daemon is the only party that
    // knows which account the session is billing to. The control plane records
    // Session.AccountID on the durable record and stamps it onto every turn's
    // usage; with no field here it recorded the empty string for every session
    // that ran remotely, and the cost of that session was attributable to
    // nothing.
    string account_id = 6;
    string account_strategy = 7;

    // THE DELIVERY GRANT THIS SESSION'S CREDENTIAL WAS RELEASED UNDER, without
    // which no remote session's credential can ever be revoked.
    //
    // The grant is ISSUED by the control plane, when it released the credential
    // to this daemon (MaterializeAccountCredential). But the release happens
    // inside the daemon's account resolution, so the control plane cannot tell
    // which session the grant it issued belongs to — only the daemon can, and
    // this is where it says so (pkg/agent/account_grant.go). The control plane
    // records it on the durable session record, and the session's conclusion —
    // an operator's close, the job ending, a restart sweep — withdraws it once
    // no other live session is still being served under it.
    //
    // With no field here a remote session's provider credential would be leased
    // and then un-revocable, which is worse than not leasing it at all: the
    // grant would expire on its own TTL while claiming to be governed.
    string credential_lease_id = 8;

    // work_dir is the directory the agent provisioned the spawn's named
    // workspace at, on the agent's own host. Empty when the spawn named none.
    string work_dir = 9;
}

// PromptSession
message PromptSessionRequest {
    string backend = 1;
    string session_id = 2;
    string project_id = 3;
    string prompt = 4;
    string model = 5;
    string system_prompt = 6;
    bool use_rag = 7;
    string tenant_id = 8;
}

// PromptSessionResponse carries one of two shapes, told apart by `status`.
//
// For a prompt on an existing session the turn is asynchronous: `status` is
// "accepted", `turn_id` identifies the dispatched turn, `sequence` is the
// session-log sequence of its turn_started event, and `content` is empty. The
// turn's output arrives on SubscribeSessionEvents and ends with a
// turn_completed or turn_failed event carrying the same turn_id.
//
// For a stateless prompt against a named backend with no session there is no
// event log to publish to, so the completed turn is returned inline: `status`
// is empty and `content` holds the agent's output.
message PromptSessionResponse {
    string session_id = 1;
    repeated ContentBlock content = 2;
    string model = 3;
    string stop_reason = 4;
    google.protobuf.Timestamp timestamp = 5;
    string turn_id = 6;
    string status = 7;
    uint64 sequence = 8;
}

// SessionStatus
message SessionStatusRequest {
    string session_id = 1;
    string tenant_id = 2;
}

message SessionStatusResponse {
    string session_id = 1;
    SessionState state = 2;
    google.protobuf.Timestamp last_activity = 3;
    int64 uptime_seconds = 4;
    google.protobuf.Timestamp timestamp = 5;
}

// CloseSession
message CloseSessionRequest {
    string session_id = 1;
    string tenant_id = 2;
}

message CloseSessionResponse {
    string session_id = 1;
    google.protobuf.Timestamp timestamp = 2;
}

// RotateSessionAccount
message RotateSessionAccountRequest {
    string session_id = 1;
    string tenant_id = 2;

    // reason is recorded on the closed account segment and in the session
    // transcript.
    string reason = 3;

    // hold_outgoing marks the account being left as "limited" until
    // available_at_unix, keeping the next selection from walking straight back
    // into the seat the operator just condemned.
    bool hold_outgoing = 4;

    // available_at_unix is when a held outgoing account rejoins the pool, in
    // Unix seconds. Ignored unless hold_outgoing is set; zero applies the
    // server's default backoff.
    int64 available_at_unix = 5;
}

message RotateSessionAccountResponse {
    string session_id = 1;
    string previous_account_id = 2;
    string account_id = 3;
    string strategy = 4;
    string mode = 5;                   // "in_place" | "resume"
    google.protobuf.Timestamp timestamp = 6;
}

// ListSessions
message ListSessionsRequest {
    string backend = 1;
    string tenant_id = 2;

    // status filters by session lifecycle state ("active", "idle",
    // "resumable", "closed", "error"). Empty means every state, which is what
    // every caller that predates the filter sends.
    //
    // It exists because the list MERGES durable records with live ones: a
    // caller asking for active sessions was silently handed closed ones back
    // once reconciliation started writing terminal records (go-quicbaas#792).
    string status = 3;
}

message ListSessionsResponse {
    repeated SessionInfo sessions = 1;
    google.protobuf.Timestamp timestamp = 2;
}

