syntax = "proto3";

package quicbaas.orchestrator.v1;

option go_package = "github.com/jeremyhahn/go-quicbaas/api/proto;proto";

import "google/protobuf/timestamp.proto";
import "pkg/api/grpc/proto/qrdbv1/authz.proto";

// =============================================================================
// Orchestrator Service
// =============================================================================

service OrchestratorService {
    // Session Operations
    rpc SpawnSession(SpawnSessionRequest) returns (SpawnSessionResponse) {
        option (qrdb.v1.permission) = "orchestrator:spawn";
    }
    rpc PromptSession(PromptSessionRequest) returns (PromptSessionResponse) {
        option (qrdb.v1.permission) = "orchestrator:prompt";
    }
    rpc SessionStatus(SessionStatusRequest) returns (SessionStatusResponse) {
        option (qrdb.v1.permission) = "orchestrator:status";
    }
    rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse) {
        option (qrdb.v1.permission) = "orchestrator:close";
    }
    rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
        option (qrdb.v1.permission) = "orchestrator:list";
    }

    // RotateSessionAccount moves one session onto a different pooled provider
    // account. Rotation also happens automatically when a turn fails on a
    // classified provider limit; this is the operator-initiated door to the
    // same verb ("this seat is bad, move my session now").
    rpc RotateSessionAccount(RotateSessionAccountRequest) returns (RotateSessionAccountResponse) {
        option (qrdb.v1.permission) = "orchestrator:spawn";
    }

    // Task Operations
    rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_create";
    }
    rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_read";
    }
    rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_list";
    }
    rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_claim";
    }
    rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_complete";
    }
    rpc DecomposeTask(DecomposeTaskRequest) returns (DecomposeTaskResponse) {
        option (qrdb.v1.permission) = "orchestrator:task_decompose";
    }

    // Job Operations
    rpc StartJob(OrchestratorStartJobRequest) returns (OrchestratorStartJobResponse) {
        option (qrdb.v1.permission) = "orchestrator:job_start";
    }
    rpc GetJobStatus(OrchestratorGetJobStatusRequest) returns (OrchestratorGetJobStatusResponse) {
        option (qrdb.v1.permission) = "orchestrator:job_read";
    }
    rpc CancelJob(OrchestratorCancelJobRequest) returns (OrchestratorCancelJobResponse) {
        option (qrdb.v1.permission) = "orchestrator:job_cancel";
    }
    rpc ListJobs(OrchestratorListJobsRequest) returns (OrchestratorListJobsResponse) {
        option (qrdb.v1.permission) = "orchestrator:job_list";
    }

    // Event Streaming
    rpc SubscribeJobEvents(SubscribeJobEventsRequest) returns (stream JobEvent) {
        option (qrdb.v1.permission) = "orchestrator:job_read";
    }

    // Backend Operations
    rpc ListBackends(OrchestratorListBackendsRequest) returns (OrchestratorListBackendsResponse) {
        option (qrdb.v1.permission) = "orchestrator:backend_list";
    }

    // Health Operations
    rpc Health(OrchestratorHealthRequest) returns (OrchestratorHealthResponse) {
        option (qrdb.v1.permission) = "orchestrator:health";
    }

    // Agent Fleet Management
    rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse) {
        option (qrdb.v1.permission) = "orchestrator:agent_register";
    }
    rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
        option (qrdb.v1.permission) = "orchestrator:agent_read";
    }
    rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
        option (qrdb.v1.permission) = "orchestrator:agent_list";
    }
    rpc RemoveAgent(RemoveAgentRequest) returns (RemoveAgentResponse) {
        option (qrdb.v1.permission) = "orchestrator:agent_remove";
    }
    rpc AgentHeartbeat(AgentHeartbeatRequest) returns (AgentHeartbeatResponse) {
        option (qrdb.v1.permission) = "orchestrator:agent_heartbeat";
    }

    // Session event ingest (Phase 3). Daemon-side agents open a bidi stream
    // and push each session event as PushEventRequest; the control plane acks
    // with EventAck carrying the accepted sequence. At-least-once delivery:
    // daemon re-sends events the control plane hasn't ack'd after reconnect.
    rpc PushEvents(stream PushEventRequest) returns (stream PushEventAck) {
        option (qrdb.v1.permission) = "orchestrator:hook";
    }

    // Session event subscription (Phase 4). Operators attach to a session
    // to see prompts, assistant output, tool calls, file ops in real time.
    // When from_sequence > 0 the stream begins with the historical replay
    // from that sequence, then transitions to live tail when follow is true.
    rpc SubscribeSessionEvents(SubscribeSessionRequest) returns (stream SessionEventEnvelope) {
        option (qrdb.v1.permission) = "orchestrator:status";
    }

    // Inference runs a stateless prompt against a named backend without
    // requiring a prior session. The response is aggregated and returned
    // as a single InferenceResponse. For streaming use InferenceStream.
    rpc Inference(InferenceRequest) returns (InferenceResponse) {
        option (qrdb.v1.permission) = "orchestrator:inference";
    }

    // InferenceStream runs a stateless prompt against a named backend and
    // streams InferenceChunk frames until the backend signals completion.
    // The final frame carries final=true and the aggregated stop_reason.
    rpc InferenceStream(InferenceRequest) returns (stream InferenceChunk) {
        option (qrdb.v1.permission) = "orchestrator:inference";
    }

    // SpawnChildJob fans out a child job from a parent job's lead agent.
    // The calling agent MUST be the registered lead of parent_job_id; any
    // other caller receives PERMISSION_DENIED (not_lead_of_parent).
    rpc SpawnChildJob(SpawnChildJobRequest) returns (SpawnChildJobResponse) {
        option (qrdb.v1.permission) = "orchestrator:job_start";
    }

    // SubmitTaskArtifacts attaches typed artifacts to a completed task.
    // Artifacts exceeding the server-side InlineLimit are stored in the
    // QuicBaaS KV store; the task record carries only the Ref.
    rpc SubmitTaskArtifacts(SubmitTaskArtifactsRequest) returns (SubmitTaskArtifactsResponse) {
        option (qrdb.v1.permission) = "orchestrator:artifact_submit";
    }

    // ListTaskArtifacts returns artifact metadata for a task without resolving
    // large Refs to their content.
    rpc ListTaskArtifacts(ListTaskArtifactsRequest) returns (ListTaskArtifactsResponse) {
        option (qrdb.v1.permission) = "orchestrator:artifact_read";
    }

    // GetTaskArtifact retrieves a single named artifact, resolving kv_key Refs
    // to their full byte content.
    rpc GetTaskArtifact(GetTaskArtifactRequest) returns (GetTaskArtifactResponse) {
        option (qrdb.v1.permission) = "orchestrator:artifact_read";
    }
}

// =============================================================================
// Enums
// =============================================================================

enum TaskStatus {
    TASK_STATUS_UNSPECIFIED = 0;
    TASK_STATUS_PENDING = 1;
    TASK_STATUS_CLAIMED = 2;
    TASK_STATUS_IN_PROGRESS = 3;
    TASK_STATUS_COMPLETED = 4;
    TASK_STATUS_FAILED = 5;
    TASK_STATUS_CANCELLED = 6;
}

enum AgentStatus {
    AGENT_STATUS_UNSPECIFIED = 0;
    AGENT_STATUS_ONLINE = 1;
    AGENT_STATUS_OFFLINE = 2;
    AGENT_STATUS_BUSY = 3;
    AGENT_STATUS_ERROR = 4;
    AGENT_STATUS_DRAINING = 5;
}

enum SessionState {
    SESSION_STATE_UNSPECIFIED = 0;
    SESSION_STATE_ACTIVE = 1;
    SESSION_STATE_IDLE = 2;
    SESSION_STATE_CLOSED = 3;
    SESSION_STATE_ERROR = 4;
    // SESSION_STATE_RESUMABLE marks a session whose durable record survived a
    // daemon restart but whose agent process did not. The session is
    // addressable and its transcript is intact; the next prompt reconstitutes
    // the process and restores the conversation before the turn runs.
    SESSION_STATE_RESUMABLE = 5;
}

// SandboxMode selects the execution sandboxing strategy for an agent
// session. The server resolves SANDBOX_MODE_DEFAULT per its active
// SandboxPolicy (and any tenant override). SANDBOX_MODE_REQUIRED forces
// container execution; SANDBOX_MODE_NONE forces raw exec. Both are
// subject to the server's policy — REQUIRED is rejected if no container
// runtime is available; NONE is rejected if the policy forbids raw exec.
enum SandboxMode {
    SANDBOX_MODE_DEFAULT = 0;
    SANDBOX_MODE_REQUIRED = 1;
    SANDBOX_MODE_NONE = 2;
}

// =============================================================================
// Core Types
// =============================================================================

// MCPServerConfig configures an MCP server for an agent session.
message MCPServerConfig {
    string name = 1;
    string url = 2;
    map<string, string> env = 3;
}

// ContainerSpec defines a container configuration for sandboxed sessions.
message ContainerSpec {
    string image = 1;
    repeated string command = 2;
    map<string, string> env = 3;
    repeated string volumes = 4;
    string work_dir = 5;
    string network = 6;
    string name = 7;
}

// ContentBlock represents a block of content in a response.
message ContentBlock {
    string type = 1;
    string text = 2;
}

// SessionInfo contains summary information about an active session.
message SessionInfo {
    string session_id = 1;
    string project_id = 2;
    string backend = 3;
    string model = 4;
    SessionState state = 5;
    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp last_activity = 7;
}

// Task represents an orchestration work item.
message Task {
    string id = 1;
    string tenant_id = 2;
    string team_name = 3;
    string subject = 4;
    string description = 5;
    TaskStatus status = 6;
    string assigned_to = 7;
    string created_by = 8;
    repeated string dependencies = 9;
    repeated string blocks = 10;
    TaskResult result = 11;
    map<string, string> metadata = 12;
    google.protobuf.Timestamp created_at = 13;
    google.protobuf.Timestamp updated_at = 14;
    google.protobuf.Timestamp claimed_at = 15;
    google.protobuf.Timestamp completed_at = 16;
    uint64 version = 17;
    bool auto_spawn = 18;
    string spawned_job_id = 19;
    google.protobuf.Timestamp spawned_at = 20;
}

// TaskResult contains the output of a completed task.
message TaskResult {
    string output = 1;
    repeated string files = 2;
    map<string, string> metadata = 3;
}

// TaskFilter specifies criteria for listing tasks.
message TaskFilter {
    string team_name = 1;
    TaskStatus status = 2;
    string assigned_to = 3;
    string created_by = 4;
    int32 limit = 5;
}

// OrchestratorWorkItem represents a decomposed unit of work.
message OrchestratorWorkItem {
    string id = 1;
    string project_id = 2;
    string title = 3;
    string description = 4;
    int32 priority = 5;
    repeated string dependencies = 6;
}

// AgentRegistration represents a registered agent in the fleet registry.
message AgentRegistration {
    string id = 1;
    string tenant_id = 2;
    string name = 3;
    string host = 4;
    string backend = 5;
    string agent_type = 6;
    AgentStatus status = 7;
    repeated string capabilities = 8;
    string container_id = 9;
    string work_dir = 10;
    google.protobuf.Timestamp last_seen = 11;
    google.protobuf.Timestamp registered_at = 12;
    uint64 version = 13;
    map<string, string> metadata = 14;
    string model = 15;
}

// AgentFilter specifies criteria for listing agents.
message AgentFilter {
    string host = 1;
    AgentStatus status = 2;
    string agent_type = 3;
    string backend = 4;
    int32 limit = 5;
    string model = 6;
}

// BackendCapabilities describes what a backend supports.
message BackendCapabilities {
    bool supports_sessions = 1;
    bool supports_streaming = 2;
    bool supports_mcp = 3;
    bool supports_rag = 4;
    bool supports_tools = 5;
    string kind = 6;
}

// AgentBackendInfo contains information about a registered agent backend.
message AgentBackendInfo {
    string name = 1;
    string type = 2;
    BackendCapabilities capabilities = 3;
    string default_model = 4;
}

// SessionHealthResult contains the health check result for a single session.
message SessionHealthResult {
    string session_id = 1;
    string backend = 2;
    SessionState state = 3;
    bool healthy = 4;
    string error = 5;
}

// HealthCheckReport contains the results of checking all active sessions.
message HealthCheckReport {
    google.protobuf.Timestamp timestamp = 1;
    int32 total_sessions = 2;
    int32 healthy = 3;
    int32 unhealthy = 4;
    int32 closed = 5;
    repeated SessionHealthResult results = 6;
}

// =============================================================================
// Session Requests and Responses
// =============================================================================

// SpawnSession
message SpawnSessionRequest {
    string backend = 1;
    string project_id = 2;
    string model = 3;
    string system_prompt = 4;
    repeated MCPServerConfig mcp_servers = 5;
    map<string, string> env = 6;
    string work_dir = 7;
    bool sandboxed = 8;                // deprecated: use sandbox_mode
    string container_image = 9;
    ContainerSpec container_config = 10;
    string tenant_id = 11;
    SandboxMode sandbox_mode = 12;
    string host_affinity = 13;         // pin to a specific agent daemon (Name or Host)
    bool host_affinity_strict = 14;    // when true, fail with NoMatchingAgentError if host_affinity is offline (overrides operator soft default)
    bool persistent = 15;              // when true, spawn a durable multi-turn session (CLI-mode backends register it in the session registry for Prompt/Status/Close); when false the backend uses one-shot-per-prompt execution

    // Pooled provider account selection. account_id pins the session to one
    // account; account_auto asks the named strategy to choose. The account a
    // session resolves to is persisted on its durable record and replayed as a
    // pin on resume, so a reconstituted session never lands on a different
    // provider account than the one it has been billing to.
    string account_id = 16;
    bool account_auto = 17;
    string account_strategy = 18;      // "static" | "least_usage"; empty selects the registry default

    // account_allow optionally names the accounts this session may use and
    // rotate through. It is an additive filter, never a source: an id the
    // tenant does not own is simply not a candidate. Together with
    // account_auto it is what authorizes rotation — a session with neither is
    // a deliberate pin and is never moved off its account.
    repeated string account_allow = 19;
}

message SpawnSessionResponse {
    string session_id = 1;
    string backend = 2;
    string model = 3;
    string container_id = 4;
    google.protobuf.Timestamp timestamp = 5;
}

// PromptSession
message PromptSessionRequest {
    string backend = 1;
    string session_id = 2;
    string project_id = 3;
    string prompt = 4;
    string model = 5;
    string system_prompt = 6;
    bool use_rag = 7;
    string tenant_id = 8;
}

// PromptSessionResponse carries one of two shapes, told apart by `status`.
//
// For a prompt on an existing session the turn is asynchronous: `status` is
// "accepted", `turn_id` identifies the dispatched turn, `sequence` is the
// session-log sequence of its turn_started event, and `content` is empty. The
// turn's output arrives on SubscribeSessionEvents and ends with a
// turn_completed or turn_failed event carrying the same turn_id.
//
// For a stateless prompt against a named backend with no session there is no
// event log to publish to, so the completed turn is returned inline: `status`
// is empty and `content` holds the agent's output.
message PromptSessionResponse {
    string session_id = 1;
    repeated ContentBlock content = 2;
    string model = 3;
    string stop_reason = 4;
    google.protobuf.Timestamp timestamp = 5;
    string turn_id = 6;
    string status = 7;
    uint64 sequence = 8;
}

// SessionStatus
message SessionStatusRequest {
    string session_id = 1;
    string tenant_id = 2;
}

message SessionStatusResponse {
    string session_id = 1;
    SessionState state = 2;
    google.protobuf.Timestamp last_activity = 3;
    int64 uptime_seconds = 4;
    google.protobuf.Timestamp timestamp = 5;
}

// CloseSession
message CloseSessionRequest {
    string session_id = 1;
    string tenant_id = 2;
}

message CloseSessionResponse {
    string session_id = 1;
    google.protobuf.Timestamp timestamp = 2;
}

// RotateSessionAccount
message RotateSessionAccountRequest {
    string session_id = 1;
    string tenant_id = 2;

    // reason is recorded on the closed account segment and in the session
    // transcript.
    string reason = 3;

    // hold_outgoing marks the account being left as "limited" until
    // available_at_unix, keeping the next selection from walking straight back
    // into the seat the operator just condemned.
    bool hold_outgoing = 4;

    // available_at_unix is when a held outgoing account rejoins the pool, in
    // Unix seconds. Ignored unless hold_outgoing is set; zero applies the
    // server's default backoff.
    int64 available_at_unix = 5;
}

message RotateSessionAccountResponse {
    string session_id = 1;
    string previous_account_id = 2;
    string account_id = 3;
    string strategy = 4;
    string mode = 5;                   // "in_place" | "resume"
    google.protobuf.Timestamp timestamp = 6;
}

// ListSessions
message ListSessionsRequest {
    string backend = 1;
    string tenant_id = 2;
}

message ListSessionsResponse {
    repeated SessionInfo sessions = 1;
    google.protobuf.Timestamp timestamp = 2;
}

