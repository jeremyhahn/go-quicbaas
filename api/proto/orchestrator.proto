// =============================================================================
// Fleet Management Requests and Responses
// =============================================================================

// RegisterFleetNode
message RegisterFleetNodeRequest {
    string tenant_id = 1;
    string name = 2;
    string host = 3;
    string backend = 4;
    string node_type = 5;
    repeated string capabilities = 6;
    string work_dir = 7;
    map<string, string> metadata = 8;
    string model = 9;
}

message RegisterFleetNodeResponse {
    FleetNode node = 1;
    google.protobuf.Timestamp timestamp = 2;
}

// GetFleetNode
message GetFleetNodeRequest {
    string tenant_id = 1;
    string node_id = 2;
}

message GetFleetNodeResponse {
    FleetNode node = 1;
    google.protobuf.Timestamp timestamp = 2;
}

// ListFleetNodes
message ListFleetNodesRequest {
    string tenant_id = 1;
    FleetNodeFilter filter = 2;

    // Paging, sorting and search — the contract every list endpoint speaks
    // (docs/software-factory/api.md). limit 0 takes the default page (25);
    // anything above 100 is capped. sort is "<field>" or "<field>:desc",
    // naming a field from the endpoint's allow-list; an unknown field is
    // refused with InvalidArgument. q is a case-insensitive substring
    // matched against the endpoint's documented text fields.
    int32 limit = 3;
    int32 offset = 4;
    string sort = 5;
    string q = 6;
}

message ListFleetNodesResponse {
    repeated FleetNode nodes = 1;
    int32 count = 2;
    google.protobuf.Timestamp timestamp = 3;

    // The paging envelope. total counts the records that matched the filters
    // and the search BEFORE the page was cut; limit and offset are the values
    // the server APPLIED. next_offset is the offset of the following page and
    // is zero on the last page.
    int32 total = 4;
    int32 limit = 5;
    int32 offset = 6;
    int32 next_offset = 7;
}

// RemoveFleetNode
message RemoveFleetNodeRequest {
    string tenant_id = 1;
    string node_id = 2;
}

message RemoveFleetNodeResponse {
    string node_id = 1;
    bool removed = 2;
    google.protobuf.Timestamp timestamp = 3;
}

// FleetNodeHeartbeat
message FleetNodeHeartbeatRequest {
    string tenant_id = 1;
    string node_id = 2;
}

message FleetNodeHeartbeatResponse {
    string node_id = 1;
    bool acknowledged = 2;
    google.protobuf.Timestamp timestamp = 3;
}

// =============================================================================
// Session Event Stream (Phase 3+4)
// =============================================================================

// PushEventRequest carries one event from a daemon to the control plane. The
// payload is opaque JSON (encoded pkg/orchestration.SessionEvent) so the
// full union of event kinds passes through without requiring a proto
// oneof — trading a small wire overhead for a stable surface as new event
// kinds are added.
message PushEventRequest {
    string session_id = 1;
    string tenant_id = 2;
    uint64 sequence = 3;
    bytes payload_json = 4;
    google.protobuf.Timestamp emitted_at = 5;
}

// PushEventAck is returned per accepted event. sequence echoes the event
// sequence; status is one of "ok", "gap" (caller must re-send from
// accepted_seq+1), "rejected" (permanent failure, operator must
// investigate).
message PushEventAck {
    string session_id = 1;
    uint64 sequence = 2;
    string status = 3;
    string detail = 4;
    uint64 accepted_seq = 5;
}

// SubscribeSessionRequest opens an event stream to a single session. When
// from_sequence > 0 the stream begins with the historical replay starting
// at that sequence and transitions to live tail once history is drained.
// When follow is false, the stream closes once history is exhausted.
message SubscribeSessionRequest {
    string tenant_id = 1;
    string session_id = 2;
    uint64 from_sequence = 3;
    bool follow = 4;
}

// SessionEventEnvelope delivers one event + metadata over the subscribe
// stream. Same opaque-JSON approach as PushEventRequest for the payload.
message SessionEventEnvelope {
    string session_id = 1;
    string tenant_id = 2;
    uint64 sequence = 3;
    bytes payload_json = 4;
    google.protobuf.Timestamp timestamp = 5;
    bool from_replay = 6; // true while draining history, false once tailing live
}

// GetSessionConversationRequest addresses one page of a session's conversation.
message GetSessionConversationRequest {
    string tenant_id = 1;
    string session_id = 2;
    // cursor is the next_cursor of a previous page. 0 starts at the
    // beginning of the RETAINED transcript, which retention may have moved.
    uint64 cursor = 3;
    // limit is the maximum number of turns to return. 0 selects the server
    // default (100); the server caps it at 500.
    uint32 limit = 4;
}

// SessionToolUse summarises one tool call inside an assistant turn. The
// arguments and output stay on the event stream: copying them here would make
// every history page carry the weight of the transcript it indexes.
message SessionToolUse {
    string invocation_id = 1;
    string name = 2;
    bool is_error = 3;
    int64 result_bytes = 4;
}

// SessionTurn is one record in a session's conversation.
message SessionTurn {
    // sequence is the log sequence of the turn's first event, and the cursor
    // that addresses it.
    uint64 sequence = 1;
    string session_id = 2;
    string tenant_id = 3;
    // role is "user", "assistant" or "system".
    string role = 4;
    google.protobuf.Timestamp timestamp = 5;
    string text = 6;
    // truncated_bytes is how much text the storage cap removed. Non-zero
    // means text is not the whole of what was said.
    int64 truncated_bytes = 7;
    string model = 8;
    string stop_reason = 9;
    repeated SessionToolUse tools = 10;
    // usage_json is the turn's token accounting as the backend reported it,
    // carried as JSON for the same reason payload_json is: the accounting
    // shape is the orchestration package's and must not fork on the wire.
    bytes usage_json = 11;
}

// GetSessionConversationResponse is one page of a session's conversation.
message GetSessionConversationResponse {
    string session_id = 1;
    string tenant_id = 2;
    repeated SessionTurn turns = 3;
    // next_cursor is the cursor for the following page, or 0 at the end.
    uint64 next_cursor = 4;
    // oldest_sequence is the lowest sequence the log still holds. Above 1
    // means retention has dropped earlier turns.
    uint64 oldest_sequence = 5;
}

// =============================================================================
// Spend reporting (the consumption ledger's read side)
// =============================================================================

// GetSpendReportRequest addresses one scope of the attribution chain.
//
// The levels are a PATH: each may be set only if every level above it is. A
// scope that skips one is refused rather than answered by a scan of the
// tenant's whole history.
message GetSpendReportRequest {
    string tenant_id = 1;
    string project_id = 2;
    string task_id = 3;
    string job_id = 4;
    string session_id = 5;
    // round selects one round below the session, applied only when round_set
    // is true so round 0 — a real level — is distinguishable from "every
    // round".
    int32 round = 6;
    bool round_set = 7;
    // from and to narrow the report to the turns that occurred in
    // [from, to). from alone ranges up to now; to alone is refused. Both unset
    // report the scope's whole history.
    google.protobuf.Timestamp from = 8;
    google.protobuf.Timestamp to = 9;
    // host narrows the report to the turns that ran on one host; empty
    // reports every host, and "-" the turns that name none.
    string host = 10;
    // agent narrows the report to the turns of the sessions one tenant Agent
    // ran; empty reports every Agent, and "-" the raw-backend sessions.
    string agent = 11;
}

// SpendWindowStatus is one sliding quota window and what has been drawn
// against it.
message SpendWindowStatus {
    string name = 1;
    // size_nanos is the window's length. Nanoseconds rather than seconds
    // because the policy field it mirrors is a Go time.Duration and a
    // sub-second window would otherwise round to "no window at all".
    int64 size_nanos = 2;
    int64 max_tokens = 3;
    int64 used_tokens = 4;
    int64 remaining_tokens = 5;
    bool exhausted = 6;
    // frees_at is when the window's oldest entry ages out. Unset when the
    // window holds nothing, because there is nothing to age out.
    google.protobuf.Timestamp frees_at = 7;
    // The dollar axis, in millionths of a US dollar at list price over the
    // window's priced turns. max_equivalent_micros is 0 when the window does
    // not meter dollars (and max_tokens 0 when it does not meter tokens).
    int64 max_equivalent_micros = 8;
    int64 used_equivalent_micros = 9;
    int64 remaining_equivalent_micros = 10;
}

// SpendBreakerVerdict is an account's derived circuit-breaker state and the
// evidence it was derived from. A breaker that refuses without showing its
// working is indistinguishable from one that is broken.
message SpendBreakerVerdict {
    // state is "closed", "open" or "half_open".
    string state = 1;
    int32 failures = 2;
    int32 successes = 3;
    google.protobuf.Timestamp last_failure_at = 4;
    google.protobuf.Timestamp last_success_at = 5;
    // open_until is when an open breaker becomes half-open; unset otherwise.
    google.protobuf.Timestamp open_until = 6;
}

// SpendTotals is what a set of consumption entries sums to. It is the shape of
// a report's own totals and of every breakdown row under it.
message SpendTotals {
    int32 entries = 1;
    // input_tokens is the FRESH prompt; the two cache dimensions are prompt
    // tokens served from and written into the provider's cache, reported
    // apart because they price differently.
    int64 input_tokens = 2;
    int64 output_tokens = 3;
    int64 cache_read_tokens = 4;
    int64 cache_write_tokens = 5;
    int64 total_tokens = 6;
    // equivalent_micros is the list-price equivalent of the PRICED entries,
    // in millionths of the report's currency. A CLIENT MUST CONSULT
    // priced_entries BEFORE RENDERING IT: zero priced entries means nothing
    // was priced and the figure is a dash, never a zero. unpriced_entries > 0
    // beside priced ones means the figure is a floor.
    int64 equivalent_micros = 7;
    int32 priced_entries = 8;
    int32 unpriced_entries = 9;
    int64 duration_ms = 10;
    int32 successes = 11;
    int32 failures = 12;
    // billed_micros is what the entries whose bill is known added to it:
    // zero per turn on a subscription, the list price on a metered key, the
    // operator's rate for an unpooled turn. Consult billed_entries as for
    // equivalent_micros.
    int64 billed_micros = 13;
    int32 billed_entries = 14;
    int32 unbilled_entries = 15;
    // energy_mwh is the energy drawn by the entries costed from electricity,
    // in milliwatt-hours (a kWh is 1e6); electricity_entries counts them.
    // Consult electricity_entries before rendering it: none is a dash.
    int64 energy_mwh = 16;
    int32 electricity_entries = 17;
    // measured_energy_entries counts the electricity entries whose energy
    // came from fleet device telemetry (measured or derived) rather than a
    // configured draw; the rest of electricity_entries were estimated.
    int32 measured_energy_entries = 18;
}

// SpendAccount is one pooled account's contribution to a scope, and the
// allowance it draws against.
message SpendAccount {
    reserved 4;
    string account_id = 1;
    string display_name = 2;
    string provider = 3;
    SpendTotals totals = 8;
    // billing_mode is "subscription", "api", or empty when not configured.
    string billing_mode = 9;
    // monthly_fee_micros is a subscription's flat monthly fee, 0 when not
    // configured.
    int64 monthly_fee_micros = 10;
    // subscription_fee_micros is the part of that fee falling in the report's
    // range. Set only on a tenant-level report and only for a subscription
    // whose fee is configured; unset renders as a dash, never as zero.
    optional int64 subscription_fee_micros = 11;
    // policy_status is "unknown", "none" or "metered". THE THREE ARE
    // DIFFERENT FACTS: "none" says the account was read and meters nothing,
    // "unknown" says nothing could read it. A client that collapses them
    // reports an unwired deployment as a fleet of uncapped accounts.
    string policy_status = 5;
    repeated SpendWindowStatus windows = 6;
    // breaker is unset when the account carries no breaker rule, which is
    // not the same as a closed breaker.
    SpendBreakerVerdict breaker = 7;
}

// SpendModel is one engine/model pair's share of a scope's spend.
message SpendModel {
    reserved 3;
    string engine = 1;
    string model = 2;
    SpendTotals totals = 4;
}

// SpendHost is one host's share of a scope's spend.
message SpendHost {
    // host is the host the turns ran on, empty when unattributed.
    string host = 1;
    // unattributed marks the turns that name no host.
    bool unattributed = 2;
    SpendTotals totals = 3;
}

// SpendAgent is one tenant Agent's share of a scope's spend.
message SpendAgent {
    // agent_id is the Agent's catalog ID, empty when unattributed.
    string agent_id = 1;
    // name is the Agent's name when it still exists.
    string name = 2;
    // unattributed marks the turns of raw-backend sessions.
    bool unattributed = 3;
    SpendTotals totals = 4;
}

// SpendChild is one drill-down row: the next chain level below the scope.
message SpendChild {
    // id is the child's identifier, empty when unattributed.
    string id = 1;
    // level names what id identifies: "project", "task", "job", "session" or
    // "round".
    string level = 2;
    // unattributed marks the subtree the ledger files under its no-value
    // sentinel — a job with no task. Real spend with no parent at this
    // level, to be labelled rather than shown as an entity named "-".
    bool unattributed = 3;
    reserved 4;
    // name is the child's human name where the level has one (a project),
    // empty when unattributed or when the entity no longer exists.
    string name = 5;
    SpendTotals totals = 6;
}

// GetSpendReportResponse is one scope's consumption and its drill-down.
message GetSpendReportResponse {
    // level names the chain level the scope addresses.
    string level = 1;
    string tenant_id = 2;
    string project_id = 3;
    string task_id = 4;
    string job_id = 5;
    string session_id = 6;
    int32 round = 7;

    // 8-15 and 23-24 were the flat token counts, now carried in totals.
    reserved 8 to 15, 23, 24;

    google.protobuf.Timestamp first_at = 16;
    google.protobuf.Timestamp last_at = 17;

    repeated SpendAccount accounts = 18;
    repeated SpendModel models = 19;

    // child_level names the level children are at, empty at the deepest
    // level where there is nothing below to attribute to.
    string child_level = 20;
    repeated SpendChild children = 21;

    // project_name is the name of the project the scope addresses, when it
    // still exists.
    string project_name = 22;
    SpendTotals totals = 25;
    // currency is what every money figure on the report is denominated in.
    string currency = 26;
    // from and to echo the range the report was narrowed to; unset for a
    // report over the scope's whole history.
    google.protobuf.Timestamp from = 27;
    google.protobuf.Timestamp to = 28;
    // subscription_fee_micros sums the accounts' fee shares: what the
    // tenant's subscriptions cost over the range, beside the per-turn billed
    // figure. Unset below the tenant level or when no subscription carries a
    // fee.
    optional int64 subscription_fee_micros = 29;
    // scope_policy_status and scope_windows are the scope's OWN spend limits
    // — a project's at project level, the tenant's at tenant level — with
    // live usage against each window. The status is "none", "metered" or
    // "unknown" as for an account; both are unset at the deeper levels,
    // which carry no limits of their own.
    string scope_policy_status = 30;
    repeated SpendWindowStatus scope_windows = 31;
    // host echoes the host the report was narrowed to, empty for every
    // host; hosts breaks the totals down by the host each turn ran on.
    string host = 32;
    repeated SpendHost hosts = 33;
    // agent echoes the Agent the report was narrowed to; agents breaks the
    // totals down by the Agent each turn's session ran as.
    string agent = 34;
    repeated SpendAgent agents = 35;
    // agent_policy_status and agent_windows are the narrowed-to Agent's own
    // spend limits with live usage — what a spawn of it is checked against.
    // "unknown" when no catalog is wired or the Agent is gone; unset when
    // the report is not narrowed to one Agent.
    string agent_policy_status = 36;
    repeated SpendWindowStatus agent_windows = 37;
}

// GetTenantSpendPolicyRequest names the tenant whose limits to read.
message GetTenantSpendPolicyRequest {
    string tenant_id = 1;
}

// SetTenantSpendPolicyRequest replaces a tenant's limits.
message SetTenantSpendPolicyRequest {
    string tenant_id = 1;
    quicbaas.spend.v1.SpendLimits limits = 2;
}

// TenantSpendPolicyResponse is a tenant's limits and its live usage against
// each window. A tenant that never set limits is unmetered: limits unset,
// updated_at unset.
message TenantSpendPolicyResponse {
    string tenant_id = 1;
    quicbaas.spend.v1.SpendLimits limits = 2;
    google.protobuf.Timestamp updated_at = 3;
    repeated SpendWindowStatus windows = 4;
}

// =============================================================================
// Inference Requests and Responses (CLIENT → CENTRAL leg)
// =============================================================================

// InferenceRequest carries the parameters for a stateless inference call
// from an operator client to the control plane quicbaasd. The control plane routes the
// call to a fleet-resident daemon that hosts the named backend.
message InferenceRequest {
    // backend is the named backend to route to (e.g., "ollama"). Required.
    string backend = 1;

    // model is the model to use. When empty the backend's default is used.
    string model = 2;

    // prompt is the user prompt text. Required.
    string prompt = 3;

    // system_prompt is an optional system message prepended to the context.
    string system_prompt = 4;

    // host_affinity pins the call to a specific agent daemon by Name or Host.
    string host_affinity = 5;

    // tenant_id is the calling tenant for multi-tenant enforcement.
    string tenant_id = 6;

    // metadata is an opaque string-to-string map forwarded to the backend.
    map<string, string> metadata = 7;

    // gpu_required restricts dispatch to daemons that advertise "gpu" in
    // their Capabilities slice.
    bool gpu_required = 8;

    // host_affinity_strict, when true, forces hard host_affinity semantics for
    // this request: if the requested host is offline the request fails with
    // NoMatchingAgentError instead of falling back to any available daemon.
    // Overrides the operator-level orchestration.host_affinity.mode default.
    bool host_affinity_strict = 9;
}

// InferenceResponse is the aggregated response returned by the unary
// Inference RPC. Content holds all content blocks from the backend.
message InferenceResponse {
    // content holds the full concatenated content blocks from all chunks.
    repeated ContentBlock content = 1;

    // model is the model that produced the response.
    string model = 2;

    // stop_reason is the reason the model stopped generating.
    string stop_reason = 3;
}

// InferenceChunk is one delta frame from the InferenceStream server-streaming
// RPC. Callers accumulate blocks across frames; the final frame has final=true.
message InferenceChunk {
    // delta carries the content blocks emitted by the backend for this frame.
    repeated ContentBlock delta = 1;

    // model is the model that produced this frame; set on the final frame.
    string model = 2;

    // stop_reason is set on the final frame. Empty on intermediate frames.
    string stop_reason = 3;

    // final is true on the last frame. Callers must not request further frames
    // after receiving a frame with final=true.
    bool final = 4;
}

// =============================================================================
// Sub-job Spawning Messages
// =============================================================================

// TaskSpec is an inline task definition supplied when spawning a child job
// without an existing workflow definition.
message TaskSpec {
    string title = 1;
    string description = 2;
    repeated string dependencies = 3;
    repeated string required_capabilities = 4;
}

// SpawnChildJobRequest fans out a child job from the calling lead agent.
message SpawnChildJobRequest {
    // parent_job_id is the parent whose lead agent is spawning this child.
    string parent_job_id = 1;

    // tenant_id scopes the operation (required).
    string tenant_id = 2;

    // workflow_id optionally names an existing workflow definition.
    string workflow_id = 3;

    // project_id scopes the child job to a registered project.
    string project_id = 4;

    // tasks provides inline task specs when no workflow is referenced.
    repeated TaskSpec tasks = 5;

    // host_affinity pins the child to a specific agent daemon.
    string host_affinity = 6;

    // gpu_required restricts dispatch to GPU-capable daemons.
    bool gpu_required = 7;

    // host_affinity_strict treats host_affinity as a hard constraint.
    bool host_affinity_strict = 8;
}

// SpawnChildJobResponse is returned after the child job has been accepted.
message SpawnChildJobResponse {
    string child_job_id = 1;
}

// =============================================================================
// Artifact Messages
// =============================================================================

// ArtifactRef locates large or external artifact content.
message ArtifactRef {
    string agent_id = 1;
    string path = 2;
    string sha = 3;
    string branch = 4;
}

// Artifact is a typed, named task output or input.
message Artifact {
    string kind = 1;
    string name = 2;
    string mime_type = 3;
    int64 size = 4;
    bytes content = 5;
    ArtifactRef ref = 6;
    map<string, string> metadata = 7;
}

// SubmitTaskArtifacts
message SubmitTaskArtifactsRequest {
    string tenant_id = 1;
    string task_id = 2;
    repeated Artifact artifacts = 3;
}

message SubmitTaskArtifactsResponse {
    string task_id = 1;
    int32 stored = 2;
    google.protobuf.Timestamp timestamp = 3;
}

// ListTaskArtifacts
message ListTaskArtifactsRequest {
    string tenant_id = 1;
    string task_id = 2;
    int32 limit = 3;
    int32 offset = 4;
    string sort = 5;
    string q = 6;
}

message ListTaskArtifactsResponse {
    repeated Artifact artifacts = 1;
    google.protobuf.Timestamp timestamp = 2;
    int32 total = 3;
    int32 limit = 4;
    int32 offset = 5;
    int32 next_offset = 6;
}

// GetTaskArtifact
message GetTaskArtifactRequest {
    string tenant_id = 1;
    string task_id = 2;
    string name = 3;
}

message GetTaskArtifactResponse {
    Artifact artifact = 1;
    google.protobuf.Timestamp timestamp = 2;
}

// TurnFailureEvidence is an agent CLI's own structured account of a turn that
// ended in error, carried from the daemon that ran the process back to the
// control plane that dispatched it.
//
// IT TRAVELS AS A STATUS DETAIL ON A FAILED Prompt, not in the response
// message, because the failure IS the RPC's error. Additive and optional in
// both directions: a daemon that does not attach it and a client that does not
// read it behave exactly as they did before (go-quicbaas#235).
//
// WHAT IS DELIBERATELY NOT HERE: the CLI's own result / stderr text. That is
// the field most likely to carry a credential, it is withheld from every error
// string on the daemon side already, and putting it on the wire would undo
// that. Only the closed-enum reason and the counts travel. The reason is
// re-checked against the control plane's own allowlist on arrival, so a daemon
// cannot make the control plane render a string of its choosing.
message TurnFailureEvidence {
    // terminal_reason is the CLI's own name for why its query loop stopped.
    string terminal_reason = 1;

    // num_turns is the CLI's turn count. Diagnostic only.
    int32 num_turns = 2;

    // usage_reported distinguishes "the CLI reported no accounting" from "the
    // CLI reported zero", which is the entire discriminator for whether a
    // model turn ran. Without it the two are indistinguishable on the wire,
    // and a turn that reported nothing would be refunded as though it had
    // reported zero.
    bool usage_reported = 3;

    int64 input_tokens = 4;
    int64 output_tokens = 5;
    int64 cache_creation_input_tokens = 6;
    int64 cache_read_input_tokens = 7;

    // provider_limit_source is set when the daemon's backend concluded the
    // provider refused the account for a rate or usage limit, and names the
    // signal that established it (a closed set, re-checked on arrival).
    // Empty means no limit was reported.
    string provider_limit_source = 8;

    // provider_limit_resets_at_unix is when the provider said the limit
    // lifts, in Unix seconds, or 0 when it did not say.
    int64 provider_limit_resets_at_unix = 9;

    // provider_limit_signal is the provider's own refusal text, redacted and
    // truncated before it is sent. It is the one piece of result text that
    // travels, because it is what an operator reads on the held account.
    string provider_limit_signal = 10;

    // provider_auth_rejected is set when the daemon's backend concluded the
    // provider refused the account's LOGIN itself (401, an expired or
    // already-used refresh token): the account needs a person to log it in
    // again, and the control plane takes it out of selection.
    bool provider_auth_rejected = 11;

    // provider_auth_signal is the provider's own refusal text, redacted and
    // truncated before it is sent, for the account's last_error.
    string provider_auth_signal = 12;
}

// SpawnFaultEvidence names a spawn failure that is a CONFIGURATION fault rather
// than a failed attempt at the work, carried from the daemon that tried the
// spawn back to the control plane that asked for it.
//
// The companion of TurnFailureEvidence for the other half of go-quicbaas#235:
// a dispatch whose pooled provider account cannot be resolved starts no process
// at all, and the SDLC module parks the item and gives its attempt back. That
// classification is made from the resolver's TYPED error, which does not
// survive a gRPC status — so a remote daemon's "no account for this tenant"
// arrived as a generic transport failure and the item was charged for a worker
// that never existed.
//
// A CLOSED SET OF CLASS TOKENS, not a message. The control plane maps the class
// back onto its own sentinel error and everything downstream is unchanged; a
// class it does not recognise is ignored, so the failure is treated exactly as
// it was before. Nothing free-form crosses.
message SpawnFaultEvidence {
    // fault_class is one of the tokens in orchestration's spawnFaultSentinels.
    string fault_class = 1;

    // available_at_unix is the earliest moment a cooling-down pool returns,
    // in Unix seconds, or 0 when unknown. Carried only for the cooldown class.
    //
    // IT IS SCHEDULING, not only diagnosis. The control plane stores it on the
    // work item as a not-before and passes the item over until it arrives —
    // without which a thirty-second sweep would spend the retry bound on a
    // ten-minute hold. A daemon that sends 0 leaves the item with no wait: it
    // retries immediately and the bound stops it, which is the fail-closed
    // direction for a version skew.
    int64 available_at_unix = 2;

    // candidates is how many accounts were held out, so the reason the control
    // plane composes can say "all three are busy" rather than "all 0". A plain
    // count; nothing identifying crosses.
    int32 candidates = 3;
}

// SessionWorkspace names the workspace a spawn works in:
// <projects_root>/<tenant_id>/<project_id>/workspace/<key> on the host that
// executes the session.
message SessionWorkspace {
    string tenant_id = 1;
    string project_id = 2;
    string key = 3;

    // pinned_dir is where an earlier session of the same job provisioned this
    // workspace on this host, empty for the job's first spawn. A host whose
    // workspace is not there refuses the spawn rather than cloning afresh.
    string pinned_dir = 4;

    // spec_files is the workspace spec directory's content by file name —
    // the spec, the forge token and the known_hosts — written read-only beside
    // the workspace and mounted at /run/quicbaas/workspace. Only the fixed
    // spec file names are accepted.
    map<string, bytes> spec_files = 5;
}

// =============================================================================
// Cost settings (go-quicbaas#1058)
// =============================================================================

// GetCostSettingsRequest names the tenant whose cost settings to read.
message GetCostSettingsRequest {
    string tenant_id = 1;
}

// SetCostSettingsRequest replaces a tenant's runtime cost settings. An unset
// rate and an engine not named inherit the configuration; an engine named
// with zero watts is not costed from electricity for the tenant.
message SetCostSettingsRequest {
    string tenant_id = 1;
    optional double electricity_price_per_kwh = 2;
    map<string, double> engine_power_watts = 3;
}

// CostSettingsResponse is a tenant's runtime cost settings and the rates in
// force once they are layered over the configuration.
message CostSettingsResponse {
    string tenant_id = 1;
    // electricity_price_per_kwh and engine_power_watts are what the tenant
    // set at runtime; unset and empty inherit the configuration.
    optional double electricity_price_per_kwh = 2;
    map<string, double> engine_power_watts = 3;
    google.protobuf.Timestamp updated_at = 4;
    // effective_electricity_price_per_kwh is the rate in force, and
    // electricity_price_source where it came from: "tenant_settings",
    // "tenant_config", "deployment_config" or "default".
    double effective_electricity_price_per_kwh = 5;
    string electricity_price_source = 6;
    // effective_engine_power_watts is every per-engine draw in force.
    map<string, double> effective_engine_power_watts = 7;
}
