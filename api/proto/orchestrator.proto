    google.protobuf.Timestamp timestamp = 2;
}

// =============================================================================
// Runner Registry Requests and Responses
// =============================================================================

// OrchestratorJobStateSpec is one state a runner drives a job through. It
// mirrors orchestration.JobStateSpec minus IdleThreshold, which is the stall
// detector's tuning and is not part of the wire surface.
message OrchestratorJobStateSpec {
    // state is the state as it appears on JobStatus.
    string state = 1;

    // label is how the state is named to a person.
    string label = 2;

    // session_backed says an agent session is doing the work in this state.
    bool session_backed = 3;
}

// OrchestratorJobRunner is one registered runner and the ordered,
// non-terminal states it declares.
message OrchestratorJobRunner {
    // name is what JobConfig.Runner selects the runner by.
    string name = 1;

    // states are the runner's states in the order it drives them.
    repeated OrchestratorJobStateSpec states = 2;
}

// ListRunners. The request is empty because the runner registry is the
// DAEMON's rather than a tenant's; a tenant_id here would be accepted and
// ignored, which is worse than absent.
message OrchestratorListRunnersRequest {}

message OrchestratorListRunnersResponse {
    repeated OrchestratorJobRunner runners = 1;
    int32 count = 2;
}

