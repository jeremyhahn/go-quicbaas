syntax = "proto3";

package quicbaas.project.v1;

option go_package = "github.com/jeremyhahn/go-quicbaas/api/proto;proto";

import "pkg/api/grpc/proto/qrdbv1/authz.proto";

// =============================================================================
// ProjectService — CRUD for Project entities
// =============================================================================

service ProjectService {
    rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
        option (qrdb.v1.permission) = "project:create";
    }
    rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
        option (qrdb.v1.permission) = "project:read";
    }
    rpc GetProjectByName(GetProjectByNameRequest) returns (GetProjectResponse) {
        option (qrdb.v1.permission) = "project:read";
    }
    rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse) {
        option (qrdb.v1.permission) = "project:update";
    }
    rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse) {
        option (qrdb.v1.permission) = "project:delete";
    }
    rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
        option (qrdb.v1.permission) = "project:list";
    }

    // GrantAgentRole sets or updates the role of a single agent. Unlike
    // UpdateProject.agent_roles — which REPLACES the whole role map — this
    // mutates exactly one entry and leaves every other agent untouched.
    rpc GrantAgentRole(GrantAgentRoleRequest) returns (GrantAgentRoleResponse) {
        option (qrdb.v1.permission) = "project:grant";
    }
    // RevokeAgentRole sets a single agent's role to "denied", blocking its
    // project access without disturbing the other entries.
    rpc RevokeAgentRole(RevokeAgentRoleRequest) returns (RevokeAgentRoleResponse) {
        option (qrdb.v1.permission) = "project:revoke";
    }
}

// =============================================================================
// Messages
// =============================================================================

// ContextRepo names one repository the worker clones beside the project
// checkout. The daemon never clones it; the name is one path segment.
message ContextRepo {
    string name     = 1;
    string repo_url = 2;
    string ref      = 3;
}

// Project represents a long-running agentic work unit.
message Project {
    string id                  = 1;
    string tenant_id           = 2;
    string name                = 3;
    string description         = 4;
    string workspace_agent_id  = 5;
    string workspace_path      = 6;
    string host_affinity       = 7;
    string default_lead_agent  = 8;
    string git_repo_url        = 9;
    string git_default_branch  = 10;
    string git_current_sha     = 11;
    // agent_roles maps agent_id → role ("lead"|"worker"|"observer"|"denied")
    map<string, string> agent_roles   = 12;
    int64 token_budget         = 13;
    int64 gpu_minutes          = 14;
    int32 max_concurrency      = 15;
    map<string, string> metadata      = 16;
    int64 created_at_unix      = 17;
    int64 updated_at_unix      = 18;
    // default_workflow is the tenant-scoped workflow a Task auto-spawns into.
    string default_workflow    = 19;
    // Commit identity, signing policy and access key of the git workspace.
    string git_author_name       = 20;
    string git_author_email      = 21;
    bool   git_signing_enabled   = 22;
    string git_signing_algorithm = 23;
    string git_signing_key_name  = 24;
    string git_signing_key_scope = 25;
    string git_signing_key_owner = 26;
    string git_ssh_key_name      = 27;
    string git_ssh_key_scope     = 28;
    string git_ssh_key_owner     = 29;
    // autonomous turns autonomous development on: the task-source poller
    // adopts work for the project and the dispatcher starts jobs for it.
    bool   autonomous            = 30;
    // context_repos are cloned by the worker beside the project checkout.
    repeated ContextRepo context_repos = 31;
}

message CreateProjectRequest {
    string tenant_id           = 1;
    string name                = 2;
    string description         = 3;
    string workspace_agent_id  = 4;
    string workspace_path      = 5;
    string host_affinity       = 6;
    string default_lead_agent  = 7;
    string git_repo_url        = 8;
    string git_default_branch  = 9;
    map<string, string> agent_roles = 10;
    int64 token_budget         = 11;
    int64 gpu_minutes          = 12;
    int32 max_concurrency      = 13;
    map<string, string> metadata    = 14;
    // default_workflow must be registered in the tenant.
    string default_workflow    = 15;
    // Commit identity, signing policy and access key of the git workspace.
    string git_author_name       = 16;
    string git_author_email      = 17;
    bool   git_signing_enabled   = 18;
    string git_signing_algorithm = 19;
    string git_signing_key_name  = 20;
    string git_signing_key_scope = 21;
    string git_signing_key_owner = 22;
    string git_ssh_key_name      = 23;
    string git_ssh_key_scope     = 24;
    string git_ssh_key_owner     = 25;
    // autonomous turns autonomous development on for the new project.
    bool   autonomous            = 26;
    // context_repos are cloned by the worker beside the project checkout.
    repeated ContextRepo context_repos = 27;
}

message CreateProjectResponse {
    Project project   = 1;
    int64 timestamp   = 2;
}

message GetProjectRequest {
    string tenant_id  = 1;
    string project_id = 2;
}

message GetProjectByNameRequest {
    string tenant_id = 1;
    string name      = 2;
}

message GetProjectResponse {
    Project project  = 1;
    int64 timestamp  = 2;
}

message UpdateProjectRequest {
    string tenant_id           = 1;
    string project_id          = 2;
    string name                = 3;
    string description         = 4;
    bool   clear_description   = 5;
    string workspace_agent_id  = 6;
    string workspace_path      = 7;
    string host_affinity       = 8;
    string default_lead_agent  = 9;
    string git_repo_url        = 10;
    string git_default_branch  = 11;
    string git_current_sha     = 12;
    map<string, string> agent_roles   = 13;
    // The quotas are optional so zero is expressible: zero means UNLIMITED
    // on the project record, so a plain scalar could not say "lift the cap"
    // — the update applied only non-zero values and the old cap stayed.
    optional int64 token_budget    = 14;
    optional int64 gpu_minutes     = 15;
    optional int32 max_concurrency = 16;
    map<string, string> metadata      = 17;
    // default_workflow sets the auto-spawn workflow when non-empty;
    // clear_default_workflow removes it.
    string default_workflow       = 18;
    bool   clear_default_workflow = 19;
    // Commit identity, signing policy and access key of the git workspace.
    // git_signing_enabled is optional so "unchanged" and "off" are distinct.
    string git_author_name       = 20;
    string git_author_email      = 21;
    optional bool git_signing_enabled = 22;
    string git_signing_algorithm = 23;
    string git_signing_key_name  = 24;
    string git_signing_key_scope = 25;
    string git_signing_key_owner = 26;
    string git_ssh_key_name      = 27;
    string git_ssh_key_scope     = 28;
    string git_ssh_key_owner     = 29;
    // autonomous is optional so "unchanged" and "off" are distinct.
    optional bool autonomous     = 30;
    // context_repos replaces the whole list when non-empty;
    // clear_context_repos empties it.
    repeated ContextRepo context_repos = 31;
    bool   clear_context_repos   = 32;
}

message UpdateProjectResponse {
    Project project  = 1;
    int64 timestamp  = 2;
}

message DeleteProjectRequest {
    string tenant_id  = 1;
    string project_id = 2;
}

message DeleteProjectResponse {
    string project_id = 1;
    bool   deleted    = 2;
    int64  timestamp  = 3;
}

message ListProjectsRequest {
    string tenant_id = 1;
}

message ListProjectsResponse {
    repeated Project projects = 1;
    int32 total               = 2;
    int64 timestamp           = 3;
}

message GrantAgentRoleRequest {
    string tenant_id  = 1;
    string project_id = 2;
    string agent_id   = 3;
    // role is one of "lead"|"worker"|"observer"|"denied".
    string role       = 4;
}

message GrantAgentRoleResponse {
    string project_id = 1;
    string agent_id   = 2;
    string role       = 3;
    int64  timestamp  = 4;
}

message RevokeAgentRoleRequest {
    string tenant_id  = 1;
    string project_id = 2;
    string agent_id   = 3;
}

message RevokeAgentRoleResponse {
    string project_id = 1;
    string agent_id   = 2;
    int64  timestamp  = 3;
}
