syntax = "proto3";

package quicbaas.scheduler.v1;

option go_package = "github.com/jeremyhahn/go-quicbaas/api/proto;proto";

import "pkg/api/grpc/proto/qrdbv1/authz.proto";

// =============================================================================
// Scheduler Service
// =============================================================================

service SchedulerService {
    // Job Management
    rpc CreateJob(CreateJobRequest) returns (CreateJobResponse) {
        option (qrdb.v1.permission) = "scheduler:create";
    }
    rpc GetJob(GetJobRequest) returns (GetJobResponse) {
        option (qrdb.v1.permission) = "scheduler:read";
    }
    rpc UpdateJob(UpdateJobRequest) returns (UpdateJobResponse) {
        option (qrdb.v1.permission) = "scheduler:update";
    }
    rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse) {
        option (qrdb.v1.permission) = "scheduler:delete";
    }
    rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
        option (qrdb.v1.permission) = "scheduler:list";
    }

    // Job Control
    rpc TriggerJob(TriggerJobRequest) returns (TriggerJobResponse) {
        option (qrdb.v1.permission) = "scheduler:trigger";
    }
    rpc PauseJob(PauseJobRequest) returns (PauseJobResponse) {
        option (qrdb.v1.permission) = "scheduler:pause";
    }
    rpc ResumeJob(ResumeJobRequest) returns (ResumeJobResponse) {
        option (qrdb.v1.permission) = "scheduler:resume";
    }
    rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {
        option (qrdb.v1.permission) = "scheduler:cancel";
    }

    // History and Status
    rpc GetJobHistory(GetJobHistoryRequest) returns (GetJobHistoryResponse) {
        option (qrdb.v1.permission) = "scheduler:history";
    }
    rpc GetSchedulerStatus(GetSchedulerStatusRequest) returns (GetSchedulerStatusResponse) {
        option (qrdb.v1.permission) = "scheduler:status";
    }

    // ---- Workload placement (pkg/scheduler/placement) ----
    //
    // Placement filters and scores caller-supplied node facts and records
    // the decision on go-qrdb. go-qrdb owns the "scheduler" permission
    // family, so placement carries its own "placement" family.

    // RegisterNode registers or refreshes a node's facts under a lease.
    rpc RegisterNode(RegisterPlacementNodeRequest) returns (PlacementNodeResponse) {
        option (qrdb.v1.permission) = "placement:manage";
    }

    // RenewNode heartbeats a node's lease.
    rpc RenewNode(PlacementNodeRequest) returns (RenewPlacementNodeResponse) {
        option (qrdb.v1.permission) = "placement:manage";
    }

    // DeregisterNode revokes a node's lease and clears its status.
    rpc DeregisterNode(PlacementNodeRequest) returns (DeregisterPlacementNodeResponse) {
        option (qrdb.v1.permission) = "placement:manage";
    }

    // GetNode returns a live node.
    rpc GetNode(PlacementNodeRequest) returns (PlacementNodeResponse) {
        option (qrdb.v1.permission) = "placement:read";
    }

    // ListNodes returns every live node.
    rpc ListNodes(ListPlacementNodesRequest) returns (ListPlacementNodesResponse) {
        option (qrdb.v1.permission) = "placement:read";
    }

    // CordonNode excludes a node from new placements.
    rpc CordonNode(PlacementNodeRequest) returns (PlacementNodeResponse) {
        option (qrdb.v1.permission) = "placement:manage";
    }

    // UncordonNode returns a node to service, clearing cordon and drain.
    rpc UncordonNode(PlacementNodeRequest) returns (PlacementNodeResponse) {
        option (qrdb.v1.permission) = "placement:manage";
    }

    // DrainNode marks a node draining and returns the placements to move.
    rpc DrainNode(PlacementNodeRequest) returns (DrainPlacementNodeResponse) {
        option (qrdb.v1.permission) = "placement:manage";
    }

    // Place decides and records the node a workload runs on.
    rpc Place(PlaceWorkloadRequest) returns (PlaceWorkloadResponse) {
        option (qrdb.v1.permission) = "placement:place";
    }

    // Release removes a workload's placement.
    rpc Release(ReleaseWorkloadRequest) returns (ReleaseWorkloadResponse) {
        option (qrdb.v1.permission) = "placement:place";
    }

    // GetPlacement returns a workload's placement.
    rpc GetPlacement(GetPlacementRequest) returns (GetPlacementResponse) {
        option (qrdb.v1.permission) = "placement:read";
    }

    // ListPlacements returns placements, optionally filtered by node or group.
    rpc ListPlacements(ListPlacementsRequest) returns (ListPlacementsResponse) {
        option (qrdb.v1.permission) = "placement:read";
    }
}

// =============================================================================
// Enums
// =============================================================================

enum JobType {
    JOB_TYPE_UNSPECIFIED = 0;
    JOB_TYPE_ONE_SHOT = 1;
    JOB_TYPE_RECURRING = 2;
    JOB_TYPE_DELAYED = 3;
}

enum JobStatus {
    JOB_STATUS_UNSPECIFIED = 0;
    JOB_STATUS_PENDING = 1;
    JOB_STATUS_RUNNING = 2;
    JOB_STATUS_COMPLETED = 3;
    JOB_STATUS_FAILED = 4;
    JOB_STATUS_PAUSED = 5;
    JOB_STATUS_CANCELED = 6;
}

enum OwnerType {
    OWNER_TYPE_UNSPECIFIED = 0;
    OWNER_TYPE_SYSTEM = 1;
    OWNER_TYPE_TENANT = 2;
    OWNER_TYPE_DELEGATED = 3;
}

// =============================================================================
// Core Types
// =============================================================================

message Job {
    uint64 id = 1;
    string name = 2;
    string description = 3;

    // Ownership
    OwnerType owner_type = 4;
    string owner_id = 5;
    string target_tenant_id = 6;
    string created_by = 7;

    // Schedule
    JobType type = 8;
    string schedule = 9;           // Cron expression for recurring
    int64 execute_at = 10;         // Unix timestamp
    int64 delay_seconds = 11;

    // Execution
    string handler = 12;
    bytes payload = 13;
    int32 priority = 14;
    int64 timeout_seconds = 15;
    int32 max_retries = 16;

    // State
    JobStatus status = 17;
    int64 last_run = 18;           // Unix timestamp
    int64 next_run = 19;           // Unix timestamp
    uint64 run_count = 20;
    uint64 fail_count = 21;
    string last_error = 22;

    // Metadata
    map<string, string> labels = 23;
    int64 created_at = 24;         // Unix timestamp
    int64 updated_at = 25;         // Unix timestamp
}

message JobExecution {
    uint64 id = 1;
    uint64 job_id = 2;
    JobStatus status = 3;
    int64 started_at = 4;          // Unix timestamp
    int64 ended_at = 5;            // Unix timestamp
    int64 duration_ms = 6;
    string error = 7;
    string output = 8;
}

message SchedulerStats {
    uint64 job_count = 1;
    uint64 running_jobs = 2;
    uint64 success_count = 3;
    uint64 failure_count = 4;
    int64 last_tick_time = 5;      // Unix timestamp
    int64 started_at = 6;          // Unix timestamp
}

// =============================================================================
// Requests and Responses
// =============================================================================

// CreateJob
message CreateJobRequest {
    string name = 1;
    string description = 2;
    OwnerType owner_type = 3;
    string owner_id = 4;
    string target_tenant_id = 5;
    JobType type = 6;
    string schedule = 7;
    int64 execute_at = 8;
    int64 delay_seconds = 9;
    string handler = 10;
    bytes payload = 11;
    int32 priority = 12;
    int64 timeout_seconds = 13;
    int32 max_retries = 14;
    map<string, string> labels = 15;

    // node_affinity restricts execution to the node whose
    // SchedulerEngine was constructed with a matching node ID.
    // Empty (default) makes the job cluster-wide — executes only
    // on the Raft leader. Non-empty pins execution to the affine
    // node regardless of leadership; see pkg/scheduler semantics.
    string node_affinity = 16;
}

message CreateJobResponse {
    Job job = 1;
    int64 timestamp = 2;
}

// GetJob
message GetJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
}

message GetJobResponse {
    Job job = 1;
    int64 timestamp = 2;
}

// UpdateJob
message UpdateJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
    string name = 3;
    string description = 4;
    string schedule = 5;
    int64 execute_at = 6;
    string handler = 7;
    bytes payload = 8;
    int32 priority = 9;
    int64 timeout_seconds = 10;
    int32 max_retries = 11;
    map<string, string> labels = 12;
}

message UpdateJobResponse {
    Job job = 1;
    int64 timestamp = 2;
}

// DeleteJob
message DeleteJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
    bool force = 3;
}

message DeleteJobResponse {
    uint64 job_id = 1;
    bool deleted = 2;
    int64 timestamp = 3;
}

// ListJobs
message ListJobsRequest {
    OwnerType owner_type = 1;
    string owner_id = 2;
    string target_tenant_id = 3;
    JobStatus status = 4;
    string handler = 5;
    map<string, string> labels = 6;
    int32 limit = 7;
    string cursor = 8;
}

message ListJobsResponse {
    repeated Job jobs = 1;
    string next_cursor = 2;
    bool has_more = 3;
    int32 total_count = 4;
    int64 timestamp = 5;
}

// TriggerJob
message TriggerJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
}

message TriggerJobResponse {
    uint64 job_id = 1;
    JobStatus status = 2;
    int64 timestamp = 3;
}

// PauseJob
message PauseJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
}

message PauseJobResponse {
    uint64 job_id = 1;
    JobStatus old_status = 2;
    JobStatus new_status = 3;
    int64 timestamp = 4;
}

// ResumeJob
message ResumeJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
}

message ResumeJobResponse {
    uint64 job_id = 1;
    JobStatus old_status = 2;
    JobStatus new_status = 3;
    int64 timestamp = 4;
}

// CancelJob
message CancelJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
    string reason = 3;
}

message CancelJobResponse {
    uint64 job_id = 1;
    JobStatus old_status = 2;
    JobStatus new_status = 3;
    int64 timestamp = 4;
}

// GetJobHistory
message GetJobHistoryRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
    int32 limit = 3;
    string cursor = 4;
}

message GetJobHistoryResponse {
    repeated JobExecution executions = 1;
    string next_cursor = 2;
    bool has_more = 3;
    int64 timestamp = 4;
}

// GetSchedulerStatus
message GetSchedulerStatusRequest {}

message GetSchedulerStatusResponse {
    bool running = 1;
    SchedulerStats stats = 2;
    int64 timestamp = 3;
}

// =============================================================================
// Workload placement messages
// =============================================================================

// PlacementNodeFacts are the caller-supplied facts a node registers.
message PlacementNodeFacts {
    string node_id = 1;
    map<string, int64> capacity = 2;
    map<string, string> labels = 3;
}

// PlacementNodeStatus is the operator-controlled scheduling state.
message PlacementNodeStatus {
    bool unschedulable = 1;
    bool draining = 2;
}

// PlacementNodeInfo is a live node with its status, lease and allocation.
message PlacementNodeInfo {
    PlacementNodeFacts facts = 1;
    PlacementNodeStatus status = 2;
    int64 lease_id = 3;
    int64 ttl_seconds = 4;
    map<string, int64> allocated = 5;
    int64 placements = 6;
    int64 registered_at_unix_nanos = 7;
}

message RegisterPlacementNodeRequest {
    PlacementNodeFacts facts = 1;
    int64 ttl_seconds = 2;
}

message PlacementNodeRequest {
    string node_id = 1;
}

message PlacementNodeResponse {
    PlacementNodeInfo node = 1;
}

message RenewPlacementNodeResponse {
    string node_id = 1;
    bool renewed = 2;
}

message DeregisterPlacementNodeResponse {
    string node_id = 1;
    bool deregistered = 2;
}

message ListPlacementNodesRequest {}

message ListPlacementNodesResponse {
    repeated PlacementNodeInfo nodes = 1;
}

message DrainPlacementNodeResponse {
    string node_id = 1;
    repeated PlacementRecord placements = 2;
}

// PlacementConstraint is a hard requirement on a node label. operator is
// one of In, NotIn, Exists, DoesNotExist.
message PlacementConstraint {
    string key = 1;
    string operator = 2;
    repeated string values = 3;
}

message PlacementAffinityTerm {
    string group = 1;
    bool required = 2;
    int32 weight = 3;
}

message PlacementSpreadConstraint {
    string topology_key = 1;
    int32 max_skew = 2;
    bool required = 3;
}

// PlaceWorkloadRequest asks for one workload to be placed. strategy is
// "binpack" (default) or "spread".
message PlaceWorkloadRequest {
    string workload_id = 1;
    string group = 2;
    map<string, string> labels = 3;
    map<string, int64> resources = 4;
    repeated PlacementConstraint constraints = 5;
    repeated PlacementAffinityTerm affinity = 6;
    repeated PlacementAffinityTerm anti_affinity = 7;
    PlacementSpreadConstraint spread = 8;
    string strategy = 9;
}

// PlacementRecord is a recorded placement decision. orphaned is computed on
// read: the node's lease has expired.
message PlacementRecord {
    string workload_id = 1;
    string group = 2;
    string node_id = 3;
    map<string, int64> resources = 4;
    map<string, string> labels = 5;
    double score = 6;
    int64 created_at_unix_nanos = 7;
    bool orphaned = 8;
}

message PlaceWorkloadResponse {
    PlacementRecord placement = 1;
    bool existing = 2;
}

message ReleaseWorkloadRequest {
    string workload_id = 1;
}

message ReleaseWorkloadResponse {
    string workload_id = 1;
    bool released = 2;
}

message GetPlacementRequest {
    string workload_id = 1;
}

message GetPlacementResponse {
    PlacementRecord placement = 1;
}

message ListPlacementsRequest {
    string node_id = 1;
    string group = 2;
}

message ListPlacementsResponse {
    repeated PlacementRecord placements = 1;
}
