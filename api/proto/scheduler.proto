syntax = "proto3";

package quicbaas.scheduler.v1;

option go_package = "github.com/jeremyhahn/go-quicbaas/api/proto;proto";

// =============================================================================
// Scheduler Service
// =============================================================================

service SchedulerService {
    // Job Management
    rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
    rpc GetJob(GetJobRequest) returns (GetJobResponse);
    rpc UpdateJob(UpdateJobRequest) returns (UpdateJobResponse);
    rpc DeleteJob(DeleteJobRequest) returns (DeleteJobResponse);
    rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

    // Job Control
    rpc TriggerJob(TriggerJobRequest) returns (TriggerJobResponse);
    rpc PauseJob(PauseJobRequest) returns (PauseJobResponse);
    rpc ResumeJob(ResumeJobRequest) returns (ResumeJobResponse);
    rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

    // History and Status
    rpc GetJobHistory(GetJobHistoryRequest) returns (GetJobHistoryResponse);
    rpc GetSchedulerStatus(GetSchedulerStatusRequest) returns (GetSchedulerStatusResponse);
}

// =============================================================================
// Enums
// =============================================================================

enum JobType {
    JOB_TYPE_UNSPECIFIED = 0;
    JOB_TYPE_ONE_SHOT = 1;
    JOB_TYPE_RECURRING = 2;
    JOB_TYPE_DELAYED = 3;
}

enum JobStatus {
    JOB_STATUS_UNSPECIFIED = 0;
    JOB_STATUS_PENDING = 1;
    JOB_STATUS_RUNNING = 2;
    JOB_STATUS_COMPLETED = 3;
    JOB_STATUS_FAILED = 4;
    JOB_STATUS_PAUSED = 5;
    JOB_STATUS_CANCELED = 6;
}

enum OwnerType {
    OWNER_TYPE_UNSPECIFIED = 0;
    OWNER_TYPE_SYSTEM = 1;
    OWNER_TYPE_TENANT = 2;
    OWNER_TYPE_DELEGATED = 3;
}

// =============================================================================
// Core Types
// =============================================================================

message Job {
    uint64 id = 1;
    string name = 2;
    string description = 3;

    // Ownership
    OwnerType owner_type = 4;
    string owner_id = 5;
    string target_tenant_id = 6;
    string created_by = 7;

    // Schedule
    JobType type = 8;
    string schedule = 9;           // Cron expression for recurring
    int64 execute_at = 10;         // Unix timestamp
    int64 delay_seconds = 11;

    // Execution
    string handler = 12;
    bytes payload = 13;
    int32 priority = 14;
    int64 timeout_seconds = 15;
    int32 max_retries = 16;

    // State
    JobStatus status = 17;
    int64 last_run = 18;           // Unix timestamp
    int64 next_run = 19;           // Unix timestamp
    uint64 run_count = 20;
    uint64 fail_count = 21;
    string last_error = 22;

    // Metadata
    map<string, string> labels = 23;
    int64 created_at = 24;         // Unix timestamp
    int64 updated_at = 25;         // Unix timestamp
}

message JobExecution {
    uint64 id = 1;
    uint64 job_id = 2;
    JobStatus status = 3;
    int64 started_at = 4;          // Unix timestamp
    int64 ended_at = 5;            // Unix timestamp
    int64 duration_ms = 6;
    string error = 7;
    string output = 8;
}

message SchedulerStats {
    uint64 job_count = 1;
    uint64 running_jobs = 2;
    uint64 success_count = 3;
    uint64 failure_count = 4;
    int64 last_tick_time = 5;      // Unix timestamp
    int64 started_at = 6;          // Unix timestamp
}

// =============================================================================
// Requests and Responses
// =============================================================================

// CreateJob
message CreateJobRequest {
    string name = 1;
    string description = 2;
    OwnerType owner_type = 3;
    string owner_id = 4;
    string target_tenant_id = 5;
    JobType type = 6;
    string schedule = 7;
    int64 execute_at = 8;
    int64 delay_seconds = 9;
    string handler = 10;
    bytes payload = 11;
    int32 priority = 12;
    int64 timeout_seconds = 13;
    int32 max_retries = 14;
    map<string, string> labels = 15;

    // node_affinity restricts execution to the node whose
    // SchedulerEngine was constructed with a matching node ID.
    // Empty (default) makes the job cluster-wide — executes only
    // on the Raft leader. Non-empty pins execution to the affine
    // node regardless of leadership; see pkg/scheduler semantics.
    string node_affinity = 16;
}

message CreateJobResponse {
    Job job = 1;
    int64 timestamp = 2;
}

// GetJob
message GetJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
}

message GetJobResponse {
    Job job = 1;
    int64 timestamp = 2;
}

// UpdateJob
message UpdateJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
    string name = 3;
    string description = 4;
    string schedule = 5;
    int64 execute_at = 6;
    string handler = 7;
    bytes payload = 8;
    int32 priority = 9;
    int64 timeout_seconds = 10;
    int32 max_retries = 11;
    map<string, string> labels = 12;
}

message UpdateJobResponse {
    Job job = 1;
    int64 timestamp = 2;
}

// DeleteJob
message DeleteJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
    bool force = 3;
}

message DeleteJobResponse {
    uint64 job_id = 1;
    bool deleted = 2;
    int64 timestamp = 3;
}

// ListJobs
message ListJobsRequest {
    OwnerType owner_type = 1;
    string owner_id = 2;
    string target_tenant_id = 3;
    JobStatus status = 4;
    string handler = 5;
    map<string, string> labels = 6;
    int32 limit = 7;
    string cursor = 8;
}

message ListJobsResponse {
    repeated Job jobs = 1;
    string next_cursor = 2;
    bool has_more = 3;
    int32 total_count = 4;
    int64 timestamp = 5;
}

// TriggerJob
message TriggerJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
}

message TriggerJobResponse {
    uint64 job_id = 1;
    JobStatus status = 2;
    int64 timestamp = 3;
}

// PauseJob
message PauseJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
}

message PauseJobResponse {
    uint64 job_id = 1;
    JobStatus old_status = 2;
    JobStatus new_status = 3;
    int64 timestamp = 4;
}

// ResumeJob
message ResumeJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
}

message ResumeJobResponse {
    uint64 job_id = 1;
    JobStatus old_status = 2;
    JobStatus new_status = 3;
    int64 timestamp = 4;
}

// CancelJob
message CancelJobRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
    string reason = 3;
}

message CancelJobResponse {
    uint64 job_id = 1;
    JobStatus old_status = 2;
    JobStatus new_status = 3;
    int64 timestamp = 4;
}

// GetJobHistory
message GetJobHistoryRequest {
    uint64 job_id = 1;
    string tenant_id = 2;
    int32 limit = 3;
    string cursor = 4;
}

message GetJobHistoryResponse {
    repeated JobExecution executions = 1;
    string next_cursor = 2;
    bool has_more = 3;
    int64 timestamp = 4;
}

// GetSchedulerStatus
message GetSchedulerStatusRequest {}

message GetSchedulerStatusResponse {
    bool running = 1;
    SchedulerStats stats = 2;
    int64 timestamp = 3;
}
