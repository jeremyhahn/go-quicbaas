// QuicBaaS Pooled Provider Account Protocol Buffer Definitions v1
//
// An Account is one pooled provider credential (a single Anthropic/Claude
// login, OpenAI/Codex API key, or OpenCode provider config) that an agent
// session can be spawned against. See docs/orchestration/accounts.md.
//
// SECURITY INVARIANT: AccountCredential is a REQUEST-ONLY message. It appears
// exclusively in CreateAccountRequest and RotateAccountCredentialRequest and
// is never a field of any response message. The Account message carries
// metadata only — no token, key, or provider config bytes ever cross the wire
// outbound.
//
// Copyright (c) 2026 QuicBaaS Project
// Licensed under MIT License

syntax = "proto3";

package quicbaas.account.v1;

option go_package = "github.com/jeremyhahn/go-quicbaas/api/proto;proto";

import "qrdb/v1/permission.proto";
import "api/proto/spend.proto";
import "api/proto/sdlc.proto";

// =============================================================================
// AccountService — pooled provider account lifecycle
// =============================================================================

// Every RPC takes QuicBaaS's own tenant-scoped agent_accounts:* family. The
// writes take agent_accounts:write (create, update, set-default, revoke),
// agent_accounts:rotate and agent_accounts:delete, registered ScopeSelf and
// held by the tenant-admin role. They do not borrow go-qrdb's credentials:*:
// that family is registered ScopeCross (system tenant only, because qrdb's
// named-credential store has no tenant namespacing), while a pooled account
// lives in the requesting tenant's own keyspace, so no principal could write
// a non-system tenant's pool. Revoke keeps the record and its usage history,
// so it is a write, not a delete. See go-quicbaas#734 for the reads,
// go-quicbaas#737 for the write half and go-quicbaas#1355 for the write verbs.
service AccountService {
    rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {
        option (qrdb.v1.permission) = "agent_accounts:write";
    }
    rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
        option (qrdb.v1.permission) = "agent_accounts:read";
    }
    rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
        option (qrdb.v1.permission) = "agent_accounts:list";
    }
    rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse) {
        option (qrdb.v1.permission) = "agent_accounts:write";
    }
    rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse) {
        option (qrdb.v1.permission) = "agent_accounts:delete";
    }
    rpc RotateAccountCredential(RotateAccountCredentialRequest) returns (RotateAccountCredentialResponse) {
        option (qrdb.v1.permission) = "agent_accounts:rotate";
    }
    rpc RevokeAccount(RevokeAccountRequest) returns (RevokeAccountResponse) {
        option (qrdb.v1.permission) = "agent_accounts:write";
    }
    rpc SetDefaultAccount(SetDefaultAccountRequest) returns (SetDefaultAccountResponse) {
        option (qrdb.v1.permission) = "agent_accounts:write";
    }
    rpc GetAccountUsage(GetAccountUsageRequest) returns (GetAccountUsageResponse) {
        option (qrdb.v1.permission) = "agent_accounts:read";
    }
    // MaterializeAccountCredential RELEASES one account's credential envelope
    // to the caller. It is the single method in this service whose response
    // carries secret material, which is why it carries its own permission
    // rather than the read verb that lists the pool: an identity that may see
    // the pool's metadata must not thereby be able to extract every login in
    // it. See docs/agent-orchestration/accounts.md.
    rpc MaterializeAccountCredential(MaterializeAccountCredentialRequest) returns (MaterializeAccountCredentialResponse) {
        option (qrdb.v1.permission) = "agent_accounts:materialize";
    }
    // ReserveAccountSession claims one session slot on a capped account in the
    // control plane's reservation table, the claim that makes
    // max_concurrent_sessions hold when several hosts spawn at once. It is the
    // credential release's companion and carries its permission. An account
    // at its cap answers RESOURCE_EXHAUSTED.
    rpc ReserveAccountSession(ReserveAccountSessionRequest) returns (ReserveAccountSessionResponse) {
        option (qrdb.v1.permission) = "agent_accounts:materialize";
    }
    // ReleaseAccountSession gives a reservation back, for a spawn that failed.
    rpc ReleaseAccountSession(ReleaseAccountSessionRequest) returns (ReleaseAccountSessionResponse) {
        option (qrdb.v1.permission) = "agent_accounts:materialize";
    }
}

// =============================================================================
// Messages
// =============================================================================

// Account is the non-secret metadata record for one pooled provider
// credential. It deliberately has no credential field.
message Account {
    string id                     = 1;
    string tenant_id              = 2;
    string project_id             = 3;
    // provider is one of "claude", "codex", "opencode".
    string provider               = 4;
    string display_name           = 5;
    bool   is_default             = 6;
    // status is one of "active", "revoked", "error", "limited".
    string status                 = 7;
    // refresh_policy is one of "none", "oauth2".
    string refresh_policy         = 8;
    int64  created_at_unix        = 9;
    int64  updated_at_unix        = 10;
    int64  last_used_at_unix      = 11;
    int64  last_refreshed_at_unix = 12;
    string last_error             = 13;
    // available_at_unix is when a "limited" account rejoins the selectable
    // pool. Zero on every other status.
    int64  available_at_unix      = 14;
    // credential_expires_at_unix mirrors the credential envelope's expiry.
    // Zero means UNKNOWN, not "never expires".
    int64  credential_expires_at_unix = 15;
    // last_validated_at_unix is the last time the credential was successfully
    // loaded and projected into a spawn.
    int64  last_validated_at_unix = 16;
    // credential_health is derived from credential_expires_at_unix:
    // "unknown", "valid", "expiring", or "expired".
    string credential_health      = 17;
    // credential_secret_ref names the tenant secret the credential is read
    // from, when the account is reference-sourced. A name, never the value.
    string credential_secret_ref  = 18;
    // credential_secret_file is where a referenced secret is materialized
    // (relative to the session home) instead of the access token.
    string credential_secret_file = 19;
    // max_concurrent_sessions caps how many live sessions the account serves
    // at once. Zero is unmetered.
    int32  max_concurrent_sessions = 20;
    // billing is how the account is billed; unset when not configured.
    AccountBilling billing        = 21;
    // spend is what the account may spend and how many failures take it out
    // of service; unset is unmetered.
    quicbaas.spend.v1.AccountSpendPolicy spend = 22;
}

// AccountBilling is how a pooled account is billed, which decides the billed
// figure each turn on it carries beside its list-price equivalent.
message AccountBilling {
    // mode is "subscription" (a turn adds nothing to the bill) or "api" (a
    // turn bills its list price). Empty means not configured: billed unknown.
    string mode               = 1;
    // monthly_fee_micros is a subscription's flat monthly fee in millionths
    // of a US dollar. Refused on an api account.
    int64  monthly_fee_micros = 2;
}

// AccountCredential is the secret envelope. REQUEST-ONLY — it appears in
// CreateAccountRequest and RotateAccountCredentialRequest and in no response.
// The one method that returns credential material uses
// MaterializedAccountCredential instead, which deliberately carries no
// refresh-grant fields.
message AccountCredential {
    map<string, string> env                  = 1;
    map<string, bytes>  files                = 2;
    string              access_token         = 3;
    string              refresh_token        = 4;
    int64               expires_at_unix      = 5;
    string              token_endpoint       = 6;
    string              client_id            = 7;
    repeated string     scopes               = 8;
    string              access_token_env_key = 9;
}

// AccountUsage is the cumulative token usage recorded against an account.
message AccountUsage {
    int64                total_tokens      = 1;
    int64                budget_limit      = 2;
    double               percent_used      = 3;
    map<string, int64>   by_agent          = 4;
    int64                last_updated_unix = 5;
}

message CreateAccountRequest {
    string            tenant_id      = 1;
    string            project_id     = 2;
    string            provider       = 3;
    string            display_name   = 4;
    bool              is_default     = 5;
    string            refresh_policy = 6;
    // credential is the inline credential. Exactly one of credential and
    // credential_secret_ref is required.
    AccountCredential credential     = 7;
    // credential_secret_ref names the tenant secret the credential is read
    // from on every spawn (e.g. "agents/claude/claude1/oauth_token").
    string credential_secret_ref     = 8;
    // credential_secret_file materializes the referenced secret as this file
    // (relative to the session home) instead of as the access token.
    string credential_secret_file    = 9;
    // max_concurrent_sessions caps how many live sessions the account serves
    // at once. Zero is unmetered.
    int32             max_concurrent_sessions = 10;
    AccountBilling    billing        = 11;
    quicbaas.spend.v1.AccountSpendPolicy spend = 12;
}

message CreateAccountResponse {
    Account account   = 1;
    int64   timestamp = 2;
}

message GetAccountRequest {
    string tenant_id  = 1;
    string account_id = 2;
}

message GetAccountResponse {
    Account account   = 1;
    int64   timestamp = 2;
}

message ListAccountsRequest {
    string tenant_id  = 1;
    string provider   = 2;
    string project_id = 3;

    // Paging, sorting and search — the contract every list endpoint speaks
    // (docs/software-factory/api.md). limit 0 takes the default page (25);
    // anything above 100 is capped. sort is "<field>" or "<field>:desc",
    // naming a field from the endpoint's allow-list; an unknown field is
    // refused with InvalidArgument. q is a case-insensitive substring
    // matched against the endpoint's documented text fields.
    int32 limit = 4;
    int32 offset = 5;
    string sort = 6;
    string q = 7;
}

message ListAccountsResponse {
    repeated Account accounts  = 1;
    int32            total     = 2;
    int64            timestamp = 3;

    // The paging envelope. total counts the records that matched the filters
    // and the search BEFORE the page was cut; limit and offset are the values
    // the server APPLIED. next_offset is the offset of the following page and
    // is zero on the last page.
    int32 limit = 4;
    int32 offset = 5;
    int32 next_offset = 6;

    // facets counts, per faceted field, how many of the matched records carry
    // each value, taken before the faceted narrowings.
    map<string, quicbaas.sdlc.v1.FacetCounts> facets = 7;
}

message UpdateAccountRequest {
    string tenant_id        = 1;
    string account_id       = 2;
    string display_name     = 3;
    string project_id       = 4;
    bool   clear_project_id = 5;
    string refresh_policy   = 6;
    // credential_secret_ref switches the account to (or re-points it at) a
    // tenant secret; re-applying the current one returns an account whose
    // secret was missing to service.
    string credential_secret_ref  = 7;
    string credential_secret_file = 8;
    // max_concurrent_sessions, when present, replaces the account's session
    // cap; zero makes it unmetered. Absent leaves it unchanged.
    optional int32 max_concurrent_sessions = 9;
    // billing, when present, replaces how the account is billed; a present
    // empty message clears it. Absent leaves it unchanged.
    AccountBilling billing  = 10;
    // spend, when present, replaces the account's spend policy; a present
    // empty message makes it unmetered. Absent leaves it unchanged.
    quicbaas.spend.v1.AccountSpendPolicy spend = 11;
}

message UpdateAccountResponse {
    Account account   = 1;
    int64   timestamp = 2;
}

message DeleteAccountRequest {
    string tenant_id  = 1;
    string account_id = 2;
}

message DeleteAccountResponse {
    string account_id = 1;
    bool   deleted    = 2;
    int64  timestamp  = 3;
}

message RotateAccountCredentialRequest {
    string            tenant_id  = 1;
    string            account_id = 2;
    AccountCredential credential = 3;
}

message RotateAccountCredentialResponse {
    string account_id = 1;
    int64  timestamp  = 2;
}

message RevokeAccountRequest {
    string tenant_id  = 1;
    string account_id = 2;
    string reason     = 3;
}

message RevokeAccountResponse {
    Account account   = 1;
    int64   timestamp = 2;
}

message SetDefaultAccountRequest {
    string tenant_id  = 1;
    string account_id = 2;
}

message SetDefaultAccountResponse {
    string account_id = 1;
    int64  timestamp  = 2;
}

message GetAccountUsageRequest {
    string tenant_id  = 1;
    string account_id = 2;
}

message GetAccountUsageResponse {
    AccountUsage usage     = 1;
    int64        timestamp = 2;
    // live_sessions is how many sessions the account is serving now: the
    // figure the balancing strategy ranks on and the session cap is checked
    // against.
    int32        live_sessions = 3;
    // spend is the spend gate's verdict on the account; unset when the
    // deployment wires no gate, so nothing is metered.
    quicbaas.spend.v1.SpendHeadroom spend = 4;
}

// MaterializedAccountCredential is the RELEASED envelope: the short-lived half
// of a pooled credential, and nothing else.
//
// It deliberately omits refresh_token, token_endpoint and client_id. Renewal
// is the central's job and already happened inside the call that produced this
// message, so a recipient has no use for the refresh grant — and shipping it
// would put the long-lived half of the credential on a worker host that only
// ever needs the short-lived half.
message MaterializedAccountCredential {
    map<string, string> env                  = 1;
    map<string, bytes>  files                = 2;
    string              access_token         = 3;
    int64               expires_at_unix      = 4;
    repeated string     scopes               = 5;
    string              access_token_env_key = 6;
    // generation identifies which copy of the account's credential this is.
    // A worker host records it on the session it spawns, so the control
    // plane can tell before a turn that the credential was rotated under
    // that session. An integer naming a copy, not credential material; zero
    // means unknown.
    int64               generation           = 7;
}

message MaterializeAccountCredentialRequest {
    string tenant_id  = 1;
    string account_id = 2;
    // project_id is the project the requesting spawn belongs to. An account
    // restricted to a project is released only to a request naming it.
    string project_id = 3;

    // job_id names the job the requesting spawn works for. It scopes the
    // DELIVERY GRANT this release takes out, so a job's releases can be listed
    // and revoked as a set.
    //
    // An enrolled daemon leaves it EMPTY, deliberately: its credential cache is
    // keyed by account, so one release serves every job running on that host and
    // a grant naming one of them would be false. A caller that releases for a
    // single job -- the control plane's own tooling -- names it and gets a
    // job-scoped grant.
    string job_id = 4;

    // lease_id presents the delivery grant a caller already holds, and is what
    // distinguishes a REFRESH of a copy from a request for a new one.
    //
    // Empty asks for a first release, which issues a grant. Non-empty says "I
    // hold a copy under this grant and want a fresh one", and is the case the
    // server ENFORCES on: a grant that has been revoked (the session that held
    // the copy ended) or has lapsed is refused, so the caller cannot replace
    // what it holds.
    string lease_id = 5;
}

message MaterializeAccountCredentialResponse {
    string                        account_id             = 1;
    string                        provider               = 2;
    string                        display_name           = 3;
    string                        project_id             = 4;
    string                        refresh_policy         = 5;
    MaterializedAccountCredential credential             = 6;
    int64                         expires_at_unix        = 7;
    // updated_at_unix is diagnostics: it moves on any write to the record,
    // including the usage stamp the release itself makes.
    int64                         updated_at_unix        = 8;
    // last_refreshed_at_unix is when the ENVELOPE was last replaced, and is the
    // cache-invalidation signal: a caller that later reads a newer value knows
    // its cached envelope is superseded without asking for the secret again.
    int64                         last_refreshed_at_unix = 9;
    int64                         timestamp              = 10;

    // lease_id is the delivery grant this release is authorised by: the one the
    // request presented, or the one this release issued. A caller that caches
    // the envelope MUST present it on every refresh of that copy.
    string lease_id = 11;

    // lease_expires_at_unix is when the grant stops being authorised without
    // renewal. It is NOT the credential's expiry (expires_at_unix, above) —
    // that is the OAuth credential's own lifetime, which the control plane's
    // refresher owns. The two are deliberately independent.
    int64 lease_expires_at_unix = 12;

    // single_use says the envelope must not be reused for a later spawn: the
    // account reads its credential from a tenant secret (credential_secret_ref),
    // which rotates with no account write a caching caller could observe, so
    // the caller re-releases for every spawn.
    bool single_use = 13;
}

message ReserveAccountSessionRequest {
    string tenant_id  = 1;
    string account_id = 2;
    // expected_live, when present, makes the claim conditional on the
    // account's live-session count still being the one the caller selected
    // on; a moved count answers ABORTED and the caller re-selects. The session
    // record that names the returned reservation_id satisfies it.
    optional int32 expected_live = 3;
}

message ReserveAccountSessionResponse {
    string reservation_id = 1;
    int64  timestamp      = 2;
}

message ReleaseAccountSessionRequest {
    string tenant_id      = 1;
    string account_id     = 2;
    string reservation_id = 3;
}

message ReleaseAccountSessionResponse {
    string reservation_id = 1;
    int64  timestamp      = 2;
}
