// QuicBaaS Agent Runtime Protocol Buffer Definitions v1
// Daemon-side gRPC service exposed by pkg/agent daemons to the control plane
// orchestrator. The daemon registers via mTLS at
// POST /api/v1/agents/register (REST), then accepts Spawn/Prompt/Status/
// Close RPCs for pkg/orchestration backends it hosts and maintains a bidi
// heartbeat stream for fleet liveness and policy refresh.
//
// Copyright (c) 2025 QuicBaaS Project
// Licensed under MIT License

syntax = "proto3";

package quicbaas.agent.runtime.v1;

option go_package = "github.com/jeremyhahn/go-quicbaas/api/proto;proto";

import "google/protobuf/timestamp.proto";
import "api/proto/orchestrator.proto";

// AgentRuntime is the daemon-side service invoked by the control plane
// orchestrator's RemoteACPBackend. Session-shaped RPCs reuse the
// OrchestratorService request/response messages so types flow naturally
// in and out of pkg/orchestration without duplicate conversion layers.
service AgentRuntime {
    // Enroll is retained as a gRPC surface marker. Production daemons do
    // NOT accept inbound registration — the REST /api/v1/agents/register
    // endpoint on the control plane handles mTLS-authenticated registration.
    // The RPC returns Unimplemented and is kept only so existing client
    // code compiles across the transition.
    rpc Enroll(EnrollRequest) returns (EnrollResponse);

    // Spawn creates a persistent agent session on the daemon.
    rpc Spawn(quicbaas.orchestrator.v1.SpawnSessionRequest)
        returns (quicbaas.orchestrator.v1.SpawnSessionResponse);

    // Prompt sends a prompt to a running session and streams response
    // content blocks. Non-streaming callers can accumulate the stream
    // and yield the final response.
    rpc Prompt(quicbaas.orchestrator.v1.PromptSessionRequest)
        returns (stream quicbaas.orchestrator.v1.PromptSessionResponse);

    // Status returns live session health.
    rpc Status(quicbaas.orchestrator.v1.SessionStatusRequest)
        returns (quicbaas.orchestrator.v1.SessionStatusResponse);

    // Close terminates a running session.
    rpc Close(quicbaas.orchestrator.v1.CloseSessionRequest)
        returns (quicbaas.orchestrator.v1.CloseSessionResponse);

    // Heartbeat is a bidirectional stream: daemons push periodic
    // liveness beats; the orchestrator can push policy refreshes
    // (tenant sandbox overrides) back on the same stream.
    rpc Heartbeat(stream HeartbeatBeat) returns (stream HeartbeatAck);

    // Infer runs a stateless prompt against a named backend without
    // requiring a prior Spawn. Intended for backends like Ollama where
    // each call is self-contained. Streams response chunks for
    // interactive UIs; callers that want a single aggregated response
    // accumulate chunks until the frame with final=true arrives.
    rpc Infer(InferRequest) returns (stream InferResponse);

    // ListModels returns the model names available on a named backend as
    // seen from this daemon. For Ollama this is the set of locally-pulled
    // models; for ACP backends it returns a curated catalog.
    rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

    // Exec runs one command inside the container of a session THIS daemon
    // spawned, for the caller's tenant (go-quicbaas#981). The session names
    // the container; the caller never does. The daemon refuses a session it
    // does not hold, one of another tenant, and one with no container.
    rpc ExecSession(ExecSessionRequest) returns (ExecSessionResponse);
}

// EnrollRequest carries the daemon-declared capabilities it would have
// advertised on registration. The enrollment_token field was removed in
// the mTLS-identity refactor; identity is now established by the client
// certificate presented on the TLS handshake at the REST register
// endpoint. Remaining fields are retained for compile compatibility on
// the gRPC Enroll stub (which always returns Unimplemented).
message EnrollRequest {
    string hostname = 2;
    repeated string backends = 3;
    string sandbox_policy = 4;
}

// EnrollResponse carries the persistent identity the daemon will use
// for every subsequent RPC in its lifetime.
message EnrollResponse {
    string agent_id = 1;
    string service_account_id = 2;
    string tenant_id = 3;
    repeated string scopes = 4;
    string client_id = 5;
    string client_secret = 6;
}

// HeartbeatBeat is the daemon-to-control-plane message on the heartbeat
// stream. Sequence numbers are monotonically increasing per-daemon and
// are echoed in the ack for round-trip correlation.
message HeartbeatBeat {
    string agent_id = 1;
    int32 active_sessions = 2;
    repeated string backends = 3;
    string sandbox_policy = 4;
    bool has_container_runtime = 5;
    uint64 sequence = 6;
    google.protobuf.Timestamp emitted_at = 7;
}

// HeartbeatAck is the control-plane-to-daemon message on the heartbeat
// stream. The optional tenant override field lets the orchestrator push
// policy changes without a separate RPC round trip.
message HeartbeatAck {
    uint64 sequence = 1;
    google.protobuf.Timestamp received_at = 2;
    string tenant_sandbox_policy_override = 3;
}

// InferRequest carries the parameters for a stateless inference call.
// No session ID is required; the backend must accept sessionless prompts.
message InferRequest {
    // backend is the named backend to route to (e.g., "ollama").
    string backend = 1;

    // model is the model to use. When empty, the backend's default model
    // is used.
    string model = 2;

    // prompt is the user prompt text. Required.
    string prompt = 3;

    // system_prompt is an optional system message prepended to the
    // conversation context.
    string system_prompt = 4;

    // tenant_id is the calling tenant for multi-tenant enforcement at
    // the daemon.
    string tenant_id = 5;

    // metadata is an opaque string-to-string map passed through
    // unchanged to the backend. Callers can use this for tracing IDs,
    // request correlation, or future extensions without breaking the
    // proto contract.
    map<string, string> metadata = 6;
}

// ListModelsRequest identifies the backend whose model catalog is requested.
message ListModelsRequest {
    // backend is the named backend to query (e.g., "ollama").
    string backend = 1;

    // tenant_id scopes the request in multi-tenant deployments.
    string tenant_id = 2;
}

// ListModelsResponse carries the model names available on the named backend.
message ListModelsResponse {
    // backend echoes the requested backend name.
    string backend = 1;

    // models is the ordered list of model identifiers (e.g., "qwen3:1.7b").
    repeated string models = 2;
}

// InferResponse carries one or more content deltas from the backend.
// Multiple frames compose the full response when streaming; a single
// frame carries the full content for non-streaming backends.
message InferResponse {
    // delta is one content block emitted by the backend. Streaming
    // callers accumulate blocks across frames; aggregate callers read
    // the single frame that has final=true.
    repeated quicbaas.orchestrator.v1.ContentBlock delta = 1;

    // model is the model that produced this frame, set on the final
    // frame. May be empty on intermediate frames.
    string model = 2;

    // stop_reason is set on the final frame (e.g., "end_turn",
    // "max_tokens"). Empty on intermediate frames.
    string stop_reason = 3;

    // final is true on the last frame of the stream. Callers must not
    // send further requests after receiving a frame with final=true.
    bool final = 4;
}

// ExecSessionRequest names a session this daemon holds and the command to run
// in its container.
message ExecSessionRequest {
    string tenant_id = 1;
    string session_id = 2;
    repeated string cmd = 3;
    map<string, string> env = 4;
    // work_dir is the directory INSIDE the container.
    string work_dir = 5;
    bytes stdin = 6;
}

// ExecSessionResponse is what the command did. A non-zero exit_code is an
// answer, not an error. Output is bounded by the daemon; truncated says it
// was cut. stdout and stderr are BYTES, exactly as the command wrote them: a
// command's output is not guaranteed to be UTF-8, and a string field holding
// invalid UTF-8 cannot be serialized — the response, and its exit status,
// would be lost.
message ExecSessionResponse {
    int32 exit_code = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    bool truncated = 4;
}
