  int64 evaluation_time_ns = 4;
}

// =============================================================================
// Delegated Administration Messages
// =============================================================================

// AdminRole represents a delegated administration role type
enum AdminRole {
  ADMIN_ROLE_UNSPECIFIED = 0;
  ADMIN_ROLE_SUPER_ADMIN = 1;
  ADMIN_ROLE_TENANT_ADMIN = 2;
  ADMIN_ROLE_USER_ADMIN = 3;
  // ADMIN_ROLE_GROUP_ADMIN managed quicbaas groups; quicbaas keeps none.
  reserved 4;
  reserved "ADMIN_ROLE_GROUP_ADMIN";
  ADMIN_ROLE_POLICY_ADMIN = 5;
  ADMIN_ROLE_AUDIT_ADMIN = 6;
  ADMIN_ROLE_READ_ONLY = 7;
}

// ResourceScope defines a scope limitation for admin access
message ResourceScope {
  string resource_type = 1;
  string resource_pattern = 2;
}

// AdminAssignment represents a user's administrative assignment
message AdminAssignment {
  string id = 1;
  string user_id = 2;
  AdminRole admin_role = 3;
  repeated string tenant_ids = 4;
  repeated string permissions = 5;
  repeated string denied_permissions = 6;
  repeated ResourceScope resource_scopes = 7;
  google.protobuf.Timestamp expires_at = 8;
  string granted_by = 9;
  google.protobuf.Timestamp granted_at = 10;
  google.protobuf.Timestamp last_used_at = 11;
  bool active = 12;
  map<string, string> metadata = 13;
}

// AdminAssignmentList contains a list of admin assignments
message AdminAssignmentList {
  repeated AdminAssignment assignments = 1;
  int32 total = 2;
}

// CreateAdminAssignmentRequest creates a new admin assignment
message CreateAdminAssignmentRequest {
  string user_id = 1;
  AdminRole admin_role = 2;
  repeated string tenant_ids = 3;
  repeated string permissions = 4;
  repeated string denied_permissions = 5;
  repeated ResourceScope resource_scopes = 6;
  google.protobuf.Timestamp expires_at = 7;
  string granted_by = 8;
  map<string, string> metadata = 9;
}

// GetAdminAssignmentRequest retrieves an admin assignment by ID
message GetAdminAssignmentRequest {
  string id = 1;
}

// UpdateAdminAssignmentRequest updates an existing admin assignment
message UpdateAdminAssignmentRequest {
  string id = 1;
  AdminRole admin_role = 2;
  repeated string tenant_ids = 3;
  repeated string permissions = 4;
  repeated string denied_permissions = 5;
  repeated ResourceScope resource_scopes = 6;
  google.protobuf.Timestamp expires_at = 7;
  bool active = 8;
  map<string, string> metadata = 9;
}

// DeleteAdminAssignmentRequest deletes an admin assignment
message DeleteAdminAssignmentRequest {
  string id = 1;
}

// DeleteAdminAssignmentResponse confirms deletion
message DeleteAdminAssignmentResponse {
  bool success = 1;
}

// ListAdminAssignmentsRequest lists admin assignments with filters
message ListAdminAssignmentsRequest {
  string user_id = 1;
  string tenant_id = 2;
  AdminRole admin_role = 3;
  bool active_only = 4;
  int32 limit = 5;
  int32 offset = 6;
}

// CheckAdminPermissionRequest checks if an admin has a specific permission
message CheckAdminPermissionRequest {
  string user_id = 1;
  string permission = 2;
  string tenant_id = 3;
  string resource_type = 4;
  string resource_id = 5;
}

// CheckAdminPermissionResponse returns the permission check result
message CheckAdminPermissionResponse {
  bool allowed = 1;
  string assignment_id = 2;
  AdminRole admin_role = 3;
  string reason = 4;
}

// ImpersonationSession represents an active impersonation session
message ImpersonationSession {
  string id = 1;
  string admin_user_id = 2;
  string target_user_id = 3;
  string tenant_id = 4;
  string reason = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp ended_at = 8;
  string audit_log_id = 9;
}

// ImpersonationSessionList contains a list of impersonation sessions
message ImpersonationSessionList {
  repeated ImpersonationSession sessions = 1;
}

// StartImpersonationRequest starts an impersonation session.
//
// It carries NO admin_user_id: the acting admin is the authenticated
// caller, resolved server-side from the verified principal, never named by
// the request (go-quicbaas#383). Field numbers are preserved across the
// removal (the old field 1 is retired) so the wire stays compatible for
// the remaining fields.
message StartImpersonationRequest {
  reserved 1;
  reserved "admin_user_id";
  string target_user_id = 2;
  string tenant_id = 3;
  string reason = 4;
  google.protobuf.Duration duration = 5;
}

// EndImpersonationRequest ends an impersonation session
message EndImpersonationRequest {
  string session_id = 1;
}

// EndImpersonationResponse confirms session ended
message EndImpersonationResponse {
  bool success = 1;
}

// GetActiveImpersonationsRequest retrieves active impersonation sessions
message GetActiveImpersonationsRequest {
  string admin_user_id = 1;
}

// =============================================================================
// GDPR Consent Messages
// =============================================================================

// ConsentPurpose represents a purpose for which consent can be granted
enum ConsentPurpose {
  CONSENT_PURPOSE_UNSPECIFIED = 0;
  CONSENT_PURPOSE_MARKETING = 1;
  CONSENT_PURPOSE_ANALYTICS = 2;
  CONSENT_PURPOSE_PERSONALIZATION = 3;
  CONSENT_PURPOSE_THIRD_PARTY = 4;
  CONSENT_PURPOSE_DATA_PROCESSING = 5;
  CONSENT_PURPOSE_DATA_RETENTION = 6;
  CONSENT_PURPOSE_FUNCTIONAL = 7;
}

// ConsentStatus represents the status of a consent
enum ConsentStatus {
  CONSENT_STATUS_UNSPECIFIED = 0;
  CONSENT_STATUS_GRANTED = 1;
  CONSENT_STATUS_DENIED = 2;
  CONSENT_STATUS_WITHDRAWN = 3;
  CONSENT_STATUS_PENDING = 4;
}

// Consent represents a user's consent for a specific purpose
message Consent {
  string id = 1;
  string user_id = 2;
  string tenant_id = 3;
  ConsentPurpose purpose = 4;
  ConsentStatus status = 5;
  string version = 6;
  google.protobuf.Timestamp granted_at = 7;
  google.protobuf.Timestamp withdrawn_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  string ip_address = 10;
  string user_agent = 11;
  map<string, string> metadata = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

// ConsentList contains a list of consents
message ConsentList {
  repeated Consent consents = 1;
  int32 total = 2;
}

// GrantConsentRequest grants consent for a specific purpose
message GrantConsentRequest {
  string tenant_id = 1;
  string user_id = 2;
  ConsentPurpose purpose = 3;
  string version = 4;
  google.protobuf.Timestamp expires_at = 5;
  string ip_address = 6;
  string user_agent = 7;
}

// WithdrawConsentRequest withdraws a previously granted consent
message WithdrawConsentRequest {
  string tenant_id = 1;
  string user_id = 2;
  ConsentPurpose purpose = 3;
  string ip_address = 4;
  string user_agent = 5;
}

// WithdrawConsentResponse confirms consent withdrawal
message WithdrawConsentResponse {
  bool success = 1;
}

// GetConsentRequest retrieves a specific consent
message GetConsentRequest {
  string tenant_id = 1;
  string user_id = 2;
  ConsentPurpose purpose = 3;
}

// ListUserConsentsRequest lists all consents for a user
message ListUserConsentsRequest {
  string tenant_id = 1;
  string user_id = 2;
}

// =============================================================================
// GDPR Data Export Messages
// =============================================================================

// DataExportFormat represents the format for data exports
enum DataExportFormat {
  DATA_EXPORT_FORMAT_UNSPECIFIED = 0;
  DATA_EXPORT_FORMAT_JSON = 1;
  DATA_EXPORT_FORMAT_CSV = 2;
  DATA_EXPORT_FORMAT_XML = 3;
}

// DataExportStatus represents the status of a data export request
enum DataExportStatus {
  DATA_EXPORT_STATUS_UNSPECIFIED = 0;
  DATA_EXPORT_STATUS_PENDING = 1;
  DATA_EXPORT_STATUS_PROCESSING = 2;
  DATA_EXPORT_STATUS_COMPLETED = 3;
  DATA_EXPORT_STATUS_FAILED = 4;
  DATA_EXPORT_STATUS_EXPIRED = 5;
}

// DataExportRequest represents a request to export user data
message DataExportRequest {
  string id = 1;
  string user_id = 2;
  string tenant_id = 3;
  string requested_by = 4;
  DataExportFormat format = 5;
  DataExportStatus status = 6;
  repeated string include_categories = 7;
  repeated string exclude_categories = 8;
  google.protobuf.Timestamp requested_at = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp completed_at = 11;
  google.protobuf.Timestamp expires_at = 12;
  string download_url = 13;
  int64 file_size_bytes = 14;
  string error_message = 15;
  map<string, string> metadata = 16;
}

// RequestExportRequest creates a new data export request
message RequestExportRequest {
  string tenant_id = 1;
  string user_id = 2;
  string requested_by = 3;
  DataExportFormat format = 4;
  repeated string include_categories = 5;
  repeated string exclude_categories = 6;
}

// GetExportStatusRequest retrieves the status of an export request
message GetExportStatusRequest {
  string export_id = 1;
}

// GenerateExportRequest triggers generation of a user data export
message GenerateExportRequest {
  string export_id = 1;
}

// UserDataExport contains all exportable user data
message UserDataExport {
  ExportMetadata export_metadata = 1;
  UserProfileExport profile = 2;
  repeated SessionExport sessions = 3;
  repeated ConsentExport consents = 4;
  // groups exported quicbaas group memberships; quicbaas keeps no groups.
  reserved 5;
  reserved "groups";
  repeated RoleAssignmentExport roles = 6;
  repeated AuditLogExport audit_logs = 7;
  repeated CredentialExport credentials = 8;
  MFAInfoExport mfa_info = 9;
}

// ExportMetadata contains metadata about the export
message ExportMetadata {
  string export_id = 1;
  string user_id = 2;
  string tenant_id = 3;
  google.protobuf.Timestamp exported_at = 4;
  DataExportFormat format = 5;
  repeated string categories = 6;
  string schema_version = 7;
}

// UserProfileExport contains exportable profile data
message UserProfileExport {
  string id = 1;
  string email = 2;
  string name = 3;
  map<string, string> attributes = 4;
  google.protobuf.Timestamp created = 5;
  google.protobuf.Timestamp updated = 6;
  google.protobuf.Timestamp last_auth = 7;
}

// SessionExport contains exportable session data
message SessionExport {
  string id = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp expires_at = 3;
  google.protobuf.Timestamp last_active = 4;
  string ip_address = 5;
  string user_agent = 6;
  string auth_method = 7;
  google.protobuf.Timestamp ended_at = 8;
}

// ConsentExport contains exportable consent data
message ConsentExport {
  ConsentPurpose purpose = 1;
  ConsentStatus status = 2;
  string version = 3;
  google.protobuf.Timestamp granted_at = 4;
  google.protobuf.Timestamp withdrawn_at = 5;
}

// RoleAssignmentExport contains exportable role assignment data
message RoleAssignmentExport {
  string role_id = 1;
  string role_name = 2;
  google.protobuf.Timestamp assigned_at = 3;
}

// AuditLogExport contains exportable audit log data
message AuditLogExport {
  google.protobuf.Timestamp timestamp = 1;
  string action = 2;
  string resource = 3;
  string ip_address = 4;
  bool success = 5;
}

// CredentialExport contains exportable credential metadata
message CredentialExport {
  string id = 1;
  string type = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_used_at = 5;
  string attestation = 6;
  repeated string transports = 7;
}

// MFAInfoExport contains exportable MFA information
message MFAInfoExport {
  bool enabled = 1;
  string method = 2;
  google.protobuf.Timestamp enrolled_at = 3;
  int32 backup_codes_remaining = 4;
}

