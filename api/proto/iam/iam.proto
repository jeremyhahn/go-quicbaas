  string name = 2;
  string description = 3;
  map<string, string> labels = 4;
  int32 priority = 5;
  bytes spec_yaml = 6;
}

message GetPolicyRequest {
  string tenant_id = 1;
  string policy_name = 2;
}

message UpdatePolicyRequest {
  string tenant_id = 1;
  string policy_name = 2;
  string description = 3;
  map<string, string> labels = 4;
  int32 priority = 5;
  bytes spec_yaml = 6;
}

message DeletePolicyRequest {
