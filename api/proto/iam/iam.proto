syntax = "proto3";

package quicbaas.iam.v1;

option go_package = "github.com/jeremyhahn/go-quicbaas/api/proto/iam;iam";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "qrdb/v1/permission.proto";

// IAM Service for identity and access management
service IAMService {
  // Tenant management
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  rpc UpdateTenant(UpdateTenantRequest) returns (Tenant);
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc ProvisionTenant(ProvisionTenantRequest) returns (ProvisionTenantResponse) {
      option (qrdb.v1.permission) = "tenants:create";
  }

  // User management
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // ApproveUser moves a pending user to active, as REST's
  // POST /api/v1/iam/users/{user_id}/approve does, and carries that route's
  // users:enable grant. It is its own verb so approving never needs the
  // broader rights of UpdateUser.
  rpc ApproveUser(ApproveUserRequest) returns (ApproveUserResponse) {
      option (qrdb.v1.permission) = "users:enable";
  }

  // WebAuthn credential administration (user-scoped). The verbs are
  // addressed by IAM user id like every other user-nested admin verb; the
  // translation to the (tenant, email) key the credential store uses happens
  // server-side so no transport can address a different account.
  // The permission annotations are what the unified server enforces; the Go
  // mapping in pkg/api/grpc/authz_mapping.go mirrors them for the legacy gate.
  // Both carry the qrdb user-admin families the same verbs require on the MCP
  // plane, so a caller needs exactly the rights it would need to delete the
  // user outright.
  rpc ListWebAuthnCredentials(ListWebAuthnCredentialsRequest) returns (ListWebAuthnCredentialsResponse) {
      option (qrdb.v1.permission) = "users:read";
  }
  rpc DeleteWebAuthnCredential(DeleteWebAuthnCredentialRequest) returns (DeleteWebAuthnCredentialResponse) {
      option (qrdb.v1.permission) = "users:delete";
  }
  rpc DeleteWebAuthnCredentials(DeleteWebAuthnCredentialsRequest) returns (DeleteWebAuthnCredentialsResponse) {
      option (qrdb.v1.permission) = "users:delete";
  }

  // Invite activation. These are PUBLIC (pre-auth): the one-time invite token
  // is the credential, and the invitee holds no account token until
  // activation completes. They therefore carry no permission option, matching
  // REST's /api/v1/iam/{tenant_id}/invites/{token} pre-auth routes.
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse);
  rpc ActivateFIDO2Begin(ActivateInviteRequest) returns (ActivateFIDO2BeginResponse);
  rpc ActivateFIDO2Finish(ActivateFIDO2FinishRequest) returns (ActivateInviteResponse);
  rpc ActivatePIV(ActivatePIVRequest) returns (ActivateInviteResponse);

  // Role management
  rpc CreateRole(CreateRoleRequest) returns (Role);
  rpc GetRole(GetRoleRequest) returns (Role);
  rpc UpdateRole(UpdateRoleRequest) returns (Role);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  // ReconcileRoles converges a tenant's stored built-in roles onto the
  // definitions the running build carries. It takes the role-create family
  // rather than a verb of its own: a dedicated roles:reconcile would be absent
  // from every role seeded before it existed, so nobody would hold the grant
  // needed to repair that exact absence. The annotation is what the unified
  // server enforces; pkg/api/grpc/authz_mapping.go mirrors it for the legacy
  // gate, and the two are pinned to each other by
  // TestGRPCPermissions_ProtoOptionMatchesAuthzMapping.
  rpc ReconcileRoles(ReconcileRolesRequest) returns (ReconcileRolesResponse) {
      option (qrdb.v1.permission) = "roles:create";
  }

  // Application (OAuth client) management
  rpc RegisterApp(RegisterAppRequest) returns (Application);
  rpc GetApp(GetAppRequest) returns (Application);
  rpc UpdateApp(UpdateAppRequest) returns (Application);
  rpc DeleteApp(DeleteAppRequest) returns (DeleteAppResponse);
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
  rpc RotateAppSecret(RotateAppSecretRequest) returns (Application);

  // Policy management
  rpc CreatePolicy(CreatePolicyRequest) returns (Policy);
  rpc GetPolicy(GetPolicyRequest) returns (Policy);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (Policy);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc ValidatePolicy(ValidatePolicyRequest) returns (ValidatePolicyResponse);
  rpc TestPolicy(TestPolicyRequest) returns (TestPolicyResponse);

  // Delegated Administration
  rpc CreateAdminAssignment(CreateAdminAssignmentRequest) returns (AdminAssignment);
  rpc GetAdminAssignment(GetAdminAssignmentRequest) returns (AdminAssignment);
  rpc UpdateAdminAssignment(UpdateAdminAssignmentRequest) returns (AdminAssignment);
  rpc DeleteAdminAssignment(DeleteAdminAssignmentRequest) returns (DeleteAdminAssignmentResponse);
  rpc ListAdminAssignments(ListAdminAssignmentsRequest) returns (AdminAssignmentList);
  rpc CheckAdminPermission(CheckAdminPermissionRequest) returns (CheckAdminPermissionResponse);
  rpc StartImpersonation(StartImpersonationRequest) returns (ImpersonationSession);
  rpc EndImpersonation(EndImpersonationRequest) returns (EndImpersonationResponse);
  rpc GetActiveImpersonations(GetActiveImpersonationsRequest) returns (ImpersonationSessionList);

  // GDPR Consent Management
  rpc GrantConsent(GrantConsentRequest) returns (Consent);
  rpc WithdrawConsent(WithdrawConsentRequest) returns (WithdrawConsentResponse);
  rpc GetConsent(GetConsentRequest) returns (Consent);
  rpc ListUserConsents(ListUserConsentsRequest) returns (ConsentList);

  // GDPR Data Export
  rpc RequestExport(RequestExportRequest) returns (DataExportRequest);
  rpc GetExportStatus(GetExportStatusRequest) returns (DataExportRequest);
  rpc GenerateExport(GenerateExportRequest) returns (UserDataExport);

  // GDPR Data Deletion
  rpc RequestDeletion(RequestDeletionRequest) returns (DataDeletionRequest);
  rpc CancelDeletion(CancelDeletionRequest) returns (CancelDeletionResponse);
  rpc ProcessDeletion(ProcessDeletionRequest) returns (DeletionSummary);
  rpc GetDeletionStatus(GetDeletionStatusRequest) returns (DataDeletionRequest);
}

// Policy Enforcement Point Service
service PEPService {
  // Single authorization check
  rpc Check(CheckRequest) returns (CheckResponse);

  // Batch authorization check
  rpc CheckBatch(CheckBatchRequest) returns (CheckBatchResponse);

  // Subscribe to policy updates (streaming)
  rpc Subscribe(SubscribeRequest) returns (stream PolicyUpdate);
}

// MFA Service for multi-factor authentication operations
service MFAService {
  // Enrollment operations
  rpc BeginEnrollment(BeginMFAEnrollmentRequest) returns (BeginMFAEnrollmentResponse);
  rpc CompleteEnrollment(CompleteMFAEnrollmentRequest) returns (CompleteMFAEnrollmentResponse);
  rpc CancelEnrollment(CancelMFAEnrollmentRequest) returns (CancelMFAEnrollmentResponse);

  // Challenge/verification operations
  rpc BeginChallenge(BeginMFAChallengeRequest) returns (BeginMFAChallengeResponse);
  rpc VerifyChallenge(VerifyMFAChallengeRequest) returns (VerifyMFAChallengeResponse);
  rpc VerifyCode(VerifyMFACodeRequest) returns (VerifyMFACodeResponse);

  // Status operations
  rpc GetStatus(GetMFAStatusRequest) returns (GetMFAStatusResponse);
  rpc Disable(DisableMFARequest) returns (DisableMFAResponse);

  // Backup code operations
  rpc GenerateBackupCodes(GenerateBackupCodesRequest) returns (GenerateBackupCodesResponse);
  rpc VerifyBackupCode(VerifyBackupCodeRequest) returns (VerifyBackupCodeResponse);
  rpc GetBackupCodeStatus(GetBackupCodeStatusRequest) returns (GetBackupCodeStatusResponse);
}

// Federation Service for OIDC Consumer federation with external identity providers
service FederationService {
  // Provider management
  rpc CreateProvider(CreateProviderRequest) returns (ExternalProvider) {
      option (qrdb.v1.permission) = "tenants:create";
  }
  rpc GetProvider(GetProviderRequest) returns (ExternalProvider) {
      option (qrdb.v1.permission) = "tenants:read";
  }
  rpc UpdateProvider(UpdateProviderRequest) returns (ExternalProvider) {
      option (qrdb.v1.permission) = "tenants:create";
  }
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse) {
      option (qrdb.v1.permission) = "tenants:delete";
  }
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse) {
      option (qrdb.v1.permission) = "tenants:read";
  }

  // Authentication flow
  rpc BeginFederatedLogin(BeginFederatedLoginRequest) returns (BeginFederatedLoginResponse);
  rpc HandleFederatedCallback(HandleFederatedCallbackRequest) returns (HandleFederatedCallbackResponse);

  // Account linking
  rpc LinkAccount(LinkAccountRequest) returns (LinkAccountResponse) {
      option (qrdb.v1.permission) = "tenants:create";
  }
  rpc UnlinkAccount(UnlinkAccountRequest) returns (UnlinkAccountResponse) {
      option (qrdb.v1.permission) = "tenants:delete";
  }
  rpc GetUserLinks(GetUserLinksRequest) returns (GetUserLinksResponse) {
      option (qrdb.v1.permission) = "tenants:read";
  }
}

// Core messages
message Tenant {
  string id = 1;
  string name = 2;
  TenantSettings settings = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// TenantSettings scalars are optional so an UpdateTenant request can tell
// "unchanged" (absent) from "set to false or 0" (present) (#1518).
message TenantSettings {
  optional int32 max_users = 1;
  optional bool mfa_required = 2;
  map<string, string> named_networks = 3;
  // display_name is the tenant's human-readable display name. It is a
  // setting, not the tenant's name (#1518).
  optional string display_name = 4;
}

message User {
  // mfa_verified and mfa_timestamp were session facts carried on an identity
  // record that never updated them, so a user who once passed MFA reported
  // verified forever. MFA state is answered by the MFA service, which owns it.
  reserved 11, 12;
  reserved "mfa_verified", "mfa_timestamp";

  // groups was the account's own group-membership list. quicbaas keeps no
  // group membership on the account (go-quicbaas#1027); the OIDC `groups`
  // claim is derived from the roles the account is bound to.
  reserved 6;
  reserved "groups";

  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string name = 4;
  repeated string roles = 5;
  map<string, string> attributes = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp last_auth = 10;

  // lifecycle is the canonical account state: pending, active, suspended,
  // locked, disabled or deleting. It replaces the state/suspended/locked triple,
  // which could describe an account as suspended and active at the same time.
  string lifecycle = 13;

  // auth_methods lists the authentication methods this account is permitted to
  // present ("webauthn", "piv"). Empty states no restriction.
  repeated string auth_methods = 14;

  // username is the tenant-unique handle — what an administrator types to
  // address this account, and the key the store's username index is built on.
  // It is a field of its own, not the display `name`: while it was derived
  // from the display name, a lookup for the handle the caller asked for missed
  // the record, and two accounts sharing a display name collided on an index
  // neither had named.
  string username = 15;

  // The activation invite, set ONLY on the CreateUser response for an account
  // created pending. The token is minted by the invite store and returned
  // exactly once; the user record never carries it, so every other read leaves
  // these empty.
  string invite_token = 16;
  string invite_url = 17;
  google.protobuf.Timestamp invite_expires_at = 18;
}

message Role {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  repeated string permissions = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // retired_permissions is derived on read from the live permission registry
  // and never stored: it names the drift between what the tenant was seeded
  // with and what the build now grants. Empty means the role agrees with the
  // build.
  repeated string retired_permissions = 8;
}

message Application {
  string client_id = 1;
  string client_secret = 2;  // Only returned on create/rotate
  string tenant_id = 3;
  string name = 4;
  repeated string redirect_uris = 5;
  string resource_prefix = 6;
  repeated string grant_types = 7;
  repeated string response_types = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // token_endpoint_auth_method is the RFC 7591 §2 client authentication method.
  string token_endpoint_auth_method = 11;
}

message Policy {
  string name = 1;
  string tenant_id = 2;
  string description = 3;
  map<string, string> labels = 4;
  int32 priority = 5;
  bytes spec_yaml = 6;  // YAML policy spec
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Set only when the stored record does not decode strictly: the entry
  // carries its name and tenant, no rules, and is never applied.
  PolicyLoadError load_error = 9;
}

// PolicyLoadError reports why a stored policy record was not applied.
// unknown_keys names key paths only, never values.
message PolicyLoadError {
  string reason = 1;
  repeated string unknown_keys = 2;
}

// PEP messages
message Subject {
  string id = 1;
  string tenant_id = 2;
  repeated string roles = 3;
  repeated string groups = 4;
  map<string, string> attributes = 5;
  bool mfa_verified = 6;
  google.protobuf.Timestamp mfa_timestamp = 7;
}

message CheckRequest {
  Subject subject = 1;
  string action = 2;
  string resource = 3;
  map<string, string> context = 4;
}

message CheckResponse {
  bool allowed = 1;
  string matched_policy = 2;
  string matched_rule = 3;
  int64 evaluation_time_ns = 4;
}

message CheckBatchRequest {
  Subject subject = 1;
  string action = 2;
  repeated string resources = 3;
  map<string, string> context = 4;
  // stop_on_deny ends evaluation after the first denied resource; the
  // response then carries results only up to and including that denial.
  bool stop_on_deny = 5;
}

message CheckBatchResponse {
  repeated bool results = 1;
  int64 evaluation_time_ns = 2;
}

message SubscribeRequest {
  string service_id = 1;
  repeated string resource_patterns = 2;
}

message PolicyUpdate {
  enum Type {
    SNAPSHOT = 0;
    CREATED = 1;
    UPDATED = 2;
    DELETED = 3;
  }
  Type type = 1;
  bytes policy_data = 2;
  string policy_id = 3;
  int64 version = 4;
}

// Tenant CRUD messages
message CreateTenantRequest {
  string id = 1;
  string name = 2;
  TenantSettings settings = 3;
  // isolation_type selects the engine isolation strategy for the tenant's
  // data ("prefix", "barrier", "volume", "raft"). The engine binds isolation
  // at creation and it cannot be changed afterwards, which is why it lives on
  // the create request and not on UpdateTenantRequest. Empty defers to the
  // engine default (prefix), so pre-existing clients are unaffected.
  string isolation_type = 4;
  // engine_quotas overrides the engine-level resource limits applied to the
  // tenant. Unset leaves the engine's configured defaults in place.
  TenantEngineQuotas engine_quotas = 5;
  // engine_entitlements overrides the engine-level feature entitlements for
  // the tenant. Unset leaves the engine's configured defaults in place.
  TenantEngineEntitlements engine_entitlements = 6;
}

// TenantEngineQuotas carries the engine-level numeric resource limits applied
// to a tenant at creation. A value of -1 means unlimited; 0 means use the
// system default. Mirrors pkg/quota.Quotas (limit fields only — the usage
// counters on that struct are engine-owned outputs, never creation inputs).
message TenantEngineQuotas {
  // max_databases caps the number of databases the tenant may create.
  int64 max_databases = 1;
  // max_raft_groups caps the number of dedicated Raft consensus groups.
  int64 max_raft_groups = 2;
  // max_replicas_per_group caps the replication factor of any single group.
  int64 max_replicas_per_group = 3;
  // max_total_replicas caps total replicas across all dedicated-raft groups.
  int64 max_total_replicas = 4;
  // max_collections caps the number of vector/time-series collections.
  int64 max_collections = 5;
  // max_keys caps the total number of keys across all databases.
  int64 max_keys = 6;
  // max_storage_bytes caps total on-disk storage consumption in bytes.
  int64 max_storage_bytes = 7;
  // max_database_size_bytes caps the on-disk size of any single database.
  int64 max_database_size_bytes = 8;
  // max_users caps the number of IAM users the tenant may create.
  int64 max_users = 9;
  // max_roles caps the number of IAM roles the tenant may create.
  int64 max_roles = 10;
  // max_certificates caps the number of TLS certificates the tenant may hold.
  int64 max_certificates = 11;
  // max_backups caps the number of database backups the tenant may retain.
  int64 max_backups = 12;
  // max_vector_dims caps the maximum vector dimensionality the tenant may use.
  int64 max_vector_dims = 13;
  // max_ts_metrics caps the number of time-series metrics the tenant may track.
  int64 max_ts_metrics = 14;
  // max_dedicated_wal_groups caps dedicated-raft groups with a per-tenant WAL.
  int64 max_dedicated_wal_groups = 15;
  // system_barrier_quota governs the tenant's use of the shared system barrier
  // (bytes): 0 = unavailable, -1 = unlimited, >0 = capped at that many bytes.
  int64 system_barrier_quota = 16;
}

// TenantEngineEntitlements carries the engine-level feature entitlements
// granted to a tenant at creation. Mirrors pkg/quota.Entitlements.
message TenantEngineEntitlements {
  // allowed_isolation_modes lists the isolation modes the tenant may use
  // (e.g. "prefix", "barrier", "volume", "raft"). Empty = system defaults.
  repeated string allowed_isolation_modes = 1;
  // allow_dedicated_raft permits provisioning dedicated Raft-backed databases.
  bool allow_dedicated_raft = 2;
  // allow_volume_storage permits provisioning databases on a dedicated volume.
  bool allow_volume_storage = 3;
  // allow_system_managed_barrier permits opting into system-managed auto-unseal
  // key management for the tenant's dedicated barrier.
  bool allow_system_managed_barrier = 4;
  // allow_dedicated_wal permits dedicated-raft databases with a per-tenant WAL.
  bool allow_dedicated_wal = 5;
  // allowed_barrier_modes lists the dedicated-barrier sealing strategies the
  // tenant may select. Empty = software defaults (none/passphrase/shamir).
  repeated string allowed_barrier_modes = 6;
}

message GetTenantRequest {
  string id = 1;
}

message UpdateTenantRequest {
  string id = 1;
  string name = 2;
  TenantSettings settings = 3;
}

message DeleteTenantRequest {
  string id = 1;
}

message DeleteTenantResponse {
  bool success = 1;
}

message ListTenantsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  int32 total = 2;
}

// ProvisionTenantRequest onboards a tenant when public registration is off:
// a system admin creates the tenant, its built-in roles and its first admin.
message ProvisionTenantRequest {
  // tenant_id is the new tenant's id. Required.
  string tenant_id = 1;
  // name is the human-readable tenant name. Empty defaults to tenant_id.
  string name = 2;
  // isolation_type selects the engine isolation strategy. Empty defaults to a
  // per-tenant barrier, unlike CreateTenant whose default is prefix.
  string isolation_type = 3;
  // admin_username is the tenant admin's login name. Empty defaults to "admin".
  string admin_username = 4;
  // admin_enrollment is "cert" (the default) or "invite".
  string admin_enrollment = 5;
  // admin_csr_pem is the admin's PEM CSR. Required in cert mode, refused in
  // invite mode.
  string admin_csr_pem = 6;
  // invite_expiry_hours bounds the invite's lifetime in invite mode. Zero
  // selects the server default.
  int32 invite_expiry_hours = 7;
}

// ProvisionTenantResponse carries the admin's credential: the signed
// certificate in cert mode, the one-time activation token in invite mode.
message ProvisionTenantResponse {
  string tenant_id = 1;
  string admin_user_id = 2;
  string admin_username = 3;
  string admin_role_id = 4;
  bool admin_pending = 5;
  string admin_cert_pem = 6;
  string admin_cert_thumbprint = 7;
  string invite_token = 8;
  google.protobuf.Timestamp invite_expires_at = 9;
  google.protobuf.Timestamp timestamp = 10;
}

// User CRUD messages
message CreateUserRequest {
  // groups: the account carries no group membership (go-quicbaas#1027).
  reserved 5;
  reserved "groups";

  string tenant_id = 1;
  string email = 2;
  string name = 3;
  repeated string roles = 4;
  map<string, string> attributes = 6;

  // lifecycle is the state to create in — pending, active or disabled only;
  // suspended and locked are things that HAPPEN to an account, not states one
  // is born in. Empty defaults to pending.
  string lifecycle = 7;

  // auth_methods lists the authentication methods this account is permitted to
  // present ("webauthn", "piv"). Empty defaults to webauthn.
  repeated string auth_methods = 8;

  // username is the tenant-unique handle: 3-64 characters of [A-Za-z0-9_-],
  // distinct from the display `name`. Empty derives one from the local part of
  // the email, which is what this transport did unconditionally while there
  // was nowhere to carry a requested handle.
  string username = 9;

  // invite_expiry_hours is how long the activation invite of a pending account
  // stays redeemable. Non-positive defaults to 24; values above 168 are capped.
  int32 invite_expiry_hours = 10;
}

message GetUserRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message UpdateUserRequest {
  // groups: the account carries no group membership (go-quicbaas#1027).
  reserved 6;
  reserved "groups";

  string tenant_id = 1;
  string user_id = 2;
  string email = 3;
  string name = 4;
  repeated string roles = 5;
  map<string, string> attributes = 7;

  // lifecycle, when non-empty, transitions the account: pending, active,
  // suspended, locked or disabled. The move is checked against the store's
  // transition table, so an illegal one is refused rather than written.
  //
  // `deleting` is REFUSED even though the transition table permits it. It is
  // the deletion workflow's claim on the record, and asserting it here would
  // strand the account in a terminal state with its credentials, group
  // memberships and sessions still live — delete the user instead.
  string lifecycle = 8;

  // auth_methods, when PRESENT, replaces the permitted authentication methods.
  //
  // It is a message rather than a bare repeated field so the update can express
  // an empty list, which the model defines as "no restriction". A repeated field
  // has no presence in proto3, so an explicit clear and an unmentioned field are
  // the same bytes — and an account restricted to ["piv"] could never be
  // un-restricted.
  AuthMethodsUpdate auth_methods = 9;

  // username, when non-empty, changes the tenant-unique handle. It is applied
  // independently of `name`: the two used to share one field, so a request
  // carrying both silently dropped this one.
  string username = 10;
}

message ApproveUserRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message ApproveUserResponse {
  User user = 1;  // The approved user, now active
}

// AuthMethodsUpdate carries a replacement set of permitted authentication
// methods. Its presence is the instruction; an empty values list clears the
// restriction.
message AuthMethodsUpdate {
  repeated string values = 1;
}

message DeleteUserRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message DeleteUserResponse {
  bool success = 1;
}

message ListUsersRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  string email = 4;
  string role = 5;

  // group filtered by membership in a quicbaas group. quicbaas keeps no
  // groups: identity is qrdb's, and a role is the grouping it offers.
  reserved 6;
  reserved "group";
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

// Role CRUD messages
message CreateRoleRequest {
  string tenant_id = 1;
  string id = 2;
  string name = 3;
  string description = 4;
  repeated string permissions = 5;
}

message GetRoleRequest {
  string tenant_id = 1;
  string role_id = 2;
}

message UpdateRoleRequest {
  string tenant_id = 1;
  string role_id = 2;
  string name = 3;
  string description = 4;
  repeated string permissions = 5;
}

message DeleteRoleRequest {
  string tenant_id = 1;
  string role_id = 2;
}

message DeleteRoleResponse {
  bool success = 1;
}

message ListRolesRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListRolesResponse {
  repeated Role roles = 1;
  int32 total = 2;
}

message AssignRoleRequest {
  string tenant_id = 1;
  string user_id = 2;
  string role = 3;
}

message AssignRoleResponse {
  bool success = 1;
}

message RevokeRoleRequest {
  string tenant_id = 1;
  string user_id = 2;
  string role = 3;
}

message RevokeRoleResponse {
  bool success = 1;
}

// ReconcileRolesRequest converges one tenant's stored built-in roles onto the
// definitions the running build carries.
message ReconcileRolesRequest {
  string tenant_id = 1;
}

// RoleReconcileResult records what reconciling one built-in role changed.
message RoleReconcileResult {
  string role_id = 1;
  string name = 2;
  bool created = 3;
  repeated string added = 4;
  repeated string removed = 5;
}

// ReconcileRolesResponse reports only the roles that changed. An empty roles
// list with changed=false means the tenant already agreed with the build and
// nothing was written.
message ReconcileRolesResponse {
  string tenant_id = 1;
  repeated RoleReconcileResult roles = 2;
  bool changed = 3;
}

// Application CRUD messages
message RegisterAppRequest {
  string tenant_id = 1;
  string name = 2;
  repeated string redirect_uris = 3;
  string resource_prefix = 4;
  repeated string grant_types = 5;
  repeated string response_types = 6;
  // token_endpoint_auth_method is the RFC 7591 §2 client authentication
  // method; empty registers the default, client_secret_basic.
  string token_endpoint_auth_method = 7;
}

message GetAppRequest {
  string tenant_id = 1;
  string client_id = 2;
}

message UpdateAppRequest {
  string tenant_id = 1;
  string client_id = 2;
  string name = 3;
  repeated string redirect_uris = 4;
  string resource_prefix = 5;
  repeated string grant_types = 6;
  repeated string response_types = 7;
  // Fields below are carried so an update never drops a value. Those the
  // application does not store are refused with InvalidArgument.
  optional string description = 8;
  repeated string post_logout_redirect_uris = 9;
  repeated string scopes = 10;
  optional string token_endpoint_auth_method = 11;
  repeated string contacts = 12;
  optional string logo_uri = 13;
  optional string policy_uri = 14;
  optional string tos_uri = 15;
  optional string jwks_uri = 16;
  optional string jwks = 17;
  google.protobuf.Duration access_token_ttl = 18;
  google.protobuf.Duration refresh_token_ttl = 19;
  google.protobuf.Duration id_token_ttl = 20;
  map<string, string> metadata = 21;
  optional bool enabled = 22;
  // mtls_cert_thumbprint re-binds the pinned RFC 8705 certificate thumbprint.
  optional string mtls_cert_thumbprint = 23;
}

message DeleteAppRequest {
  string tenant_id = 1;
  string client_id = 2;
}

message DeleteAppResponse {
  bool success = 1;
}

message ListAppsRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListAppsResponse {
  repeated Application apps = 1;
  int32 total = 2;
}

message RotateAppSecretRequest {
  string tenant_id = 1;
  string client_id = 2;
}

// Policy CRUD messages
message CreatePolicyRequest {
