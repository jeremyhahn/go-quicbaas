}

// Verify MFA challenge response
message VerifyMFAChallengeResponse {
  bool success = 1;
  string session_token = 2;
  google.protobuf.Timestamp verified_at = 3;
}

// Verify MFA code request (stateless verification)
message VerifyMFACodeRequest {
  string tenant_id = 1;
  string user_id = 2;
  string code = 3;
}

// Verify MFA code response
message VerifyMFACodeResponse {
  bool success = 1;
}

// Get MFA status request
message GetMFAStatusRequest {
  string tenant_id = 1;
  string user_id = 2;
}

// Get MFA status response
message GetMFAStatusResponse {
  bool enabled = 1;
  MFAMethod method = 2;
  google.protobuf.Timestamp enrolled_at = 3;
  google.protobuf.Timestamp last_verified = 4;
  int32 backup_codes_remaining = 5;
}

// Disable MFA request
message DisableMFARequest {
  string tenant_id = 1;
  string user_id = 2;
}

// Disable MFA response
message DisableMFAResponse {
  bool success = 1;
}

// Generate backup codes request
message GenerateBackupCodesRequest {
  string tenant_id = 1;
  string user_id = 2;
}

// Generate backup codes response
message GenerateBackupCodesResponse {
  repeated string codes = 1;
}

// Verify backup code request
message VerifyBackupCodeRequest {
  string tenant_id = 1;
  string user_id = 2;
  string code = 3;
}

// Verify backup code response
message VerifyBackupCodeResponse {
  bool success = 1;
  int32 remaining_codes = 2;
}

// Get backup code status request
message GetBackupCodeStatusRequest {
  string tenant_id = 1;
  string user_id = 2;
}

// Get backup code status response
message GetBackupCodeStatusResponse {
  int32 total_codes = 1;
  int32 remaining_codes = 2;
  google.protobuf.Timestamp generated_at = 3;
}

// =============================================================================
// Session Service
// =============================================================================

// Session Service for managing user sessions
service SessionService {
  // List sessions for a tenant/user
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // Get a specific session
  rpc GetSession(GetSessionRequest) returns (Session);

  // Revoke a specific session
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // Revoke all sessions for a user/tenant
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (RevokeAllSessionsResponse);

  // Revoke all sessions except the specified one
  rpc RevokeOtherSessions(RevokeOtherSessionsRequest) returns (RevokeOtherSessionsResponse);
}

// Session represents a user session
message Session {
  string id = 1;
  string user_id = 2;
  string tenant_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_active = 5;
  google.protobuf.Timestamp expires_at = 6;
  bool mfa_verified = 7;
  string ip_address = 8;
  string user_agent = 9;
  string device_info = 10;
}

message ListSessionsRequest {
  string tenant_id = 1;
  string user_id = 2;  // Optional: filter by user
  int32 limit = 3;
  int32 offset = 4;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  int32 total = 2;
}

message GetSessionRequest {
  string session_id = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
}

message RevokeSessionResponse {
  bool success = 1;
}

message RevokeAllSessionsRequest {
  string tenant_id = 1;
  string user_id = 2;  // Optional: revoke for specific user
}

message RevokeAllSessionsResponse {
  int32 revoked_count = 1;
}

message RevokeOtherSessionsRequest {
  string tenant_id = 1;
  string keep_session_id = 2;
}

message RevokeOtherSessionsResponse {
  int32 revoked_count = 1;
}

// =============================================================================
// Audit Service
// =============================================================================

// Audit Service for querying audit logs
service AuditService {
  // Query audit events with filters
  rpc QueryAuditEvents(QueryAuditEventsRequest) returns (QueryAuditEventsResponse);

  // Get a specific audit event
  rpc GetAuditEvent(GetAuditEventRequest) returns (AuditEvent);

  // Record (emit) a new audit event onto the platform audit chain. This is
  // the remote-write counterpart to Query/Get: a caller (e.g. a downstream
  // platform composing this IAM plane) records an event synchronously
  // (async=false, event_id returned) or fire-and-forget (async=true,
  // event_id empty). The event lands in the CALLER's own authenticated
  // tenant, and ONLY there: a tenant_id naming any other tenant fails
  // PermissionDenied regardless of who the caller is — the system-tenant
  // principal included (go-quicbaas#356, no operator lift).
  rpc RecordAuditEvent(RecordAuditEventRequest) returns (RecordAuditEventResponse);
}

// AuditEvent represents a single audit log entry
message AuditEvent {
  string id = 1;
  string tenant_id = 2;
  string event_type = 3;
  string category = 4;
  string outcome = 5;
  string actor_id = 6;
  string actor_type = 7;
  string resource_id = 8;
  string action = 9;
  map<string, string> details = 10;
  string ip_address = 11;
  string user_agent = 12;
  google.protobuf.Timestamp timestamp = 13;
}

message QueryAuditEventsRequest {
  string tenant_id = 1;
  repeated string event_types = 2;
  repeated string categories = 3;
  repeated string outcomes = 4;
  string actor_id = 5;
  string resource_id = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
  int32 limit = 9;
  int32 offset = 10;
}

message QueryAuditEventsResponse {
  repeated AuditEvent events = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetAuditEventRequest {
  string tenant_id = 1;
  string event_id = 2;
}

message RecordAuditEventRequest {
  // tenant_id is the target tenant. Empty means "the caller's own
  // authenticated tenant". Any value other than the caller's own tenant
  // fails PermissionDenied, no matter who the caller is — the
  // system-tenant principal included (go-quicbaas#356, no operator lift).
  string tenant_id = 1;

  // event is the event to record. id and timestamp are assigned by the
  // chain if left unset.
  AuditEvent event = 2;

  // async selects Log (false, synchronous, event_id populated in the
  // response) vs LogAsync (true, fire-and-forget, event_id empty).
  bool async = 3;
}

message RecordAuditEventResponse {
  // event_id is the chain-assigned event ID. Empty when async=true.
  string event_id = 1;
}

// =============================================================================
// Federation Service Messages (OIDC Consumer)
// =============================================================================

// ProviderType represents the type of external identity provider
enum ProviderType {
  PROVIDER_TYPE_UNSPECIFIED = 0;
  PROVIDER_TYPE_OIDC = 1;
  PROVIDER_TYPE_SAML = 2;
  PROVIDER_TYPE_OAUTH2 = 3;
}

// ClaimMappings defines how IdP claims map to QuicBaaS user attributes
message ClaimMappings {
  string subject = 1;     // Claim for user ID (default: "sub")
  string email = 2;       // Claim for email (default: "email")
  string name = 3;        // Claim for display name (default: "name")
  string groups = 4;      // Claim for group memberships
  string roles = 5;       // Claim for role assignments
  map<string, string> attributes = 6;  // Custom claim to attribute mappings
}

// ExternalProvider represents an external identity provider configuration
message ExternalProvider {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  ProviderType type = 4;
  bool enabled = 5;
  string client_id = 6;
  string client_secret = 7;  // Only set on create, not returned in responses
  string issuer_url = 8;
  string auth_url = 9;
  string token_url = 10;
  string userinfo_url = 11;
  repeated string scopes = 12;
  ClaimMappings claim_mappings = 13;
  bool auto_provision = 14;
  bool allow_linking = 15;
  repeated string default_roles = 16;
  repeated string default_groups = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}

// FederatedIdentity represents a link between a QuicBaaS user and an external identity
message FederatedIdentity {
  string id = 1;
  string user_id = 2;
  string tenant_id = 3;
  string provider_id = 4;
  string external_id = 5;
  string external_email = 6;
  string external_name = 7;
  map<string, string> claims = 8;
  google.protobuf.Timestamp last_login = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// CreateProviderRequest creates a new external identity provider
message CreateProviderRequest {
  string id = 1;  // Optional, will be generated if not provided
  string tenant_id = 2;
  string name = 3;
  ProviderType type = 4;
  bool enabled = 5;
  string client_id = 6;
  string client_secret = 7;
  string issuer_url = 8;
  string auth_url = 9;
  string token_url = 10;
  string userinfo_url = 11;
  repeated string scopes = 12;
  ClaimMappings claim_mappings = 13;
  bool auto_provision = 14;
  bool allow_linking = 15;
  repeated string default_roles = 16;
  repeated string default_groups = 17;
}

// GetProviderRequest retrieves an external provider by ID
message GetProviderRequest {
  string tenant_id = 1;
  string provider_id = 2;
}

// UpdateProviderRequest updates an existing external provider
message UpdateProviderRequest {
  string tenant_id = 1;
  string provider_id = 2;
  string name = 3;
  ProviderType type = 4;
  bool enabled = 5;
  string client_id = 6;
  string client_secret = 7;
  string issuer_url = 8;
  string auth_url = 9;
  string token_url = 10;
  string userinfo_url = 11;
  repeated string scopes = 12;
  ClaimMappings claim_mappings = 13;
  bool auto_provision = 14;
  bool allow_linking = 15;
  repeated string default_roles = 16;
  repeated string default_groups = 17;
}

// DeleteProviderRequest removes an external provider
message DeleteProviderRequest {
  string tenant_id = 1;
  string provider_id = 2;
}

// DeleteProviderResponse confirms provider deletion
message DeleteProviderResponse {
  bool success = 1;
}

// ListProvidersRequest lists external providers for a tenant
message ListProvidersRequest {
  string tenant_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

// ListProvidersResponse contains a list of external providers
message ListProvidersResponse {
  repeated ExternalProvider providers = 1;
  int32 total = 2;
}

// BeginFederatedLoginRequest initiates the OAuth2/OIDC authorization flow
message BeginFederatedLoginRequest {
  string tenant_id = 1;
  string provider_name = 2;  // Provider name to use for login
  string redirect_uri = 3;   // URI to redirect after authentication
}

// BeginFederatedLoginResponse contains the redirect URL for the IdP
message BeginFederatedLoginResponse {
  string auth_url = 1;       // URL to redirect the user to
  string state = 2;          // CSRF protection state token
  google.protobuf.Timestamp expires_at = 3;
}

// HandleFederatedCallbackRequest processes the OAuth2/OIDC callback
message HandleFederatedCallbackRequest {
  string state = 1;   // State token from the initial request
  string code = 2;    // Authorization code from the IdP
}

// HandleFederatedCallbackResponse contains the authentication result
message HandleFederatedCallbackResponse {
  User user = 1;                          // The authenticated user
  FederatedIdentity federated_identity = 2;  // The identity link
  string access_token = 3;                // QuicBaaS access token
  string refresh_token = 4;               // QuicBaaS refresh token
  int64 expires_in = 5;                   // Token lifetime in seconds
  bool provisioned = 6;                   // True if user was newly created
}

// LinkAccountRequest links an external identity to an existing user
message LinkAccountRequest {
  string user_id = 1;
  string tenant_id = 2;
  string provider_id = 3;
  string external_token = 4;  // Access token from the external IdP
}

// LinkAccountResponse confirms account linking
message LinkAccountResponse {
  bool success = 1;
}

// UnlinkAccountRequest removes the link between a user and an external provider
message UnlinkAccountRequest {
  string user_id = 1;
  string tenant_id = 2;
  string provider_id = 3;
}

// UnlinkAccountResponse confirms account unlinking
message UnlinkAccountResponse {
  bool success = 1;
}

// GetUserLinksRequest retrieves all linked identities for a user
message GetUserLinksRequest {
  string user_id = 1;
  string tenant_id = 2;
}

// GetUserLinksResponse contains all linked identities for a user
message GetUserLinksResponse {
  repeated FederatedIdentity identities = 1;
}
