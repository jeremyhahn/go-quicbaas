// QuicBaaS Per-Tenant Barrier Protocol Buffer Definitions v1
// Per-tenant barrier lifecycle exposed by the QuicBaaS daemon.
//
// QuicBaaS itself owns no per-tenant barrier logic; the embedded go-qrdb
// instance does. These RPCs are a thin gRPC facade so that gRPC-only clients
// connecting to the QuicBaaS endpoint can drive per-tenant barrier operations
// without dialling qrdb directly. The shape mirrors the REST surface served
// from /api/v1/tenants/{tenant_id}/barrier/* and the underlying go-qrdb
// TenantBarrierService.
//
// Authorization: callers must hold tenant_barrier:{init,unseal,seal,status}
// for the target tenant. The system tenant is denied at the transport layer
// before these RPCs are reached.
//
// Copyright (c) 2026 Jeremy Hahn
// Copyright (c) 2026 Automate The Things, LLC

syntax = "proto3";

package quicbaas.tenant.v1;

import "google/protobuf/empty.proto";
import "pkg/api/grpc/proto/qrdbv1/authz.proto";

option go_package = "github.com/jeremyhahn/go-quicbaas/api/proto;proto";

// =============================================================================
// TenantBarrier Service
// =============================================================================

// TenantBarrier exposes per-tenant barrier lifecycle through gRPC.
// All RPCs delegate to the embedded go-qrdb TenantBarrierServicer facade.
// The system tenant is rejected at the authz layer before reaching these RPCs.
service TenantBarrier {
  // Init initializes the per-tenant barrier with the selected strategy.
  // For the Shamir strategy the response carries the generated shares (returned
  // exactly once, never persisted). For none/passphrase, shares is empty and
  // a google.protobuf.Empty is the effective response (but Init always returns
  // TenantBarrierInitResponse to keep the shape uniform).
  rpc Init(TenantBarrierInitRequest) returns (TenantBarrierInitResponse) {
      option (qrdb.v1.permission) = "tenant_barrier:init";
  }

  // Unseal unseals the per-tenant barrier with a single key (passphrase
  // strategy). Empty key material is rejected by qrdb.
  rpc Unseal(TenantBarrierUnsealRequest) returns (google.protobuf.Empty) {
      option (qrdb.v1.permission) = "tenant_barrier:unseal";
  }

  // UnsealShare submits a single Shamir share toward the per-tenant barrier's
  // quorum threshold. Unseals automatically once enough distinct shares have
  // been submitted.
  rpc UnsealShare(TenantBarrierUnsealShareRequest) returns (TenantBarrierUnsealProgress) {
      option (qrdb.v1.permission) = "tenant_barrier:unseal";
  }

  // Seal seals the per-tenant barrier.
  rpc Seal(TenantBarrierSealRequest) returns (google.protobuf.Empty) {
      option (qrdb.v1.permission) = "tenant_barrier:seal";
  }

  // Status reports the per-tenant barrier's sealed/initialized state and
  // active strategy metadata, including Shamir threshold/total.
  rpc Status(TenantBarrierStatusRequest) returns (TenantBarrierStatusResponse) {
      option (qrdb.v1.permission) = "tenant_barrier:status";
  }

  // EnableEncryption migrates a tenant's dedicated barrier from the none
  // (unencrypted) strategy to a keyed strategy in place. Requires
  // tenant_barrier:enable_encryption on the target tenant. The embedded
  // qrdb node's EncryptionMigrator drives the migration; the transport
  // BarrierClient stub returns UNIMPLEMENTED.
  rpc EnableEncryption(TenantBarrierEnableEncryptionRequest) returns (google.protobuf.Empty) {
      option (qrdb.v1.permission) = "tenant_barrier:enable_encryption";
  }

  // UpdateQuotas sets the engine-level numeric resource limits for the tenant
  // (databases, keys, storage bytes, etc.). Requires tenants:set_quotas.
  // Delegates to the embedded qrdb node's TenantServicer.UpdateQuotas.
  rpc UpdateQuotas(UpdateTenantQuotasRequest) returns (google.protobuf.Empty) {
      option (qrdb.v1.permission) = "tenants:set_quotas";
  }

  // UpdateEntitlements sets the engine-level feature entitlements for the
  // tenant (isolation tiers, dedicated-storage features, barrier modes).
  // Requires tenants:set_entitlements. Delegates to the embedded qrdb node's
  // TenantServicer.UpdateEntitlements.
  rpc UpdateEntitlements(UpdateTenantEntitlementsRequest) returns (google.protobuf.Empty) {
      option (qrdb.v1.permission) = "tenants:set_entitlements";
  }
}

// =============================================================================
// Messages
// =============================================================================

// TenantBarrierInitRequest initializes the per-tenant barrier.
message TenantBarrierInitRequest {
  // tenant_id identifies the target tenant.
  string tenant_id = 1;
  // passphrase is the sealing passphrase (passphrase strategy).
  bytes passphrase = 2;
  // threshold is the Shamir quorum threshold (Shamir strategy).
  int32 threshold = 3;
  // shares is the total number of Shamir shares (Shamir strategy).
  int32 shares = 4;
  // strategy selects the sealing strategy: "none", "passphrase", or "shamir".
  string strategy = 5;
}

// TenantBarrierInitResponse carries the init outcome. For the Shamir strategy
// the shares field contains the generated shares (returned exactly once).
// For none/passphrase the shares field is empty.
message TenantBarrierInitResponse {
  // tenant_id echoes the target tenant.
  string tenant_id = 1;
  // strategy is the active sealing strategy after initialization.
  string strategy = 2;
  // shares contains Shamir shares when strategy is "shamir"; otherwise empty.
  repeated string shares = 3;
  // threshold is the Shamir quorum threshold; zero for non-Shamir strategies.
  int32 threshold = 4;
  // total_shares is the total Shamir share count; zero for non-Shamir strategies.
  int32 total_shares = 5;
}

// TenantBarrierUnsealRequest carries single-key unseal material.
message TenantBarrierUnsealRequest {
  // tenant_id identifies the target tenant.
  string tenant_id = 1;
  // key is the raw unseal key (passphrase bytes).
  bytes key = 2;
}

// TenantBarrierUnsealShareRequest carries one Shamir share.
message TenantBarrierUnsealShareRequest {
  // tenant_id identifies the target tenant.
  string tenant_id = 1;
  // share is the Shamir share value.
  string share = 2;
}

// TenantBarrierUnsealProgress reports quorum progress for a Shamir unseal.
message TenantBarrierUnsealProgress {
  // tenant_id echoes the target tenant.
  string tenant_id = 1;
  // required is the number of shares required to reach the threshold.
  int32 required = 2;
  // submitted is the number of distinct shares submitted so far.
  int32 submitted = 3;
  // complete is true when the threshold has been reached and the barrier
  // has been unsealed.
  bool complete = 4;
  // sealed reflects whether the barrier is still sealed after this share.
  bool sealed = 5;
}

// TenantBarrierSealRequest seals the barrier for tenant_id.
message TenantBarrierSealRequest {
  // tenant_id identifies the target tenant.
  string tenant_id = 1;
}

// TenantBarrierStatusRequest queries the barrier state for tenant_id.
message TenantBarrierStatusRequest {
  // tenant_id identifies the target tenant.
  string tenant_id = 1;
}

// TenantBarrierStatusResponse reports the per-tenant barrier state.
message TenantBarrierStatusResponse {
  // tenant_id echoes the target tenant.
  string tenant_id = 1;
  // sealed is true when the barrier is currently sealed.
  bool sealed = 2;
  // initialized is true when the barrier has been initialized.
  bool initialized = 3;
  // strategy is the active sealing strategy.
  string strategy = 4;
  // hardware_backed is true when the strategy uses a hardware security module.
  bool hardware_backed = 5;
  // shamir_threshold is the Shamir quorum threshold; zero for non-Shamir strategies.
  int32 shamir_threshold = 6;
  // shamir_total is the total Shamir share count; zero for non-Shamir strategies.
  int32 shamir_total = 7;
}

// TenantBarrierEnableEncryptionRequest requests at-rest encryption migration
// for a tenant's dedicated barrier.
message TenantBarrierEnableEncryptionRequest {
  // tenant_id identifies the target tenant. Required.
  string tenant_id = 1;

  // target_strategy is the keyed strategy to migrate to: "passphrase" or
  // "shamir". Required; must not be "none".
  string target_strategy = 2;

  // mechanism selects the physical re-encryption approach: "swap" (default)
  // or "inplace".
  string mechanism = 3;

  // availability controls write availability during migration: "online"
  // (default) or "quiesced".
  string availability = 4;

  // passphrase is required for a passphrase-target migration.
  bytes passphrase = 5;

  // shamir_threshold is the M-of-N quorum threshold for a Shamir-target
  // migration.
  int32 shamir_threshold = 6;

  // shamir_total is the total number of Shamir shares for a Shamir-target
  // migration.
  int32 shamir_total = 7;
}

// UpdateTenantQuotasRequest sets the engine-level numeric resource limits for
// a tenant. A value of -1 means unlimited; 0 means use the system default.
// Mirrors pkg/quota.Quotas (limit fields only; usage counters are read-only).
message UpdateTenantQuotasRequest {
  // tenant_id identifies the target tenant. Required.
  string tenant_id = 1;
  // max_databases caps the number of databases the tenant may create.
  int64 max_databases = 2;
  // max_raft_groups caps the number of dedicated Raft consensus groups.
  int64 max_raft_groups = 3;
  // max_replicas_per_group caps the replication factor of any single group.
  int64 max_replicas_per_group = 4;
  // max_total_replicas caps total replicas across all dedicated-raft groups.
  int64 max_total_replicas = 5;
  // max_collections caps the number of vector/time-series collections.
  int64 max_collections = 6;
  // max_keys caps the total number of keys across all databases.
  int64 max_keys = 7;
  // max_storage_bytes caps total on-disk storage consumption in bytes.
  int64 max_storage_bytes = 8;
  // max_database_size_bytes caps the on-disk size of any single database.
  int64 max_database_size_bytes = 9;
  // max_users caps the number of IAM users the tenant may create.
  int64 max_users = 10;
  // max_roles caps the number of IAM roles the tenant may create.
  int64 max_roles = 11;
  // max_certificates caps the number of TLS certificates the tenant may hold.
  int64 max_certificates = 12;
  // max_backups caps the number of database backups the tenant may retain.
  int64 max_backups = 13;
  // max_vector_dims caps the maximum vector dimensionality the tenant may use.
  int64 max_vector_dims = 14;
  // max_ts_metrics caps the number of time-series metrics the tenant may track.
  int64 max_ts_metrics = 15;
  // max_dedicated_wal_groups caps dedicated-raft groups with a per-tenant WAL.
  int64 max_dedicated_wal_groups = 16;
  // system_barrier_quota governs the tenant's use of the shared system barrier
  // (bytes): 0 = unavailable, -1 = unlimited, >0 = capped at that many bytes.
  int64 system_barrier_quota = 17;
}

// UpdateTenantEntitlementsRequest sets the engine-level feature entitlements
// for a tenant. Mirrors pkg/quota.Entitlements.
message UpdateTenantEntitlementsRequest {
  // tenant_id identifies the target tenant. Required.
  string tenant_id = 1;
  // allowed_isolation_modes lists the isolation modes the tenant may use
  // (e.g. "prefix", "barrier", "volume", "raft"). Empty = system defaults.
  repeated string allowed_isolation_modes = 2;
  // allow_dedicated_raft permits provisioning dedicated Raft-backed databases.
  bool allow_dedicated_raft = 3;
  // allow_volume_storage permits provisioning databases on a dedicated volume.
  bool allow_volume_storage = 4;
  // allow_system_managed_barrier permits opting into system-managed auto-unseal
  // key management for the tenant's dedicated barrier.
  bool allow_system_managed_barrier = 5;
  // allow_dedicated_wal permits dedicated-raft databases with a per-tenant WAL.
  bool allow_dedicated_wal = 6;
  // allowed_barrier_modes lists the dedicated-barrier sealing strategies the
  // tenant may select. Empty = software defaults (none/passphrase/shamir).
  repeated string allowed_barrier_modes = 7;
}
