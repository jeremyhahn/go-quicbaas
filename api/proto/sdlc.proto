// QuicBaaS SDLC Protocol Buffer Definitions v1
// The SDLC module of the Software Factory: a project's forge binding and a
// task's delivery. Tasks, jobs and sessions are the Orchestrator service's.
//
// Copyright (c) 2025 QuicBaaS Project
