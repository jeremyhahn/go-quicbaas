openapi: 3.0.3
info:
  title: QuicBaaS REST API
  description: |
    High-performance distributed key-value database with Raft consensus.

    QuicBaaS provides a RESTful API for CRUD operations, indexing, querying,
    and cluster management. All operations are backed by Raft consensus for
    strong consistency and fault tolerance.

    ## Features
    - CRUD operations on entities
    - Secondary index queries
    - Cluster status and management
    - Health checks and metrics
    - Prometheus metrics endpoint

    ## Authentication
    Currently no authentication is required (future versions will support TLS client certificates).

    ## Rate Limiting
    Configurable per-server (default: unlimited)

  version: 1.0.0
  contact:
    name: QuicBaaS Project
    url: https://github.com/jeremyhahn/go-quicbaas
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/v1
    description: Local development server
  - url: https://quicbaas.example.com/v1
    description: Production server

tags:
  - name: Entities
    description: CRUD operations on entities
  - name: Queries
    description: Index-based query operations
  - name: Cluster
    description: Cluster management and status
  - name: Health
    description: Health checks and monitoring

paths:
  /entities/{type}:
    post:
      tags:
        - Entities
      summary: Create a new entity
      description: Stores a new entity of the specified type with an auto-generated ID
      operationId: createEntity
      parameters:
        - $ref: '#/components/parameters/EntityType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRequest'
      responses:
        '201':
          description: Entity created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags:
        - Entities
      summary: List entities
      description: Retrieves all entities of the specified type with pagination
      operationId: listEntities
      parameters:
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/ConsistencyLevel'
      responses:
        '200':
          description: Successfully retrieved entities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /entities/{type}/{id}:
    get:
      tags:
        - Entities
      summary: Get entity by ID
      description: Retrieves a specific entity by its type and ID
      operationId: getEntity
      parameters:
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/ConsistencyLevel'
      responses:
        '200':
          description: Entity found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - Entities
      summary: Update entity
      description: Updates an existing entity or creates it if it doesn't exist
      operationId: updateEntity
      parameters:
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRequest'
      responses:
        '200':
          description: Entity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags:
        - Entities
      summary: Delete entity
      description: Removes an entity by its type and ID
      operationId: deleteEntity
      parameters:
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/ConsistencyLevel'
      responses:
        '200':
          description: Entity deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /query/{type}/{index}:
    get:
      tags:
        - Queries
      summary: Query by index
      description: Searches for entities using a secondary index
      operationId: queryByIndex
      parameters:
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/IndexName'
        - name: value
          in: query
          description: Value to search for in the index
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/ConsistencyLevel'
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /query/range:
    post:
      tags:
        - Queries
      summary: Range query
      description: Performs a range query on an indexed field
      operationId: rangeQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RangeQueryRequest'
      responses:
        '200':
          description: Range query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /cluster/status:
    get:
      tags:
        - Cluster
      summary: Get cluster status
      description: Returns the current status of all cluster nodes and Raft groups
      operationId: getClusterStatus
      parameters:
        - name: include_metrics
          in: query
          description: Include detailed metrics in the response
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Cluster status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterStatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /cluster/leader/{shardID}:
    get:
      tags:
        - Cluster
      summary: Get shard leader
      description: Returns the leader node for a specific Raft shard
      operationId: getShardLeader
      parameters:
        - name: shardID
          in: path
          required: true
          description: Raft shard ID
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: Leader information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the overall health status of the node
      operationId: healthCheck
      responses:
        '200':
          description: Node is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Node is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      description: Kubernetes-compatible liveness probe
      operationId: livenessProbe
      responses:
        '200':
          description: Node is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness probe
      description: Kubernetes-compatible readiness probe
      operationId: readinessProbe
      responses:
        '200':
          description: Node is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        '503':
          description: Node is not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "not ready"

  /metrics:
    get:
      tags:
        - Health
      summary: Prometheus metrics
      description: Returns Prometheus-compatible metrics
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP quicbaas_requests_total Total number of requests
                  # TYPE quicbaas_requests_total counter
                  quicbaas_requests_total 1234

components:
  parameters:
    EntityType:
      name: type
      in: path
      required: true
      description: Entity type (e.g., "user", "sensor")
      schema:
        type: string
        example: "user"

    EntityID:
      name: id
      in: path
      required: true
      description: Entity ID (numeric)
      schema:
        type: integer
        format: uint64
        example: 12345

    IndexName:
      name: index
      in: path
      required: true
      description: Name of the secondary index to query
      schema:
        type: string
        example: "email_idx"

    PageSize:
      name: page_size
      in: query
      description: Maximum number of results to return
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 100

    PageToken:
      name: page_token
      in: query
      description: Pagination token from previous response
      schema:
        type: string

    ConsistencyLevel:
      name: consistency
      in: query
      description: Read/write consistency level
      schema:
        type: string
        enum: [local, quorum]
        default: quorum

  schemas:
    PutRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: Entity data (any valid JSON)
          example:
            name: "John Doe"
            email: "john@example.com"
            age: 30
        ttl_seconds:
          type: integer
          format: uint64
          description: Time-to-live in seconds (0 = no expiration)
          example: 3600
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Optional metadata key-value pairs
          example:
            source: "api"
            version: "1.0"

    PutResponse:
      type: object
      properties:
        id:
          type: integer
          format: uint64
          description: Assigned entity ID
          example: 12345
        version:
          type: integer
          format: uint64
          description: Entity version number
          example: 1
        timestamp:
          type: string
          format: date-time
          description: Server timestamp when stored
          example: "2025-10-05T10:30:00Z"

    GetResponse:
      type: object
      properties:
        id:
          type: integer
          format: uint64
          example: 12345
        data:
          type: object
          description: Entity data
          example:
            name: "John Doe"
            email: "john@example.com"
        version:
          type: integer
          format: uint64
          example: 1
        timestamp:
          type: string
          format: date-time
          example: "2025-10-05T10:30:00Z"
        metadata:
          type: object
          additionalProperties:
            type: string

    DeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
          description: Whether the entity was deleted
          example: true
        timestamp:
          type: string
          format: date-time
          example: "2025-10-05T10:30:00Z"

    ListResponse:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        next_page_token:
          type: string
          description: Token for next page (empty if last page)
        total_count:
          type: integer
          format: uint64
          description: Total number of entities (if available)

    Entity:
      type: object
      properties:
        id:
          type: integer
          format: uint64
          example: 12345
        type:
          type: string
          example: "user"
        data:
          type: object
          example:
            name: "John Doe"
            email: "john@example.com"
        version:
          type: integer
          format: uint64
          example: 1
        timestamp:
          type: string
          format: date-time
          example: "2025-10-05T10:30:00Z"
        metadata:
          type: object
          additionalProperties:
            type: string

    QueryResponse:
      type: object
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        next_page_token:
          type: string
        total_count:
          type: integer
          format: uint64

    RangeQueryRequest:
      type: object
      required:
        - entity_type
        - index_name
        - range_start
        - range_end
      properties:
        entity_type:
          type: string
          example: "user"
        index_name:
          type: string
          example: "age_idx"
        range_start:
          type: string
          description: Inclusive start of range
          example: "18"
        range_end:
          type: string
          description: Inclusive end of range
          example: "65"
        page_size:
          type: integer
          minimum: 1
          maximum: 10000
          default: 100
        page_token:
          type: string

    ClusterStatusResponse:
      type: object
      properties:
        cluster_id:
          type: string
          description: Unique cluster identifier
          example: "quicbaas-cluster-1"
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NodeInfo'
        shards:
          type: array
          items:
            $ref: '#/components/schemas/ShardInfo'
        timestamp:
          type: string
          format: date-time

    NodeInfo:
      type: object
      properties:
        node_id:
          type: integer
          format: uint64
          example: 1
        address:
          type: string
          example: "localhost:8080"
        raft_address:
          type: string
          example: "localhost:63001"
        is_leader:
          type: boolean
          example: true
        health_status:
          type: string
          enum: [healthy, degraded, unhealthy, unknown]
          example: "healthy"
        version:
          type: string
          example: "1.0.0"
        uptime_seconds:
          type: integer
          format: uint64
          example: 86400
        metrics:
          type: object
          additionalProperties:
            type: number

    ShardInfo:
      type: object
      properties:
        shard_id:
          type: integer
          format: uint64
          example: 1
        leader_id:
          type: integer
          format: uint64
          example: 1
        replicas:
          type: array
          items:
            type: integer
            format: uint64
          example: [1, 2, 3]
        entity_types:
          type: array
          items:
            type: string
          example: ["user", "sensor"]
        status:
          type: string
          enum: [healthy, degraded, unhealthy, unknown]
          example: "healthy"

    LeaderResponse:
      type: object
      properties:
        shard_id:
          type: integer
          format: uint64
          example: 1
        leader_id:
          type: integer
          format: uint64
          example: 1
        leader_address:
          type: string
          example: "localhost:63001"
        term:
          type: integer
          format: uint64
          description: Current Raft term
          example: 42

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy, unknown]
          example: "healthy"
        node_id:
          type: integer
          format: uint64
          example: 1
        version:
          type: string
          example: "1.0.0"
        uptime_seconds:
          type: integer
          format: uint64
          example: 86400
        details:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentHealth'

    ComponentHealth:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy, unknown]
        message:
          type: string
        last_check:
          type: string
          format: date-time
        metrics:
          type: object
          additionalProperties:
            type: number

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error code
          example: "INVALID_INPUT"
        message:
          type: string
          description: Human-readable error message
          example: "Invalid entity type"
        request_id:
          type: string
          description: Request ID for debugging
          example: "req-abc123"
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
