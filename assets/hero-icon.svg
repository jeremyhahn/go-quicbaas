          stroke-linecap="round"/>

    <circle cx="160" cy="96" r="11" fill="#ffd9c4"/>
    <circle cx="223" cy="206" r="11" fill="#ffd9c4"/>
    <circle cx="97" cy="206" r="11" fill="#ffd9c4"/>

    <path d="M98 188
