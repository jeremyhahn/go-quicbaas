    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd5bf"/>
      <stop offset="100%" stop-color="#ffb18f"/>
    </linearGradient>
    <linearGradient id="link" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd1b3" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffd1b3" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#ffd1b3" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#7c2d12" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="272" height="272" rx="52" fill="#fff7f2"/>

