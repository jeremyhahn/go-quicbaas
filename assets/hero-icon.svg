      <rect x="169" y="121" width="30" height="30" rx="8" fill="url(#core)" opacity="0.96"/>
      <rect x="121" y="169" width="30" height="30" rx="8" fill="url(#core)" opacity="0.92"/>
      <rect x="169" y="169" width="30" height="30" rx="8" fill="url(#core)" opacity="0.88"/>

      <path d="M151 136h18" stroke="#8a2b10" stroke-width="5" stroke-linecap="round"/>
      <path d="M136 151v18" stroke="#8a2b10" stroke-width="5" stroke-linecap="round"/>
      <path d="M184 151v18" stroke="#8a2b10" stroke-width="5" stroke-linecap="round"/>
      <path d="M151 184h18" stroke="#8a2b10" stroke-width="5" stroke-linecap="round"/>

      <circle cx="136" cy="136" r="4" fill="#8a2b10"/>
      <circle cx="184" cy="136" r="4" fill="#8a2b10"/>
      <circle cx="136" cy="184" r="4" fill="#8a2b10"/>
      <circle cx="184" cy="184" r="4" fill="#8a2b10"/>
