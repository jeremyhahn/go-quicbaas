# The devcontainer's compose services, one per image.
include:
  - ../../../test/integration/docker-compose.integration.yml

x-build: &build
  context: ../../..
  dockerfile: build/docker/devcontainer/Dockerfile
  args:
    GO_VERSION: ${GO_VERSION:-}
    GO_IMAGE_DIGEST: ${GO_IMAGE_DIGEST:-}
    GO_BUILD_PROXY: ${GO_BUILD_PROXY:-}
  secrets:
    - gomodauth

x-ulimits: &ulimits
  memlock:
    soft: -1
    hard: -1
  core:
    soft: 0
    hard: 0

services:
  toolchain:
    image: ${TOOLCHAIN_IMAGE:-quicbaas-devcontainer:toolchain}
    build:
      <<: *build
      target: toolchain
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    volumes:
      - ../../..:/src
    working_dir: /src
    ulimits: *ulimits

  # Hardened: read-only, no network, no capabilities.
  integration:
    image: ${INTEGRATION_IMAGE:-${IT_IMAGE:-quicbaas-devcontainer:integration}}
    build:
      <<: *build
      target: integration
      args:
        GO_VERSION: ${GO_VERSION:-}
        GO_IMAGE_DIGEST: ${GO_IMAGE_DIGEST:-}
        GO_BUILD_PROXY: ${GO_BUILD_PROXY:-}
        # The Makefile's INTEGRATION_BUILD_TAGS, so the nodes and the test driver agree.
        BUILD_TAGS: ${INTEGRATION_BUILD_TAGS:-}
        # COVER=1 builds a coverage-instrumented daemon (Dockerfile).
        COVER: ${COVER:-}
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:exec
    ulimits: *ulimits
