name: TEMP GHA Cache Probe

on:
  push:
  pull_request:
    branches: [main]

jobs:
  probe:
    name: Probe buildx type=gha cache
    runs-on: ubuntu-latest
    steps:
      - name: Report cache service environment
        run: |
          echo "server_url=${GITHUB_SERVER_URL}"
          echo "ACTIONS_CACHE_URL set: ${ACTIONS_CACHE_URL:+yes}${ACTIONS_CACHE_URL:-no}"
          echo "ACTIONS_RESULTS_URL set: ${ACTIONS_RESULTS_URL:+yes}${ACTIONS_RESULTS_URL:-no}"
          echo "ACTIONS_RUNTIME_TOKEN present: ${ACTIONS_RUNTIME_TOKEN:+yes}"
          echo "ACTIONS_CACHE_URL value: ${ACTIONS_CACHE_URL:-<unset>}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Minimal build context
        run: |
          mkdir -p probe
          printf 'FROM alpine:3.20\nRUN echo gha-cache-probe > /probe.txt\n' > probe/Dockerfile

      - name: Build with unconditional type=gha cache
        uses: docker/build-push-action@v6
        with:
          context: probe
          file: probe/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: gha-cache-probe:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
