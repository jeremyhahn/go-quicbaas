# worker-image — build, scan and publish the software-factory worker image to
# ghcr.io, nightly at 03:00 UTC and on any dispatch.
#
# build-publish builds the image with exactly the versions the repository
# locks (G3): Claude Code, Codex and the Gemini CLI from
# deployments/agents/software-factory-worker/versions.lock, and Go, gh and the
# rest of the toolchain from pkg/version/toolchain.mk, both read by `make
# build-worker-image`; nothing is taken from "latest". The Debian base packages
# are upgraded in the Dockerfile on every build. The tag is the content tag plus
# the UTC build date, <version>-cc<claude-code>-cx<codex>-n<YYYYMMDD>, so each
# night publishes a fresh image and a rerun the same day pushes nothing: a
# published tag is never pushed again. The push goes to ghcr.io with the job's
# own GITHUB_TOKEN under `packages: write` (G1: no PAT, no other secret) via
# `make push-worker-image`, whose Trivy gate blocks the push. Before the push,
# two Trivy secret scans, one of the built image and one of each of its layer
# tarballs, fail the job on a secret of any severity; the image scan also
# covers the image config, and the config JSON is scanned with the layers. The
# job fails before the build if any DEVCACHE_* variable is set, and both make
# calls pass the dev-cache args empty. The image is published BY DIGEST: the
# digest push-worker-image prints is the job's output, the `WORKER-IMAGE-DIGEST`
# log line and the `worker-image-digest` artifact, each with the locked
# versions and the CLIs' npm integrity sums. post-digest then posts that digest
# to the run summary and as its own output. This workflow does not move
# `current`. Once the digest is known, an anonymous lookup of it must be
# refused, or the job fails: the package stays private. The nightly schedule is
# an owner exception to the no-`schedule:` workflow rule.
name: worker-image

on:
  schedule:
    - cron: '0 3 * * *'
  # A dispatch builds the same locked versions; change versions.lock by PR.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-publish:
    name: Build, scan and publish the worker image (ghcr.io)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # When the bigdisk-docker pool is live, switch to: runs-on: [self-hosted, linux, x64, bigdisk-docker]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    concurrency: { group: worker-image-build-publish, cancel-in-progress: false }
    outputs:
      ref: ${{ steps.record.outputs.ref }}
      digest: ${{ steps.record.outputs.digest }}
      published: ${{ steps.record.outputs.published }}
      cc: ${{ steps.resolve.outputs.cc }}
      cx: ${{ steps.resolve.outputs.cx }}
      go: ${{ steps.resolve.outputs.go }}
      gh: ${{ steps.resolve.outputs.gh }}
      tag: ${{ steps.resolve.outputs.tag }}
    env:
      IMAGE: quicbaas-software-factory-worker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      - name: Read the locked versions and the nightly tag
        id: resolve
        run: |
          set -euo pipefail
          lock=deployments/agents/software-factory-worker/versions.lock
          toolchain=pkg/version/toolchain.mk
          pin() { local v; v="$(sed -n "s/^$2$3//p" "$1" | tail -n 1)"; [[ "$v" =~ $4 ]] || { echo "::error::$1 has no valid $2 (got '${v}')" >&2; return 1; }; printf '%s' "$v"; }
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          cc="$(pin "$lock" CLAUDE_CODE_VERSION = "$semver")"
          cx="$(pin "$lock" CODEX_VERSION = "$semver")"
          gm="$(pin "$lock" GEMINI_CLI_VERSION = "$semver")"
          go="$(pin "$toolchain" GO_VERSION ' := ' "$semver")"
          gh="$(pin "$toolchain" GH_VERSION ' := ' '^v[0-9]+\.[0-9]+\.[0-9]+$')"
          integrity() { local v; v="$(npm view "$1" dist.integrity)"; [[ "$v" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]] || { echo "::error::$1 has no sha512 integrity on npm" >&2; return 1; }; printf '%s' "$v"; }
          cc_int="$(integrity "@anthropic-ai/claude-code@${cc}")"
          cc_x64_int="$(integrity "@anthropic-ai/claude-code-linux-x64@${cc}")"
          cx_int="$(integrity "@openai/codex@${cx}")"
          cx_x64_int="$(integrity "@openai/codex@${cx}-linux-x64")"
          gm_int="$(integrity "@google/gemini-cli@${gm}")"
          # The Makefile's content tag, <VERSION>-cc<claude-code>-cx<codex>, plus
          # the UTC build date, so each night's rebuild (fresh base packages)
          # is a new tag and a same-day rerun finds its tag published.
          tag="$(tr -d '\n' < VERSION)-cc${cc}-cx${cx}-n$(date -u +%Y%m%d)"
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE}"
          printf 'cc=%s\ncx=%s\ngo=%s\ngh=%s\ntag=%s\nrepo=%s\n' "$cc" "$cx" "$go" "$gh" "$tag" "$repo" >> "$GITHUB_OUTPUT"
          printf 'gm=%s\ncc_int=%s\ncc_x64_int=%s\ncx_int=%s\ncx_x64_int=%s\ngm_int=%s\n' \
            "$gm" "$cc_int" "$cc_x64_int" "$cx_int" "$cx_x64_int" "$gm_int" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          ( umask 077; mkdir -p "$DOCKER_CONFIG" )
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Is the content tag already published?
        id: existing
        env:
          REPO: ${{ steps.resolve.outputs.repo }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          err="$(mktemp)"
          if manifest="$(docker buildx imagetools inspect "${REPO}:${TAG}" --format '{{json .Manifest}}' 2>"$err")"; then
            digest="$(printf '%s' "$manifest" | jq -r .digest)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::${REPO}:${TAG} exists but names no sha256 digest"; exit 1; }
            echo "${REPO}:${TAG} is already published at ${digest}; pushing nothing"
            { echo "exists=true"; echo "digest=$digest"; } >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown|name unknown' "$err"; then
            cat "$err" >&2
            echo "${REPO}:${TAG} is not published yet"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$err" >&2
            echo "::error::could not tell whether ${REPO}:${TAG} is already published; pushing nothing"
            exit 1
          fi

      - name: No dev-cache build args
        id: devcache-empty
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          set -euo pipefail
          bad=""
          for v in $(compgen -e); do
            case "$v" in DEVCACHE_*) if [ -n "${!v}" ]; then bad="$bad $v"; fi ;; esac
          done
          if [ -n "$bad" ]; then
            echo "::error::a published image is never built through the dev caches; set:$bad"
            exit 1
          fi
          echo "no DEVCACHE_* build arg is set"

      - name: Build the worker image
        if: ${{ steps.existing.outputs.exists != 'true' }}
        env:
          CC: ${{ steps.resolve.outputs.cc }}
          CX: ${{ steps.resolve.outputs.cx }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          make build-worker-image CLAUDE_CODE_VERSION="$CC" CODEX_VERSION="$CX" WORKER_IMAGE_TAG="$TAG" WORKER_IMAGE_UID=1000 WORKER_IMAGE_GID=1000 DEVCACHE_GOPROXY= DEVCACHE_NPM_REGISTRY=

      - name: Install Trivy
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" make install-trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan the image for secrets
        id: secret-scan
        if: ${{ steps.existing.outputs.exists != 'true' }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          trivy image --scanners secret --image-config-scanners secret --exit-code 1 --no-progress "${IMAGE}:${TAG}"

      - name: Scan every layer tarball for secrets
        id: layer-scan
        if: ${{ steps.existing.outputs.exists != 'true' }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/image-layers"
          rm -rf "$work"; mkdir -p "$work/image" "$work/layers"
          trap 'rm -rf "$work"' EXIT
          docker save "${IMAGE}:${TAG}" -o "$work/image.tar"
          tar -xf "$work/image.tar" -C "$work/image"
          layers="$(jq -r '.[0].Layers[]' "$work/image/manifest.json")"
          if [ -z "$layers" ]; then
            echo "::error::${IMAGE}:${TAG} lists no layer tarballs in manifest.json"
            exit 1
          fi
          i=0
          while IFS= read -r layer; do
            i=$((i + 1))
            mkdir -p "$work/layers/$i"
            tar -xf "$work/image/$layer" -C "$work/layers/$i" --no-same-owner --no-same-permissions
          done <<< "$layers"
          config="$(jq -r '.[0].Config' "$work/image/manifest.json")"
          if [ -z "$config" ] || [ "$config" = "null" ]; then
            echo "::error::${IMAGE}:${TAG} names no image config in manifest.json"
            exit 1
          fi
          mkdir -p "$work/layers/config"
          cp "$work/image/$config" "$work/layers/config/config.json"
          trivy fs --scanners secret --exit-code 1 --no-progress "$work/layers"
          echo "scanned ${i} layer tarballs of ${IMAGE}:${TAG} for secrets"

      - name: The package is not public before the push
        id: private-before
        if: ${{ steps.existing.outputs.exists != 'true' }}
        env:
          REPO: ${{ steps.resolve.outputs.repo }}
        run: |
          set -euo pipefail
          if ! [[ "$REPO" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]; then
            echo "::error::REPO is not a ghcr.io repository: ${REPO}"
            exit 1
          fi
          path="${REPO#ghcr.io/}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          if ! code="$(curl -sS -o "$work/token.json" -w '%{http_code}' "https://ghcr.io/token?service=ghcr.io&scope=repository:${path}:pull")"; then
            echo "::error::could not ask ghcr.io for an anonymous pull token for ${REPO}; pushing nothing"
            exit 1
          fi
          case "$code" in
            401|403)
              echo "${REPO} is not public: ghcr.io refused an anonymous pull token (HTTP ${code})"
              exit 0
              ;;
            200) ;;
            *)
              echo "::error::could not tell whether ${REPO} is public (token HTTP ${code}); pushing nothing"
              exit 1
              ;;
          esac
          anon="$(jq -r '.token // empty' "$work/token.json")"
          if [ -z "$anon" ]; then
            echo "::error::ghcr.io answered HTTP 200 without an anonymous pull token for ${REPO}; pushing nothing"
            exit 1
          fi
          ( umask 077; printf 'Authorization: Bearer %s\n' "$anon" > "$work/hdr" )
          if ! code="$(curl -sS -o /dev/null -w '%{http_code}' -H @"$work/hdr" "https://ghcr.io/v2/${path}/tags/list")"; then
            echo "::error::could not list the tags of ${REPO} anonymously; pushing nothing"
            exit 1
          fi
          case "$code" in
            200)
              echo "::error::${REPO} can be read without credentials; the package must be private, and nothing is pushed"
              exit 1
              ;;
            401|403|404)
              echo "${REPO} is not public: an anonymous tag listing got HTTP ${code}"
              ;;
            *)
              echo "::error::could not tell whether ${REPO} is public (tags HTTP ${code}); pushing nothing"
              exit 1
              ;;
          esac

      - name: Scan, then push
        id: push
        if: ${{ steps.existing.outputs.exists != 'true' }}
        env:
          CC: ${{ steps.resolve.outputs.cc }}
          CX: ${{ steps.resolve.outputs.cx }}
          TAG: ${{ steps.resolve.outputs.tag }}
          REPO: ${{ steps.resolve.outputs.repo }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/push-worker-image.log"
          make push-worker-image CLAUDE_CODE_VERSION="$CC" CODEX_VERSION="$CX" WORKER_IMAGE_TAG="$TAG" \
            WORKER_IMAGE_UID=1000 WORKER_IMAGE_GID=1000 DEVCACHE_GOPROXY= DEVCACHE_NPM_REGISTRY= \
            WORKER_IMAGE_REGISTRY="$REPO" TRIVY="$RUNNER_TEMP/bin/trivy" 2>&1 | tee "$log"
          ref_line="$(grep '^WORKER_IMAGE_REF=' "$log" | tail -n 1 || true)"
          digest="${ref_line##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::push-worker-image printed no WORKER_IMAGE_REF=...@sha256:<hex> line"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record the digest
        id: record
        if: ${{ always() && steps.resolve.outcome == 'success' }}
        env:
          REPO: ${{ steps.resolve.outputs.repo }}
          TAG: ${{ steps.resolve.outputs.tag }}
          CC: ${{ steps.resolve.outputs.cc }}
          CX: ${{ steps.resolve.outputs.cx }}
          GM: ${{ steps.resolve.outputs.gm }}
          GO: ${{ steps.resolve.outputs.go }}
          GH: ${{ steps.resolve.outputs.gh }}
          CC_INT: ${{ steps.resolve.outputs.cc_int }}
          CC_X64_INT: ${{ steps.resolve.outputs.cc_x64_int }}
          CX_INT: ${{ steps.resolve.outputs.cx_int }}
          CX_X64_INT: ${{ steps.resolve.outputs.cx_x64_int }}
          GM_INT: ${{ steps.resolve.outputs.gm_int }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -n "$PUSHED_DIGEST" ]; then
            digest="$PUSHED_DIGEST"; published=true
          elif [ -n "$EXISTING_DIGEST" ]; then
            digest="$EXISTING_DIGEST"; published=false
          else
            echo "::error::no digest: the tag was not found published and nothing was pushed"
            exit 1
          fi
          ref="${REPO}:${TAG}@${digest}"
          line="WORKER-IMAGE-DIGEST ${ref} published=${published}"
          versions="$(printf 'claude-code=%s integrity=%s\nclaude-code-linux-x64=%s integrity=%s\ncodex=%s integrity=%s\ncodex-linux-x64=%s integrity=%s\ngemini-cli=%s integrity=%s\ngo=%s\ngh=%s' \
            "$CC" "$CC_INT" "$CC" "$CC_X64_INT" "$CX" "$CX_INT" "$CX" "$CX_X64_INT" "$GM" "$GM_INT" "$GO" "$GH")"
          echo "$line"
          echo "$versions"
          printf '%s\n\n```\n%s\n```\n' "$line" "$versions" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n%s\n' "$line" "$versions" > "$RUNNER_TEMP/worker-image-digest.txt"
          { echo "ref=$ref"; echo "digest=$digest"; echo "published=$published"; } >> "$GITHUB_OUTPUT"

      - name: The package stays private
        id: private
        if: ${{ steps.record.outcome == 'success' }}
        env:
          REPO: ${{ steps.resolve.outputs.repo }}
          DIGEST: ${{ steps.record.outputs.digest }}
        run: |
          set -euo pipefail
          anon="$(mktemp -d)"; err="$(mktemp)"
          trap 'rm -rf "$anon" "$err"' EXIT
          if DOCKER_CONFIG="$anon" docker buildx imagetools inspect "${REPO}@${DIGEST}" >/dev/null 2>"$err"; then
            echo "::error::${REPO}@${DIGEST} can be pulled without credentials; the package must be private"
            exit 1
          elif grep -qiE '\b(denied|unauthorized|forbidden|401|403)\b|not found|name unknown|manifest unknown' "$err"; then
            cat "$err" >&2
            echo "${REPO} is private: an anonymous lookup of ${DIGEST} was refused"
          else
            cat "$err" >&2
            echo "::error::could not tell whether ${REPO} is private"
            exit 1
          fi

      - name: Upload the digest
        if: ${{ always() && steps.record.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: worker-image-digest
          path: ${{ runner.temp }}/worker-image-digest.txt
          retention-days: 90
          if-no-files-found: error

      - name: Log out of ghcr.io
        if: ${{ always() }}
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          rm -rf "$RUNNER_TEMP/docker-config"

  # The second job posts the digest build-publish published (or found already
  # published under the same tag): a run summary and the job's outputs, for a
  # caller of this workflow to pin the image by digest. It holds no token.
  post-digest:
    name: Post the worker image digest
    needs: build-publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      ref: ${{ steps.post.outputs.ref }}
      digest: ${{ steps.post.outputs.digest }}
    steps:
      - name: Post the digest
        id: post
        env:
          REF: ${{ needs.build-publish.outputs.ref }}
          DIGEST: ${{ needs.build-publish.outputs.digest }}
          PUBLISHED: ${{ needs.build-publish.outputs.published }}
          TAG: ${{ needs.build-publish.outputs.tag }}
          CC: ${{ needs.build-publish.outputs.cc }}
          CX: ${{ needs.build-publish.outputs.cx }}
          GO: ${{ needs.build-publish.outputs.go }}
          GH: ${{ needs.build-publish.outputs.gh }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::build-publish output no sha256 digest (got '${DIGEST}')"; exit 1; }
          [[ "$REF" == *":${TAG}@${DIGEST}" ]] || { echo "::error::build-publish ref '${REF}' does not name ${TAG}@${DIGEST}"; exit 1; }
          line="WORKER-IMAGE-DIGEST ${REF} published=${PUBLISHED}"
          echo "$line"
          {
            printf '### Worker image\n\n'
            printf '```\n%s\ndigest=%s\nclaude-code=%s codex=%s go=%s gh=%s\n```\n' "$line" "$DIGEST" "$CC" "$CX" "$GO" "$GH"
          } >> "$GITHUB_STEP_SUMMARY"
          { echo "ref=$REF"; echo "digest=$DIGEST"; } >> "$GITHUB_OUTPUT"
