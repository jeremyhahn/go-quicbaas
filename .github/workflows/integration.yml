# Integration suite — the five-node quicbaas cluster against real daemons.
#
# Separate from ci.yml on purpose (devops.md §5): this stands up a five-node
# cluster plus its supporting services in containers, builds the daemon, the
# CLI and the test-runner images from tagged modules, and takes on the order of
# an hour, so the per-PR gate stays fast and honest while the suite still runs.
#
# FULL TIER (handbook sdlc §5a; go-quicbaas#1266, #1272). It runs on push to
# main (paths-filtered), on workflow_dispatch -- the coordinator dispatches the
# nightly full tier this way; no workflow carries a `schedule:` trigger, owner
# ruling 2026-10-11 -- and on a pull_request labelled `ci:full`. Every other
# pull request starts a run whose only job skips at once. The pull_request
# trigger carries `labeled`, so adding `ci:full` starts the suite at once.
# This workflow is in no required check, so its skip gates nothing.
#
# Why not a job inside ci.yml: Gitea does not honour job-level
# continue-on-error for the overall run conclusion, so an advisory job there
# could only lie or hold the whole gate red. Observed on run 367, 2026-08-14.
#
# This suite ran dark until 2026-08-14, so its failures are first-execution
# findings rather than regressions. Tracked as #57.
#
# One of them has been fixed and is worth knowing about, because the symptom
# named the wrong culprit: compose starts an init service once for `up` and
# again for the later `run`, and the certificate generator regenerated on the
# second start. That minted a fresh CA under the same subject name while nodes
# 1-3 were already running on the first one, so every client saw "x509:
# certificate signed by unknown authority" against an authority it could name
# by subject. It reads as a broken cluster and is rotated trust. gen-certs is
# now a no-op when the material is already present; per-run freshness comes
# from `down --volumes` between runs, not from rewriting a live volume.
name: Integration

on:
  # Gitea has no API to re-run a finished run (ci-template v1.3).
  workflow_dispatch:
  # `labeled` so that adding `ci:full` starts a full-tier run (#1272); the
  # job's `if:` requires `ci:full`, so any other label starts a run whose only
  # job skips at once.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    # main is the only trunk (ci.yml v1.15); this used to name master and
    # develop, neither of which exists, so a push never ran it.
    branches: [main]
    paths:
      - 'pkg/**'
      - 'cmd/**'
      - 'sdk/**'
      - 'test/integration/**'
      - '**/Dockerfile*'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/integration.yml'

permissions:
  contents: read

# The ci.yml block (DS-3161): Gitea does not evaluate an expression in
# cancel-in-progress, so it is a literal true. A newer push to a pull request
# cancels that ref's older run; on main the group key carries the commit sha,
# so no main run is cancelled and every main commit keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.4'

jobs:
  # #2427 (owner order): picks the pool Integration Tests runs on, with
  # ci.yml's `Balanced runner pool (ruling 1137)` step copied verbatim (its
  # tests, testdata/runner-select-tests.py, hold the two copies equal). Only
  # a push to main or a same-repository pull_request can take the Dells'
  # bigdisk-docker; workflow_dispatch and every other event go hosted. It
  # runs under the job's own `if:`, so a pull request without ci:full skips
  # both at no cost, and on ubuntu-latest, before any checkout.
  preflight:
    name: Preflight [runner selection]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      runner_docker: ${{ steps.runner.outputs.runner_docker }}
    steps:
      - name: Balanced runner pool (ruling 1137)
        id: runner
        env:
          SERVER: ${{ github.server_url }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/actions
          RUN_ID: ${{ github.run_id }}
          JOB_TOKEN: ${{ github.token }}
          HS: ${{ vars.CI_HOSTED_SHARE }}
          C1: ${{ vars.CI_SELF_HOSTED_BIGDISK }}
          C2: ${{ vars.CI_SELF_HOSTED_BIGDISK_DOCKER }}
        run: |
          set -uo pipefail
          HOSTED='"ubuntu-latest"'
          selfhosted() { printf '["self-hosted","linux","x64","%s"]' "$1"; }
          emit() {
            echo "runner: $1; runner_docker: $2"
            { echo "runner=$1"; echo "runner_docker=$2"; } >> "$GITHUB_OUTPUT"
          }
          # hosted <why>: no count, so the default, with the reason shown.
          hosted() {
            echo "::warning::runner selection: $1; every job of this run takes the GitHub-hosted default, ubuntu-latest, and none runs on the Dells (ci-template v1.54, ruling 1137)"
            emit "$HOSTED" "$HOSTED"
            exit 0
          }
          if [ "$SERVER" != https://github.com ]; then
            echo "not github.com: each job keeps its forge label (bigdisk, ci-gate); no selection"
            emit "$HOSTED" "$HOSTED"
            exit 0
          fi
          # v1.52: a fork's pull request runs every job on GitHub-hosted runners.
          # #2427: so does every event but a push to main and a same-repository
          # pull_request, which the Dells' runner image's job hook refuses.
          # refused <why>: the hosted default, with the reason shown.
          refused() {
            echo "::notice::runner selection: $1, which the Dells' runner image refuses (it takes a push to main or a same-repository pull_request only); every job of this run takes the GitHub-hosted default, ubuntu-latest (#2427)"
            emit "$HOSTED" "$HOSTED"
            exit 0
          }
          case "$EVENT" in
            pull_request|pull_request_target)
              if [ "$HEAD_REPO" != "$REPO" ]; then
                echo "::notice::runner selection: this pull request's head repository is not this repository (a fork); every job of this run takes the GitHub-hosted default, ubuntu-latest, and none reaches a self-hosted runner (ci-template v1.52)"
                emit "$HOSTED" "$HOSTED"
                exit 0
              fi
              [ "$EVENT" = pull_request ] || refused "a $EVENT event" ;;
            push)
              [ "$REF" = refs/heads/main ] || refused "a push to $REF, not to refs/heads/main" ;;
            *)
              refused "a $EVENT event" ;;
          esac
          # whole <value>: a whole number above 0, at most 6 digits.
          whole() { [[ "$1" =~ ^[0-9]{1,6}$ ]] && [ "$((10#$1))" -gt 0 ]; }
          whole "$C1" || hosted "CI_SELF_HOSTED_BIGDISK='$C1' is unset, 0 or not a whole number, so no bigdisk job can be placed (the Infra Department sets it)"
          whole "$C2" || hosted "CI_SELF_HOSTED_BIGDISK_DOCKER='$C2' is unset, 0 or not a whole number, so no bigdisk-docker job can be placed (the Infra Department sets it)"
          C1=$((10#$C1)) C2=$((10#$C2))
          if whole "$HS"; then
            HS=$((10#$HS))
          else
            echo "::warning::runner selection: CI_HOSTED_SHARE='$HS' is unset, 0 or not a whole number; HS=12 until the Infra Department sets it (ci-template v1.54, ruling 1137)"
            HS=12
          fi
          # get <url> <file>: 0 on a 200 reply, saved in <file>; the answer in
          # CODE. The token reaches curl as a header from a file descriptor.
          get() {
            CODE=$(curl -sS --max-time 30 -o "$2" -w '%{http_code}' \
              -H @<(printf 'Authorization: Bearer %s\n' "$JOB_TOKEN") \
              -H 'Accept: application/vnd.github+json' "$1") || CODE="curl exit $?"
            [ "$CODE" = 200 ]
          }
          # pages <url> <key> <out>: every page of a listing, its <key> items
          # one JSON object per line in <out>. 1, with WHY set, when a reply is
          # not 200, has no total_count or list, or passes 1000 entries. A list
          # short of its total_count (runs change state while it is read) is
          # kept as a lower bound and named in SHORT (v1.59).
          pages() {
            local p=1 got=0 total n
            : > "$3"
            while :; do
              get "$1&per_page=100&page=$p" "$RUNNER_TEMP/sel-page.json" || { WHY="$1: $CODE"; return 1; }
              total=$(jq -er '.total_count | numbers' "$RUNNER_TEMP/sel-page.json") || { WHY="$1: 200 with no total_count"; return 1; }
              n=$(jq -er --arg k "$2" '.[$k] | arrays | length' "$RUNNER_TEMP/sel-page.json") || { WHY="$1: 200 with no $2 list"; return 1; }
              jq -c --arg k "$2" '.[$k][]' "$RUNNER_TEMP/sel-page.json" >> "$3"
              got=$((got + n))
              { [ "$got" -lt "$total" ] && [ "$n" -gt 0 ]; } || break
              [ "$p" -lt 10 ] || { WHY="$1: more than 1000 entries"; return 1; }
              p=$((p + 1))
            done
            [ "$got" -ge "$total" ] || SHORT="${SHORT:+$SHORT; }${1#"$API"/}: $got of $total entries"
            return 0
          }
          SHORT=
          : > "$RUNNER_TEMP/sel-runs.jsonl"
          for st in queued in_progress; do
            pages "$API/runs?status=$st" workflow_runs "$RUNNER_TEMP/sel-r.jsonl" || hosted "the Actions API gave no complete run list ($WHY)"
            cat "$RUNNER_TEMP/sel-r.jsonl" >> "$RUNNER_TEMP/sel-runs.jsonl"
          done
          : > "$RUNNER_TEMP/sel-jobs.jsonl"
          for id in $(jq -r '.id' "$RUNNER_TEMP/sel-runs.jsonl" | sort -u); do
            [ "$id" != "$RUN_ID" ] || continue
            pages "$API/runs/$id/jobs?filter=latest" jobs "$RUNNER_TEMP/sel-j.jsonl" || hosted "the Actions API gave no complete job list ($WHY)"
            cat "$RUNNER_TEMP/sel-j.jsonl" >> "$RUNNER_TEMP/sel-jobs.jsonl"
          done
          # H, S1, S2: hosted, bigdisk (not bigdisk-docker) and bigdisk-docker
          # jobs in progress plus queued; HQ, SQ: the queued hosted and
          # self-hosted (both kinds) ones. A job of this run is not counted.
          read -r H S1 S2 HQ SQ < <(jq -rs --argjson run "$RUN_ID" '
              [.[] | select(.run_id != $run and (.status == "queued" or .status == "in_progress"))
                   | (.labels // []) as $l
                   | {q: (.status == "queued"),
                      p: (if ($l | any(. == "self-hosted")) then
                            (if ($l | any(. == "bigdisk-docker")) then "s2"
                             elif ($l | any(. == "bigdisk")) then "s1" else "x" end)
                          elif ($l | any(startswith("ubuntu-"))) then "h"
                          else "x" end)}] as $j
              | def n(f): $j | map(select(f)) | length;
              [n(.p == "h"), n(.p == "s1"), n(.p == "s2"), n(.p == "h" and .q),
               n((.p == "s1" or .p == "s2") and .q)]
              | map(tostring) | join(" ")' "$RUNNER_TEMP/sel-jobs.jsonl") || hosted "the job list could not be counted"
          [ -n "${SQ:-}" ] || hosted "the job list could not be counted"
          echo "this repository: hosted $H of CI_HOSTED_SHARE=$HS ($HQ queued); bigdisk $S1 of CI_SELF_HOSTED_BIGDISK=$C1, bigdisk-docker $S2 of CI_SELF_HOSTED_BIGDISK_DOCKER=$C2 ($SQ self-hosted queued)"
          # v1.59: a short listing is a lower bound; still choose.
          [ -z "$SHORT" ] || echo "::notice::runner selection: the listing returned fewer entries than its total ($SHORT); the counts are a lower bound and the choice below uses them (ci-template v1.59)"
          pick=hosted hfull=0 sfull=0
          [ "$H" -lt "$HS" ] || hfull=1
          { [ "$S1" -lt "$C1" ] && [ "$S2" -lt "$C2" ]; } || sfull=1
          if [ "$hfull" = 1 ] && [ "$sfull" = 1 ]; then
            [ "$SQ" -le "$HQ" ] && pick=self
            why="both pools full: hosted $HQ queued, self-hosted $SQ queued"
          elif [ "$hfull" = 1 ]; then
            pick=self; why="the hosted pool is full ($H of $HS)"
          elif [ "$sfull" = 1 ]; then
            why="the self-hosted pool is full (bigdisk $S1 of $C1, bigdisk-docker $S2 of $C2)"
          else
            # self-hosted use, max(S1/C1, S2/C2), at or below hosted use H/HS.
            [ $((S1 * HS)) -le $((H * C1)) ] && [ $((S2 * HS)) -le $((H * C2)) ] && pick=self
            why="use hosted $H/$HS, bigdisk $S1/$C1, bigdisk-docker $S2/$C2"
          fi
          if [ "$pick" = self ]; then
            echo "::notice::runner selection: $why; this run's jobs run on the Dells (bigdisk, bigdisk-docker) (ci-template v1.54, ruling 1137)"
            emit "$(selfhosted bigdisk)" "$(selfhosted bigdisk-docker)"
          else
            echo "::notice::runner selection: $why; this run's jobs take the GitHub-hosted default, ubuntu-latest (ci-template v1.54, ruling 1137)"
            emit "$HOSTED" "$HOSTED"
          fi

  integration-test:
    name: Integration Tests
    # #2427: the preflight runner_docker pool, as ci.yml's Docker jobs:
    # ubuntu-latest, or the Dells' bigdisk-docker when the selector picks them.
    runs-on: ${{ github.server_url == 'https://github.com' && fromJSON(needs.preflight.outputs.runner_docker) || 'bigdisk' }}   # v1.48
    needs: preflight
    # Full tier: the same condition as ci.yml's (see its header).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    timeout-minutes: 120
    env:
      # #2427: as ci.yml's integration job, 8g on a self-hosted runner for a
      # stage run through scripts/in-toolchain-image.sh; no cap only on a
      # GitHub-hosted runner (the preflight runner_docker output is
      # "ubuntu-latest").
      IN_IMAGE_MEMORY: ${{ (github.server_url != 'https://github.com' || needs.preflight.outputs.runner_docker != '"ubuntu-latest"') && '8g' || 'none' }}
    steps:
      # The stack builds several images in one run; the runner's stock free
      # space is not enough for them plus the toolchain caches.
      #
      # Nothing here touches Docker, deliberately. The suite reclaims its own
      # space: `make integration-test` brings its compose stack down with
      # `--volumes --remove-orphans` and removes the five node images and the
      # test-runner image before it rebuilds them, and arms an EXIT trap before
      # the first container exists so the stack comes down on every way out of
      # the recipe — a failed build or an unhealthy cluster included, not only
      # the run that reached its last line (pinned by
      # `make verify-integration-teardown`). A host-global
      # `sudo docker system prune -af --volumes` used to run here instead; the
      # runners are shared, and that deletes every unused image and named
      # volume on the host. On 2026-08-17 it repeatedly destroyed the
      # codex-review job image on two of the shared runners and failed 16 review runs
      # portfolio-wide (#3). Space beyond this job's own stack is host
      # maintenance, not this workflow's to reclaim.
      # Hosted runners only: the pool guest (bigdisk-docker, ruling 442) is a
      # throwaway VM with its own large disk and no passwordless sudo promise.
      - name: Free up disk space
        if: runner.environment == 'github-hosted'
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout code
        uses: actions/checkout@v6

      # #2427, as in ci.yml (ruling 887; template v1.44): a pool runner's
      # environment names LAN addresses and host names; they are masked
      # before any step that builds can print one. On a GitHub-hosted runner
      # the variables are unset and the script prints nothing.
      - name: Mask the LAN addresses
        env:
          CI_IMAGE_REGISTRY: ${{ runner.environment != 'github-hosted' && secrets.CI_IMAGE_REGISTRY || '' }}
        run: scripts/ci-mask-lan.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: Download dependencies
        run: go mod download

      # Every service runs in a container with its binary baked in, and the
      # per-run certificates are produced by an init service into a named
      # volume, so this step needs nothing from the host but a Docker daemon
      # (devops.md §4). `make integration-test` stages the module-fetch
      # credentials for the image builds itself.
      - name: Run integration tests
        timeout-minutes: 90
        run: make integration-test

      # The service logs are the only evidence of WHY a run failed, and they
      # used to be unobtainable: the compose stack runs the servers in
      # containers, so their stdout never reaches the job log, and
      # `make integration-test` tears the stack down itself — by the time any
      # step here runs, the containers are gone. `make integration-test` now
      # dumps them to integration-compose.log before teardown (Makefile), and
      # tails 200 lines into the job log so the common case needs no artifact
      # at all. This step preserves the full copy.
      #
      # The github.com condition was removed rather than kept: this workflow
      # runs on Gitea, where `github.server_url` is never 'https://github.com',
      # so the step could not fire on the one forge it actually executes on —
      # an artifact step shaped like coverage that collected nothing. That is
      # how a suite stayed red across three main commits with no evidence of
      # the cause (#164). upload-artifact is a no-op elsewhere if unsupported;
      # a step that never runs is strictly worse than one that might.
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results
          path: |
            *.out
            *.log
          retention-days: 7
