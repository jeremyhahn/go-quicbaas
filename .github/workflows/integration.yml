# Integration suite — the five-node quicbaas cluster against real daemons.
#
# Separate from ci.yml on purpose (devops.md §5): this stands up a five-node
# cluster plus its supporting services in containers, builds the daemon, the
# CLI and the test-runner images from tagged modules, and takes on the order of
# an hour. §5's shape for exactly this case is a scheduled workflow with
# workflow_dispatch and a paths filter, so the per-push gate stays fast and
# honest while the suite still runs.
#
# Why not a job inside ci.yml: Gitea does not honour job-level
# continue-on-error for the overall run conclusion, so an advisory job there
# could only lie or hold the whole gate red. Observed on run 367, 2026-08-14.
#
# This suite ran dark until 2026-08-14, so its failures are first-execution
# findings rather than regressions. Tracked as #57.
#
# One of them has been fixed and is worth knowing about, because the symptom
# named the wrong culprit: compose starts an init service once for `up` and
# again for the later `run`, and the certificate generator regenerated on the
# second start. That minted a fresh CA under the same subject name while nodes
# 1-3 were already running on the first one, so every client saw "x509:
# certificate signed by unknown authority" against an authority it could name
# by subject. It reads as a broken cluster and is rotated trust. gen-certs is
# now a no-op when the material is already present; per-run freshness comes
# from `down --volumes` between runs, not from rewriting a live volume.
name: Integration

on:
  schedule:
    - cron: '0 8 * * *'
  # Gitea has no API to re-run a finished run (ci-template v1.3).
  workflow_dispatch:
  push:
    branches: [ master, develop ]
    paths:
      - 'pkg/**'
      - 'cmd/**'
      - 'sdk/**'
      - 'test/integration/**'
      - '**/Dockerfile*'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/integration.yml'

permissions:
  contents: read

env:
  GO_VERSION: '1.27.0'

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The stack builds several images in one run; the runner's stock free
      # space is not enough for them plus the toolchain caches.
      #
      # Nothing here touches Docker, deliberately. The suite reclaims its own
      # space: `make integration-test` brings its compose stack down with
      # `--volumes --remove-orphans` and removes the five node images and the
      # test-runner image before it rebuilds them, and arms an EXIT trap before
      # the first container exists so the stack comes down on every way out of
      # the recipe — a failed build or an unhealthy cluster included, not only
      # the run that reached its last line (pinned by
      # `make verify-integration-teardown`). A host-global
      # `sudo docker system prune -af --volumes` used to run here instead; the
      # runners are shared, and that deletes every unused image and named
      # volume on the host. On 2026-08-17 it repeatedly destroyed the
      # codex-review job image on two of the shared runners and failed 16 review runs
      # portfolio-wide (#3). Space beyond this job's own stack is host
      # maintenance, not this workflow's to reclaim.
      - name: Free up disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # Every service runs in a container with its binary baked in, and the
      # per-run certificates are produced by an init service into a named
      # volume, so this step needs nothing from the host but a Docker daemon
      # (devops.md §4). `make integration-test` stages the module-fetch
      # credentials for the image builds itself.
      - name: Run integration tests
        timeout-minutes: 90
        run: make integration-test

      # The service logs are the only evidence of WHY a run failed, and they
      # used to be unobtainable: the compose stack runs the servers in
      # containers, so their stdout never reaches the job log, and
      # `make integration-test` tears the stack down itself — by the time any
      # step here runs, the containers are gone. `make integration-test` now
      # dumps them to integration-compose.log before teardown (Makefile), and
      # tails 200 lines into the job log so the common case needs no artifact
      # at all. This step preserves the full copy.
      #
      # The github.com condition was removed rather than kept: this workflow
      # runs on Gitea, where `github.server_url` is never 'https://github.com',
      # so the step could not fire on the one forge it actually executes on —
      # an artifact step shaped like coverage that collected nothing. That is
      # how a suite stayed red across three main commits with no evidence of
      # the cause (#164). upload-artifact is a no-op elsewhere if unsupported;
      # a step that never runs is strictly worse than one that might.
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results
          path: |
            *.out
            *.log
          retention-days: 7
