# PR Base Guard (#463).
#
# WHAT THIS EXISTS TO PREVENT: a pull request that sits open, reviewed and
# apparently waiting on the queue, while it is targeted at the wrong trunk and
# has NO PIPELINE AT ALL. #453 was in that state for hours on 2026-09-04 —
# approved against feature/software-factory, silently retargeted to main, and carrying
# `total_count: 0` statuses.
#
# Three mechanisms compounded, and this workflow addresses the two that are not
# merge policy:
#
#  1. Merging a parent silently retargets its stacked child to the DEFAULT
#     branch (delete_branch_after_merge is on, default_branch is main). Whether
#     that should happen at all is a POLICY question and is deliberately NOT
#     answered here.
#
#  2. ci.yml only triggers on `branches: [main, feature/software-factory]`, so a pull
#     request opened against any other base — a stacked child on
#     `issue/167-limiter-bounds`, say — creates NO RUN WHATSOEVER. Measured on
#     this server: a trigger with no `branches:` filter DOES fire for such a
#     base, so this workflow deliberately omits one.
#
#  3. Zero statuses and queued statuses render identically. `{"state":
#     "pending", "statuses": [], "total_count": 0}` and a run in flight are the
#     same colour, and the count is the only tell.
#
# The fix for (3) is not a better dashboard, it is to make ZERO UNREACHABLE:
# this workflow runs on every pull request whatever its base, so an open pull
# request always carries at least one status. "No statuses" stops being a state
# the UI can show.
#
# It also fires on `edited`, which is how Gitea reports a base change — but ONLY
# a base change somebody makes. MEASURED, and the distinction matters:
#
#   base changed by hand / API PATCH  -> pull_request action=edited  (fires)
#   base retargeted by a parent merge -> NO pull_request EVENT AT ALL (silent)
#
# Reproduced end to end on 2026-09-04: a throwaway stack base <- parent <-
# child, parent squash-merged with branch deletion. The child's base changed
# from tmp/463-stack-parent to `main` with its head sha untouched, and exactly
# one run existed for it afterwards — the one from `opened`. So the `edited`
# arm below covers a manual retarget and does NOT cover the path that caused
# #453. ci.yml re-runs on neither.
#
# THE GUARD STILL COVERS #453, EARLIER AND STRUCTURALLY. A pull request can only
# be silently retargeted if its base branch is deleted when a parent merges —
# which means its base was a non-trunk branch, which this guard marks RED THE
# MOMENT THE PULL REQUEST IS OPENED, hours before any parent merges. Trunks are
# never deleted on merge, so there is no version of this failure that begins
# from a base the guard calls acceptable. The red is early rather than exact.
#
# A consequence to expect rather than be surprised by: after a merge-induced
# retarget the guard status is STALE — it names the base the pull request had
# when it last ran. It is still red, and the red is the signal to look.
#
# WHAT THIS DOES NOT DECIDE (all owner-level policy, #463):
#   - whether a branch with an open child should survive delete_branch_after_merge
#   - whether a retarget should dismiss stale approvals
#   - whether THIS check should BLOCK a merge, which is a branch-protection
#     setting. As it stands the guard reports; it does not gate.
name: PR Base Guard

on:
  # No `branches:` filter, deliberately -- see (2) above. This is the one
  # workflow in the repository that must run for a base ci.yml ignores.
  #
  # `edited` is included because Gitea fires it on a BASE CHANGE (measured on
  # this server, probe run 10882: action=edited immediately after a retarget).
  # The job is seconds long, which is what makes `edited` affordable here and
  # not on ci.yml -- re-running the full gate on every description edit would
  # not be.
  pull_request:
    types: [opened, reopened, synchronize, edited]

# Cancel superseded runs (#579). Measured 2026-09-06, one
# `GET /actions/runs?limit=100`: NINE runs of this workflow on
# refs/pull/557/head, against five of ci.yml on the same ref. The guard is one
# job of a few seconds, so each run is cheap -- but it fires on `edited` as
# well, which every title or body change triggers, so it accumulates faster
# than anything else in the repository, and on a `capacity: 3` pool a slot is a
# slot.
#
# THE QUESTION #579 SAID TO ANSWER BEFORE ADDING THIS, since this guard exists
# to make "zero statuses" an unreachable state (#463): does cancelling a run
# put a pull request back into that state? It does not. A cancelled Gitea run
# writes `failure` to its contexts -- a status, and a red one. The property the
# guard was built for is preserved, because the guard's claim was never "the
# check passes", it was "the count is never zero".
#
# A nuance this workflow has and ci.yml does not, recorded so it is not read as
# a defect: `edited` carries the SAME head SHA as the run it supersedes, so a
# cancellation here writes `failure` to the `PR Base Guard` context on the
# CURRENT head, not on an abandoned one. The superseding run then overwrites
# that context on the same (sha, context) key when it finishes seconds later.
# The transient red is real and self-clearing; the settled value is always the
# newest run's.
#
# The rest of the reasoning -- why this diverges from devops.md §9, what was
# measured, why `cancel-in-progress` is the literal `true` -- is written out
# once in ci.yml beside the identical block, and is not repeated here. The
# group leads with ${{ github.workflow }}, so `PR Base Guard` and `CI` are
# separate groups and neither can cancel the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    name: PR Base Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The trunk list is READ FROM ci.yml rather than repeated here. A second
      # copy would drift, and a guard that disagrees with the gate about which
      # bases are gated is worse than no guard.
      - name: The base must be a trunk ci.yml actually gates
        env:
          BASE_REF: ${{ github.base_ref }}
          ACTION: ${{ github.event.action }}
          # Gitea reports a base change as a non-null `changes` object. It is
          # used ONLY as a boolean here -- see the note in the next step.
          CHANGES: ${{ toJSON(github.event.changes) }}
        run: |
          set -uo pipefail

          command -v python3 >/dev/null 2>&1 || {
            echo "CI INFRASTRUCTURE: python3 is not on this runner, so the trunk list"
            echo "could not be read from ci.yml. This is not a finding about the branch."
            exit 3
          }

          # Deliberately NO PyYAML: it is not guaranteed on the runner image, and
          # a guard that fails on its own missing dependency is the exact failure
          # mode this workflow exists to remove. Both list spellings are handled;
          # anything else yields no trunks and fails as infrastructure below,
          # rather than silently passing every base.
          TRUNKS="$(python3 - <<'PY'
          import re

          lines = open(".github/workflows/ci.yml").read().split("\n")
          out, seen_pr = [], False
          for i, line in enumerate(lines):
              if re.match(r"^\s+pull_request:\s*$", line):
                  seen_pr = True
                  continue
              if not seen_pr:
                  continue
              inline = re.match(r"^\s+branches:\s*\[(.*)\]\s*$", line)
              if inline:
                  out = [b.strip().strip("\"'") for b in inline.group(1).split(",")]
                  break
              if re.match(r"^\s+branches:\s*$", line):
                  for nxt in lines[i + 1:]:
                      item = re.match(r"^\s+-\s*(\S+)\s*$", nxt)
                      if not item:
                          break
                      out.append(item.group(1).strip("\"'"))
                  break
          print(" ".join(b for b in out if b))
          PY
          )" || TRUNKS=""

          if [ -z "$TRUNKS" ]; then
            echo "CI INFRASTRUCTURE: could not read on.pull_request.branches from"
            echo ".github/workflows/ci.yml, so there is nothing to check the base against."
            exit 3
          fi

          echo "base branch : ${BASE_REF}"
          echo "gated trunks: ${TRUNKS}   (read from ci.yml)"
          echo "event action: ${ACTION}"
          echo

          gated=0
          for trunk in $TRUNKS; do
            [ "$BASE_REF" = "$trunk" ] && gated=1
          done

          bad=0

          if [ "$gated" -ne 1 ]; then
            echo "============================================================"
            echo "WRONG BASE -- ci.yml does not gate '${BASE_REF}'."
            echo
            echo "No CI run will EVER be created for this pull request while it"
            echo "targets this branch: ci.yml triggers only on ${TRUNKS}. The"
            echo "absence looks exactly like a queue on a capacity-3 runner, which"
            echo "is how #453 sat for hours with zero statuses and an intact"
            echo "approval."
            echo
            echo "Either retarget this pull request at a gated trunk, or -- if it"
            echo "is deliberately stacked on a parent -- know that it carries no"
            echo "gate until its parent merges and it is retargeted."
            echo "============================================================"
            bad=1
          fi

          if [ "$ACTION" = "edited" ] && [ "$CHANGES" != "null" ]; then
            echo "============================================================"
            echo "BASE CHANGED -- and the gate did not re-run."
            echo
            echo "This pull request now targets '${BASE_REF}'. ci.yml triggers on"
            echo "opened/reopened/synchronize, and a retarget is none of them, so"
            echo "any green already on this pull request was earned against a"
            echo "DIFFERENT base, and any approval was given against that base too."
            echo
            echo "This is the shape of a silently retargeted stacked branch: a"
            echo "parent merged, its branch was deleted, and the child was"
            echo "repointed at the default branch with nothing announcing it."
            echo
            echo "Push to this branch (or re-run CI) so the gate judges the tree"
            echo "that would actually land. This check clears itself on the next"
            echo "push."
            echo "============================================================"
            bad=1
          fi

          if [ "$bad" -eq 0 ]; then
            echo "OK: base '${BASE_REF}' is gated by ci.yml, and this event is not a retarget."
          fi
          exit $bad

      # A DELIBERATE NON-USE, recorded so nobody "fixes" it by reaching for the
      # value: Gitea's payload does NOT name the previous base.
      #
      # A GitHub recipe reads `changes.base.ref.from` as the branch the pull
      # request was retargeted AWAY FROM. On this server the field is
      # `changes.ref.from` (no `base`), and measured twice on probe PR #466 its
      # value is the NEW base, not the old one:
      #
      #   feature/software-factory -> tmp/463-probe-base : changes.ref.from = tmp/463-probe-base
      #   tmp/463-probe-base -> feature/software-factory : changes.ref.from = feature/software-factory
      #
      # So it is sound as a boolean ("the base changed") and wrong as a value.
      # Reporting it as the old base would print a confident falsehood into the
      # one message somebody reads when they are already confused.
      - name: Record what the payload carried
        if: always()
        run: |
          echo "changes payload (boolean use only, see the comment above):"
          echo '${{ toJSON(github.event.changes) }}'
