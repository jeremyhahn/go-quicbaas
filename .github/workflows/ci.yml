# ci-template: v1.15 (customized)
#
# TIERED CI adopted 2026-10-11 (handbook sdlc §5a; go-quicbaas#1266). Two tiers:
#
#   PR tier   -- lint, test (unit), build, security, plus the merge and
#                snapshot gate infrastructure. Runs on every event.
#   Full tier -- race, web, docker, and the FIPS build step inside `build`.
#                Runs on push to main, on workflow_dispatch, and on a
#                pull_request labelled `ci:full`. The rest of the full tier
#                lives in integration.yml (same selection) and nightly.yml
#                (workflow_dispatch only; the coordinator dispatches it
#                nightly -- no workflow carries a `schedule:` trigger, owner
#                ruling 2026-10-11).
#
# The full-tier condition is written out at every use rather than defined once:
# a job-level `if:` sees only the github/needs/vars/inputs contexts, never
# workflow `env`, so there is nowhere to name it. Every copy must read
#
#   github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
#   contains(github.event.pull_request.labels.*.name, 'ci:full')
#
# The pull_request trigger deliberately has no `labeled` type -- every task:*
# label change would then cost a CI run -- so adding `ci:full` to a pull request
# takes effect on its next push or branch update, not at once. CI Gate passes a
# full-tier job the tier skipped and fails one that was selected and skipped or
# failed.
#
# v1.15 adopted 2026-10-05 (#1156; automatethethings#209): every job starts at
# once -- test, race, security, snapshot and docker no longer wait on lint +
# build, so a run takes as long as its slowest job (v1.14). Jobs that read
# needs.merge.outputs.base_sha still need `merge`. CI Gate still needs every
# job and fails closed on each. push and pull_request run on main only:
# automerge v7's merge trains are PRs into main and get CI from pull_request,
# and feature/software-factory no longer exists on the server. This
# supersedes the v1.9 staged ordering described below.
#
# MERGE-RESULT VALIDATION added 2026-09-03 (#436). Every job that compiles code
# now builds merge(base, head) instead of head alone. On github.com this is what
# a pull_request run already does -- GitHub publishes refs/pull/<n>/merge and
# points github.ref at it -- but GITEA PUBLISHES NO SUCH REF (measured: 118
# refs/pull/* on this repo, every one .../head), so the workflow constructs the
# merge itself in .github/scripts/ci-merge-base.sh. Without it two pull requests
# that are each green against their own base can merge into a branch that does
# not compile, which is what happened to feature/software-factory on 2026-09-03 (#374's
# GetUserByEmail arity change against #385's caller of the old signature; no
# textual conflict, so git merged both without complaint).
#
# v1.9 adopted 2026-08-20 (owner ruling -- STAGED FAIL-FAST): a fast tier
# (lint + build, ~minutes) now gates the expensive tier (test, race, security,
# docker). Gitea cannot cancel in-flight jobs, so ordering IS the fail-fast: a
# broken push reports in minutes and burns nothing downstream, and a green push
# pays one fast-tier of latency. `build` moved INTO the fast tier -- it used to
# wait on `test`, so a compile break was not reported until the whole unit
# suite had run. fips and trivy moved to nightly.yml: both were known-red on
# every push, and a known-red job burning runner-hours verifies nothing. The
# gate now names a SKIP as a skip (upstream stage failed) distinctly from a
# FAIL, both failing closed. This supersedes the v1.8.1 lint-decoupling carried
# here; its silent-skip hazard is closed at the source (the pinned linter) and
# in the gate (named skips).
#
# NOTE: this repo's integration suite lives in a separate workflow
# (integration.yml). Cross-workflow `needs:` does not exist, so the staging
# principle cannot be applied to it from here -- it is out of scope for v1.9
# rather than overlooked.
#
# v1.8 adopted 2026-08-19: gosec now triages its own exit code in the Makefile
# target, the way `vuln` already did. A shell renders a signal death as 128+N,
# so an OOM kill left 137 and the target's `|| exit 1` collapsed it into the
# same red as a real finding -- the conflation that ci-template v1.8 was written
# from, on this repository. v1.6 (GOMEMLIMIT/GOMAXPROCS on the security job) and
# v1.7 (gosec -concurrency 4) were already carried here, so this closes the gap.
# Reconciled against software/templates/github-actions/ci.yml in the
# automatethethings repo (devops.md §1/§8/§9). Divergence outside the
# repo-specific blocks below is a defect.

name: CI

on:
  push:
    # main is the ONLY trunk (v1.15). Every merge into it is validated on
    # push, because two PRs can each be green against their own base and their
    # union not compile (measured 2026-09-12: #879 + #914). The concurrency
    # group below is ref-keyed, so consecutive merges supersede each other and
    # only the latest trunk state is validated. automerge v7's merge trains are
    # PRs into main and get their CI from pull_request.
    branches: [main]
  # Default types only, no `labeled` (#1266): adding `ci:full` selects the full
  # tier from the pull request's next push or branch update.
  pull_request:
    branches: [main]
  # Gitea has no API to re-run a finished run (ci-template v1.3).
  workflow_dispatch:

# Cancel superseded runs (#579). A push to a branch that already has a run in
# flight supersedes it: the older run's result has no consumer, and on a
# `capacity: 3` pool it is holding a slot a live head needs. Measured on this
# repository 2026-09-06, one `GET /actions/runs?limit=100`: five ci.yml runs on
# refs/pull/557/head, three on refs/pull/567/head -- every one but the last on a
# head nothing would ever merge.
#
# This block is on `main` (#527 / PR #578) and did not reach this file, because
# Gitea runs a `pull_request` workflow from the HEAD ref: ci.yml here is a
# different file from ci.yml on main (it carries the Merge Result job) and
# inherits nothing from it. That is #579 item 2, and this is it being fixed on
# the branch rather than waiting for the main reconciliation (#522 / #552).
#
# This is a deliberate divergence from ci-template v1.9 / devops.md §9, whose
# note says Gitea does not honour `concurrency:`. That note was written from
# #88, which used `group: task-worker-${{ github.repository }}` with
# `cancel-in-progress: false` at JOB level on the label-triggered task-worker
# workflow -- a key with no ref component, so every task worker in the portfolio
# shared one group and saturated it. It says nothing about a ref-keyed group
# with cancellation on.
#
# Measured on this Gitea (1.27.1) on 2026-09-06: the OLDER run is cancelled and
# the newest survives -- go-netmon run 12242, go-recountly run 12261,
# go-truststrap runs 12133 and 12232 all carry conclusion `cancelled`. The same
# block is on main in go-truststrap, go-trusted-platform, go-qrdb, go-xkms,
# go-netmon, go-sysmon and go-recountly. The narrower #90 finding still holds
# and is why this is the only available mechanism: Gitea 1.27.1 exposes no
# `cancel` REST route (a human can still cancel through the session-
# authenticated web route, software/scripts/gitea-cancel-run.sh).
#
# `cancel-in-progress` is NOT expression-evaluated on 1.27.1 -- any non-empty
# value is truthy -- so it is written as the literal `true`.
#
# The ref component is what keeps one pull request from cancelling another:
# every run of this workflow is keyed by refs/pull/<n>/head (or refs/heads/main
# on a push), so a group never spans two pull requests. The group leads with
# ${{ github.workflow }}, so this `CI` group cannot reach the separate
# `Code Review` workflow that gates the merge. A cancelled
# run writes `failure` to its contexts, but only ever against the superseded
# SHA, which is not the head a merge is evaluated on.
#
# Adoption boundary, expect it once: Gitea groups a run by the workflow file OF
# THAT RUN, so a run created before this block landed is in no group and the
# first push after it cannot supersede that run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GOPROXY / GOSUMDB are deliberately absent (ci-template v1.1). GOPRIVATE is
# injected by the runners (dependency-resolution.md §6) and already exempts
# github.com/jeremyhahn/* from both the proxy and the checksum database, which
# is what makes the Gitea url-rewrite fire. Setting `GOPROXY: direct` and
# `GOSUMDB: off` here additionally routed every *third-party* module around
# proxy.golang.org and switched off sumdb verification for all of them --
# resolving them from mutable VCS refs instead. That broke this repo on
# 2026-08-14: upstream re-pointed the go-tpm-tools v0.4.8 tag 48 minutes after
# publishing it, so a direct fetch produced a zip whose hash no longer matched
# the (correct, sum.golang.org-backed) entry in go.sum.
env:
  GO_VERSION: '1.27.2'
  COVERAGE_THRESHOLD: 90
  REGISTRY: ghcr.io
  IMAGE_NAME: jeremyhahn/quicbaas

jobs:
  # THE MERGE-RESULT CHECK (#436). It resolves the base commit ONCE and hands
  # it to every other job, so all of them validate the same tree even when the
  # base branch moves underneath a run -- runs here last up to two hours and
  # pull requests do merge inside that window, so per-job resolution would let
  # different jobs certify different trees.
  #
  # It also fail-fasts a conflicted branch: nothing else starts on a tree that
  # cannot exist, and a conflict is reported in about a minute instead of
  # after every job has burned its runner-minutes.
  #
  # It carries NO `if:` on purpose. Gating it on pull_request would make it
  # SKIP on push, and a skipped `needs:` dependency skips its dependents --
  # which would silently disable the whole pipeline on main. Instead the script
  # no-ops on any non-pull_request event, which costs one short job on a push.
  merge:
    name: Merge Result
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base_sha: ${{ steps.merge.outputs.base_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 -- a depth-1 clone has no merge base to three-way
          # merge against, and checkout fetches only the ref it checked out.
          fetch-depth: 0

      # No base sha is passed here: this is the job that RESOLVES it, publishes
      # it as base_sha, and proves the branch merges at all.
      - name: Resolve the base commit and prove the branch merges
        id: merge
        run: .github/scripts/ci-merge-base.sh "${{ github.event_name }}" "${{ github.base_ref }}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # #436: nothing compiles the head alone; the merge job resolves the base first.
    needs: [merge]
    # A job with no upper bound turns a HANGING test into a silently occupied
    # runner instead of a fast red. One run on this workflow held a runner for
    # 4h23m before a human noticed and cancelled it, on a fleet where other PRs
    # were queued behind it. These ceilings sit well above the honest worst case
    # — they exist to catch a hang, not to police a slow run on a loaded fleet.
    # Lint takes 31-41 min on most runners. On the slowest runner, all three
    # runs in the 12 h before 2026-10-12 07:00Z hit the old 45-minute ceiling
    # (main run 48724 among them), so a slow runner turned main red. 75 leaves
    # a margin for that runner and still catches a hang.
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 -- required by the merge-result step below (#436).
          fetch-depth: 0

      # #436: build merge(base, head), not head. The base commit is the one the
      # `merge` job pinned, so every job validates the same tree.
      - name: Validate the merge result, not the head
        run: .github/scripts/ci-merge-base.sh "${{ github.event_name }}" "${{ github.base_ref }}" "${{ needs.merge.outputs.base_sha }}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          gofmt -l . > /tmp/gofmt.out
          if [ -s /tmp/gofmt.out ]; then
            echo "The following files are not formatted:"
            cat /tmp/gofmt.out
            exit 1
          fi

      # `make vet` is the contract (devops.md §4), for the same reason `make
      # lint` is below: a bare `go vet ./...` typechecks the tag-gated packages
      # in their disabled configuration and reports phantom errors (undefined
      # accountToREST in pkg/api/rest under !rest). The Makefile target sweeps
      # the maximal, minimal, desktop and integration tag sets instead, so a
      # package is vetted in every configuration it actually ships in.
      - name: Run go vet
        run: make vet

      # `make lint` is the contract (devops.md §4). It passes the Makefile's
      # LINT_BUILD_TAGS, without which golangci-lint typechecks the tag-gated
      # packages in their disabled configuration and reports phantom errors --
      # e.g. undefined accountToREST in pkg/api/rest under !rest.
      #
      # PINNED, with the devops.md §9 documented reason: golangci-lint v2.13.0
      # panics under Go 1.26, so @latest turns a green branch red for a reason
      # that has nothing to do with the branch. Unpin tracker: go-qrdb#42.
      #
      # No job waits on this one (ci-template v1.14): a lint failure can no
      # longer stop unit tests from running, so the go-qrdb#42 class -- a red
      # that reads as a test failure while tests never ran -- cannot arise
      # from lint. CI Gate reads lint's result on its own line.
      #
      # THE VERSION IS READ FROM THE MAKEFILE, not repeated here. It is also
      # what `make install-tools` installs and what `make build-worker-image`
      # bakes into the Software Factory worker (#772), and a second copy of a
      # pin is a pin that drifts: a worker that lints with a different version
      # than this job produces a review verdict the merge then contradicts.
      - name: Install golangci-lint
        run: |
          version="$(make -s print-GOLANGCI_VERSION)"
          test -n "$version" || { echo "Makefile GOLANGCI_VERSION is empty"; exit 1; }
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$version"

      # `make lint` also runs the repository's naming gate
      # (scripts/verifynaming, a milliseconds-long text scan of the
      # tracked files) ahead of golangci-lint, so a naming regression reports
      # before the 20-minute linter pass rather than after it. There is
      # deliberately no separate step for it: two invocations of the same
      # check is two places to forget.
      - name: Run the naming gate and golangci-lint (make lint)
        run: make lint

      # Fast tier because it is a text parse of the repo's go.mod files: no
      # build, no network, milliseconds.
      #
      # It catches a defect class a local build CANNOT see. Each module
      # publishes its own go.mod, so a consumer importing sdk/go gets sdk/go's
      # pins; MVS hides the disagreement from anyone importing both, and only
      # an outside consumer of the tag ever feels it. This repo shipped exactly
      # that — the root module on go-qrdb v0.8.0-alpha while sdk/go stayed on
      # v0.7.0-alpha — from 32389ca until a review round found it, because the
      # check existed company-side and nothing here ran it.
      - name: Check module pins (make check-reciprocal-pins)
        run: make check-reciprocal-pins

  # SHARDED (#1006): the six full-suite passes used to run back to back in one
  # job (~52 min). Each is now its own matrix leg, so they run in parallel and
  # the job takes as long as its slowest leg. `fail-fast: false` lets every leg
  # report. `needs.test.result` is success only when every leg succeeded, so
  # CI Gate and its required context are unchanged.
  #
  # Each leg runs one `make` target; what each pass covers and why it exists is
  # recorded on its matrix entry below.
  test:
    name: Unit Tests (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # No lint/build in `needs` (v1.14): starts with them, not after them.
    # `merge` stays so the job can read needs.merge.outputs.base_sha (#436).
    needs: [merge]
    strategy:
      fail-fast: false
      matrix:
        include:
          # `make test` compiles the MAXIMAL feature set.
          - leg: default
            target: test
          # `make test` compiles the maximal set, so a file gated on a
          # conjunction of an enabled and a disabled tag -- rag_stub.go is
          # `rest && !rag` -- is compiled by neither it nor `make test-minimal`
          # (which has no `rest` either). The REST route goldens froze the
          # rag-enabled surface and were wrong by six routes for `make
          # build-standard`, a binary we ship, and no gate could see it (#299).
          # This pass is that configuration: REST on, AI features off.
          - leg: standard
            target: test-standard
          # Transports on, optional data-model features off. The only pass that
          # satisfies `mcp && !rag`, `rest && !otel` and `rest && !timeseries` —
          # each needs one feature ON and another OFF, which the maximal pass
          # (all on) and the minimal pass (all off) both miss by construction.
          # `rest && !otel` is the sharpest: `otel` is TEST-ONLY, so the no-op
          # tracing path it guards is what every shipped binary runs, and
          # nothing compiled it. `make check-build-tags` now proves the
          # coverage rather than assuming it (#305).
          - leg: lean
            target: test-lean
          # The disabled-feature side of the tree. This is the ONLY pass that
          # compiles the !rest / !quic / !mcp / !rag / !vector / !timeseries /
          # !raft / !otel / !l2_redis / !quicbaas_{mqtt,amqp,stomp} stub and
          # no-op files and the tests asserting their behaviour — a tag and its
          # negation cannot coexist in one `go test`, so the maximal pass can
          # never reach them. It was RED on the trunk because it was never
          # wired in (#304): a pass nobody runs is a pass nobody notices going
          # red.
          - leg: minimal
            target: test-minimal
          # `make test` covers ./pkg/... ./cmd/... in the ROOT module only, so
          # the separate sdk/go module -- the one downstream consumers actually
          # import -- had no CI coverage at all. It runs with -race and
          # excludes sdk/go/test/, whose docker-compose harness needs Docker; it
          # runs off the gate in nightly.yml's sdk-go-integration job.
          - leg: sdk-go
            target: test-sdk-go
          # Coverage report; this leg alone checks the threshold, uploads the
          # reports and comments on the PR.
          - leg: coverage
            target: coverage
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 -- required by the merge-result step below (#436).
          fetch-depth: 0

      # #436: build merge(base, head), not head. The base commit is the one the
      # `merge` job pinned, so every job validates the same tree.
      - name: Validate the merge result, not the head
        run: .github/scripts/ci-merge-base.sh "${{ github.event_name }}" "${{ github.base_ref }}" "${{ needs.merge.outputs.base_sha }}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests (make ${{ matrix.target }})
        run: make ${{ matrix.target }}

      - name: Check coverage threshold
        if: matrix.leg == 'coverage'
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage/coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "Total coverage: ${COVERAGE}%"
          if ! awk -v c="$COVERAGE" -v t="${{ env.COVERAGE_THRESHOLD }}" 'BEGIN { if (c !~ /^[0-9]+(\.[0-9]+)?$/) exit 1; exit !(c + 0 >= t + 0) }'; then
            echo "Coverage ${COVERAGE}% is below threshold ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi

      - name: Upload coverage to Codecov
        if: matrix.leg == 'coverage'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # upload-artifact v4+ refuses to run against any server that is not
      # github.com -- it detects one and reports "not currently supported on
      # GHES", and Gitea presents as such (devops.md §1). Every such step in
      # this file is guarded; the work it captures has already run.
      - name: Upload coverage reports
        if: matrix.leg == 'coverage' && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            coverage/coverage.out
            coverage/coverage.html
          retention-days: 30

      - name: Comment PR with coverage
        if: matrix.leg == 'coverage' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const threshold = '${{ env.COVERAGE_THRESHOLD }}';
            const status = parseFloat(coverage) >= parseFloat(threshold) ? '✅' : '❌';

            const comment = `## Coverage Report ${status}

            **Total Coverage**: ${coverage}%
            **Threshold**: ${threshold}%

            ${parseFloat(coverage) >= parseFloat(threshold)
              ? '✅ Coverage meets the required threshold!'
              : '❌ Coverage is below the required threshold. Please add more tests.'}

            [View detailed coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # The integration suite lives in integration.yml, not here (devops.md §5).
  # It stands up a five-node cluster in containers and takes on the order of an
  # hour, which is not what this gate is for; that alone is why it is a
  # workflow of its own. It is also currently red, tracked as #57. Gitea does
  # not honour job-level continue-on-error for a run's conclusion, so an
  # advisory job here could only lie or hold the whole gate red.

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # No lint/build in `needs` (v1.14): starts with them, not after them.
    # `merge` stays so the job can read needs.merge.outputs.base_sha (#436).
    needs: [merge]
    # Full tier (header; sdlc §5a). The implicit success() still skips this job
    # when `merge` fails.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 -- required by the merge-result step below (#436).
          fetch-depth: 0

      # #436: build merge(base, head), not head. The base commit is the one the
      # `merge` job pinned, so every job validates the same tree.
      - name: Validate the merge result, not the head
        run: .github/scripts/ci-merge-base.sh "${{ github.event_name }}" "${{ github.base_ref }}" "${{ needs.merge.outputs.base_sha }}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # This deliberately does NOT run `make race`, which is what devops.md §4
      # would otherwise ask for. Measured on 2026-08-14: the tagged race build
      # reports 7 data races in the sealed-window boot path
      # (server.startSealedRESTServer / runSealedWindow), fails two
      # TestSealedBoot_* tests, and blows the target's 10m per-package timeout
      # in pkg/security. All of it predates this workflow and none of it is a
      # CI fix -- widening the gate is tracked separately. Left at the scope it
      # has always had rather than pretending to a coverage it does not deliver.
      # pkg/iam runs in its OWN step with its own bound. Measured on loaded
      # runners: pkg/iam alone exceeds 600s under -race, so one shared
      # -timeout=10m killed the whole invocation and made the gate
      # unreachable for a reason that is capacity, not a race. The root cause
      # (pkg/iam's -race runtime) is code work tracked in go-quicbaas#100;
      # this split is the CI accommodation, mirrored from main so the two
      # ci.yml files differ only by the pull_request trigger for this branch.
      - name: Run tests with race detector
        run: go test -race -timeout=10m $(go list ./pkg/... ./cmd/... | grep -v -e '^github.com/jeremyhahn/go-quicbaas/pkg/iam$' -e '^github.com/jeremyhahn/go-quicbaas/pkg/sdlc$' -e '^github.com/jeremyhahn/go-quicbaas/pkg/service$')

      - name: Run pkg/iam with race detector (its own bound)
        run: go test -race -timeout=20m ./pkg/iam

      # pkg/sdlc and pkg/service persist through the qrdb DAO, whose codec is
      # tag-gated: untagged, every test in them fails at CreateProject with
      # `codec "json" is not supported in this build` — 287 failures and zero
      # actual races in run 6149 (measured 2026-08-24; masked until then
      # because the staged fail-fast skipped this job while Lint was red).
      # They run in their own step with exactly the codec tag they need,
      # NOT the full tag set — the tagged race build's known sealed-window
      # findings (see the note above) stay out of scope. Same race-split
      # accommodation pattern as pkg/iam above.
      - name: Run pkg/sdlc and pkg/service with race detector (codec_json)
        run: go test -race -tags codec_json -timeout=10m ./pkg/sdlc ./pkg/service

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # No lint/build in `needs` (v1.14): starts with them, not after them.
    # `merge` stays so the job can read needs.merge.outputs.base_sha (#436).
    needs: [merge]
    permissions:
      security-events: write
      contents: read
    # ci-template v1.6: the Go toolchain is cgroup-unaware — in a 16 GB job
    # container it sees the HOST's 24 cores and 94 GB, so gosec ran 24 workers
    # and the GC grew the heap to ~27 GB, swapping 11 GB of anonymous memory
    # and stalling the whole host (memory PSI 98, 43% CPU in iowait; measured
    # 2026-08-18 from the live cgroup). GOMEMLIMIT makes the GC respect the
    # container budget; GOMAXPROCS bounds the worker fan-out.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 -- required by the merge-result step below (#436).
          fetch-depth: 0

      # #436: build merge(base, head), not head. The base commit is the one the
      # `merge` job pinned, so every job validates the same tree.
      - name: Validate the merge result, not the head
        run: .github/scripts/ci-merge-base.sh "${{ github.event_name }}" "${{ github.base_ref }}" "${{ needs.merge.outputs.base_sha }}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify module integrity
        run: make modverify

      # `make gosec` is the contract (devops.md §4/§8): CI runs the target a
      # developer runs, so the exclude list, the excluded directories and the
      # build tags cannot drift between the two. The tags matter here for the
      # same reason they do in the Lint job -- without the Makefile's
      # LINT_BUILD_TAGS gosec typechecks the tag-gated packages in their
      # disabled configuration. GOSEC_EXCLUDE and the written justification for
      # every rule in it live beside the target in the Makefile.
      #
      # The target passes -stdout -verbose=text, so findings are readable in
      # the job log; the SARIF upload below only exists on github.com, and
      # without that flag a Gitea failure exited 1 with the findings buried in
      # a file nobody could see (ci-template v1.1).
      # Scanners are PINNED, the golangci-lint discipline above (fleet
      # ruling 2026-08-26): an unpinned gosec self-updated mid-day to v2.29.0
      # and reddened every go-qrdb PR with a new rule (G703) on untouched
      # code. A scanner that changes under a branch produces a red that has
      # nothing to do with the branch. Bump deliberately, with a commit that
      # owns the new findings. Pinning govulncheck pins the TOOL only -- its
      # vulnerability database is fetched live on every run, so a pinned
      # binary still reports today's CVEs.
      # The pins live in the Makefile (GOSEC_VERSION, GOVULNCHECK_VERSION) and
      # are read from it, so this job, `make install-tools` and the Software
      # Factory worker image all scan with one version (#772). gosec is built
      # by `make install-gosec`, not `go install`ed: its release requires a
      # vulnerable grpc, so it is built with GO_TOOL_DEPENDENCY_FLOORS
      # (pkg/version/toolchain.mk), exactly as the worker image builds it.
      - name: Run gosec Security Scanner
        run: |
          make install-gosec
          make gosec

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.server_url == 'https://github.com'
        with:
          sarif_file: build/gosec.sarif
          category: gosec

      # Pinned for the same reason.
      #
      # This pins the TOOL, not the vulnerability DATABASE. govulncheck fetches
      # its data from the Go vulnerability database at every run, so the scan
      # stays as current as it was before: a CVE published an hour ago is still
      # caught. What the pin removes is the analyzer changing underneath the
      # gate without a commit -- the failure mode above, not the freshness the
      # job exists for.
      - name: Run govulncheck
        run: |
          version="$(make -s print-GOVULNCHECK_VERSION)"
          test -n "$version" || { echo "Makefile GOVULNCHECK_VERSION is empty"; exit 1; }
          go install "golang.org/x/vuln/cmd/govulncheck@$version"
          make vuln

  build:
    name: Build
    runs-on: ubuntu-latest
    # #436: nothing compiles the head alone; the merge job resolves the base first.
    needs: [merge]
    # Runs in parallel with every other job (v1.14); it gates nothing
    # downstream, only CI Gate.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # #436: build merge(base, head), not head. The base commit is the one the
      # `merge` job pinned, so every job validates the same tree.
      - name: Validate the merge result, not the head
        run: .github/scripts/ci-merge-base.sh "${{ github.event_name }}" "${{ github.base_ref }}" "${{ needs.merge.outputs.base_sha }}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # `make build` produces the daemon and the client, and the client is
      # always linked with the embedded desktop GUI (CGO + Wails/GTK/WebKit)
      # after rsync-ing and npm-building the frontend. The runner image ships
      # node and npm but neither rsync nor the GTK/WebKit development headers,
      # so build-frontend died on a missing rsync and build-cli on its
      # pkg-config guard. Provision them rather than narrowing what the Build
      # gate covers.
      - name: Install desktop and frontend build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rsync libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build binaries
        run: make build

      # gms_pure_go for the same reason the Makefile sets it: these are
      # CGO_ENABLED=0 builds and dolthub/go-mysql-server's internal/regex has
      # no file that satisfies `cgo && !gms_pure_go` without cgo, so the build
      # fails on "build constraints exclude all Go files".
      #
      # Full tier (header; sdlc §5a): a PR-tier run skips this step and the
      # Build job still reports on the standard binaries.
      - name: Build FIPS binaries
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
        env:
          GOFIPS140: v1.0.0
        run: |
          CGO_ENABLED=0 go build -tags gms_pure_go -buildvcs=false -o bin/quicbaasd-fips ./cmd/quicbaasd
          CGO_ENABLED=0 go build -tags gms_pure_go -buildvcs=false -o bin/quicbaas-fips ./cmd/quicbaas

      - name: Upload build artifacts
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: binaries
          path: bin/*
          retention-days: 30

  # THE WEB SUITES (#551). Until this job existed the TypeScript SDK and the
  # frontend had no CI at all: `ci.yml` mentioned npm exactly twice, both in a
  # comment on the Build job's dependency step. The suites are real and they
  # pass -- `make test-sdk-ts` is 27 files / 359 tests, `make test-frontend` is
  # 75 files / 1294 tests -- but nothing ran them, so a frontend suite that had
  # gone red on this branch was only found when a human ran it by hand (#549).
  # The Build job npm-builds the frontend, which proves it compiles and proves
  # nothing whatsoever about its behaviour.
  #
  # Item 2 of #551 -- rebuilding the frontend and failing on a `dist/` diff, so
  # the committed assets cannot drift from their source -- is an OWNER DECISION
  # and is deliberately not implemented here. This job runs the tests; it does
  # not judge the bundle.
  web:
    name: Web Tests
    runs-on: ubuntu-latest
    # #436: nothing validates the head alone; the merge job resolves the base
    # first. TypeScript branches conflict the same way Go branches do -- two
    # that are each green can together delete a store one of them still
    # subscribes to, with no conflicting hunk anywhere.
    needs: [merge]
    # FAST TIER by cost (seconds of npm ci, ~40 s of vitest), but DELIBERATELY
    # NOT A GATE ON THE EXPENSIVE TIER the way lint and build are. #349 records
    # a frontend test that flakes; putting this job in the Go tier's `needs:`
    # would let one flake SKIP the unit, race, security and docker jobs and
    # cost a re-run of the whole pipeline. It gates the merge through `CI Gate`
    # below -- which is what #551 asked for -- and gates nothing else.
    #
    # Full tier (header; sdlc §5a). The implicit success() still skips this job
    # when `merge` fails.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 -- required by the merge-result step below (#436).
          fetch-depth: 0

      # #436: build merge(base, head), not head. The base commit is the one the
      # `merge` job pinned, so every job validates the same tree.
      - name: Validate the merge result, not the head
        run: .github/scripts/ci-merge-base.sh "${{ github.event_name }}" "${{ github.base_ref }}" "${{ needs.merge.outputs.base_sha }}"

      # No `actions/setup-node`, matching the Build job: the runner image ships
      # node and npm, which is what makes `make build`'s npm frontend build
      # work, and a version pinned here would be the repository's only
      # declaration of one. The versions are printed so that a failure which is
      # really a toolchain gap reads as one instead of as a test failure.
      - name: Report the node toolchain
        run: |
          node --version
          npm --version

      # `npm ci` rather than `npm install`: both packages commit a lockfile and
      # CI should install exactly it. Neither Makefile target installs anything
      # -- they assume a populated node_modules, which holds on a developer
      # machine and never on a fresh runner. The SDK is installed first because
      # the frontend depends on it through `file:../../../sdk/typescript`.
      - name: Install TypeScript SDK and frontend dependencies
        run: |
          (cd sdk/typescript && npm ci)
          (cd cmd/quicbaas/frontend && npm ci)

      # `make` is the contract (devops.md §4): the same two targets a developer
      # runs, so a green here means the same thing it means locally.
      - name: Run the TypeScript SDK tests (make test-sdk-ts)
        run: make test-sdk-ts

      - name: Run the frontend tests (make test-frontend)
        run: make test-frontend

  # THE MERGE-RESULT SNAPSHOT SUITE (#982). It is the only thing that measures
  # what the tree a verification judges actually HOLDS: `git add --all` staged
  # into an index that starts EMPTY silently drops every file the repository
  # tracks despite an ignore rule (seven here, the vector-store markers), and a
  # double that records the argument vector sees an identical command either
  # way -- so only real git against a real working tree can tell the two apart.
  #
  # Nothing else in this pipeline runs it. `make test` never compiles it: the
  # suite is `integration`-tagged, for what it TOUCHES rather than what it
  # costs -- it spawns git and writes a working tree, which the unit tier
  # forbids, and it finishes in well under a second. The Lint job's
  # `make vet-integration` only TYPECHECKS it, and a suite that is only
  # typechecked is a dark suite (integration-testing.md §8).
  #
  # It is here rather than in integration.yml because it is neither slow nor
  # service-dependent (devops.md §5): no server, no credential, no network,
  # and an image that is one alpine, one git and one static test binary. The
  # regression it catches -- a snapshot that silently loses tracked files --
  # is one a pull request introduces, so it belongs on the gate that judges
  # pull requests.
  #
  # `make` is the contract (devops.md §4): the target bakes the source into
  # the image and bind-mounts nothing, which is what lets this job run the
  # same command a developer runs. A bind mount would not work here at all --
  # act_runner talks to the host daemon, which cannot resolve a path inside
  # this job container (see the Build Binaries step in release.yml).
  #
  # The job id is one word on purpose: every other job here is, and a
  # hyphenated id has to survive `needs.<id>.result` in the gate's expression
  # parser -- which is act_runner's, not GitHub's, on the forge this actually
  # runs on.
  snapshot:
    name: Merge-Result Snapshot
    runs-on: ubuntu-latest
    # No lint/build in `needs` (v1.14). `merge` stays so the job can read
    # needs.merge.outputs.base_sha (#436).
    needs: [merge]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 -- required by the merge-result step below (#436).
          fetch-depth: 0

      # #436: build merge(base, head), not head. The base commit is the one the
      # `merge` job pinned, so every job validates the same tree.
      - name: Validate the merge result, not the head
        run: .github/scripts/ci-merge-base.sh "${{ github.event_name }}" "${{ github.base_ref }}" "${{ needs.merge.outputs.base_sha }}"

      # THE IMAGE THIS JOB BUILDS IS SCANNED BEFORE ANYTHING RUNS FROM IT.
      # devops.md §8 gates `trivy image` on every image this repository
      # builds, CI images included, and the gate is inside the `make` target
      # rather than a step here (§4) so a developer's run is the same run:
      # `integration-test-merge-result` hands the id it just built to
      # `trivy-image-merge-result`, which fails the target -- and therefore
      # this job -- on a fixable CRITICAL or HIGH. The image carries no tag, so
      # a concurrent run on this host cannot substitute another commit's image
      # between the scan and the test (integration-testing.md §7).
      #
      # No `actions/setup-go`: everything compiles inside the image, from the
      # module cache the build warms. The target's own `stage-gomodauth` reads
      # the Gitea module-fetch credentials straight out of this job's shell
      # environment, where the runner injects them (dependency-resolution.md
      # §6), and hands them to the build as a BuildKit secret -- never a build
      # arg, which `docker history` would recover. On GitHub none of those
      # variables exist, the file is written empty, the Dockerfile's mount is
      # optional, and the same build resolves from the public proxy.
      - name: Run the merge-result snapshot suite (make integration-test-merge-result)
        run: make integration-test-merge-result

      # The staged file lives in this job container's /tmp and dies with it,
      # but a credential is removed when it stops being needed rather than
      # when its container happens to exit.
      - name: Remove staged credentials
        if: always()
        run: rm -f "$(make -s print-GOMODAUTH_ENV)"

  docker:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    # No `needs` (v1.14): it consumes no artefact of another job (it checks
    # out and builds the image itself), so it starts at once. Full tier
    # (header; sdlc §5a).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io does not exist on Gitea and a Gitea token cannot authenticate to
      # it (lessons.md). Nothing in this job pushes -- the build is load-only
      # and the tag is a local name -- so the login is only there for GitHub's
      # pull rate limits and is guarded accordingly.
      - name: Log in to Container Registry
        if: github.server_url == 'https://github.com'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # go.mod pins first-party modules published to the internal Gitea, which
      # `go mod download` inside the image cannot reach on its own. The runner
      # injects GOPRIVATE and the tokenised insteadOf rewrite into this job's
      # environment (dependency-resolution.md §6), but a job environment does
      # not cross into a docker build -- hence handing it over explicitly.
      #
      # Written under RUNNER_TEMP, deliberately OUTSIDE the build context: the
      # Dockerfile does `COPY . .`, so a credentials file inside the workspace
      # would be baked into a layer. .dockerignore lists gomodauth* as a second
      # line of defence. It is a BuildKit secret, never a build arg -- an arg is
      # recoverable with `docker history`.
      #
      # On GitHub none of these variables exist, the file is written empty, and
      # the Dockerfile's mount is optional, so the same build works there
      # against the public proxy.
      #
      # The variables are read straight from the shell environment, NOT through
      # ${{ env.X }} -- that expression reads this workflow's `env:` block,
      # which does not define them, and would quietly write blanks (the failure
      # then surfaces as an unrelated-looking "unknown revision").
      - name: Stage module-fetch credentials
        run: |
          set -eu
          umask 077
          : > "${RUNNER_TEMP}/gomodauth.env"
          if [ -n "${GIT_CONFIG_KEY_0:-}" ]; then
            {
              printf 'export GOPRIVATE=%s\n' "${GOPRIVATE:-}"
              printf 'export GIT_CONFIG_COUNT=%s\n' "${GIT_CONFIG_COUNT:-}"
              printf 'export GIT_CONFIG_KEY_0=%s\n' "${GIT_CONFIG_KEY_0}"
              printf 'export GIT_CONFIG_VALUE_0=%s\n' "${GIT_CONFIG_VALUE_0:-}"
            } > "${RUNNER_TEMP}/gomodauth.env"
            echo "staged Gitea module credentials"
          else
            echo "no Gitea credentials in this environment; resolving from the public proxy"
          fi

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          # The GitHub Actions cache service is unreachable from a Gitea job
          # container, and buildx treats a cache timeout as a fatal build error
          # rather than a cache miss (lessons.md) -- so the cache is requested
          # only on the server that has one.
          cache-from: ${{ github.server_url == 'https://github.com' && 'type=gha' || '' }}
          cache-to: ${{ github.server_url == 'https://github.com' && 'type=gha,mode=max' || '' }}
          secret-files: |
            gomodauth=${{ runner.temp }}/gomodauth.env

      - name: Remove staged credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/gomodauth.env"

      # SARIF pass, for the Security tab only. trivy-action's setup cannot
      # authenticate to github.com from a Gitea runner and the code scanning
      # API is GitHub-only, so both steps are guarded. Neither gates -- the
      # gate is the CLI step below, which runs on both servers.
      - name: Run Trivy security scanner (SARIF for code scanning)
        # @master, matching the two uses in nightly.yml's Trivy job (v1.9
        # moved that job off the push path). The pinned "0.33.1"
        # that used to be here does not exist as a ref, and act_runner resolves
        # every action in a job before running any step -- including ones behind
        # an `if:` that will never fire on this server -- so an unresolvable ref
        # failed the whole Docker job with "reference not found" before a single
        # step executed.
        uses: aquasecurity/trivy-action@master
        if: github.server_url == 'https://github.com'
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.server_url == 'https://github.com'
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

      # THE GATE (devops.md §8): every image this repo builds is scanned and a
      # CRITICAL/HIGH finding fails the job, on both servers. Trivy runs from
      # its own image rather than the action, because the action installs
      # itself through a nested checkout that a self-hosted runner resolves
      # against its own server. Reproduce locally with `make trivy-image`.
      - name: Trivy image gate (fail on CRITICAL/HIGH)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --format table \
              --severity CRITICAL,HIGH \
              --exit-code 1 \
              --no-progress \
              "${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Run Grype security scanner
        uses: anchore/scan-action@v7
        id: grype
        continue-on-error: true
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          fail-build: false
          severity-cutoff: high

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.server_url == 'https://github.com'
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

  # The single required check (devops.md §1). Every job above appears in BOTH
  # the needs list and the results check -- a gate that can pass vacuously is
  # worse than no gate. join(needs.*.result) is deliberately not used: it
  # evaluates empty on Gitea and reports success while jobs fail.
  # v1.9: fips and trivy moved to nightly.yml (known-red/long-horizon jobs off
  # the push path -- owner ruling 2026-08-20); they gate nothing here.
  #
  # Tiered CI (sdlc §5a, #1266): the gate fails a full-tier job that ran and
  # failed, and passes one the tier skipped. The job name must stay `CI Gate`:
  # branch protection requires `CI / CI Gate (pull_request)`.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [merge, lint, test, race, security, build, web, snapshot, docker]
    steps:
      - name: Fail closed on any non-success
        env:
          # The full-tier condition from the header, evaluated here so the gate
          # can tell a skip the tier chose from a skip it did not.
          FULL_TIER: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && 'true' || 'false' }}
        run: |
          echo "full tier selected: $FULL_TIER (event=${{ github.event_name }})"
          # PR-tier jobs carry no `if:`, so they run on every event. skipped !=
          # failed, but BOTH fail the gate: a skipped job means the merge-result
          # job it needs failed, and NAMING it as a skip prevents the go-qrdb#42
          # class -- a red that reads as a test failure while the tests never
          # ran at all.
          check() { case "$2" in
            success) echo "OK   $1";;
            skipped) echo "SKIP $1 (did not run -- see Merge Result and its job)"; BAD=1;;
            *)       echo "FAIL $1 ($2)"; BAD=1;;
          esac; }
          # Full-tier jobs (race, web, docker) carry the full-tier `if:`. A skip
          # passes only when this event did not select the full tier. When it
          # did, a skip means the job never ran when it should have (race and
          # web also skip when merge fails) -- fail closed rather than pass
          # vacuously.
          check_full() { case "$2" in
            success) echo "OK   $1";;
            skipped)
              if [ "$FULL_TIER" = true ]; then
                echo "SKIP $1 (full tier selected but the job did not run -- see Merge Result and its job)"; BAD=1
              else
                echo "OK   $1 (full tier not selected for this event)"
              fi;;
            *)       echo "FAIL $1 ($2)"; BAD=1;;
          esac; }
          BAD=0
          # merge is the #436 merge-result check, and it gets its own case
          # rather than the generic one. It carries no `if:`, so it never
          # legitimately skips: a non-success means either that this branch does
          # not merge into its base, or that the check could not be performed at
          # all. Both fail closed -- but a MERGE CONFLICT reported as
          # "SKIP lint (upstream stage failed)" is the reads-like-infrastructure
          # misfiling this whole change exists to prevent, so the gate names it.
          case "${{ needs.merge.result }}" in
            success) echo "OK   merge" ;;
            *) echo "FAIL merge (${{ needs.merge.result }}) -- this branch does not merge into its base, or the merge-result check could not run. Open the 'Merge Result' job: a conflict lists the conflicting paths, an infrastructure failure says CI INFRASTRUCTURE on its first line."; BAD=1 ;;
          esac
          check lint     "${{ needs.lint.result }}"
          check test     "${{ needs.test.result }}"
          check security "${{ needs.security.result }}"
          check build    "${{ needs.build.result }}"
          # snapshot runs on every event, so a skip here means merge failed and
          # nothing measured what a verification's tree holds (#982).
          check snapshot "${{ needs.snapshot.result }}"
          check_full race   "${{ needs.race.result }}"
          # web gates nothing downstream, so it never causes another job to
          # skip (#551).
          check_full web    "${{ needs.web.result }}"
          # docker has no `needs` (v1.14), so on a full-tier event it runs even
          # when merge fails; a skip there is never legitimate.
          check_full docker "${{ needs.docker.result }}"
          exit $BAD
