# ci-template: v1.8 (customized)
#
# v1.8 adopted 2026-08-19: gosec now triages its own exit code in the Makefile
# target, the way `vuln` already did. A shell renders a signal death as 128+N,
# so an OOM kill left 137 and the target's `|| exit 1` collapsed it into the
# same red as a real finding -- the conflation that ci-template v1.8 was written
# from, on this repository. v1.6 (GOMEMLIMIT/GOMAXPROCS on the security job) and
# v1.7 (gosec -concurrency 4) were already carried here, so this closes the gap.
# Reconciled against software/templates/github-actions/ci.yml in the
# automatethethings repo (devops.md §1/§8/§9). Divergence outside the
# repo-specific blocks below is a defect.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Gitea has no API to re-run a finished run (ci-template v1.3).
  workflow_dispatch:

# GOPROXY / GOSUMDB are deliberately absent (ci-template v1.1). GOPRIVATE is
# injected by the runners (dependency-resolution.md §6) and already exempts
# github.com/jeremyhahn/* from both the proxy and the checksum database, which
# is what makes the Gitea url-rewrite fire. Setting `GOPROXY: direct` and
# `GOSUMDB: off` here additionally routed every *third-party* module around
# proxy.golang.org and switched off sumdb verification for all of them --
# resolving them from mutable VCS refs instead. That broke this repo on
# 2026-08-14: upstream re-pointed the go-tpm-tools v0.4.8 tag 48 minutes after
# publishing it, so a direct fetch produced a zip whose hash no longer matched
# the (correct, sum.golang.org-backed) entry in go.sum.
env:
  GO_VERSION: '1.26.6'
  COVERAGE_THRESHOLD: 90
  REGISTRY: ghcr.io
  IMAGE_NAME: jeremyhahn/quicbaas

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          gofmt -l . > /tmp/gofmt.out
          if [ -s /tmp/gofmt.out ]; then
            echo "The following files are not formatted:"
            cat /tmp/gofmt.out
            exit 1
          fi

      # `make vet` is the contract (devops.md §4), for the same reason `make
      # lint` is below: a bare `go vet ./...` typechecks the tag-gated packages
      # in their disabled configuration and reports phantom errors (undefined
      # accountToREST in pkg/api/rest under !rest). The Makefile target sweeps
      # the maximal, minimal, desktop and integration tag sets instead, so a
      # package is vetted in every configuration it actually ships in.
      - name: Run go vet
        run: make vet

      # `make lint` is the contract (devops.md §4). It passes the Makefile's
      # LINT_BUILD_TAGS, without which golangci-lint typechecks the tag-gated
      # packages in their disabled configuration and reports phantom errors --
      # e.g. undefined accountToREST in pkg/api/rest under !rest.
      #
      # Pinned, per devops.md §9 and company task #122. The version is not a
      # detail: at identical flags v2.12.2 and v2.13.1 produce DISJOINT finding
      # sets on this tree (0 and 16 respectively), so `@latest` let the gate
      # turn red with no commit behind it -- which is what happened on
      # 2026-08-20. v2.13.x also over-reports and panics on Go 1.26. Bump this
      # deliberately, together with the rest of the portfolio.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint (make lint)
        run: make lint

  fips:
    name: FIPS
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    env:
      GOFIPS140: latest
      GODEBUG: fips140=only
      # Mirrors `make test`'s tag set. A bare `go test` under-reports the FIPS
      # boundary: ~287 failures are a MISSING build tag (codec_json, ...), not a
      # FIPS refusal, and it misses pkg/server (its KMS symmetric path compiles
      # only with tags). Measured on #114.
      FIPS_TAGS: "!integration hashicorpmetrics local raft timeseries qrdb_ts vector qrdb_vector rag rest quic mcp quicbaas_mqtt quicbaas_amqp quicbaas_stomp codec_json codec_yaml codec_toml codec_msgpack codec_bson codec_cbor codec_protobuf gms_pure_go canary otel l2_redis"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Build every package under fips140=only. Compilation triggers no FIPS
      # refusals (those are runtime), so the whole repo is validated here
      # regardless of the scoped test set below.
      - name: Build all packages (FIPS mode)
        run: go build -tags "$FIPS_TAGS" ./...

      # Scoped FIPS boundary — owner ruling 2026-08-23 (#114): option 2 (scope
      # the gate honestly to the packages compliant under GODEBUG=fips140=only
      # TODAY) now; option 1 (full remediation) is tracked as the #114
      # programme. This job STAYS REQUIRED in ci-gate and reports a true,
      # shrinking boundary — it never skips. The test universe mirrors
      # `make test` (./pkg/... ./cmd/... with the tag set); the packages listed
      # below refuse under fips140=only today and are EXCLUDED until their #114
      # remediation line item lands.
      #
      # RULES:
      #  * This list may only SHRINK. Removing an entry (its remediation landed)
      #    is expected; ADDING one means a change made a compliant package
      #    non-compliant — fix the change, do not grow the list.
      #  * Every entry maps to a remediation line item on #114 (A/B/C/D/E).
      - name: Unit tests (FIPS mode, scoped — see #114)
        run: |
          # pipefail so a failing `go list` cannot be masked by the grep that
          # filters it, and set -e/-u so a partial discovery aborts the step
          # rather than silently shrinking the FIPS boundary (a vacuous pass is
          # exactly the gate-integrity failure #114 exists to close).
          set -euo pipefail
          FIPS_EXCLUDE='
          github.com/jeremyhahn/go-quicbaas/pkg/api/websocket             # SHA-1 in RFC-6455 handshake (coder/websocket dep) — #114 item B
          github.com/jeremyhahn/go-quicbaas/pkg/api/websocket/subprotocol # SHA-1 in RFC-6455 handshake (coder/websocket dep) — #114 item B
          github.com/jeremyhahn/go-quicbaas/pkg/backup                    # AES-GCM arbitrary IV — #114 item A
          github.com/jeremyhahn/go-quicbaas/pkg/catalog                   # AES-GCM arbitrary IV — #114 item A
          github.com/jeremyhahn/go-quicbaas/pkg/iam                       # legacy SHA-1 TOTP test — #114 item B (code already refuses; test needs a !fips guard)
          github.com/jeremyhahn/go-quicbaas/pkg/kms                       # AES-GCM arbitrary IV — #114 item A
          github.com/jeremyhahn/go-quicbaas/pkg/secrets                   # AES-GCM arbitrary IV + ChaCha20-Poly1305 — #114 items A, C
          github.com/jeremyhahn/go-quicbaas/pkg/security                  # AES-GCM arbitrary IV — #114 item A
          github.com/jeremyhahn/go-quicbaas/pkg/server                    # AES-GCM arbitrary IV (KMS symmetric path) — #114 item A
          github.com/jeremyhahn/go-quicbaas/pkg/signalbridge             # X25519 + SHA-1 (Signal primitives) — #114 items E, B
          github.com/jeremyhahn/go-quicbaas/pkg/storage/encryption      # AES-GCM arbitrary IV — #114 item A
          github.com/jeremyhahn/go-quicbaas/pkg/xkms                      # AES-GCM arbitrary IV + sub-112-bit HMAC key — #114 items A, D
          '
          # Strip the trailing "# ..." annotation AND the whitespace before it so
          # each pattern is the bare import path (a trailing space would make the
          # grep -vxF match nothing and silently exclude nobody).
          EXCLUDE_LIST=$(printf '%s\n' "$FIPS_EXCLUDE" | sed -E 's/[[:space:]]*#.*$//' | awk 'NF')
          # NO SILENT EXCLUSION. Every exclusion must carry a #114 remediation
          # reference in its inline comment. This is the check the base-authority
          # gate below cannot make: a package NEW in this PR (absent on the base
          # branch) added to FIPS_EXCLUDE is invisible to the base comparison
          # (its name was never compliant-on-base), so without this it could be
          # dropped from the fips140=only gate with no trace. Requiring a #114
          # line item forces every exclusion — new or pre-existing — to be an
          # explicit, reviewable claim rather than a silent omission.
          UNJUSTIFIED=$(printf '%s\n' "$FIPS_EXCLUDE" | awk 'NF' | grep -v '#114' || true)
          if [ -n "$UNJUSTIFIED" ]; then
            echo "These FIPS exclusions lack a #114 remediation reference — every excluded package must cite its #114 line item (no silent exclusions):" >&2
            printf '%s\n' "$UNJUSTIFIED" >&2
            exit 1
          fi
          # Capture `go list` on its own so its exit status is checked (set -e)
          # before it is ever piped into grep.
          ALL=$(go list -tags "$FIPS_TAGS" ./pkg/... ./cmd/...)
          # Every exclusion must resolve to a discovered package, so a typo or a
          # renamed/removed package can never sit in the list silently excluding
          # nothing.
          UNRESOLVED=$(printf '%s\n' "$EXCLUDE_LIST" | grep -vxF "$ALL" || true)
          if [ -n "$UNRESOLVED" ]; then
            echo "These #114 exclusions no longer match a discovered package — remove or fix them:" >&2
            printf '%s\n' "$UNRESOLVED" >&2
            exit 1
          fi
          # The PROTECTED base branch is the authority on what is FIPS-compliant,
          # NOT this branch's own copy of the two lists. Comparing the branch's
          # discovered-minus-excluded set against the branch's OWN
          # .github/fips-compliant-packages.txt (the diff below) is self-
          # referential: a PR can add a compliant package to FIPS_EXCLUDE AND
          # delete it from the baseline in the same branch — both branch-local
          # sets still agree, UNRESOLVED stays empty — and that package silently
          # stops running under fips140=only while this gate passes. Close that
          # hole by rejecting any package that is compliant on the base branch
          # but excluded here: a compliant package must be REMEDIATED, never
          # moved into the exclusion list. Only runs when a base ref exists
          # (pull_request); a push to main is itself the new authority.
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF" >/dev/null 2>&1 || true
            # FAIL CLOSED: on a pull_request the protected-base authority MUST be
            # resolvable. If the base ref cannot be resolved the check cannot run,
            # and a check that cannot run must not pass — otherwise the guard is
            # defeated simply by making the base unreachable. Distinct from the
            # base genuinely lacking the file (first introduction), handled below
            # as a pass.
            if ! git rev-parse --verify --quiet "origin/${GITHUB_BASE_REF}" >/dev/null; then
              echo "FIPS base-authority check FAILED: could not resolve origin/${GITHUB_BASE_REF} on a pull_request. The protected-base authority is required — refusing to pass without it (fail closed)." >&2
              exit 1
            fi
            # cat-file -e distinguishes "file absent on base" (exit != 0 → first
            # introduction, a legitimate pass) from a transient read failure, so
            # an empty read is never silently treated as "nothing to check".
            if git cat-file -e "origin/${GITHUB_BASE_REF}:.github/fips-compliant-packages.txt" 2>/dev/null; then
              BASE_COMPLIANT=$(git show "origin/${GITHUB_BASE_REF}:.github/fips-compliant-packages.txt" | awk 'NF')
              REGRESSED=$(printf '%s\n' "$EXCLUDE_LIST" | grep -xF -f <(printf '%s\n' "$BASE_COMPLIANT") || true)
              if [ -n "$REGRESSED" ]; then
                echo "These packages are FIPS-compliant on ${GITHUB_BASE_REF} but newly EXCLUDED here — that silently drops them from the fips140=only gate. Remediate them (make them pass), do not exclude:" >&2
                printf '%s\n' "$REGRESSED" >&2
                exit 1
              fi
              echo "FIPS base-authority check: no compliant package on ${GITHUB_BASE_REF} is excluded here ($(printf '%s\n' "$BASE_COMPLIANT" | grep -c .) base-compliant packages checked)."
            else
              echo "FIPS base-authority check: base ${GITHUB_BASE_REF} has no fips-compliant-packages.txt yet — nothing to regress against (first introduction)."
            fi
          fi
          # LC_ALL=C so the ordering is byte-wise and reproducible: a
          # locale-aware sort orders "apimodule" before "api/rest" (punctuation
          # folded) while the runner's C locale orders "/" (0x2f) before letters,
          # so an unpinned sort produces a different order than the checked-in
          # baseline was generated under and the diff below fails on ordering,
          # not on a real boundary change. Both sides use LC_ALL=C.
          PKGS=$(printf '%s\n' "$ALL" | grep -vxF "$EXCLUDE_LIST" | LC_ALL=C sort)
          # Enforce the FIPS boundary BY NAME against the checked-in baseline,
          # and with it the EXHAUSTIVE PARTITION: discovered = compliant ∪
          # excluded, with no third state. PKGS is discovered-minus-excluded, so
          # requiring baseline == PKGS means every discovered package is either
          # in the compliant baseline or in FIPS_EXCLUDE — a package that is
          # neither (a new, untested, unexcluded package) lands in PKGS, is
          # absent from the baseline, and reddens this diff by name. It also
          # catches a compliant package dropping out of discovery (build-tag or
          # layout change) and a stale baseline entry. A bare count cannot: an
          # addition can offset a removal, and it names no package. Update the
          # baseline deliberately in the same PR when a package is added or an
          # exclusion is remediated (the list only shrinks).
          if ! diff -u <(LC_ALL=C sort .github/fips-compliant-packages.txt) <(printf '%s\n' "$PKGS"); then
            echo "FIPS-tested package set drifted from .github/fips-compliant-packages.txt (diff above)." >&2
            echo "If this change is intended, update that file in the same PR." >&2
            exit 1
          fi
          echo "FIPS-scoped test packages ($(printf '%s\n' "$PKGS" | grep -c .)):"; printf '%s\n' "$PKGS"
          go test -count=1 -timeout=900s -tags "$FIPS_TAGS" $PKGS

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: make test

      # `make test` covers ./pkg/... ./cmd/... in the ROOT module only, so the
      # separate sdk/go module -- the one downstream consumers actually import
      # -- had no CI coverage at all: a dependency bump or a compilation
      # regression confined to it could merge with this gate green. The target
      # already existed and was simply never wired in. It runs with -race and
      # excludes sdk/go/test/, whose docker-compose harness is a separate
      # known-broken concern.
      - name: Run SDK module unit tests
        run: make test-sdk-go

      - name: Generate coverage report
        run: make coverage

      - name: Check coverage threshold
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage/coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # upload-artifact v4+ refuses to run against any server that is not
      # github.com -- it detects one and reports "not currently supported on
      # GHES", and Gitea presents as such (devops.md §1). Every such step in
      # this file is guarded; the work it captures has already run.
      - name: Upload coverage reports
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            coverage/coverage.out
            coverage/coverage.html
          retention-days: 30

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const threshold = '${{ env.COVERAGE_THRESHOLD }}';
            const status = parseFloat(coverage) >= parseFloat(threshold) ? '✅' : '❌';

            const comment = `## Coverage Report ${status}

            **Total Coverage**: ${coverage}%
            **Threshold**: ${threshold}%

            ${parseFloat(coverage) >= parseFloat(threshold)
              ? '✅ Coverage meets the required threshold!'
              : '❌ Coverage is below the required threshold. Please add more tests.'}

            [View detailed coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # The integration suite lives in integration.yml, not here (devops.md §5).
  # It stands up a five-node cluster in containers and takes on the order of an
  # hour, which is not what this gate is for; that alone is why it is a
  # workflow of its own. It is also currently red, tracked as #57. Gitea does
  # not honour job-level continue-on-error for a run's conclusion, so an
  # advisory job here could only lie or hold the whole gate red.

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # This deliberately does NOT run `make race`, which is what devops.md §4
      # would otherwise ask for. Measured on 2026-08-14: the tagged race build
      # reports 7 data races in the sealed-window boot path
      # (server.startSealedRESTServer / runSealedWindow), fails two
      # TestSealedBoot_* tests, and blows the target's 10m per-package timeout
      # in pkg/security. All of it predates this workflow and none of it is a
      # CI fix -- widening the gate is tracked separately. Left at the scope it
      # has always had rather than pretending to a coverage it does not deliver.
      # pkg/iam is split out with its own, longer timeout. `-timeout` in
      # `go test` is PER PACKAGE, and one value for every package meant
      # pkg/iam's runtime set the bound for all of them: measured on run 5792
      # (job 23585) it consumed the whole 10m and died with
      # `panic: test timed out after 10m0s` while the test it named had been
      # running 1s. Nothing was hung -- the package needs more than 600s under
      # -race on a contended runner (188s locally, idle, with the make tag
      # set). The panic failed the job, so CI Gate was unreachable for EVERY
      # pull request regardless of what it changed (#104).
      #
      # Splitting rather than raising the single value keeps the tight 10m
      # bound on everything else, so a genuine hang anywhere else still fails
      # fast instead of holding a runner for twice as long. The 20m here is
      # headroom over the measured 600s+, not a target; pkg/iam's race runtime
      # is a real cost and reducing it is tracked as code work in #100
      # (bcrypt at default cost in tests, and a goroutine leak in
      # BatchManager.ImportUsers).
      #
      # Discovery is its OWN step. A `go list` inside command substitution
      # cannot fail the job: the runner's `bash -e -o pipefail` applies to the
      # outer `go test`, and a substitution that exits nonzero merely expands to
      # a shorter list -- or an empty one, which makes `go test` fall back to
      # the current directory and pass. That would be a green race gate with no
      # race coverage. Resolving the list here means a discovery failure, an
      # unloadable package, or an unexpectedly empty result fails the step
      # outright, and the count is logged so the number is auditable rather than
      # assumed.
      - name: Resolve the race package list
        run: |
          go list ./pkg/... ./cmd/... \
            | grep -vx 'github.com/jeremyhahn/go-quicbaas/pkg/iam' \
            > "${RUNNER_TEMP}/race-packages.txt"
          test -s "${RUNNER_TEMP}/race-packages.txt"
          echo "race package list: $(wc -l < "${RUNNER_TEMP}/race-packages.txt") packages"

      - name: Run tests with race detector
        run: xargs -a "${RUNNER_TEMP}/race-packages.txt" -x go test -race -timeout=10m

      - name: Run pkg/iam tests with race detector
        run: go test -race -timeout=20m ./pkg/iam/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    # ci-template v1.6: the Go toolchain is cgroup-unaware — in a 16 GB job
    # container it sees the HOST's 24 cores and 94 GB, so gosec ran 24 workers
    # and the GC grew the heap to ~27 GB, swapping 11 GB of anonymous memory
    # and stalling the whole host (memory PSI 98, 43% CPU in iowait; measured
    # 2026-08-18 from the live cgroup). GOMEMLIMIT makes the GC respect the
    # container budget; GOMAXPROCS bounds the worker fan-out.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify module integrity
        run: make modverify

      # `make gosec` is the contract (devops.md §4/§8): CI runs the target a
      # developer runs, so the exclude list, the excluded directories and the
      # build tags cannot drift between the two. The tags matter here for the
      # same reason they do in the Lint job -- without the Makefile's
      # LINT_BUILD_TAGS gosec typechecks the tag-gated packages in their
      # disabled configuration. GOSEC_EXCLUDE and the written justification for
      # every rule in it live beside the target in the Makefile.
      #
      # The target passes -stdout -verbose=text, so findings are readable in
      # the job log; the SARIF upload below only exists on github.com, and
      # without that flag a Gitea failure exited 1 with the findings buried in
      # a file nobody could see (ci-template v1.1).
      #
      # Pinned, per devops.md §9, for the same reason golangci-lint is above:
      # an unpinned scanner turns the gate red with no commit behind it. gosec
      # self-updated mid-day on 2026-08-26 (v2.28.0 -> v2.29.0, published
      # 08:34Z) and reddened another repo in the portfolio on a file nobody had
      # touched since April. This tree was unaffected, and that is measured
      # rather than assumed: running v2.28.0 and v2.29.0 over the same commit
      # with G703 removed from GOSEC_EXCLUDE produced identical findings (the
      # same two sites), so nothing here depended on the version -- but the
      # exposure was real and arrived on a timer, not on a change. Bump this
      # deliberately, together with the rest of the portfolio.
      - name: Run gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          make gosec

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.server_url == 'https://github.com'
        with:
          sarif_file: build/gosec.sarif
          category: gosec

      # Pinned for the same reason, and v1.7.0 is what the last green runs
      # already resolved -- this records the version in use, it does not change
      # it.
      #
      # This pins the TOOL, not the vulnerability DATABASE. govulncheck fetches
      # its data from the Go vulnerability database at every run, so the scan
      # stays as current as it was before: a CVE published an hour ago is still
      # caught. What the pin removes is the analyzer changing underneath the
      # gate without a commit -- the failure mode above, not the freshness the
      # job exists for.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          make vuln

  # trivy fs -- dependency CVEs and leaked secrets in the tree (devops.md §8).
  # Scoping mirrors the `trivy` target in the Makefile; keep the two identical.
  # test/ and examples/ do not ship; bin/, build/ and data/ are local build
  # output. The skip-files entry keeps the secret scanner off the committed
  # test TLS material in pkg/server/certs.
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Two paths for one gate. trivy-action's setup step cannot authenticate
      # to github.com from a Gitea runner and upload-sarif has no
      # GHES-compatible endpoint there, so the action path is guarded on the
      # server URL and Gitea gates with the trivy CLI below. Both run the same
      # fs scan at the same severity; only the SARIF upload is GitHub-only.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples,bin,build,data
          skip-files: pkg/server/certs/*.key
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples,bin,build,data
          skip-files: pkg/server/certs/*.key
          trivyignores: .trivyignore

      - name: Install Trivy CLI (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: |
          trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table \
            --skip-dirs test --skip-dirs examples --skip-dirs bin --skip-dirs build --skip-dirs data \
            --skip-files 'pkg/server/certs/*.key' --ignorefile .trivyignore .

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # `make build` produces the daemon and the client, and the client is
      # always linked with the embedded desktop GUI (CGO + Wails/GTK/WebKit)
      # after rsync-ing and npm-building the frontend. The runner image ships
      # node and npm but neither rsync nor the GTK/WebKit development headers,
      # so build-frontend died on a missing rsync and build-cli on its
      # pkg-config guard. Provision them rather than narrowing what the Build
      # gate covers.
      - name: Install desktop and frontend build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rsync libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build binaries
        run: make build

      # gms_pure_go for the same reason the Makefile sets it: these are
      # CGO_ENABLED=0 builds and dolthub/go-mysql-server's internal/regex has
      # no file that satisfies `cgo && !gms_pure_go` without cgo, so the build
      # fails on "build constraints exclude all Go files".
      - name: Build FIPS binaries
        env:
          GOFIPS140: v1.0.0
        run: |
          CGO_ENABLED=0 go build -tags gms_pure_go -buildvcs=false -o bin/quicbaasd-fips ./cmd/quicbaasd
          CGO_ENABLED=0 go build -tags gms_pure_go -buildvcs=false -o bin/quicbaas-fips ./cmd/quicbaas

      - name: Upload build artifacts
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: binaries
          path: bin/*
          retention-days: 30

  docker:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io does not exist on Gitea and a Gitea token cannot authenticate to
      # it (lessons.md). Nothing in this job pushes -- the build is load-only
      # and the tag is a local name -- so the login is only there for GitHub's
      # pull rate limits and is guarded accordingly.
      - name: Log in to Container Registry
        if: github.server_url == 'https://github.com'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # go.mod pins first-party modules published to the internal Gitea, which
      # `go mod download` inside the image cannot reach on its own. The runner
      # injects GOPRIVATE and the tokenised insteadOf rewrite into this job's
      # environment (dependency-resolution.md §6), but a job environment does
      # not cross into a docker build -- hence handing it over explicitly.
      #
      # Written under RUNNER_TEMP, deliberately OUTSIDE the build context: the
      # Dockerfile does `COPY . .`, so a credentials file inside the workspace
      # would be baked into a layer. .dockerignore lists gomodauth* as a second
      # line of defence. It is a BuildKit secret, never a build arg -- an arg is
      # recoverable with `docker history`.
      #
      # On GitHub none of these variables exist, the file is written empty, and
      # the Dockerfile's mount is optional, so the same build works there
      # against the public proxy.
      #
      # The variables are read straight from the shell environment, NOT through
      # ${{ env.X }} -- that expression reads this workflow's `env:` block,
      # which does not define them, and would quietly write blanks (the failure
      # then surfaces as an unrelated-looking "unknown revision").
      - name: Stage module-fetch credentials
        run: |
          set -eu
          umask 077
          : > "${RUNNER_TEMP}/gomodauth.env"
          if [ -n "${GIT_CONFIG_KEY_0:-}" ]; then
            {
              printf 'export GOPRIVATE=%s\n' "${GOPRIVATE:-}"
              printf 'export GIT_CONFIG_COUNT=%s\n' "${GIT_CONFIG_COUNT:-}"
              printf 'export GIT_CONFIG_KEY_0=%s\n' "${GIT_CONFIG_KEY_0}"
              printf 'export GIT_CONFIG_VALUE_0=%s\n' "${GIT_CONFIG_VALUE_0:-}"
            } > "${RUNNER_TEMP}/gomodauth.env"
            echo "staged Gitea module credentials"
          else
            echo "no Gitea credentials in this environment; resolving from the public proxy"
          fi

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          # The GitHub Actions cache service is unreachable from a Gitea job
          # container, and buildx treats a cache timeout as a fatal build error
          # rather than a cache miss (lessons.md) -- so the cache is requested
          # only on the server that has one.
          cache-from: ${{ github.server_url == 'https://github.com' && 'type=gha' || '' }}
          cache-to: ${{ github.server_url == 'https://github.com' && 'type=gha,mode=max' || '' }}
          secret-files: |
            gomodauth=${{ runner.temp }}/gomodauth.env

      - name: Remove staged credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/gomodauth.env"

      # SARIF pass, for the Security tab only. trivy-action's setup cannot
      # authenticate to github.com from a Gitea runner and the code scanning
      # API is GitHub-only, so both steps are guarded. Neither gates -- the
      # gate is the CLI step below, which runs on both servers.
      - name: Run Trivy security scanner (SARIF for code scanning)
        # @master, matching the two uses in the Trivy job. The pinned "0.33.1"
        # that used to be here does not exist as a ref, and act_runner resolves
        # every action in a job before running any step -- including ones behind
        # an `if:` that will never fire on this server -- so an unresolvable ref
        # failed the whole Docker job with "reference not found" before a single
        # step executed.
        uses: aquasecurity/trivy-action@master
        if: github.server_url == 'https://github.com'
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.server_url == 'https://github.com'
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

      # THE GATE (devops.md §8): every image this repo builds is scanned and a
      # CRITICAL/HIGH finding fails the job, on both servers. Trivy runs from
      # its own image rather than the action, because the action installs
      # itself through a nested checkout that a self-hosted runner resolves
      # against its own server. Reproduce locally with `make trivy-image`.
      - name: Trivy image gate (fail on CRITICAL/HIGH)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --format table \
              --severity CRITICAL,HIGH \
              --exit-code 1 \
              --no-progress \
              "${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Run Grype security scanner
        uses: anchore/scan-action@v7
        id: grype
        continue-on-error: true
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          fail-build: false
          severity-cutoff: high

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.server_url == 'https://github.com'
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

  # The single required check (devops.md §1). Every job above appears in BOTH
  # the needs list and the results check -- a gate that can pass vacuously is
  # worse than no gate. join(needs.*.result) is deliberately not used: it
  # evaluates empty on Gitea and reports success while jobs fail.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, race, security, trivy, build, docker, fips]
    steps:
      - name: Fail closed on any non-success
        run: |
          check() { case "$2" in success) echo "OK   $1";; *) echo "FAIL $1 ($2)"; BAD=1;; esac; }
          BAD=0
          check lint             "${{ needs.lint.result }}"
          check test             "${{ needs.test.result }}"
          check race             "${{ needs.race.result }}"
          check security         "${{ needs.security.result }}"
          check trivy            "${{ needs.trivy.result }}"
          check build            "${{ needs.build.result }}"
          check fips        "${{ needs.fips.result }}"
          # docker carries `if: github.event_name == 'push'`, so 'skipped' is
          # legitimate on a pull_request and only there. On a push a skip means
          # the job never ran -- fail closed rather than pass vacuously.
          case "${{ needs.docker.result }}" in
            success) echo "OK   docker" ;;
            skipped)
              if [ "${{ github.event_name }}" != 'push' ]; then
                echo "OK   docker (push-only job, event=${{ github.event_name }})"
              elif [ "${{ needs.lint.result }}" != 'success' ] || [ "${{ needs.test.result }}" != 'success' ]; then
                # docker carries `needs: [lint, test]`, so when either of those
                # fails docker is skipped without ever being given a chance to
                # run. The genuine failure has already set BAD, so reporting
                # docker as failed here adds nothing and misdirects whoever
                # reads the gate log -- which is the one thing agents are told
                # to read instead of the run conclusion (#135).
                echo "SKIP docker (dependency failed; not a docker failure)"
              else
                # Dependencies green and docker still skipped on a push means
                # the job never ran when it should have. Fail closed.
                echo "FAIL docker (skipped on a push with its dependencies green)"; BAD=1
              fi ;;
            *) echo "FAIL docker (${{ needs.docker.result }})"; BAD=1 ;;
          esac
          exit $BAD
