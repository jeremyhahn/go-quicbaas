# ci-template: v1.8 (customized)
#
# v1.8 adopted 2026-08-19: gosec now triages its own exit code in the Makefile
# target, the way `vuln` already did. A shell renders a signal death as 128+N,
# so an OOM kill left 137 and the target's `|| exit 1` collapsed it into the
# same red as a real finding -- the conflation that ci-template v1.8 was written
# from, on this repository. v1.6 (GOMEMLIMIT/GOMAXPROCS on the security job) and
# v1.7 (gosec -concurrency 4) were already carried here, so this closes the gap.
# Reconciled against software/templates/github-actions/ci.yml in the
# automatethethings repo (devops.md §1/§8/§9). Divergence outside the
# repo-specific blocks below is a defect.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Gitea has no API to re-run a finished run (ci-template v1.3).
  workflow_dispatch:

# GOPROXY / GOSUMDB are deliberately absent (ci-template v1.1). GOPRIVATE is
# injected by the runners (dependency-resolution.md §6) and already exempts
# github.com/jeremyhahn/* from both the proxy and the checksum database, which
# is what makes the Gitea url-rewrite fire. Setting `GOPROXY: direct` and
# `GOSUMDB: off` here additionally routed every *third-party* module around
# proxy.golang.org and switched off sumdb verification for all of them --
# resolving them from mutable VCS refs instead. That broke this repo on
# 2026-08-14: upstream re-pointed the go-tpm-tools v0.4.8 tag 48 minutes after
# publishing it, so a direct fetch produced a zip whose hash no longer matched
# the (correct, sum.golang.org-backed) entry in go.sum.
env:
  GO_VERSION: '1.26.6'
  COVERAGE_THRESHOLD: 90
  REGISTRY: ghcr.io
  IMAGE_NAME: jeremyhahn/quicbaas

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          gofmt -l . > /tmp/gofmt.out
          if [ -s /tmp/gofmt.out ]; then
            echo "The following files are not formatted:"
            cat /tmp/gofmt.out
            exit 1
          fi

      # `make vet` is the contract (devops.md §4), for the same reason `make
      # lint` is below: a bare `go vet ./...` typechecks the tag-gated packages
      # in their disabled configuration and reports phantom errors (undefined
      # accountToREST in pkg/api/rest under !rest). The Makefile target sweeps
      # the maximal, minimal, desktop and integration tag sets instead, so a
      # package is vetted in every configuration it actually ships in.
      - name: Run go vet
        run: make vet

      # `make lint` is the contract (devops.md §4). It passes the Makefile's
      # LINT_BUILD_TAGS, without which golangci-lint typechecks the tag-gated
      # packages in their disabled configuration and reports phantom errors --
      # e.g. undefined accountToREST in pkg/api/rest under !rest.
      #
      # Pinned, per devops.md §9 and company task #122. The version is not a
      # detail: at identical flags v2.12.2 and v2.13.1 produce DISJOINT finding
      # sets on this tree (0 and 16 respectively), so `@latest` let the gate
      # turn red with no commit behind it -- which is what happened on
      # 2026-08-20. v2.13.x also over-reports and panics on Go 1.26. Bump this
      # deliberately, together with the rest of the portfolio.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint (make lint)
        run: make lint

  fips:
    name: FIPS
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    env:
      GOFIPS140: latest
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages (FIPS mode)
        run: go build ./...

      - name: Unit tests (FIPS mode)
        run: go test -count=1 -timeout=900s ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: make test

      # `make test` covers ./pkg/... ./cmd/... in the ROOT module only, so the
      # separate sdk/go module -- the one downstream consumers actually import
      # -- had no CI coverage at all: a dependency bump or a compilation
      # regression confined to it could merge with this gate green. The target
      # already existed and was simply never wired in. It runs with -race and
      # excludes sdk/go/test/, whose docker-compose harness is a separate
      # known-broken concern.
      - name: Run SDK module unit tests
        run: make test-sdk-go

      - name: Generate coverage report
        run: make coverage

      - name: Check coverage threshold
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage/coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold ${{ env.COVERAGE_THRESHOLD }}%"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # upload-artifact v4+ refuses to run against any server that is not
      # github.com -- it detects one and reports "not currently supported on
      # GHES", and Gitea presents as such (devops.md §1). Every such step in
      # this file is guarded; the work it captures has already run.
      - name: Upload coverage reports
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            coverage/coverage.out
            coverage/coverage.html
          retention-days: 30

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const threshold = '${{ env.COVERAGE_THRESHOLD }}';
            const status = parseFloat(coverage) >= parseFloat(threshold) ? '✅' : '❌';

            const comment = `## Coverage Report ${status}

            **Total Coverage**: ${coverage}%
            **Threshold**: ${threshold}%

            ${parseFloat(coverage) >= parseFloat(threshold)
              ? '✅ Coverage meets the required threshold!'
              : '❌ Coverage is below the required threshold. Please add more tests.'}

            [View detailed coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # The integration suite lives in integration.yml, not here (devops.md §5).
  # It stands up a five-node cluster in containers and takes on the order of an
  # hour, which is not what this gate is for; that alone is why it is a
  # workflow of its own. It is also currently red, tracked as #57. Gitea does
  # not honour job-level continue-on-error for a run's conclusion, so an
  # advisory job here could only lie or hold the whole gate red.

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # This deliberately does NOT run `make race`, which is what devops.md §4
      # would otherwise ask for. Measured on 2026-08-14: the tagged race build
      # reports 7 data races in the sealed-window boot path
      # (server.startSealedRESTServer / runSealedWindow), fails two
      # TestSealedBoot_* tests, and blows the target's 10m per-package timeout
      # in pkg/security. All of it predates this workflow and none of it is a
      # CI fix -- widening the gate is tracked separately. Left at the scope it
      # has always had rather than pretending to a coverage it does not deliver.
      - name: Run tests with race detector
        run: go test -race -timeout=10m ./pkg/... ./cmd/...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    # ci-template v1.6: the Go toolchain is cgroup-unaware — in a 16 GB job
    # container it sees the HOST's 24 cores and 94 GB, so gosec ran 24 workers
    # and the GC grew the heap to ~27 GB, swapping 11 GB of anonymous memory
    # and stalling the whole host (memory PSI 98, 43% CPU in iowait; measured
    # 2026-08-18 from the live cgroup). GOMEMLIMIT makes the GC respect the
    # container budget; GOMAXPROCS bounds the worker fan-out.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify module integrity
        run: make modverify

      # `make gosec` is the contract (devops.md §4/§8): CI runs the target a
      # developer runs, so the exclude list, the excluded directories and the
      # build tags cannot drift between the two. The tags matter here for the
      # same reason they do in the Lint job -- without the Makefile's
      # LINT_BUILD_TAGS gosec typechecks the tag-gated packages in their
      # disabled configuration. GOSEC_EXCLUDE and the written justification for
      # every rule in it live beside the target in the Makefile.
      #
      # The target passes -stdout -verbose=text, so findings are readable in
      # the job log; the SARIF upload below only exists on github.com, and
      # without that flag a Gitea failure exited 1 with the findings buried in
      # a file nobody could see (ci-template v1.1).
      - name: Run gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          make gosec

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.server_url == 'https://github.com'
        with:
          sarif_file: build/gosec.sarif
          category: gosec

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make vuln

  # trivy fs -- dependency CVEs and leaked secrets in the tree (devops.md §8).
  # Scoping mirrors the `trivy` target in the Makefile; keep the two identical.
  # test/ and examples/ do not ship; bin/, build/ and data/ are local build
  # output. The skip-files entry keeps the secret scanner off the committed
  # test TLS material in pkg/server/certs.
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Two paths for one gate. trivy-action's setup step cannot authenticate
      # to github.com from a Gitea runner and upload-sarif has no
      # GHES-compatible endpoint there, so the action path is guarded on the
      # server URL and Gitea gates with the trivy CLI below. Both run the same
      # fs scan at the same severity; only the SARIF upload is GitHub-only.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples,bin,build,data
          skip-files: pkg/server/certs/*.key
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples,bin,build,data
          skip-files: pkg/server/certs/*.key
          trivyignores: .trivyignore

      - name: Install Trivy CLI (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: |
          trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table \
            --skip-dirs test --skip-dirs examples --skip-dirs bin --skip-dirs build --skip-dirs data \
            --skip-files 'pkg/server/certs/*.key' --ignorefile .trivyignore .

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # `make build` produces the daemon and the client, and the client is
      # always linked with the embedded desktop GUI (CGO + Wails/GTK/WebKit)
      # after rsync-ing and npm-building the frontend. The runner image ships
      # node and npm but neither rsync nor the GTK/WebKit development headers,
      # so build-frontend died on a missing rsync and build-cli on its
      # pkg-config guard. Provision them rather than narrowing what the Build
      # gate covers.
      - name: Install desktop and frontend build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rsync libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build binaries
        run: make build

      # gms_pure_go for the same reason the Makefile sets it: these are
      # CGO_ENABLED=0 builds and dolthub/go-mysql-server's internal/regex has
      # no file that satisfies `cgo && !gms_pure_go` without cgo, so the build
      # fails on "build constraints exclude all Go files".
      - name: Build FIPS binaries
        env:
          GOFIPS140: v1.0.0
        run: |
          CGO_ENABLED=0 go build -tags gms_pure_go -buildvcs=false -o bin/quicbaasd-fips ./cmd/quicbaasd
          CGO_ENABLED=0 go build -tags gms_pure_go -buildvcs=false -o bin/quicbaas-fips ./cmd/quicbaas

      - name: Upload build artifacts
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: binaries
          path: bin/*
          retention-days: 30

  docker:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io does not exist on Gitea and a Gitea token cannot authenticate to
      # it (lessons.md). Nothing in this job pushes -- the build is load-only
      # and the tag is a local name -- so the login is only there for GitHub's
      # pull rate limits and is guarded accordingly.
      - name: Log in to Container Registry
        if: github.server_url == 'https://github.com'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # go.mod pins first-party modules published to the internal Gitea, which
      # `go mod download` inside the image cannot reach on its own. The runner
      # injects GOPRIVATE and the tokenised insteadOf rewrite into this job's
      # environment (dependency-resolution.md §6), but a job environment does
      # not cross into a docker build -- hence handing it over explicitly.
      #
      # Written under RUNNER_TEMP, deliberately OUTSIDE the build context: the
      # Dockerfile does `COPY . .`, so a credentials file inside the workspace
      # would be baked into a layer. .dockerignore lists gomodauth* as a second
      # line of defence. It is a BuildKit secret, never a build arg -- an arg is
      # recoverable with `docker history`.
      #
      # On GitHub none of these variables exist, the file is written empty, and
      # the Dockerfile's mount is optional, so the same build works there
      # against the public proxy.
      #
      # The variables are read straight from the shell environment, NOT through
      # ${{ env.X }} -- that expression reads this workflow's `env:` block,
      # which does not define them, and would quietly write blanks (the failure
      # then surfaces as an unrelated-looking "unknown revision").
      - name: Stage module-fetch credentials
        run: |
          set -eu
          umask 077
          : > "${RUNNER_TEMP}/gomodauth.env"
          if [ -n "${GIT_CONFIG_KEY_0:-}" ]; then
            {
              printf 'export GOPRIVATE=%s\n' "${GOPRIVATE:-}"
              printf 'export GIT_CONFIG_COUNT=%s\n' "${GIT_CONFIG_COUNT:-}"
              printf 'export GIT_CONFIG_KEY_0=%s\n' "${GIT_CONFIG_KEY_0}"
              printf 'export GIT_CONFIG_VALUE_0=%s\n' "${GIT_CONFIG_VALUE_0:-}"
            } > "${RUNNER_TEMP}/gomodauth.env"
            echo "staged Gitea module credentials"
          else
            echo "no Gitea credentials in this environment; resolving from the public proxy"
          fi

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          # The GitHub Actions cache service is unreachable from a Gitea job
          # container, and buildx treats a cache timeout as a fatal build error
          # rather than a cache miss (lessons.md) -- so the cache is requested
          # only on the server that has one.
          cache-from: ${{ github.server_url == 'https://github.com' && 'type=gha' || '' }}
          cache-to: ${{ github.server_url == 'https://github.com' && 'type=gha,mode=max' || '' }}
          secret-files: |
            gomodauth=${{ runner.temp }}/gomodauth.env

      - name: Remove staged credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/gomodauth.env"

      # SARIF pass, for the Security tab only. trivy-action's setup cannot
      # authenticate to github.com from a Gitea runner and the code scanning
      # API is GitHub-only, so both steps are guarded. Neither gates -- the
      # gate is the CLI step below, which runs on both servers.
      - name: Run Trivy security scanner (SARIF for code scanning)
        # @master, matching the two uses in the Trivy job. The pinned "0.33.1"
        # that used to be here does not exist as a ref, and act_runner resolves
        # every action in a job before running any step -- including ones behind
        # an `if:` that will never fire on this server -- so an unresolvable ref
        # failed the whole Docker job with "reference not found" before a single
        # step executed.
        uses: aquasecurity/trivy-action@master
        if: github.server_url == 'https://github.com'
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.server_url == 'https://github.com'
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

      # THE GATE (devops.md §8): every image this repo builds is scanned and a
      # CRITICAL/HIGH finding fails the job, on both servers. Trivy runs from
      # its own image rather than the action, because the action installs
      # itself through a nested checkout that a self-hosted runner resolves
      # against its own server. Reproduce locally with `make trivy-image`.
      - name: Trivy image gate (fail on CRITICAL/HIGH)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --format table \
              --severity CRITICAL,HIGH \
              --exit-code 1 \
              --no-progress \
              "${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Run Grype security scanner
        uses: anchore/scan-action@v7
        id: grype
        continue-on-error: true
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          fail-build: false
          severity-cutoff: high

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.server_url == 'https://github.com'
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

  # The single required check (devops.md §1). Every job above appears in BOTH
  # the needs list and the results check -- a gate that can pass vacuously is
  # worse than no gate. join(needs.*.result) is deliberately not used: it
  # evaluates empty on Gitea and reports success while jobs fail.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, race, security, trivy, build, docker, fips]
    steps:
      - name: Fail closed on any non-success
        run: |
          check() { case "$2" in success) echo "OK   $1";; *) echo "FAIL $1 ($2)"; BAD=1;; esac; }
          BAD=0
          check lint             "${{ needs.lint.result }}"
          check test             "${{ needs.test.result }}"
          check race             "${{ needs.race.result }}"
          check security         "${{ needs.security.result }}"
          check trivy            "${{ needs.trivy.result }}"
          check build            "${{ needs.build.result }}"
          check fips        "${{ needs.fips.result }}"
          # docker carries `if: github.event_name == 'push'`, so 'skipped' is
          # legitimate on a pull_request and only there. On a push a skip means
          # the job never ran -- fail closed rather than pass vacuously.
          case "${{ needs.docker.result }}" in
            success) echo "OK   docker" ;;
            skipped)
              if [ "${{ github.event_name }}" = 'push' ]; then
                echo "FAIL docker (skipped on a push)"; BAD=1
              else
                echo "OK   docker (push-only job, event=${{ github.event_name }})"
              fi ;;
            *) echo "FAIL docker (${{ needs.docker.result }})"; BAD=1 ;;
          esac
          exit $BAD
