# nightly-template: v1.0 (customized). Known-red and long-horizon jobs, off the push path.

name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '5 4 * * *'

env:
  GO_VERSION: '1.27.4'

jobs:
  # The root module under fips140=only, over two shards from `make test-fips-shard`.
  fips:
    name: FIPS (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # needs: none -- nightly runs standalone; build health is ci.yml's job.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      GOFIPS140: latest
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages (FIPS mode)
        if: matrix.shard == 0
        run: go build ./...

      - name: Unit tests (FIPS mode)
        run: make test-fips-shard SHARD=${{ matrix.shard }} SHARDS=2

  # trivy fs: dependency CVEs and leaked secrets in the tree.
  trivy:
    timeout-minutes: 60
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # SARIF upload on github.com; other forges gate with the trivy CLI below.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples,bin,build,data
          skip-files: pkg/server/certs/*.key
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples,bin,build,data
          skip-files: pkg/server/certs/*.key
          trivyignores: .trivyignore

      - name: Install Trivy CLI (Gitea)
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: |
          trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table \
            --skip-dirs test --skip-dirs examples --skip-dirs bin --skip-dirs build --skip-dirs data \
            --skip-files 'pkg/server/certs/*.key' --ignorefile .trivyignore .

  # Every worker-image toolchain pin at its upstream's latest release.
  worker-toolchain-currency:
    name: Worker toolchain currency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Check every worker-image pin against upstream
        run: make check-worker-toolchain-currency

  # The sdk/go docker-compose harness (sdk/go/test/integration).
  sdk-go-integration:
    name: SDK Go integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The harness's TestMain exits 0 without Docker, so require it here.
      - name: Require Docker and Compose
        run: |
          docker info
          docker compose version

      - name: Run the Go SDK integration harness
        run: make integration-test-sdk-go
