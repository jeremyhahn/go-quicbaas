# nightly-template: v1.8 (customized) -- the known-red and long-horizon jobs,
# off the push path.
# Taken: v1.3 security-events permission (job-level here), v1.4 trivy-action
# commit pin and advisory misconfig scan on both servers, v1.5 strict trivy
# version parse, v1.7 actions pinned by commit, v1.8 GO_VERSION 1.27.3.
# CUSTOMIZE: the trivy pin is TRIVY_VERSION in pkg/version/toolchain.mk and
# Gitea installs it with `make install-trivy`, in place of the template's
# .trivy-version and scripts/install-trivy.sh; no `schedule:` (below).
#
# Owner ruling 2026-08-20 (fail-fast pipeline for iteration speed): jobs that
# are known-red with tracked issues, or that verify a slow-moving property, do
# NOT run per push -- a known-red job burning 60-90 runner-minutes per push
# produces information we already have. They run here on workflow_dispatch
# only -- the coordinator dispatches the nightly full tier (handbook sdlc §5a;
# go-quicbaas#1266), and no workflow carries a `schedule:` trigger (owner
# ruling 2026-10-11) -- and are NOT in any merge gate. When their tracked
# issues land (FIPS: this repo's fips140=only failures; Trivy: the install
# diagnosis), a job may move back to ci.yml -- that move is deliberate, not
# automatic.
#
# sdk-go-integration joined on the same terms: it is the sdk/go docker-compose
# harness that `make test-sdk-go` excludes from the gate (see the comment
# above test-sdk-go in the Makefile).
#
# fips and trivy are the jobs that were in this repo's ci.yml, moved unchanged
# apart from the fips job's `needs: [build]`, which had no meaning here.
# Reconciled against software/templates/github-actions/nightly.yml in the
# automatethethings repo (devops.md §1/§8/§9).

name: Nightly

on:
  workflow_dispatch:

env:
  GO_VERSION: '1.27.3'

jobs:
  fips:
    name: FIPS
    runs-on: ubuntu-latest
    # needs: none -- nightly runs standalone; build health is ci.yml's job.
    timeout-minutes: 30
    env:
      GOFIPS140: latest
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages (FIPS mode)
        run: go build ./...

      - name: Unit tests (FIPS mode)
        run: go test -count=1 -timeout=900s ./...

  # trivy fs -- dependency CVEs and leaked secrets in the tree (devops.md §8).
  # Scoping mirrors the `trivy` target in the Makefile; keep the two identical.
  # test/ and examples/ do not ship; bin/, build/ and data/ are local build
  # output. The skip-files entry keeps the secret scanner off the committed
  # test TLS material in pkg/server/certs.
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # nightly-template v1.5 reads the pin from .trivy-version. CUSTOMIZE:
      # go-quicbaas declares it once as TRIVY_VERSION in
      # pkg/version/toolchain.mk, beside its checksums, and `make install-trivy`
      # installs that build. Read as ONE bare token; fail on a malformed line.
      - name: Resolve pinned trivy version
        id: trivy_version
        run: |
          version=$(awk '$1 == "TRIVY_VERSION" && $2 == ":=" && NF == 3 {print $3}' pkg/version/toolchain.mk)
          if [ -z "$version" ]; then
            echo "::error::TRIVY_VERSION in pkg/version/toolchain.mk is missing or malformed"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Two paths for one gate. trivy-action's setup step cannot authenticate
      # to github.com from a Gitea runner and upload-sarif has no
      # GHES-compatible endpoint there, so the action path is guarded on the
      # server URL and Gitea gates with the trivy CLI below. Both run the same
      # fs scan at the same severity; only the SARIF upload is GitHub-only.
      # trivy-action is pinned to a full commit sha (nightly-template v1.4).
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ steps.trivy_version.outputs.version }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,examples,bin,build,data
          skip-files: pkg/server/certs/*.key
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ steps.trivy_version.outputs.version }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,examples,bin,build,data
          skip-files: pkg/server/certs/*.key
          trivyignores: .trivyignore

      # nightly-template v1.4 replaced `curl .../install.sh | sh` with a
      # pinned, checksum-verified install. CUSTOMIZE: go-quicbaas's is
      # `make install-trivy` (the same one a developer runs), which needs Go.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: github.server_url != 'https://github.com'
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Trivy (Gitea)
        if: github.server_url != 'https://github.com'
        run: |
          make install-trivy
          gobin=$(go env GOBIN)
          echo "${gobin:-$(go env GOPATH)/bin}" >> "$GITHUB_PATH"

      - name: Trivy gate (Gitea)
        if: github.server_url != 'https://github.com'
        run: |
          trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --format table \
            --skip-dirs test --skip-dirs examples --skip-dirs bin --skip-dirs build --skip-dirs data \
            --skip-files 'pkg/server/certs/*.key' --ignorefile .trivyignore .

      # Misconfiguration scan, advisory (nightly-template v1.4): on both
      # servers, same pin, exit code 0, so findings surface without gating.
      - name: Trivy misconfiguration scan (advisory, GitHub)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: ${{ steps.trivy_version.outputs.version }}
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          exit-code: 0
          format: table
          skip-dirs: test,examples,bin,build,data
          trivyignores: .trivyignore

      - name: Trivy misconfiguration scan (advisory, Gitea)
        if: github.server_url != 'https://github.com'
        run: |
          trivy fs --scanners misconfig --exit-code 0 --format table \
            --skip-dirs test --skip-dirs examples --skip-dirs bin --skip-dirs build --skip-dirs data \
            --ignorefile .trivyignore .

  # Every worker-image toolchain pin at its upstream's latest release
  # (devops.md: track the latest). The pins move by hand, so this is what
  # notices when one falls behind; it names each stale pin and its latest
  # release. A slow-moving property, so nightly rather than per push.
  worker-toolchain-currency:
    name: Worker toolchain currency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check every worker-image pin against upstream
        run: make check-worker-toolchain-currency

  # The sdk/go docker-compose harness (sdk/go/test/integration). Its compose
  # file builds the server from test/integration/Dockerfile.dev, which resolves
  # first-party modules from published tags (no sibling checkouts), so the
  # image builds on a runner. The harness is excluded from ci.yml's
  # `make test-sdk-go` (Makefile, grep -v '/test/') and runs here so it is
  # never out of sight. Moving it into ci.yml is deliberate, not automatic.
  sdk-go-integration:
    name: SDK Go integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # The harness's TestMain exits 0 when `docker info` fails, so a runner
      # without Docker would report green and run nothing. This step turns that
      # into a failure.
      - name: Require Docker and Compose
        run: |
          docker info
          docker compose version

      - name: Run the Go SDK integration harness
        run: make integration-test-sdk-go
