[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npu-embedding"
version = "1.0.0"
description = "OpenVINO-backed embedding sidecar for go-quicbaas, targeting the Intel NPU"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later OR LicenseRef-Commercial" }

# The pure layers need only numpy; the HTTP surface needs fastapi.
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
# Installed on the host that owns the NPU.
device = [
    "openvino>=2026.3",
    "optimum-intel>=1.20",
    "transformers>=4.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
npu-embedding = "npu_embedding.__main__:main"

[tool.setuptools.packages.find]
include = ["npu_embedding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No skip guards: a collection error is a failure.
addopts = "-q --strict-markers"
