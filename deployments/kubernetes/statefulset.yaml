# Three QuicBaaS nodes, each embedding one go-qrdb node, forming one Raft
# group over QUIC. One pod template, so one image tag on every node
# (kustomization.yaml pins it).
#
# Formation: the three replicas start together (podManagementPolicy:
# Parallel) and bootstrap the group from the same three-member join list, as
# test/integration/docker-compose.cluster.yml does. OrderedReady would
# deadlock: quicbaas-0 is not ready until a quorum exists, so quicbaas-1
# would never start.
#
# Failover: the replicas are spread over distinct nodes, the PDB keeps a
# quorum through voluntary disruptions, and a replaced pod reattaches its own
# PersistentVolumeClaim under its own name, so it rejoins as the same member.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quicbaas
spec:
  serviceName: quicbaas-raft
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: quicbaas
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quicbaas
        app.kubernetes.io/component: node
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: quicbaas
                  app.kubernetes.io/component: node
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: quicbaasd
          image: ghcr.io/jeremyhahn/quicbaasd
          imagePullPolicy: IfNotPresent
          # The pod's ordinal names the replica: quicbaas-0 is Raft node 1.
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              ordinal="${POD_NAME##*-}"
              peers=""
              for i in 0 1 2; do
                peers="${peers:+$peers,}$((i + 1))=quicbaas-$i.quicbaas-raft.$POD_NAMESPACE.svc.cluster.local:63000"
              done
              export QUICBAAS_RAFT_NODE_ID="$((ordinal + 1))"
              export QUICBAAS_RAFT_RAFT_ADDRESS="$POD_NAME.quicbaas-raft.$POD_NAMESPACE.svc.cluster.local:63000"
              export QUICBAAS_RAFT_LISTEN_HOST="$POD_IP"
              export QUICBAAS_RAFT_JOIN_ADDRESSES="$peers"
              export QUICBAAS_RAFT_TLS_CERT_FILE="/etc/quicbaas/raft-tls/$POD_NAME.crt"
              export QUICBAAS_RAFT_TLS_KEY_FILE="/etc/quicbaas/raft-tls/$POD_NAME.key"
              exec /usr/local/bin/quicbaasd node --config /etc/quicbaas/quicbaas.yaml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: QUICBAAS_SEAL_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: quicbaas-seal
                  key: passphrase
          ports:
            - name: rest
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: raft
              containerPort: 63000
              protocol: UDP
          # Liveness: the process serves. Readiness: the node's shards have a
          # leader, so the client Service routes only to a formed cluster.
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: rest
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: rest
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: rest
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/quicbaas/quicbaas.yaml
              subPath: quicbaas.yaml
              readOnly: true
            - name: raft-tls
              mountPath: /etc/quicbaas/raft-tls
              readOnly: true
            - name: server-tls
              mountPath: /etc/quicbaas/server-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/quicbaas
            - name: logs
              mountPath: /var/log/quicbaas
      volumes:
        - name: config
          configMap:
            name: quicbaas-config
        - name: raft-tls
          secret:
            secretName: quicbaas-raft-tls
            # Group-readable: the kubelet gives the files the pod's fsGroup.
            defaultMode: 0440
        - name: server-tls
          secret:
            secretName: quicbaas-server-tls
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
