# vLLM serving the triage model on a CUDA card.
services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: quicbaas-vllm
    restart: unless-stopped
    runtime: nvidia
    # vLLM's workers use shared memory; the 64MB default /dev/shm deadlocks them.
    ipc: host
    ports:
      - "11435:8000"
    volumes:
      - ${QUICBAAS_VLLM_MODEL_DIR:-/data/models/hf}:/models:ro
      # Persists the compiled CUDA graphs.
      - ${QUICBAAS_VLLM_CACHE_DIR:-/var/cache/quicbaas/vllm}:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model=/models/${QUICBAAS_VLLM_MODEL:-Qwen3.8-27B}
      # The agent daemon's --vllm-model must match this, not the path.
      - --served-model-name=review
      - --dtype=bfloat16
      - --max-model-len=65536
      # 0.92 leaves room for the card's display and driver allocations.
      - --gpu-memory-utilization=0.92
      - --max-num-seqs=32
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-num-batched-tokens=8192
      # Required for agentic tool calls.
      - --enable-auto-tool-choice
      # qwen3_xml, not hermes: the model's chat template emits XML tool calls.
      - --tool-call-parser=qwen3_xml
      # Splits the <think> block into reasoning_content, away from the tool parser and the verdict text.
      - --reasoning-parser=qwen3
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/models"]
      interval: 30s
      # Cold start compiles CUDA graphs.
      start_period: 600s
      retries: 3
