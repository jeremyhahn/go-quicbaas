# Grafana dashboard provisioning configuration

apiVersion: 1

providers:
  - name: 'QuicBaaS Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/quicbaas
      foldersFromFilesStructure: false
