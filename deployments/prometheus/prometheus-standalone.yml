# Prometheus configuration for QuicBaaS Standalone Mode

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'quicbaas-standalone'
    mode: 'standalone'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # QuicBaaS Standalone Node
  - job_name: 'quicbaas-standalone'
    static_configs:
      - targets: ['quicbaas-standalone:8080']
        labels:
          mode: 'standalone'
          node: 'standalone'
          instance: 'quicbaas-standalone'
    metrics_path: '/v1/metrics/'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
