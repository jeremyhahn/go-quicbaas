# QuicBaaS Single-Node Raft Configuration
# Single-node Raft cluster for development and testing
# Provides Raft consensus semantics without multi-node complexity
# Best for: Testing Raft behavior, development, CI/CD
#
# Usage:
#   quicbaasd --config configs/raft-single-node.yaml
#   docker compose -f configs/docker/docker-compose.raft-single-node.yaml up

server:
  host: "127.0.0.1"
  # Bind host for the sealed-window (pre-unseal ceremony/unseal) listeners;
  # loopback by default — set to 0.0.0.0 only when remote Shamir officers
  # must reach the sealed surface. Post-unseal listeners use host above.
  sealed_bind_host: "127.0.0.1"
  grpc:
    enabled: true
    port: 9443
  rest:
    enabled: true
    port: 8443
  quic:
    enabled: true
    port: 10443
  mcp:
    enabled: true
    port: 11443
  unix:
    enabled: true
    socket: "/var/run/quicbaas.sock"
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 30s
  max_connections: 1000
  shards: [1]

# Raft consensus configuration
raft:
  node_id: 1
  election_rtt: 10
  heartbeat_rtt: 1
  snapshot_entries: 10000
  compaction_overhead: 5000
  request_timeout: 5s
  rtt_millisecond: 200
  raft_address: "127.0.0.1:63000"
  listen_address: "127.0.0.1:63000"
  mutual_tls: false
  max_in_mem_log_size: 67108864  # 64MB
  max_send_queue_size: 1024
  max_receive_queue_size: 1024
  enable_metrics: true

# PebbleDB storage configuration
storage:
  backend: "raft"
  data_dir: "./data"
  wal_dir: "./data/wal"
  cache_size: 134217728  # 128MB
  max_open_files: 1000
  max_concurrent_reads: 100
  max_concurrent_writes: 100
  disable_wal: false
  sync_writes: true
  bytes_per_sync: 1048576  # 1MB
  mem_table_size: 67108864  # 64MB
  mem_table_stop_writes: 2
  l0_compaction_threshold: 4
  l0_stop_writes_threshold: 12
  block_size: 4096
  target_file_size: 67108864  # 64MB
  compression_type: "snappy"

# Object storage using local filesystem
object_storage:
  backends:
    primary:
      type: "local"
      description: "Local filesystem object storage"
      config:
        path: "./data/objects"

# Minimal security for development
security:
  tls_enabled: false
  api_key_enabled: false
  fips_mode: false
  authorization:
    provider: "rbac"
    rbac:
      enabled: true
      allow_anonymous: true

# Enable KMS and Secrets with dedicated shards
kms:
  enabled: true
  backend: software
  auto_generate_key: true
  raft:
    shard_id: 1000

secrets:
  enabled: true
  raft:
    shard_id: 1001

# Backup configuration
backup:
  enabled: true
  storage_backend: "primary"
  default_compression: "zstd"
  default_encryption: "none"
  work_dir: "/tmp/quicbaas-backup"
  timeout: "30m"

# Console logging for development
logging:
  level: "info"
  format: "console"
  output: "stdout"
