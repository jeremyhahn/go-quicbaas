# QuicBaaS 3-node Raft cluster; tolerates one node failure.

services:
  node1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: quicbaas-node1
    hostname: node1
    ports:
      - "8444:8443"   # REST API
      - "9444:9443"   # gRPC
    volumes:
      - node1-data:/data/quicbaas
      - ../raft-3-node/node1.yaml:/etc/quicbaas/config.yaml:ro
    command: ["quicbaasd", "--config", "/etc/quicbaas/config.yaml"]
    networks:
      - quicbaas-cluster
    healthcheck:
      test: ["CMD", "quicbaas", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      - node2
      - node3

  node2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: quicbaas-node2
    hostname: node2
    ports:
      - "8445:8443"   # REST API
      - "9445:9443"   # gRPC
    volumes:
      - node2-data:/data/quicbaas
      - ../raft-3-node/node2.yaml:/etc/quicbaas/config.yaml:ro
    command: ["quicbaasd", "--config", "/etc/quicbaas/config.yaml"]
    networks:
      - quicbaas-cluster
    healthcheck:
      test: ["CMD", "quicbaas", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  node3:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: quicbaas-node3
    hostname: node3
    ports:
      - "8446:8443"   # REST API
      - "9446:9443"   # gRPC
    volumes:
      - node3-data:/data/quicbaas
      - ../raft-3-node/node3.yaml:/etc/quicbaas/config.yaml:ro
    command: ["quicbaasd", "--config", "/etc/quicbaas/config.yaml"]
    networks:
      - quicbaas-cluster
    healthcheck:
      test: ["CMD", "quicbaas", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

networks:
  quicbaas-cluster:
    driver: bridge

volumes:
  node1-data:
    driver: local
  node2-data:
    driver: local
  node3-data:
    driver: local
