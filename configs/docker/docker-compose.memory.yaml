# QuicBaaS Memory Configuration - Docker Compose
# In-memory storage for testing and development
# Data is NOT persisted - all data is lost on container restart
#
# Usage:
#   docker compose -f configs/docker/docker-compose.memory.yaml up
#   docker compose -f configs/docker/docker-compose.memory.yaml up -d  # detached
#
# Access:
#   REST API: http://localhost:8443
#   gRPC:     localhost:9443

services:
  quicbaas:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: quicbaas:latest
    container_name: quicbaas-memory
    ports:
      - "8443:8443"   # REST API
      - "9443:9443"   # gRPC
    environment:
      - QUICBAAS_SERVER_HOST=0.0.0.0
      # Sealed-window (pre-unseal ceremony/unseal) listeners default to loopback;
      # explicit opt-in so remote Shamir officers can reach the sealed surface.
      - QUICBAAS_SERVER_SEALED_BIND_HOST=0.0.0.0
      - QUICBAAS_STORAGE_BACKEND=memory
      - QUICBAAS_SERVER_GRPC_ENABLED=true
      - QUICBAAS_SERVER_GRPC_PORT=9443
      - QUICBAAS_SERVER_REST_ENABLED=true
      - QUICBAAS_SERVER_REST_PORT=8443
      - QUICBAAS_LOGGING_LEVEL=debug
      - QUICBAAS_LOGGING_FORMAT=console
    healthcheck:
      test: ["CMD", "quicbaas", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
