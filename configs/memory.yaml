# QuicBaaS Memory Configuration
# In-memory storage for testing and development
# Data is NOT persisted - all data is lost on restart
#
# Usage:
#   quicbaasd --config configs/memory.yaml
#   docker compose -f configs/docker/docker-compose.memory.yaml up

server:
  host: "127.0.0.1"
  # Bind host for the sealed-window (pre-unseal ceremony/unseal) listeners;
  # loopback by default — set to 0.0.0.0 only when remote Shamir officers
  # must reach the sealed surface. Post-unseal listeners use host above.
  sealed_bind_host: "127.0.0.1"
  grpc:
    enabled: true
    port: 9443
  rest:
    enabled: true
    port: 8443
  quic:
    enabled: true
    port: 10443
  mcp:
    enabled: true
    port: 11443
  unix:
    enabled: true
    socket: "/var/run/quicbaas.sock"
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 30s
  max_connections: 1000

# In-memory storage (no persistence)
storage:
  backend: "memory"
  data_dir: ""  # Empty = in-memory
  cache_size: 134217728  # 128MB

# Object storage using memory backend
object_storage:
  backends:
    primary:
      type: "memory"
      description: "In-memory object storage"

# Minimal security for development
security:
  tls_enabled: false
  api_key_enabled: false
  fips_mode: false
  authorization:
    provider: "rbac"
    rbac:
      enabled: true
      allow_anonymous: true

# Enable KMS and Secrets with memory backend
kms:
  enabled: true
  backend: software
  auto_generate_key: true

secrets:
  enabled: true

# Console logging for development
logging:
  level: "debug"
  format: "console"
  output: "stdout"

# Trust resolver configuration (outbound TLS trust strategy chain).
# Remove tofu from strategies once DANE is published for this deployment.
# tofu must NEVER be an implicit fallback — only explicit listing enables it.
trust:
  scopes:
    default:
      strategies: [dane, noise, spki, tofu]
      server-url: ""
      per-method-timeout: 5s
