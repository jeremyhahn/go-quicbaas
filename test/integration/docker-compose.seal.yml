# QuicBaaS cloud-seal integration environment.

services:
  # AWS KMS emulator for the awskms seal strategy.
  floci:
    image: floci/floci:2.2.0@sha256:e97cd0c1dc2aa14e7697fb5ef5018404c4d6345169dbd276315f0bed2c7b0520
    hostname: floci
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    networks:
      - seal-test-network
    healthcheck:
      # Check KMS reports "running", not just an open port.
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/4566 || exit 1
          printf 'GET /_floci/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          resp=
          while IFS= read -r -u 3 line || [ -n "$$line" ]; do resp+="$$line"; done
          [[ "$$resp" == HTTP/1.?" 200"* ]] || exit 1
          for svc in "$$@"; do [[ "$$resp" == *"\"$$svc\":\"running\""* ]] || exit 1; done
        - floci-health
        - kms
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    restart: on-failure

  # HashiCorp Vault dev server (Transit engine) for the vault seal strategy.
  vault:
    image: hashicorp/vault:latest
    hostname: vault
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    command: ["vault", "server", "-dev"]
    networks:
      - seal-test-network
    healthcheck:
      # `vault status` exits 0 once initialized and unsealed.
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: on-failure

  # Cloud-seal integration test runner.
  seal-test:
    build:
      context: ../..
      additional_contexts:
        workspace: ../../..
      dockerfile: test/integration/Dockerfile.seal
      args:
        # The seal factories + the seal tests are both gated on these tags.
        SEAL_TAGS: "awskms vault"
        BUILD_TAGS: "${SEAL_BUILD_TAGS:-local quic raft rest iam mcp hashicorpmetrics codec_json codec_yaml awskms vault}"
      secrets:
        - gomodauth
    hostname: seal-test
    user: "0:0"
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      - QUICBAAS_TEST_MODE=integration
      - INTEGRATION_TEST=1
      - CGO_ENABLED=0
      - QUICBAASD_BINARY=/usr/local/bin/quicbaasd
      - QUICBAAS_BINARY=/usr/local/bin/quicbaas
      # Floci KMS endpoint + dummy creds (awskms_test.go).
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      # Vault dev server (vault_test.go).
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    networks:
      - seal-test-network
    depends_on:
      floci:
        condition: service_healthy
      vault:
        condition: service_healthy
    working_dir: /workspace/go-quicbaas
    command: >
      bash -c "
        set -o pipefail;
        rm -f go.sum sdk/go/go.sum;
        echo 'Cloud seal integration tests — tags: integration awskms vault';
        go test -v -p 1 -tags 'integration awskms vault' -timeout 20m ./test/integration/seal/...
      "


  # Per-tenant barrier lane (make integration-test-tenantbarrier): a seal-enabled single-node daemon, since the shared cluster has no seal section.

  # Seal-enabled single-node quicbaasd under test.
  tenantbarrier-node:
    build:
      context: ../..
      additional_contexts:
        workspace: ../../..
      dockerfile: test/integration/Dockerfile.node
      args:
        BUILD_TAGS: "${BUILD_TAGS:-local quic raft rest rag timeseries vector qrdb_vector iam mcp hashicorpmetrics codec_json codec_yaml codec_toml codec_msgpack codec_bson codec_cbor codec_protobuf gms_pure_go awss3 gcpstorage azureblob minio}"
      secrets:
        - gomodauth
    hostname: test-node1
    environment:
      - CGO_ENABLED=0
      - QUICBAAS_LOGGING_LEVEL=debug
      - QUICBAAS_LOGGING_FORMAT=json
      - QUICBAAS_STORAGE_DATA_DIR=/data
      - QUICBAAS_SERVER_HOST=0.0.0.0
      # Sealed-window listeners default to loopback; this opts in so remote Shamir officers can reach them.
      - QUICBAAS_SERVER_SEALED_BIND_HOST=0.0.0.0
      # System barrier: passphrase strategy, auto-initialised and auto-unsealed at startup.
      - QUICBAAS_SEAL_PASSPHRASE=tenantbarrier-integration-test-passphrase
    volumes:
      - tenantbarrier-data:/data
      - ./quicbaas-tenantbarrier.yaml:/etc/quicbaas/quicbaas.yaml:ro
      - ./certs:/etc/quicbaas/certs:ro
    # Standalone mode, no Raft.
    command: ["/usr/local/bin/quicbaasd", "start", "--config", "/etc/quicbaas/quicbaas.yaml", "--data-dir", "/data"]
    networks:
      - seal-test-network
    healthcheck:
      # Readiness, including the seal auto-unseal, so the runner never races the barrier.
      test: ["CMD", "curl", "-ksf", "https://localhost:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: on-failure
    stop_grace_period: 30s

  # Per-tenant barrier test runner (test/integration/tenantbarrier).
  tenantbarrier-test:
    build:
      context: ../..
      additional_contexts:
        workspace: ../../..
      dockerfile: test/integration/Dockerfile
      args:
        BUILD_TAGS: "${BUILD_TAGS:-local quic raft rest rag timeseries vector qrdb_vector iam mcp hashicorpmetrics codec_json codec_yaml codec_toml codec_msgpack codec_bson codec_cbor codec_protobuf gms_pure_go awss3 gcpstorage azureblob minio}"
      secrets:
        - gomodauth
    hostname: tenantbarrier-test
    user: "0:0"
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      - QUICBAAS_TEST_MODE=integration
      - INTEGRATION_TEST=1
      - CGO_ENABLED=0
      # The single seal-enabled node; NODE2 and NODE3 unset make a one-node deployment.
      - QUICBAAS_NODE1_URL=https://test-node1:8080
      - QUICBAAS_NODE1_GRPC=test-node1:50051
    volumes:
      # PIV and mTLS fixture bundle, with the fixture CA under ca-keystore/.
      - ./certs:/etc/quicbaas/certs
    working_dir: /workspace/go-quicbaas
    networks:
      - seal-test-network
    depends_on:
      tenantbarrier-node:
        condition: service_healthy
    command: >
      bash -c "
        set -o pipefail;
        rm -f go.sum sdk/go/go.sum;
        TAGS=$$(echo \"integration $$TEST_BUILD_TAGS\" | tr ' ' '\\n' | grep -vx -e rag -e gpu | tr '\\n' ' ' | sed 's/  */ /g; s/ $$//');
        echo \"Per-tenant barrier integration tests — tags: $$TAGS\";
        go test -v -p 1 -tags \"$$TAGS\" -timeout 30m ./test/integration/tenantbarrier/...
      "

networks:
  seal-test-network:
    driver: bridge

volumes:
  tenantbarrier-data:

# Module fetch credentials for the image builds.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/tmp/quicbaas-gomodauth.env}
