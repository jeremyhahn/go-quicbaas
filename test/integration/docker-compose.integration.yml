# QuicBaaS Integration Test Environment
# Complete isolated environment for running integration tests
# Includes 3-node cluster + optional 4th/5th nodes and test runner with proper health checks
#
# All images are based on consistent tooling from the devcontainer setup.
# The node images use a lightweight runtime, while the test runner includes
# full Go tooling for test execution.

services:
  # Ollama Embedding Service for vector/embedding tests
  ollama:
    image: ollama/ollama:latest
    hostname: ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - integration-test-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: on-failure

  # Ollama model setup - pulls all-minilm model
  ollama-setup:
    image: curlimages/curl:latest
    hostname: ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - integration-test-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'Pulling all-minilm embedding model...'
        curl -X POST http://ollama:11434/api/pull -d '{"name": "all-minilm"}' --max-time 300
        echo 'Pulling tinyllama model...'
        curl -X POST http://ollama:11434/api/pull -d '{"name": "tinyllama"}' --max-time 300
        echo 'Verifying models are available...'
        curl -s http://ollama:11434/api/tags | grep -q 'all-minilm' && echo 'all-minilm ready!' || echo 'all-minilm pull may still be in progress'
        curl -s http://ollama:11434/api/tags | grep -q 'tinyllama' && echo 'tinyllama ready!' || echo 'tinyllama pull may still be in progress'
    restart: "no"

  # Floci - AWS services emulator (KMS, S3). MIT-licensed, no auth token.
  # Drop-in replacement for LocalStack on the same port 4566.
  floci:
    image: floci/floci:latest
    hostname: floci
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      # Floci runs Docker-backed services (e.g. Lambda) in real containers.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - integration-test-network
    healthcheck:
      # Assert the two services this suite actually uses report "running",
      # not merely that the port is open. A bare TCP/200 check would go green
      # before the service handlers are wired and cause flaky test failures.
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:4566/_floci/health -o /tmp/floci-health.json && grep -q '\"s3\":\"running\"' /tmp/floci-health.json && grep -q '\"kms\":\"running\"' /tmp/floci-health.json",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: on-failure

  # Fake GCS Server - Google Cloud Storage emulator
  fake-gcs-server:
    image: fsouza/fake-gcs-server:latest
    hostname: fake-gcs-server
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://fake-gcs-server:4443"]
    networks:
      - integration-test-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: on-failure

  # Azurite - Azure Storage emulator (Blob, Queue, Table)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    hostname: azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose"
    networks:
      - integration-test-network
    healthcheck:
      # Use node to check if the blob service is listening (node is available in azurite image)
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:10000/', (r) => process.exit(r.statusCode === 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: on-failure

  # MinIO - S3-compatible object storage
  # Per-run mTLS/PIV material is generated by a service INSIDE the stack, into a
  # named volume, and never bind-mounted from the caller. A bind source is a
  # path in the host daemon's filesystem; this compose is driven from a job
  # container over the host's docker socket, so the workspace path it would hand
  # over does not exist there and Docker silently creates an empty directory at
  # it. Named volumes are daemon-side objects, so this works identically on a
  # runner and on a laptop.
  #
  # It runs the test-runner image, which already carries the source, so the
  # fixture command is available without a second build definition diverging
  # from it.
  #
  # Every certificate is issued by QuicBaaS's OWN certificate authority
  # (test/integration/certfixture -> pkg/server.NewCAService), not by a
  # lookalike: go-quicbaas#943 replaced the 444-line parallel CA that used to
  # live here. The CA's key and certificate stores persist in the
  # ca-keystore/ subdirectory of the volume, because the suite also issues
  # per-tenant client certificates at runtime and they must chain to the same
  # trust anchor the nodes were started with.
  certs-init:
    build:
      context: ../..
      dockerfile: test/integration/Dockerfile
      args:
        BUILD_TAGS: "${BUILD_TAGS:-local quic raft rest rag timeseries vector qrdb_vector iam mcp hashicorpmetrics codec_json codec_yaml codec_toml codec_msgpack codec_bson codec_cbor codec_protobuf gms_pure_go awss3 gcpstorage azureblob minio}"
      secrets:
        - gomodauth
    working_dir: /workspace/go-quicbaas
    command: ["go", "run", "./test/integration/certfixture/cmd", "/etc/quicbaas/certs"]
    volumes:
      - quicbaas-certs:/etc/quicbaas/certs
    networks:
      - integration-test-network

  minio:
    # Docker Hub's minio/minio is gone and quay.io/minio/minio needs auth.
    # Chainguard's rolling free-tier image is the source that resolves; the
    # -dev variant carries busybox for the healthcheck. Pinned by digest
    # (multi-arch index of latest-dev as of 2026-10-11); bump deliberately.
    image: cgr.dev/chainguard/minio:latest-dev@sha256:88df627ed94cddb2a0417f6248e6024cb614128fd213e1097c283b31f4170b73
    user: "0"
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - integration-test-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: on-failure

  # Integration Test Runner
  integration-test:
    build:
      context: ../..
      dockerfile: test/integration/Dockerfile
      args:
        BUILD_TAGS: "${BUILD_TAGS:-local quic raft rest rag timeseries vector qrdb_vector iam mcp hashicorpmetrics codec_json codec_yaml codec_toml codec_msgpack codec_bson codec_cbor codec_protobuf gms_pure_go awss3 gcpstorage azureblob minio}"
      secrets:
        - gomodauth
    hostname: integration-test
    user: "0:0"
    # Increase memory limit to handle test compilation
    mem_limit: 6g
    memswap_limit: 6g
    # DNS options to improve resolver reliability under load
    dns_opt:
      - "attempts:5"
      - "timeout:2"
      - "ndots:0"
    # Add capabilities required for multicast networking
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      # Test configuration
      - QUICBAAS_TEST_MODE=integration
      # Opt into the env-gated init matrix suite (test/integration/init).
      # The suite execs the daemon built into this image at the path below.
      - INTEGRATION_TEST=1
      - QUICBAASD_BINARY=/usr/local/bin/quicbaasd
      - QUICBAAS_LOG_LEVEL=debug
      - QUICBAAS_LOG_FORMAT=text
      - CGO_ENABLED=0

      # Cluster configuration
      - QUICBAAS_NODES=test-node1:8080,test-node2:8080,test-node3:8080
      - QUICBAAS_NODE1_URL=https://test-node1:8080
      - QUICBAAS_NODE2_URL=https://test-node2:8080
      - QUICBAAS_NODE3_URL=https://test-node3:8080
      - QUICBAAS_NODE1_GRPC=test-node1:50051
      - QUICBAAS_NODE2_GRPC=test-node2:50051
      - QUICBAAS_NODE3_GRPC=test-node3:50051
      - QUICBAAS_NODE1_QUIC=test-node1:4433
      - QUICBAAS_NODE2_QUIC=test-node2:4433
      - QUICBAAS_NODE3_QUIC=test-node3:4433
      - QUICBAAS_NODE1_MCP=https://test-node1:8888/mcp
      - QUICBAAS_NODE2_MCP=https://test-node2:8888/mcp
      - QUICBAAS_NODE3_MCP=https://test-node3:8888/mcp
      - QUICBAAS_MCP_ENDPOINT=https://test-node1:8888/mcp
      - QUICBAAS_NODE1_UNIX=/var/run/quicbaas/node1.sock
      - QUICBAAS_NODE2_UNIX=/var/run/quicbaas/node2.sock
      - QUICBAAS_NODE3_UNIX=/var/run/quicbaas/node3.sock
      - QUICBAAS_UNIX_ENABLED=true
      - QUICBAAS_UNIX_SOCKET=/var/run/quicbaas/node1.sock
      - QUICBAAS_QUIC_ENABLED=true
      - QUICBAAS_QUIC_ADDRESS=test-node1:4433
      - QUICBAAS_MCP_ENABLED=true
      - QUICBAAS_BACKUP_ENABLED=true
      - QUICBAAS_OBJECTSTORAGE_ENABLED=true
      - QUICBAAS_OLLAMA_ENABLED=${QUICBAAS_OLLAMA_ENABLED:-true}
      - QUICBAAS_MESSAGING_ENABLED=true
      - QUICBAAS_ORCHESTRATION_ENABLED=true

      # Test timeouts
      - QUICBAAS_HEALTH_TIMEOUT=180
      - QUICBAAS_CHECK_INTERVAL=2
      - QUICBAAS_TEST_TIMEOUT=30m

      # Ollama embedding service (for vector/embedding tests)
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=tinyllama
      - QUICBAAS_URL=https://test-node1:8080

      # Cloud storage emulator endpoints
      - AWS_ENDPOINT_URL=http://floci:4566
      - S3_ENDPOINT=http://floci:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - GCS_ENDPOINT=http://fake-gcs-server:4443
      - STORAGE_EMULATOR_HOST=http://fake-gcs-server:4443
      - AZURITE_ENDPOINT=http://azurite:10000
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      # Project source is baked into the image at /workspace/go-quicbaas (no host bind needed)
      - integration-test-results:/test-results
      # Mount Docker socket for container management in tests
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared Unix socket directory for gRPC-over-Unix-socket testing
      - quicbaas-sockets:/var/run/quicbaas
      # mTLS / PIV cert bundle so helpers.AuthPIV can present the admin client
      # cert against the cluster's /api/v1/auth/login/piv endpoint.
      #
      # Writable, unlike the node mounts: the suite issues per-tenant client
      # certificates through the fixture CA at runtime (helpers.AuthTenantAdmin,
      # the login suite's software PIV credentials), and the CA records every
      # certificate it signs in its certificate store under ca-keystore/. A
      # read-only mount would fail the issuance, not the store write.
      - quicbaas-certs:/etc/quicbaas/certs
    working_dir: /workspace/go-quicbaas
    networks:
      - integration-test-network
    depends_on:
      certs-init:
        condition: service_completed_successfully
      test-node1:
        condition: service_healthy
      test-node2:
        condition: service_healthy
      test-node3:
        condition: service_healthy
      floci:
        condition: service_healthy
      fake-gcs-server:
        condition: service_healthy
      azurite:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      bash -c "
        set -o pipefail;
        echo 'Waiting for cluster to be fully operational...' &&
        /usr/local/bin/health_check.sh &&
        echo 'Cluster is ready.' &&
        echo '' &&
        echo 'Using pre-built CLI binary: /workspace/go-quicbaas/bin/quicbaas' &&
        ls -la /workspace/go-quicbaas/bin/quicbaas &&
        echo '' &&
        ALL_PKG_ROOT='github.com/jeremyhahn/go-quicbaas/test/integration/...' &&
        OLLAMA_PKGS_RE='/(agent|orchestration|orchestration_gpu|rag|embedding)$$' &&
        SEAL_LANE_PKGS_RE='/(tenantbarrier)$$' &&
        BASE_TAGS=$$(echo \"integration $$TEST_BUILD_TAGS\" | tr ' ' '\\n' | grep -vx -e rag -e gpu | tr '\\n' ' ' | sed 's/  */ /g; s/ $$//') &&
        if [ \"$$QUICBAAS_TEST_GPU\" = 'true' ]; then RAG_TAGS='integration rag gpu'; else RAG_TAGS='integration rag'; fi &&
        echo \"Non-ollama test tags: $$BASE_TAGS\" &&
        echo \"Ollama enabled: $${QUICBAAS_TEST_OLLAMA:-0}  |  Ollama test tags: $$RAG_TAGS  |  Ollama URL: $${OLLAMA_URL:-unset}\" &&
        echo 'Test configuration:' &&
        echo '  - Sequential execution (-p 1) to prevent connection storms' &&
        echo '  - Total timeout: 60 minutes' &&
        echo '' &&
        OVERALL_EXIT=0 &&
        if [ -n \"$$QUICBAAS_TEST_FILTER\" ]; then
          echo \"Running filtered integration tests: $$QUICBAAS_TEST_FILTER\" &&
          echo '' &&
          FILTER_TAGS=\"integration $$TEST_BUILD_TAGS\" &&
          if [ \"$$QUICBAAS_TEST_GPU\" = 'true' ]; then FILTER_TAGS=\"$$FILTER_TAGS gpu\"; fi &&
          go test -v -p 1 -tags \"$$FILTER_TAGS\" -timeout 60m $$QUICBAAS_TEST_FILTER 2>&1 | tee /test-results/integration-test.log;
          OVERALL_EXIT=$${PIPESTATUS[0]};
        else
          echo 'Phase 1: non-ollama integration packages...' &&
          echo '' &&
          BASE_PKGS=$$(go list -tags \"$$BASE_TAGS\" $$ALL_PKG_ROOT | grep -vE \"$$OLLAMA_PKGS_RE\" | grep -vE \"$$SEAL_LANE_PKGS_RE\") &&
          go test -v -p 1 -tags \"$$BASE_TAGS\" -timeout 60m $$BASE_PKGS 2>&1 | tee /test-results/integration-test.log;
          OVERALL_EXIT=$${PIPESTATUS[0]};
          if [ \"$$QUICBAAS_TEST_OLLAMA\" = '1' ] || [ \"$$QUICBAAS_TEST_OLLAMA\" = 'true' ]; then
            echo '' &&
            echo 'Phase 2: ollama-dependent packages (serialized, one inference at a time)...' &&
            echo '' &&
            OLLAMA_PKGS=$$(go list -tags \"$$RAG_TAGS\" $$ALL_PKG_ROOT | grep -E '/(agent|orchestration|orchestration_gpu|rag)$$') &&
            go test -v -p 1 -tags \"$$RAG_TAGS\" -timeout 60m $$OLLAMA_PKGS 2>&1 | tee -a /test-results/integration-test.log;
            OLLAMA_EXIT=$${PIPESTATUS[0]};
            if [ $$OLLAMA_EXIT -ne 0 ]; then OVERALL_EXIT=$$OLLAMA_EXIT; fi;
            echo '' &&
            echo 'Phase 2b: cli orchestrator inference (ollama) subset...' &&
            echo '' &&
            go test -v -p 1 -tags \"$$RAG_TAGS\" -timeout 60m -run 'TestOrchestratorInference_(Stateless_Ollama|StreamMode|TenantIsolation)$$' github.com/jeremyhahn/go-quicbaas/test/integration/cli/... 2>&1 | tee -a /test-results/integration-test.log;
            CLI_EXIT=$${PIPESTATUS[0]};
            if [ $$CLI_EXIT -ne 0 ]; then OVERALL_EXIT=$$CLI_EXIT; fi;
          else
            echo '' &&
            echo 'Ollama disabled — skipping ollama-dependent packages (agent, orchestration, rag, embedding, cli inference subset).';
          fi;
        fi;
        TEST_EXIT=$$OVERALL_EXIT;
        if [ $$TEST_EXIT -eq 0 ]; then
          echo '';
          echo '========================================';
          echo 'Integration tests completed successfully';
          echo '========================================';
        else
          echo '';
          echo '========================================';
          echo 'Integration tests FAILED with exit code' $$TEST_EXIT;
          echo '========================================';
        fi;
        exit $$TEST_EXIT
      "

  # Test Node 1 - Primary node
  test-node1:
    build:
      context: ../..
      dockerfile: test/integration/Dockerfile.node
      args:
        BUILD_TAGS: "${BUILD_TAGS:-local quic raft rest rag timeseries vector qrdb_vector iam mcp hashicorpmetrics codec_json codec_yaml codec_toml codec_msgpack codec_bson codec_cbor codec_protobuf gms_pure_go awss3 gcpstorage azureblob minio}"
        COVER: "${COVER:-}"
      secrets:
        - gomodauth
    hostname: test-node1
    # Add capabilities required for multicast networking
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - CGO_ENABLED=0
      - QUICBAAS_RAFT_NODE_ID=1
      - QUICBAAS_RAFT_DEPLOYMENT_ID=1
      - GOCOVERDIR=${QUICBAAS_NODE_GOCOVERDIR:-}
      - QUICBAAS_RAFT_RAFT_ADDRESS=test-node1:63001
      - QUICBAAS_RAFT_MUTUAL_TLS=true
      - QUICBAAS_RAFT_TLS_CA_FILE=/etc/quicbaas/certs/ca.crt
      - QUICBAAS_RAFT_TLS_CERT_FILE=/etc/quicbaas/certs/node1.crt
      - QUICBAAS_SECURITY_TLS_CERT_FILE=/etc/quicbaas/certs/node1.crt
      - QUICBAAS_SECURITY_TLS_KEY_FILE=/etc/quicbaas/certs/node1.key
      - QUICBAAS_SECURITY_TLS_CA_FILE=/etc/quicbaas/certs/ca.crt
      - QUICBAAS_RAFT_TLS_KEY_FILE=/etc/quicbaas/certs/node1.key
      - QUICBAAS_RAFT_JOIN_ADDRESSES=1=test-node1:63001,2=test-node2:63002,3=test-node3:63003
      - QUICBAAS_LOGGING_LEVEL=info
      - QUICBAAS_LOGGING_FORMAT=json
      - QUICBAAS_STORAGE_DATA_DIR=/data
      - QUICBAAS_STORAGE_WAL_DIR=/data/wal
      - QUICBAAS_SERVER_HOST=0.0.0.0
      # Sealed-window (pre-unseal ceremony/unseal) listeners default to loopback;
      # explicit opt-in so remote Shamir officers can reach the sealed surface.
      - QUICBAAS_SERVER_SEALED_BIND_HOST=0.0.0.0
      - QUICBAAS_SERVER_REST_PORT=8080
      - QUICBAAS_SERVER_GRPC_PORT=50051
      - QUICBAAS_SERVER_QUIC_PORT=4433
      - QUICBAAS_SERVER_GRPC_ENABLED=true
      - QUICBAAS_SERVER_REST_ENABLED=true
      - QUICBAAS_SERVER_QUIC_ENABLED=true
      - QUICBAAS_SERVER_MCP_ENABLED=true
      - QUICBAAS_SERVER_MCP_PORT=8888
      - QUICBAAS_SERVER_UNIX_SOCKET=/var/run/quicbaas/node1.sock
      - QUICBAAS_METRICS_PORT=9090
      - QUICBAAS_ENABLE_DEBUG_ROUTES=1
      - QUICBAAS_SERVER_EXPOSE_SHARD_HEADER=1
      # TLS enabled with auto-generated CA certs for gRPC/QUIC
      - QUICBAAS_SECURITY_TLS_ENABLED=true
      # Enable KMS for secrets tests
      - QUICBAAS_KMS_ENABLED=true
      - QUICBAAS_KMS_BACKEND=software
      # Enable Secrets engine
      - QUICBAAS_SECRETS_ENABLED=true
      # Enable Vector service
      - QUICBAAS_VECTOR_ENABLED=true
      # Enable Scheduler service
      - QUICBAAS_ENABLE_SCHEDULER=true
      # Enable Orchestration service
      - QUICBAAS_ORCHESTRATION_ENABLED=true
      # Enable password authentication for auth integration tests
      - QUICBAAS_AUTH_ENABLED=true
      - QUICBAAS_AUTH_BOOTSTRAP_ADMIN_PIV_CERT_PATH=/etc/quicbaas/certs/admin.crt
      - QUICBAAS_IAM_PIV_LOGIN_ENABLED=true
      - QUICBAAS_IAM_PIV_LOGIN_CA_FILE=/etc/quicbaas/certs/ca.crt
      # Fixtures use ordinary PKI client certificates, not smartcards, so no
      # slot attestation exists to verify. The token then records
      # attest_level=software and omits the hardware-attested ACR. Never set
      # this in a deployment; configure attestation_ca_file instead.
      - QUICBAAS_IAM_PIV_LOGIN_ALLOW_UNATTESTED=true
      - QUICBAAS_AUTH_JWT_SECRET=integration-test-secret-key-at-least-32-characters-long
      - QUICBAAS_AUTH_BOOTSTRAP_ADMIN=true
      # Enable Backup service
      - QUICBAAS_BACKUP_ENABLED=true
      # Enable Ollama/RAG service
      - QUICBAAS_OLLAMA_BASE_URL=${QUICBAAS_OLLAMA_BASE_URL:-http://ollama:11434}
      - QUICBAAS_OLLAMA_ENABLED=${QUICBAAS_OLLAMA_ENABLED:-true}
      - QUICBAAS_SERVER_EMBEDDED_AGENT_OLLAMA_URL=${QUICBAAS_SERVER_EMBEDDED_AGENT_OLLAMA_URL:-http://ollama:11434}
      - QUICBAAS_OLLAMA_DEFAULT_EMBEDDING_MODEL=all-minilm
      # Enable Object Storage service
      - QUICBAAS_OBJECTSTORAGE_ENABLED=true
      # Cloud storage emulator endpoints
      - AWS_ENDPOINT_URL=http://floci:4566
      - S3_ENDPOINT=http://floci:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - GCS_ENDPOINT=http://fake-gcs-server:4443
      - STORAGE_EMULATOR_HOST=http://fake-gcs-server:4443
      - AZURITE_ENDPOINT=http://azurite:10000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - test-data-node1:/data
      - ${QUICBAAS_COVDATA_DIR_NODE1:-/tmp/quicbaas-covdata-disabled-node1}:/covdata
      - test-logs-node1:/var/log/quicbaas
      - quicbaas-sockets:/var/run/quicbaas
      - quicbaas-certs:/etc/quicbaas/certs:ro
    expose:
      - "4433/udp"         # QUIC for container-to-container
      - "8888"             # MCP for container-to-container
    ports:
      - "8080"       # REST API (host:container)
      - "50051"      # gRPC
      - "4433/udp"   # QUIC
      - "8888"       # MCP
    command: ["/usr/local/bin/quicbaasd", "node", "--config", "/etc/quicbaas/quicbaas.yaml"]
    networks:
      integration-test-network:
        aliases:
          - node1
    depends_on:
      certs-init:
        condition: service_completed_successfully
      floci:
        condition: service_healthy
      fake-gcs-server:
        condition: service_healthy
      azurite:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-ksf", "https://localhost:8080/api/v1/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: on-failure
    stop_grace_period: 45s

  # Test Node 2
  test-node2:
    build:
      context: ../..
      dockerfile: test/integration/Dockerfile.node
      args:
        BUILD_TAGS: "${BUILD_TAGS:-local quic raft rest rag timeseries vector qrdb_vector iam mcp hashicorpmetrics codec_json codec_yaml codec_toml codec_msgpack codec_bson codec_cbor codec_protobuf gms_pure_go awss3 gcpstorage azureblob minio}"
        COVER: "${COVER:-}"
      secrets:
        - gomodauth
    hostname: test-node2
    # Add capabilities required for multicast networking
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
