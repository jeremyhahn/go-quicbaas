      - QUICBAAS_OLLAMA_ENABLED=${QUICBAAS_OLLAMA_ENABLED:-true}
      - QUICBAAS_SERVER_EMBEDDED_AGENT_OLLAMA_URL=${QUICBAAS_SERVER_EMBEDDED_AGENT_OLLAMA_URL:-http://ollama:11434}
      - QUICBAAS_OLLAMA_DEFAULT_EMBEDDING_MODEL=all-minilm
      # Enable Object Storage service
      - QUICBAAS_OBJECTSTORAGE_ENABLED=true
      # Cloud storage emulator endpoints
      - AWS_ENDPOINT_URL=http://floci:4566
      - S3_ENDPOINT=http://floci:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - GCS_ENDPOINT=http://fake-gcs-server:4443
      - STORAGE_EMULATOR_HOST=http://fake-gcs-server:4443
      - AZURITE_ENDPOINT=http://azurite:10000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - test-data-node5:/data
      - ${QUICBAAS_COVDATA_DIR_NODE5:-/tmp/quicbaas-covdata-disabled-node5}:/covdata
      - test-logs-node5:/var/log/quicbaas
      - quicbaas-sockets:/var/run/quicbaas
      - quicbaas-certs:/etc/quicbaas/certs:ro
    expose:
      - "8888"             # MCP for container-to-container
    ports:
      - "4433/udp"
      - "8888"       # MCP
    command: ["/usr/local/bin/quicbaasd", "node", "--config", "/etc/quicbaas/quicbaas.yaml"]
    depends_on:
      certs-init:
        condition: service_completed_successfully
    networks:
      integration-test-network:
        aliases:
          - node5
    healthcheck:
      test: ["CMD", "curl", "-ksf", "https://localhost:8080/api/v1/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: on-failure
    stop_grace_period: 45s

networks:
  integration-test-network:
    driver: bridge
    # Enable multicast support via driver options while letting Docker allocate
    # a non-overlapping subnet for each per-run project.
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.enable_icc: "true"

volumes:
  # Per-run mTLS/PIV material, produced by certs-init inside the stack.
  quicbaas-certs:
    driver: local

  # Data volumes for cluster nodes
  test-data-node1:
    driver: local
  test-data-node2:
    driver: local
  test-data-node3:
    driver: local
  test-data-node4:
    driver: local
  test-data-node5:
    driver: local

  # Log volumes
  test-logs-node1:
    driver: local
  test-logs-node2:
    driver: local
  test-logs-node3:
    driver: local
  test-logs-node4:
    driver: local
  test-logs-node5:
    driver: local

  # Test results volume
  integration-test-results:
    driver: local

  # Shared Unix socket directory
  quicbaas-sockets:
    driver: local

  # Ollama model storage
  ollama-data:
    driver: local

  # MinIO data storage
  minio-data:
    driver: local

# Gitea module-fetch credentials for the image builds, as a BuildKit secret
# rather than an env var or build arg (dependency-resolution.md §6). The file
# is staged by `make stage-gomodauth` -- from the runner's environment, or a
# Gitea read token on any other host -- before the build and emptied after it
# (docs/testing/private-modules.md). When it is empty the builds fall back to
# the public proxy, which is what happens on GitHub.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/tmp/quicbaas-gomodauth.env}
