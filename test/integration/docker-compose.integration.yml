networks:
  integration-test-network:
    driver: bridge
    # Enable multicast support via driver options
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.enable_icc: "true"
    # Use a predictable subnet to ensure multicast routing works
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  # Data volumes for cluster nodes
  test-data-node1:
    driver: local
  test-data-node2:
    driver: local
  test-data-node3:
    driver: local
  test-data-node4:
    driver: local
  test-data-node5:
    driver: local

  # Log volumes
  test-logs-node1:
    driver: local
  test-logs-node2:
    driver: local
  test-logs-node3:
    driver: local
  test-logs-node4:
    driver: local
  test-logs-node5:
    driver: local

  # Test results volume
  integration-test-results:
    driver: local

  # Shared Unix socket directory
  quicbaas-sockets:
    driver: local

  # Ollama model storage
  ollama-data:
    driver: local

  # MinIO data storage
  minio-data:
    driver: local
