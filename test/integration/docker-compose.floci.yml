version: '3.8'

services:
  # Floci - AWS services emulator (KMS, S3, etc.). MIT-licensed, no auth token.
  floci:
    image: floci/floci:latest
    container_name: quicbaas-floci
    ports:
      - "4566:4566"            # Floci gateway (all services on one port)
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      # Floci runs Docker-backed services (e.g. Lambda) in real containers.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - quicbaas-test
    healthcheck:
      # Assert the services actually report "running" instead of just probing
      # the port, so warm-up never masquerades as readiness.
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:4566/_floci/health -o /tmp/floci-health.json && grep -q '\"s3\":\"running\"' /tmp/floci-health.json && grep -q '\"kms\":\"running\"' /tmp/floci-health.json",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Fake GCS Server - Google Cloud Storage emulator
  fake-gcs-server:
    image: fsouza/fake-gcs-server:latest
    container_name: quicbaas-fake-gcs
    ports:
      - "4443:4443"
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://localhost:4443"]
    networks:
      - quicbaas-test
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Azurite - Azure Storage emulator (Blob, Queue, Table)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: quicbaas-azurite
    ports:
      - "10000:10000"  # Blob service
      - "10001:10001"  # Queue service
      - "10002:10002"  # Table service
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose"
    networks:
      - quicbaas-test
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10000"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SoftHSM - PKCS#11 HSM emulator
  softhsm:
    build:
      context: ../..
      dockerfile: test/integration/docker/softhsm/Dockerfile
    container_name: quicbaas-softhsm
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    networks:
      - quicbaas-test
    command: ["tail", "-f", "/dev/null"]  # Keep container running

networks:
  quicbaas-test:
    name: quicbaas-test
    driver: bridge

volumes:
  softhsm-tokens:
