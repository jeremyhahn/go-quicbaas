version: '3.8'

services:
  # Floci - AWS services emulator (KMS, S3, etc.). MIT-licensed, no auth token.
  floci:
    image: floci/floci:2.2.0@sha256:e97cd0c1dc2aa14e7697fb5ef5018404c4d6345169dbd276315f0bed2c7b0520
    ports:
      - "4566"            # Floci gateway (all services on one port)
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      # Floci runs Docker-backed services (e.g. Lambda) in real containers.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - quicbaas-test
    healthcheck:
      # Assert the services actually report "running" instead of just probing
      # the port, so warm-up never masquerades as readiness.
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/4566 || exit 1
          printf 'GET /_floci/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          resp=
          while IFS= read -r -u 3 line || [ -n "$$line" ]; do resp+="$$line"; done
          [[ "$$resp" == HTTP/1.?" 200"* ]] || exit 1
          for svc in "$$@"; do [[ "$$resp" == *"\"$$svc\":\"running\""* ]] || exit 1; done
        - floci-health
        - s3
        - kms
      interval: 5s
      timeout: 3s
      retries: 10

  # Fake GCS Server - Google Cloud Storage emulator
  fake-gcs-server:
    image: fsouza/fake-gcs-server:latest
    ports:
      - "4443"
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://localhost:4443"]
    networks:
      - quicbaas-test
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4443/storage/v1/b"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Azurite - Azure Storage emulator (Blob, Queue, Table)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - "10000"  # Blob service
      - "10001"  # Queue service
      - "10002"  # Table service
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose"
    networks:
      - quicbaas-test
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10000"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SoftHSM - PKCS#11 HSM emulator
  softhsm:
    build:
      context: ../..
      dockerfile: test/integration/docker/softhsm/Dockerfile
    volumes:
      - softhsm-tokens:/var/lib/softhsm/tokens
    networks:
      - quicbaas-test
    command: ["tail", "-f", "/dev/null"]  # Keep container running

networks:
  quicbaas-test:
    driver: bridge

volumes:
  softhsm-tokens:
