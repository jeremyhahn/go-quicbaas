# GPU override for agent integration tests.
# Applied automatically when NVIDIA GPU is detected.

services:
  ollama:
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - OLLAMA_GPU_LAYERS=${OLLAMA_GPU_LAYERS:-999}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_DEVICE_ID:-0}"]
              capabilities: [gpu, compute, utility]
