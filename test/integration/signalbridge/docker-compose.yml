version: '3.9'

services:
  quicbaasd:
    image: quicbaas:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: signalbridge-quicbaas
    environment:
      QUICBAAS_LOG_LEVEL: info
    ports:
      - "8888:8888"  # gRPC
      - "9090:9090"  # REST/HTTP
    volumes:
      - quicbaas-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  signalbridge:
    image: signalbridge:latest
    build:
      context: .
      dockerfile: Dockerfile.signalbridge
    container_name: signalbridge-bridge
    depends_on:
      quicbaasd:
        condition: service_healthy
    environment:
      QUICBAAS_URL: http://quicbaasd:9090
      SIGNAL_LISTEN_ADDR: 0.0.0.0:8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quicbaas-data:
