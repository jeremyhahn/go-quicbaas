# QuicBaaS Cluster Integration Test Configuration
# Minimal config for 3-node Raft cluster tests.
# Server TLS, auth and IAM are enabled: tests authenticate as the
# certfixture-issued system admin, as in the main integration stack.

logging:
  level: info
  format: json

server:
  mode: cluster
  grpc:
    enabled: true
    port: 50051
  rest:
    enabled: true
    port: 8080
  # write_timeout applies to the HTTP server's response write window.
  # It must be larger than the effective request_timeout (= write_timeout - 5s)
  # so the server can flush the error response before the TCP connection closes.
  write_timeout: 45s
  quic:
    enabled: false
  mcp:
    enabled: false
  unix:
    enabled: false
  # Only shard 1 exists in the qrdb clustered node. Listing additional
  # shards would cause the readiness check to fail (those shards don't
  # exist in the Raft host).
  shards:
    - 1

# TLS on the REST/gRPC server surface. Per-node certificate paths come from
# QUICBAAS_SECURITY_TLS_* environment variables (docker-compose.cluster.yml).
security:
  tls_enabled: true

# Auth enabled with the bootstrap system admin bound to the certfixture-issued
# admin.crt, so the suite authenticates exactly as the main integration stack.
auth:
  enabled: true
  bootstrap_admin: true

# Raft: mTLS enabled (quicraft requires it for multi-node QUIC transport).
# Per-node node_id, raft_address, join_addresses, and TLS cert paths are
# supplied via QUICBAAS_RAFT_* environment variables so the same config
# file can be shared across all three nodes.
raft:
  mutual_tls: true
  tls_ca_file: /etc/quicbaas/certs/ca.crt
  tls_cert_file: /etc/quicbaas/certs/node1.crt
  tls_key_file: /etc/quicbaas/certs/node1.key
  # More conservative Raft timing to prevent leader oscillation in Docker.
  # election timeout = 30 * 200ms = 6000ms = 6s (enough slack for Docker network jitter)
  # heartbeat interval = 3 * 200ms = 600ms
  election_rtt: 30
  heartbeat_rtt: 3
  rtt_millisecond: 200

# Storage
storage:
  backend: pebble

# Seal/barrier: enabled with passphrase strategy for at-rest encryption tests.
# The passphrase is injected via QUICBAAS_SEAL_PASSPHRASE env var so the node
# auto-initialises and unseals on startup without operator intervention.
# QUICBAAS_SEAL_ENABLED / QUICBAAS_SEAL_STRATEGY env vars override these
# values via viper bindings; they are provided here as documentation of intent.
seal:
  enabled: true
  strategy: passphrase

# KMS disabled to keep the cluster startup fast and dependency-free.
kms:
  enabled: false

# Secrets disabled.
secrets:
  enabled: false

# IAM enabled: the admin logs in with its PIV certificate (CA from env).
iam:
  enabled: true

# TimeSeries disabled (not needed for cluster KV tests).
timeseries:
  enabled: false

# Vector disabled.
vector:
  enabled: false

# Scheduler enabled: the cluster scheduler suite proves leader-gated firing
# (each cluster-wide job fires once per tick, cluster-wide).
scheduler:
  enabled: true
  tick_interval: 1s
  max_concurrent_jobs: 10

# Orchestration disabled.
orchestration:
  enabled: false

# Messaging disabled.
messaging:
  enabled: false

# RAG disabled.
rag:
  enabled: false

# Backup disabled.
backup:
  enabled: false
