##############################################################################
# Agent Runtime Integration Test Environment
#
# Brings up three services on a shared bridge network:
#
#   central   — single-node QuicBaaS cluster (enrollment + heartbeat endpoints)
#   agent     — remote agent daemon under test
#   ollama    — Ollama model server (model: qwen3:1.7b — fastest for CI)
#
# Usage:
#   make integration-test-agent-runtime
#
# Environment variables:
#   QUICBAAS_IMAGE  — QuicBaaS image tag (default: quicbaas:latest)
#   OLLAMA_MODEL    — Ollama model to pull/use (default: qwen3:1.7b)
##############################################################################

services:
  central:
    image: ${QUICBAAS_IMAGE:-quicbaas:latest}
    container_name: agent-runtime-central
    environment:
      - QUICBAAS_MODE=standalone
      - QUICBAAS_BIND=0.0.0.0:8080
      - QUICBAAS_LOG_LEVEL=info
    ports:
      - "18080:8080"
    networks:
      - agent-runtime-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v1/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: agent-runtime-ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
    ports:
      - "11434:11434"
    volumes:
      - agent-runtime-ollama-data:/root/.ollama
    networks:
      - agent-runtime-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

  integration-test:
    image: ${QUICBAAS_IMAGE:-quicbaas:latest}
    container_name: agent-runtime-tests
    depends_on:
      central:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - QUICBAAS_URL=http://central:8080
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:1.7b}
      - QUICBAAS_TEST_FILTER=${QUICBAAS_TEST_FILTER:-./test/integration/agent_runtime/...}
    networks:
      - agent-runtime-net
    command: >
      go test -tags 'integration agent_runtime'
             -v -count=1 -timeout 5m
             $${QUICBAAS_TEST_FILTER}

networks:
  agent-runtime-net:
    driver: bridge

volumes:
  agent-runtime-ollama-data:
    driver: local
