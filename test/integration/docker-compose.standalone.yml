version: '3.8'

# QuicBaaS Standalone Mode - Single Node in Docker
# Complete containerized setup with monitoring

services:
  # Single QuicBaaS node
  quicbaas-standalone:
    image: ${QUICBAAS_DEV_IMAGE:-quicbaas:dev}
    hostname: quicbaas-standalone
    # Run production binary with cluster command for single-node Raft
    command: ["/usr/local/bin/quicbaasd", "cluster"]
    ports:
      - "8080"   # REST API
      - "9090"   # Metrics
      - "50051" # gRPC
    environment:
      - QUICBAAS_RAFT_NODE_ID=1
      - QUICBAAS_RAFT_RAFT_ADDRESS=quicbaas-standalone:63001
      - QUICBAAS_RAFT_CLUSTER_RTT_MILLISECOND=10   # 10ms RTT for local/Docker networking (was 200ms!)
      - QUICBAAS_RAFT_CLUSTER_ELECTION_RTT=10      # 10 RTT units = 100ms election timeout
      - QUICBAAS_RAFT_CLUSTER_HEARTBEAT_RTT=1      # 1 RTT unit = 10ms heartbeat
      - QUICBAAS_LOGGING_LEVEL=debug
      - QUICBAAS_LOGGING_FORMAT=console
      - QUICBAAS_STORAGE_DATA_DIR=/data
      - QUICBAAS_SERVER_HOST=0.0.0.0
      # Sealed-window (pre-unseal ceremony/unseal) listeners default to loopback;
      # explicit opt-in so remote Shamir officers can reach the sealed surface.
      - QUICBAAS_SERVER_SEALED_BIND_HOST=0.0.0.0
      - QUICBAAS_SERVER_ENABLE_TCP=true
      - QUICBAAS_SERVER_ENABLE_REST=true
      - QUICBAAS_SERVER_UNIX_SOCKET=
    volumes:
      - standalone-data:/data
      - standalone-logs:/var/log/quicbaas
    networks:
      - quicbaas-standalone-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090"
    volumes:
      - ./deployments/prometheus/prometheus-standalone.yml:/etc/prometheus/prometheus.yml
      - prometheus-standalone-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - quicbaas-standalone-network
    depends_on:
      - quicbaas-standalone
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deployments/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./deployments/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-standalone-data:/var/lib/grafana
    networks:
      - quicbaas-standalone-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  quicbaas-standalone-network:
    driver: bridge

volumes:
  standalone-data:
  standalone-logs:
  prometheus-standalone-data:
  grafana-standalone-data:
