# QuicBaaS Cloud KMS Integration Test Environment
# Floci (MIT-licensed, tokenless AWS emulator) for AWS KMS and other cloud
# service emulators. Used for testing cloud KMS providers without actual
# cloud credentials.

version: '3.8'

services:
  # Floci - AWS Services Emulator (KMS, Secrets Manager, etc.)
  floci:
    image: floci/floci:2.2.0@sha256:e97cd0c1dc2aa14e7697fb5ef5018404c4d6345169dbd276315f0bed2c7b0520
    hostname: floci
    ports:
      - "4566"       # Floci gateway (all services on one port)
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test

      # Persist emulator state across restarts.
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_STORAGE_PERSISTENT_PATH=/var/lib/floci
    volumes:
      - floci-data:/var/lib/floci
      # Floci runs Docker-backed services (e.g. Lambda) in real containers.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - kms-cloud-network
    healthcheck:
      # Assert the services this stack uses report "running" rather than just
      # probing the port, so warm-up cannot be mistaken for readiness.
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/4566 || exit 1
          printf 'GET /_floci/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          resp=
          while IFS= read -r -u 3 line || [ -n "$$line" ]; do resp+="$$line"; done
          [[ "$$resp" == HTTP/1.?" 200"* ]] || exit 1
          for svc in "$$@"; do [[ "$$resp" == *"\"$$svc\":\"running\""* ]] || exit 1; done
        - floci-health
        - kms
        - secretsmanager
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Test runner for AWS KMS integration tests
  awskms-test:
    build:
      context: ../..
      dockerfile: test/integration/Dockerfile
    hostname: awskms-test
    environment:
      # AWS emulator (Floci) configuration
      - AWS_ENDPOINT=http://floci:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test

      # Test configuration
      - QUICBAAS_TEST_MODE=integration
      - QUICBAAS_LOG_LEVEL=debug
      - CGO_ENABLED=0
    volumes:
      - ./:/app:ro
      - awskms-test-cache:/go/pkg/mod
      - awskms-test-results:/test-results
    working_dir: /app
    networks:
      - kms-cloud-network
    depends_on:
      floci:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running AWS KMS integration tests (Floci gated by depends_on: service_healthy)...' &&
        go test -v -tags 'awskms integration' -run 'TestAWSKMSIntegration' -timeout 10m ./pkg/keyring/... | tee /test-results/awskms-integration-test.log &&
        echo 'AWS KMS integration tests completed'
      "

networks:
  kms-cloud-network:
    driver: bridge

volumes:
  floci-data:
    driver: local
    labels:
      com.quicbaas.service: "floci"
      com.quicbaas.type: "data"

  awskms-test-cache:
    driver: local

  awskms-test-results:
    driver: local
