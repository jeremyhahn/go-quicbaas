# QuicBaaS Integration Test Configuration
# This file provides complex configuration that cannot be set via environment variables

# Enable debug logging for troubleshooting
logging:
  level: debug
  format: json

security:
  # This IAM integration suite predates the default-deny scope -> RBAC gate and
  # authenticates its data-plane operations through its own per-test ceremonies
  # (bootstrap admin + PIV/mTLS login + OAuth2 token), not the global gate. The
  # gate is now ON by default (config.Default sets require_authz=true), so pin it
  # OFF here to preserve this suite's established posture. The dedicated SDK
  # integration suite (sdk/go/test/integration) proves default-deny enforcement
  # with authenticated clients + a negative (no-token -> 401/403) test.
  require_authz: false
  # The refuse-to-start gate rejects require_authz=false with network
  # transports enabled unless the dev-only escape hatch is set. This harness
  # runs inside an isolated Docker network and authenticates via the per-test
  # ceremonies above, so acknowledge explicitly. NEVER set this in production.
  insecure_dev_mode: true

server:
  mode: cluster  # Cluster mode enables Raft consensus
  # Enable all protocols for integration testing
  grpc:
    enabled: true
    port: 50051
  rest:
    enabled: true
    port: 8080
  quic:
    enabled: true
    port: 4433
  mcp:
    enabled: true
    port: 8888
  unix:
    enabled: true
    socket: /var/run/quicbaas.sock
  # Shards available for routing fallback/modulo
  # Note: KMS shard (1000) and Secrets shard (1001) are configured separately
  # in their respective sections and should NOT be included here
  shards:
    - 1
    - 2
    - 3
    - 200
    - 300
  # Entity type to shard mapping
  # Note: Shard 3 is excluded by default as the timeseries shard ID constant,
  # so we use shards 1 and 2 for entity pins to avoid routing conflicts.
  entity_shard_pins:
    users: 2
    orders: 1

# Authentication configuration for integration tests.
# Password auth has been removed; the bootstrap admin is bound to the
# generated admin client cert via auth.bootstrap_admin_piv_cert_path.
auth:
  enabled: true
  jwt_secret: "integration-test-secret-key-at-least-32-characters-long"
  token_ttl: 1h
  refresh_token_ttl: 24h
  bootstrap_admin: true
  bootstrap_admin_username: "admin@integration.test"
  bootstrap_admin_piv_cert_path: /etc/quicbaas/certs/admin.crt
  # Disable login attempt throttling for integration tests.
  # Failed auth attempts from QUIC/MCP protocol probing must not trigger
  # account lockout that cascades into failures across all protocols.
  max_login_attempts: 0

# Raft configuration for integration tests
# mTLS uses a shared CA with per-node certs generated by gen-certs tool.
# Cert/key paths are overridden per-node via QUICBAAS_RAFT_TLS_* env vars.
#
# Container-friendly Raft timing to prevent leader oscillation with mTLS:
#   election timeout = 15 * 200ms = 3000ms
#   heartbeat interval = 2 * 200ms = 400ms
# These non-default values bypass the server's low-latency override
# (50ms RTT → 1s election) which is too aggressive for Docker + mTLS.
raft:
  mutual_tls: true
  tls_ca_file: /etc/quicbaas/certs/ca.crt
  tls_cert_file: /etc/quicbaas/certs/node1.crt
  tls_key_file: /etc/quicbaas/certs/node1.key
  election_rtt: 15
  heartbeat_rtt: 2
  rtt_millisecond: 200

# Storage configuration
storage:
  backend: pebble

# KMS configuration for integration tests
kms:
  enabled: true
  backend: software
  raft:
    shard_id: 1000
  auto_generate_key: true  # Auto-generate default key on startup

# Secrets configuration for integration tests
secrets:
  enabled: true
  raft:
    shard_id: 1001
  encryption:
    default_key_id: "quicbaas-secrets-key"

# Time Series configuration for integration tests
timeseries:
  enabled: true
  storage_path: /data/timeseries
  shard_id: 300
  retention:
    default_days: 30
    check_interval: 1h
  query:
    max_points: 100000
    default_limit: 10000
  aggregation:
    buffer_size: 1000

# Vector configuration for integration tests
vector:
  enabled: true
  shard_id: 200
  storage_path: /data/vector
  hnsw:
    m: 16
    ef_construction: 200
    max_elements: 100000
    ml: 1.0
  cache_enabled: true
  cache_ttl: 5m
  cache_max_size: 536870912  # 512MB

# IAM configuration for integration tests
iam:
  enabled: true
  mode: primary

  # PIV (mTLS client cert) login is the integration-test authentication path.
  # Tests acquire a bearer via POST /api/v1/auth/login/piv presenting the admin
  # client cert generated by test/integration/gen-certs/main.go.
  piv_login:
    enabled: true
    ca_file: /etc/quicbaas/certs/ca.crt

  tenants:
    default: "test-tenant"
    isolation: strict
    auto_create: true

  auth:
    local:
      enabled: true
      webauthn:
        enabled: true
        rp_id: "localhost"
        rp_name: "QuicBaaS Integration Tests"
        rp_origins:
          - "http://localhost:8080"
          - "http://test-node1:8080"
        attestation: none
        user_verification: discouraged

  oidc:
    issuer: "http://test-node1:8080"
    access_token_ttl: 1h
    refresh_token_ttl: 24h
    id_token_ttl: 1h

  policy:
    default_effect: deny
    cache_ttl: 5m

# Scheduler configuration for integration tests
scheduler:
  enabled: true
  tick_interval: 1s
  max_concurrent_jobs: 10

# Orchestration configuration for integration tests
orchestration:
  enabled: true

# Messaging configuration for integration tests
messaging:
  enabled: true
  dedup_enabled: true
  watch_bridge:
    enabled: true

# RAG configuration for integration tests
rag:
  enabled: true
  embedding:
    provider: ollama
    api_url: http://ollama:11434
    model: all-minilm
    dimensions: 384
  vector:
    num_centroids: 256
    dimensions: 384
    nprobe: 10
    metric: cosine
  ranking:
    strategy: fusion
    bm25_k1: 1.2
    bm25_b: 0.75
    rrf_k: 60
  query:
    cache_size: 1000
    default_top_k: 10
    default_nprobe: 10
  context:
    max_tokens: 4096
    default_template: markdown
  pipeline:
    timeout: 30s
    max_concurrent_queries: 10
    default_top_k: 10
    default_max_tokens: 4096
  storage:
    backend: pebble

# Backup configuration for integration tests
backup:
  enabled: true
  storage_path: /data/backups
  providers:
    local:
      enabled: true
      path: /data/backups/local
