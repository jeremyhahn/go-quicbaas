# QuicBaaS Integration Test Configuration
# This file provides complex configuration that cannot be set via environment variables

# Enable debug logging for troubleshooting
logging:
  level: debug
  format: json

security:
  # The default-deny scope -> RBAC gate is ON, as in production. Every client
  # of this stack presents a credential: the helpers in
  # test/integration/helpers enrol the suite's principals and attach their
  # bearers. Only the public routes (health, login and registration
  # ceremonies) answer a request that carries none.
  require_authz: true

server:
  mode: cluster  # Cluster mode enables Raft consensus
  # Enable all protocols for integration testing
  grpc:
    enabled: true
    port: 50051
  rest:
    enabled: true
    port: 8080
  quic:
    enabled: true
    port: 4433
  mcp:
    enabled: true
    port: 8888
  unix:
    enabled: true
    socket: /var/run/quicbaas.sock
  # Shards available for routing fallback/modulo
  # Note: KMS shard (1000) and Secrets shard (1001) are configured separately
  # in their respective sections and should NOT be included here
  shards:
    - 1
    - 2
    - 3
    - 200
    - 300
  # Entity type to shard mapping
  # Note: Shard 3 is excluded by default as the timeseries shard ID constant,
  # so we use shards 1 and 2 for entity pins to avoid routing conflicts.
  entity_shard_pins:
    users: 2
    orders: 1

# Authentication configuration for integration tests.
# Password auth has been removed; the bootstrap admin is bound to the
# generated admin client cert via auth.bootstrap_admin_piv_cert_path.
auth:
  enabled: true
  token_ttl: 1h
  refresh_token_ttl: 24h
  bootstrap_admin: true
  # NOTE: bootstrap_admin_username / bootstrap_admin_password are dead knobs
  # (consumed by nothing since password bootstrap was retired). The bootstrap
  # admin identity comes exclusively from the cert bound via
  # bootstrap_admin_piv_cert_path below.
  bootstrap_admin_piv_cert_path: /etc/quicbaas/certs/admin.crt
  # Disable login attempt throttling for integration tests.
  # Failed auth attempts from QUIC/MCP protocol probing must not trigger
  # account lockout that cascades into failures across all protocols.
  max_login_attempts: 0

# Raft configuration for integration tests
# mTLS uses a shared CA whose per-node certs are issued by QuicBaaS's own CA
# (test/integration/certfixture).
# Cert/key paths are overridden per-node via QUICBAAS_RAFT_TLS_* env vars.
#
# Container-friendly Raft timing to prevent leader oscillation with mTLS:
#   election timeout = 15 * 200ms = 3000ms
#   heartbeat interval = 2 * 200ms = 400ms
# These non-default values bypass the server's low-latency override
# (50ms RTT → 1s election) which is too aggressive for Docker + mTLS.
raft:
  mutual_tls: true
  tls_ca_file: /etc/quicbaas/certs/ca.crt
  tls_cert_file: /etc/quicbaas/certs/node1.crt
  tls_key_file: /etc/quicbaas/certs/node1.key
  election_rtt: 15
  heartbeat_rtt: 2
  rtt_millisecond: 200

# Storage configuration
storage:
  backend: pebble

# KMS configuration for integration tests
kms:
  enabled: true
  backend: software
  raft:
    shard_id: 1000
  auto_generate_key: true  # Auto-generate default key on startup

# Secrets configuration for integration tests
secrets:
  enabled: true
  raft:
    shard_id: 1001
  encryption:
    default_key_id: "quicbaas-secrets-key"

# Time Series configuration for integration tests
timeseries:
  enabled: true
  storage_path: /data/timeseries
  shard_id: 300
  retention:
    default_days: 30
    check_interval: 1h
  query:
    max_points: 100000
    default_limit: 10000
  aggregation:
    buffer_size: 1000

# Vector configuration for integration tests
vector:
  enabled: true
  shard_id: 200
  storage_path: /data/vector
  hnsw:
    m: 16
    ef_construction: 200
    max_elements: 100000
    ml: 1.0
  cache_enabled: true
  cache_ttl: 5m
  cache_max_size: 536870912  # 512MB

# IAM configuration for integration tests
iam:
  enabled: true
  mode: primary

  # The SPIFFE trust domain the daemon issues and PINS against.
  #
  # REQUIRED on any node that has a CA: first-boot issues the platform admin's
  # certificate through it, and it fails closed without a trust domain
  # (ErrNoSPIFFETrustDomain) because the certificate would carry no tenant SAN
  # for login to resolve. Since go-quicbaas#57 that failure refuses the boot
  # instead of warning, so this node did not have an administrator before this
  # line existed — the warning was simply swallowed.
  #
  # The value MUST equal IntegrationTrustDomain in test/integration/helpers/fixture_ca.go:
  # the fixture client certificates carry spiffe://<td>/tenant/... SANs, and
  # login pins the configured trust domain against the presented one.
  spiffe_trust_domain: quicbaas.integration

  # PIV (mTLS client cert) login is the integration-test authentication path.
  # Tests acquire a bearer via POST /api/v1/iam/login/piv presenting the admin
  # client cert the QuicBaaS CA issued into test/integration/certs.
  piv_login:
    enabled: true
    # The integration fixtures authenticate with ordinary PKI client
    # certificates: there is no smartcard, so no slot attestation exists to
    # verify. This is the explicit acknowledgement of that — PIV login proceeds
    # and the issued token records attest_level=software WITHOUT the
    # hardware-attested ACR, so nothing is represented as more than it is.
    #
    # It must never appear in a deployment configuration. Set
    # attestation_ca_file to the vendor PIV attestation root instead; see
    # docs/iam/engineering.md "PIV smartcard attestation".
    allow_unattested: true

  tenants:
    default: "test-tenant"
    isolation: strict
    auto_create: true

  # WebAuthn relying party (iam.webauthn is the canonical block the server
  # reads; iam.auth.local.webauthn below is the legacy local-auth toggle).
  #
  # Without this block the RP is derived from the issuer URL
  # (https://localhost:8080) and rp_origins would contain ONLY that origin.
  # The headless software authenticator used by the FIDO2 login tests
  # (go-xkms/pkg/webauthn/client.SoftwareAdapter) stamps the WebAuthn-standard
  # same-origin default "https://<rpId>" into its collected client data, so
  # "https://localhost" must be an accepted origin or every ceremony fails
  # origin validation. Both forms are listed so the derived issuer origin keeps
  # working unchanged.
  webauthn:
    rp_id: "localhost"
    rp_display_name: "QuicBaaS Integration Tests"
    rp_origins:
      - "https://localhost:8080"
      - "https://localhost"
      - "http://localhost:8080"
    attestation_preference: none
    user_verification: discouraged
    # The integration suite drives go-xkms's headless CTAP2 software adapter,
    # which emits fmt:"none" attestation, and it enrolls administrators. Under
    # any other assurance policy every one of those registrations is refused —
    # correctly, because a software authenticator is not hardware.
    #
    # This is the explicit, deliberately unmistakable opt-in for exactly that
    # situation. A node running it logs a SECURITY warning on every boot. It
    # must never appear in a deployment configuration; see
    # docs/iam/engineering.md "Enrollment assurance".
    assurance: insecure-allow-software-administrators

  auth:
    local:
      enabled: true
      webauthn:
        enabled: true
        rp_id: "localhost"
        rp_name: "QuicBaaS Integration Tests"
        rp_origins:
          - "http://localhost:8080"
          - "http://test-node1:8080"
        attestation: none
        user_verification: discouraged

  oidc:
    issuer: "http://test-node1:8080"
    access_token_ttl: 1h
    refresh_token_ttl: 24h
    id_token_ttl: 1h

  policy:
    default_effect: deny
    cache_ttl: 5m

# Scheduler configuration for integration tests
scheduler:
  enabled: true
  tick_interval: 1s
  max_concurrent_jobs: 10

# Orchestration configuration for integration tests
orchestration:
  enabled: true

# Messaging configuration for integration tests
messaging:
  enabled: true
  dedup_enabled: true
  watch_bridge:
    enabled: true

# RAG configuration for integration tests
rag:
  enabled: true
  embedding:
    provider: ollama
    api_url: http://ollama:11434
    model: all-minilm
    dimensions: 384
  vector:
    num_centroids: 256
    dimensions: 384
    nprobe: 10
    metric: cosine
  ranking:
    strategy: fusion
    bm25_k1: 1.2
    bm25_b: 0.75
    rrf_k: 60
  query:
    cache_size: 1000
    default_top_k: 10
    default_nprobe: 10
  context:
    max_tokens: 4096
    default_template: markdown
  pipeline:
    timeout: 30s
    max_concurrent_queries: 10
    default_top_k: 10
    default_max_tokens: 4096
  storage:
    backend: pebble

# Backup configuration for integration tests
backup:
  enabled: true
  storage_path: /data/backups
  providers:
    local:
      enabled: true
      path: /data/backups/local
