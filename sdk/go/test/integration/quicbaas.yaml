# QuicBaaS SDK integration server configuration.
#
# Mounted by docker-compose.yml at /etc/quicbaas/quicbaas.yaml. Only the keys
# the compose env/flag surface cannot express live here (the config loader's
# env override list is explicit and does not cover these):
#
#   - Fixture-cert TLS identity: the shared integration cert fixtures
#     (test/integration/certs, issued by test/integration/certfixture) give
#     the server a serving certificate valid for localhost AND a client CA so
#     the suite's admin PIV mTLS login verifies. The host-side test client
#     pins the same ca.crt as its RootCAs.
#   - Cert-bound bootstrap admin: TLS is mandatory and dynamic client
#     registration requires an initial access token, so the suite's first
#     credential comes from the cert-based admin bootstrap (PIV mTLS login),
#     mirroring test/integration/quicbaas.yaml.
#   - RFC 7591 Dynamic Client Registration: disabled by default; the suite
#     exercises DCR + client_credentials with the admin bearer as the
#     initial access token.

security:
  tls_cert_file: /etc/quicbaas/certs/node1.crt
  tls_key_file: /etc/quicbaas/certs/node1.key
  tls_ca_file: /etc/quicbaas/certs/ca.crt

auth:
  enabled: true
  bootstrap_admin: true
  bootstrap_admin_piv_cert_path: /etc/quicbaas/certs/admin.crt
  # Disable login attempt throttling: the suite's negative auth tests post
  # invalid credentials and must not trip account lockout.
  max_login_attempts: 0

iam:
  # Required by first-boot (admin cert issuance) and by PIV login tenant
  # derivation. MUST match the trust domain certfixture stamps into the fixture
  # client certs' SPIFFE URI SANs
  # (spiffe://quicbaas.integration/tenant/system/user/admin).
  spiffe_trust_domain: quicbaas.integration
  piv_login:
    enabled: true
    # The integration fixtures authenticate with ordinary PKI client
    # certificates: there is no smartcard, so no slot attestation exists to
    # verify. This is the explicit acknowledgement of that — PIV login proceeds
    # and the issued token records attest_level=software WITHOUT the
    # hardware-attested ACR, so nothing is represented as more than it is.
    #
    # It must never appear in a deployment configuration. Set
    # attestation_ca_file to the vendor PIV attestation root instead; see
    # docs/iam/engineering.md "PIV smartcard attestation".
    allow_unattested: true
  dynamic_client_registration:
    enabled: true
