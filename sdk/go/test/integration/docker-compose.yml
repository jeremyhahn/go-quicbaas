# QuicBaaS SDK Integration Test Environment
# Single-node server for testing SDK functionality

services:
  quicbaas:
    build:
      context: ../../../..
      additional_contexts:
        # ~/sources — parent dir containing all sibling repos. The
        # Dockerfile.dev workspace build stage pulls go-qrdb, go-xkms, etc.
        # from this named context (5 levels up from this compose file).
        workspace: ../../../../..
      dockerfile: test/integration/Dockerfile.dev
      args:
        BUILD_TAGS: "iam raft rest rag"
    container_name: quicbaas-sdk-test
    hostname: quicbaas
    command:
      - /usr/local/bin/quicbaasd
      - node
      - --config
      - /etc/quicbaas/quicbaas.yaml
      - --discovery=static
      - --grpc-port=50051
      - --http-port=8080
    ports:
      - "58080:8080"   # REST API
      - "59090:9090"   # Metrics
      - "50151:50051"  # gRPC
    environment:
      - QUICBAAS_RAFT_NODE_ID=1
      - QUICBAAS_RAFT_RAFT_ADDRESS=quicbaas:63001
      - QUICBAAS_LOGGING_LEVEL=debug
      - QUICBAAS_LOGGING_FORMAT=console
      - QUICBAAS_STORAGE_DATA_DIR=/data
      - QUICBAAS_SERVER_HOST=0.0.0.0
      # Sealed-window (pre-unseal ceremony/unseal) listeners default to loopback;
      # explicit opt-in so remote Shamir officers can reach the sealed surface.
      - QUICBAAS_SERVER_SEALED_BIND_HOST=0.0.0.0
      - QUICBAAS_SERVER_ENABLE_TCP=true
      - QUICBAAS_SERVER_ENABLE_REST=true
      - QUICBAAS_SERVER_UNIX_SOCKET=/var/run/quicbaas/quicbaas.sock
      - QUICBAAS_KMS_ENABLED=true
      - QUICBAAS_KMS_BACKEND=software
      - QUICBAAS_SECRETS_ENABLED=true
      # TLS is mandatory stack-wide: the REST listener serves HTTPS with the
      # shared integration cert fixtures (quicbaas.yaml security.tls_*). The
      # suite pins test/integration/certs/ca.crt as the client RootCAs (see
      # setup_test.go suiteTLS); no InsecureSkipVerify anywhere.
      # Default-deny scope -> RBAC gate ON (the secure default). The suite
      # bootstraps a platform token via public OAuth2 (DCR + client_credentials)
      # and attaches it to every protected data-plane request; an anonymous
      # request to a protected path is rejected (proved by the negative test).
      - QUICBAAS_SECURITY_REQUIRE_AUTHZ=true
      - QUICBAAS_SERVER_MCP_ENABLED=false
    volumes:
      - quicbaas-data:/data
      - quicbaas-logs:/var/log/quicbaas
      - quicbaas-socket:/var/run/quicbaas
      # Server config: fixture-cert TLS identity + cert-bound bootstrap admin
      # + RFC 7591 DCR enablement (keys the env surface cannot express).
      - ./quicbaas.yaml:/etc/quicbaas/quicbaas.yaml:ro
      # Shared integration cert fixtures, issued by QuicBaaS's own CA
      # (test/integration/certfixture): serving cert valid for localhost, the
      # trust anchor, and the bootstrap admin client cert bundle.
      - ../../../../test/integration/certs:/etc/quicbaas/certs:ro
    networks:
      - sdk-test-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 && nc -z localhost 8080"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

networks:
  sdk-test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  quicbaas-data:
  quicbaas-logs:
  quicbaas-socket:
