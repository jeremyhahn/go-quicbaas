# QuicBaaS SDK integration environment: one server node.

services:
  quicbaas:
    build:
      context: ../../../..
      dockerfile: test/integration/Dockerfile.dev
      args:
        BUILD_TAGS: "iam raft rest rag"
      secrets:
        - gomodauth
    container_name: quicbaas-sdk-test
    hostname: quicbaas
    command:
      - /usr/local/bin/quicbaasd
      - node
      - --config
      - /etc/quicbaas/quicbaas.yaml
      - --discovery=static
      - --grpc-port=50051
      - --http-port=8080
    ports:
      - "58080:8080"   # REST API
      - "59090:9090"   # Metrics
      - "50151:50051"  # gRPC
    environment:
      - QUICBAAS_RAFT_NODE_ID=1
      - QUICBAAS_RAFT_RAFT_ADDRESS=quicbaas:63001
      - QUICBAAS_LOGGING_LEVEL=debug
      - QUICBAAS_LOGGING_FORMAT=console
      - QUICBAAS_STORAGE_DATA_DIR=/data
      - QUICBAAS_SERVER_HOST=0.0.0.0
      # Sealed-window listeners default to loopback; this opts in so remote Shamir officers can reach them.
      - QUICBAAS_SERVER_SEALED_BIND_HOST=0.0.0.0
      - QUICBAAS_SERVER_ENABLE_TCP=true
      - QUICBAAS_SERVER_ENABLE_REST=true
      - QUICBAAS_SERVER_UNIX_SOCKET=/var/run/quicbaas/quicbaas.sock
      - QUICBAAS_KMS_ENABLED=true
      - QUICBAAS_KMS_BACKEND=software
      - QUICBAAS_SECRETS_ENABLED=true
      # TLS is mandatory: the REST listener serves HTTPS with the shared integration certificate fixtures.
      - QUICBAAS_SECURITY_REQUIRE_AUTHZ=true
      - QUICBAAS_SERVER_MCP_ENABLED=false
    volumes:
      - quicbaas-data:/data
      - quicbaas-logs:/var/log/quicbaas
      - quicbaas-socket:/var/run/quicbaas
      # Server config: fixture TLS identity, certificate-bound bootstrap admin and RFC 7591 DCR.
      - ./quicbaas.yaml:/etc/quicbaas/quicbaas.yaml:ro
      # Shared integration certificate fixtures, issued by QuicBaaS's own CA.
      - ../../../../test/integration/certs:/etc/quicbaas/certs:ro
    networks:
      - sdk-test-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 && nc -z localhost 8080"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

# Module fetch credentials for the image build as a BuildKit secret, staged by `make stage-gomodauth`.
secrets:
  gomodauth:
    file: ${GOMODAUTH_ENV:-/tmp/quicbaas-gomodauth.env}

networks:
  sdk-test-network:
    driver: bridge

volumes:
  quicbaas-data:
  quicbaas-logs:
  quicbaas-socket:
