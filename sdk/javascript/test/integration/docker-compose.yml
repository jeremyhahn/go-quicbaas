# JavaScript SDK integration environment: one standalone server and a Node runner for the jest suites.
services:
  central:
    image: ${QUICBAAS_IMAGE:-quicbaas:latest}
    # The hostname is in the server certificate's SANs, so the runner can verify https://central:8080.
    hostname: central
    # Standalone daemon on the suite's own configuration.
    entrypoint: ["/usr/local/bin/quicbaasd"]
    command: ["start", "--config", "/etc/quicbaas/quicbaas.yaml", "--data-dir", "/data"]
    volumes:
      - ./quicbaas.yaml:/etc/quicbaas/quicbaas.yaml:ro
      - sdk-js-quicbaas-data:/data
    networks:
      - sdk-js-net
    healthcheck:
      # The runtime image has no curl; it ships busybox wget.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://localhost:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  js-integration-test:
    image: node:22-bookworm-slim
    depends_on:
      central:
        condition: service_healthy
    environment:
      - QUICBAAS_URL=https://central:8080
      # Node trusts the chain of the daemon's own CA from its data volume.
      - NODE_EXTRA_CA_CERTS=/quicbaas-data/certs/ca-chain.crt
      - JS_TEST_PATTERN=${JS_TEST_PATTERN:-integration}
    working_dir: /sdk
    volumes:
      - ../..:/sdk:ro
      - sdk-js-quicbaas-data:/quicbaas-data:ro
      - sdk-js-node-modules:/sdk/node_modules
    networks:
      - sdk-js-net
    command: >
      sh -c "npm ci --silent &&
             npx jest --testPathPattern=$${JS_TEST_PATTERN} --testTimeout=30000"

networks:
  sdk-js-net:
    driver: bridge

volumes:
  sdk-js-node-modules:
    driver: local
  sdk-js-quicbaas-data:
    driver: local
