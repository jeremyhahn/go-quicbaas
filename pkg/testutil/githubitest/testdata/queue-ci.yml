# The scratch repository's queue gate for the live GitHub merge-train e2e.
# It reports ci-gate on every pull request, so a project that requires green
# checks can merge a car, and fails only a queue/* head whose tree holds a
# file named BREAK-CI: that is how a test breaks one car in the train while
# the car's own pull request stays green.
name: queue-ci

on: pull_request

permissions:
  contents: read

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: refuse a queue head that holds BREAK-CI
        if: startsWith(github.head_ref, 'queue/')
        run: |
          if [ -e BREAK-CI ]; then
            echo "BREAK-CI is present: this queue head fails ci-gate"
            exit 1
          fi
          echo "ci-gate passed"
